/* 静态照片 → 不限时长视频：可自定义到 1 小时，帧率/分辨率可调，支持进度与随时停止 */
let videoCancel=false;
function cancelVideoExport(){ if(videoExporting){ videoCancel=true; toast('正在停止并保存已录制部分…'); } }
function recordStillClip(seconds,mime,motion,onProgress){
  return new Promise((resolve,reject)=>{
    if(typeof MediaRecorder==='undefined'||typeof HTMLCanvasElement.prototype.captureStream!=='function'){
      reject(new Error('NO_RECORDER')); return;
    }
    let src;
    try{ src=renderExportCanvas(); }catch(e){ reject(e); return; }
    const [ew,eh]=exportDims();
    /* 0 = 保持原始分辨率（默认），其余为最长边上限；最高支持 60fps */
    const cap=(+state.exportVideoMaxEdge>0)?clamp(+state.exportVideoMaxEdge,320,3840):Math.max(ew,eh);
    const k=Math.min(1,cap/Math.max(ew,eh));
    let W=Math.max(2,Math.round(ew*k)), H=Math.max(2,Math.round(eh*k));
    if(W%2)W--; if(H%2)H--;
    const proxy=document.createElement('canvas'); proxy.width=W; proxy.height=H;
    const px=proxy.getContext('2d');
    const fps=clamp(+state.exportVideoFps||30,12,60);
    let rec,stream;
    try{
      stream=proxy.captureStream(fps);
      rec=new MediaRecorder(stream,videoRecorderOpts(mime));
    }catch(e){ reject(e); return; }
    const chunks=[]; let timer=0, tickTimer=0, done=false, lastToast=0;
    const paint=t=>{
      px.fillStyle='#000'; px.fillRect(0,0,W,H);
      const drawScaled=(z,dx,dy)=>{
        const dw=W*z,dh=H*z;
        px.drawImage(src,0,0,src.width,src.height,(W-dw)/2+dx,(H-dh)/2+dy,dw,dh);
      };
      if(motion==='push') drawScaled(1+.10*t,0,0);
      else if(motion==='zoomout') drawScaled(1.10-.10*t,0,0);
      else if(motion==='pan') drawScaled(1.08,(t-.5)*-W*.08,0);
      else if(motion==='breathe') drawScaled(1+.035*Math.sin(t*Math.PI*2),0,0);
      else drawScaled(1,0,0);
    };
    const finish=()=>{
      if(done) return; done=true;
      clearTimeout(timer); clearInterval(tickTimer);
      if(rec.state!=='inactive'){ try{rec.stop();}catch(e){} }
      setTimeout(()=>{ try{stream.getTracks().forEach(t=>t.stop());}catch(e){} },200);
    };
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onerror=e=>{ done=true; clearTimeout(timer); clearInterval(tickTimer); reject(e.error||new Error('REC_ERR')); };
    rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||mime||'video/webm'}));
    paint(0);
    try{ rec.start(1000); }catch(e){ reject(e); return; }
    const t0=performance.now(), ms=clamp(seconds||3,.5,86400)*1000;
    tickTimer=setInterval(()=>{
      if(done) return;
      const el=performance.now()-t0;
      if(videoCancel){ finish(); return; }
      paint(Math.min(1,el/ms));
      if(onProgress&&el-lastToast>1200){ lastToast=el; onProgress(Math.min(1,el/ms)); }
      if(el>=ms) setTimeout(finish,140);
    },Math.max(16,Math.round(1000/fps)));
    timer=setTimeout(finish,ms+3000);
  });
}
let videoExporting=false;
async function exportVideo(){
  if(videoExporting){ toast('正在导出视频，点「停止导出」可提前结束并保存'); return; }
  const {mime,fallback}=videoMimeChoice();
  if(!mime){ toast('当前浏览器不支持视频录制'); return; }
  if(fallback) toast('所选格式不可用，已自动使用可用编码');
  videoExporting=true; videoCancel=false;
  try{
    const secs=state.exportVideoCustom>0?state.exportVideoCustom:clamp(state.exportVideoSeconds||3,.5,86400);
    const motion=state.exportVideoMotion||'still';
    const mn={still:'定格',push:'推近',zoomout:'拉远',pan:'摇摄',breathe:'呼吸'}[motion]||motion;
    const qn={lossless:'原画质·不限码率',high:'高画质',standard:'标准',custom:(state.exportVideoBitrate||80)+' Mbps'}[state.exportVideoQuality||'lossless'];
    toast((LIVE.pair?'正在逐帧导出实况视频…':'正在生成 '+secs+' 秒视频 · '+mn+'…')+
      ' · '+state.exportVideoFps+'fps · '+qn+'（可随时停止）');
    /* 个别浏览器某编码声称支持但产出空文件，自动换下一种编码重试 */
    const tries=[mime,...liveRecorderMimes().filter(m=>m!==mime)].slice(0,2);
    let blob=null;
    for(let i=0;i<tries.length;i++){
      if(videoCancel) break;
      try{
        blob=LIVE.pair
          ? await recordLiveClip(tries[i])
          : await recordStillClip(secs,tries[i],motion,p=>toast('视频录制中… '+Math.round(p*100)+'% · 点「停止导出」可提前保存'));
      }catch(e){ blob=null; }
      if(blob&&blob.size>=256) break;
      if(i<tries.length-1&&!videoCancel) toast('该编码无输出，正在换一种重试…');
    }
    if(!blob||blob.size<256){
      if(videoCancel){ toast('已停止导出，未产生可用片段'); return; }
      throw new Error('EMPTY_CLIP');
    }
    const ext=(blob.type||mime).indexOf('mp4')>=0?'.mp4':'.webm';
    downloadBlob(blob,'Iris_视频_'+Date.now()+ext);
    toast('已导出视频 '+(blob.size/1024).toFixed(0)+' KB · '+
      (LIVE.pair?LIVE.duration.toFixed(1)+'s（逐帧调色）':secs+'s · '+mn)+
      (videoCancel?'（提前停止，仅含已录制部分）':''));
  }catch(e){ toast(videoCancel?'已停止导出':('视频导出失败：'+(e.message||e))); }
  finally{ videoExporting=false; videoCancel=false; if(tool==='presets') buildPanel(true); }
}
function liveRecorderMimes(){
  if(typeof MediaRecorder==='undefined'||!MediaRecorder.isTypeSupported) return [];
  const ok=m=>MediaRecorder.isTypeSupported(m);
  const webm=['video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(ok);
  const mp4=['video/mp4;codecs=avc1.42E01E','video/mp4'].find(ok);
  /* Chrome / Firefox 优先 WebM（稳定有数据）；Safari / iOS 只有 MP4 */
  return [webm,mp4].filter(Boolean);
}
function liveRecorderMime(){ return liveRecorderMimes()[0]||''; }
function recordLiveClip(mimeOverride){
  return new Promise((resolve,reject)=>{
    if(typeof MediaRecorder==='undefined'||typeof canvas.captureStream!=='function'){
      reject(new Error('NO_RECORDER')); return;
    }
    const v=LIVE.video, mime=mimeOverride||liveRecorderMime();
    /* WebGL 画布的 captureStream 在部分浏览器（含 iOS Safari）不出帧。
       用一张 2D 中转画布逐帧 drawImage，录制源始终是普通 2D canvas。 */
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const proxy=document.createElement('canvas');
    proxy.width=Math.max(2,Math.round(canvas.clientWidth*dpr));
    proxy.height=Math.max(2,Math.round(canvas.clientHeight*dpr));
    const px=proxy.getContext('2d');
    let rec, stream;
    try{
      stream=proxy.captureStream(clamp(+state.exportVideoFps||30,12,60));
      rec=new MediaRecorder(stream,videoRecorderOpts(mime));
    }catch(e){ reject(e); return; }
    const chunks=[]; let done=false, guard=0, guard2=0, pump=0;
    const paint=()=>{
      if(done) return;
      try{ px.drawImage(canvas,0,0,proxy.width,proxy.height); }catch(e){}
      pump=requestAnimationFrame(paint);
    };
    const finish=()=>{
      if(done) return; done=true;
      clearTimeout(guard); clearTimeout(guard2); cancelAnimationFrame(pump);
      try{ livePause(); }catch(e){}
      LIVE.recording=false; updateLiveUI();
      if(rec.state!=='inactive'){ try{rec.stop();}catch(e){} }
      setTimeout(()=>{ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} },300);
    };
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onerror=e=>{ done=true; clearTimeout(guard); clearTimeout(guard2); cancelAnimationFrame(pump);
      LIVE.recording=false; updateLiveUI(); reject(e.error||new Error('REC_ERR')); };
    rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||mime||'video/webm'}));
    const dur=clamp(LIVE.duration||1.5,.3,3600);
    LIVE.recording=true; let started=false; updateLiveUI();
    const start=()=>{
      if(started||done) return; started=true;
      v.removeEventListener('seeked',start);
      try{ px.drawImage(canvas,0,0,proxy.width,proxy.height); }catch(e){}
      try{ rec.start(100); }catch(e){ LIVE.recording=false; reject(e); return; }
      livePlay(); pump=requestAnimationFrame(paint);
      v.addEventListener('ended',()=>setTimeout(finish,160),{once:true});
      guard=setTimeout(finish,dur*1000+450);
    };
    try{ v.currentTime=0; }catch(e){}
    v.addEventListener('seeked',start,{once:true});
    guard2=setTimeout(finish,dur*1000+1800);
    if(Math.abs(v.currentTime)<.02) setTimeout(()=>{ if(!done&&rec.state==='inactive') start(); },60);
  });
}
/* 极简 ZIP（store 模式，仅打包不压缩）：避免引入外部依赖 */
function crc32(buf){
  let table=crc32.table;
  if(!table){ table=crc32.table=new Uint32Array(256);
    for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); table[n]=c>>>0; } }
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c=table[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(), L=[], C=[]; let off=0;

    const name=enc.encode(f.name), data=f.data, crc=crc32(data);
    const lh=new Uint8Array(30+name.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true);
    lv.setUint32(14,crc,true); lv.setUint32(18,data.length,true); lv.setUint32(22,data.length,true);
    lv.setUint16(26,name.length,true); lh.set(name,30);

function localPoint(el,cx,cy){
  const c=qToClient(el.x,el.y), a=-(el.rot||0);

function hitHandle(cx,cy){
  const el=selEl(); if(!el||tool!=='elements') return null;
  const p=localPoint(el,cx,cy), m=elMetrics(el,ov.getContext('2d'),photoUnits());
  const hw=m.w/2+8, hh=m.h/2+8;
  const d=(hx,hy)=>Math.hypot(p.x-hx,p.y-hy)<=23;
  if(d(-hw,-hh)) return 'delete';
  if(d(hw,-hh)) return 'rotate';
  if(d(hw,hh)) return 'scale';

}
function hitEl(cx,cy){
  for(let i=state.elements.length-1;i>=0;i--){
    const el=state.elements[i]; if(el.on===false) continue;
    const U=photoUnits(), p=localPoint(el,cx,cy), m=elMetrics(el,ov.getContext('2d'),U);
    if(el.type==='draw'){
      const pts=el.pts||[], tol=Math.max(14,(el.width||.008)*U[0]*2+10);
      for(let j=0;j<pts.length;j++){
        const q=qToClient(pts[j][0],pts[j][1]);
        if(Math.hypot(cx-q[0],cy-q[1])<=tol) return el;
      }

    }
    if(Math.abs(p.x)<=m.w/2+10&&Math.abs(p.y)<=m.h/2+10) return el;
  }

}
function hitFx(cx,cy){

    const d=Math.hypot((cx-c[0])/Math.max(8,r.rx*ux),(cy-c[1])/Math.max(8,r.ry*uy));

function hitFxTab(cx,cy){

    const r=state.fxRegions[i], c=qToClient(r.cx,r.cy);
    if(Math.abs(cx-c[0])<=34&&Math.abs(cy-c[1])<=13) return r;

function exitDrawMode(silent){

  if(!silent) toast(was==='bokeh'?'已退出虚化涂抹，可继续调参数或编辑元素'

function elPointerDown(e){

  if(tool!=='elements') return false;
  const cx=e.clientX, cy=e.clientY;
  /* 涂抹是「整屏画笔」：画面上有文字 / 贴纸 / 效果圈 / 选中框时也必须能刷，
     且绝不能因为碰到删除手柄而误删元素。因此涂抹模式跳过一切元素交互。 */
  const brushing=typeof drawMode==='string'&&drawMode.startsWith('brush');
  const h=brushing?null:hitHandle(cx,cy);
  const tab0=brushing?null:hitFxTab(cx,cy);
  const hit0=brushing?null:hitEl(cx,cy);
  const fx0=brushing?null:hitFx(cx,cy);
  /* 1. 选中框的删除 / 旋转 / 缩放手柄 */
  if(h)
    exitDrawMode(true);
  if(h){
    const el=selEl(), before=JSON.stringify(state);
    if(h==='delete'){
      mutate(()=>{state.elements=state.elements.filter(v=>v.id!==el.id);selElId=null;buildPanel(true);});
      return true;
    }
    elDrag={mode:h,id:el.id,before,sx:cx,sy:cy,
      start:{scale:el.scale||1,rot:el.rot||0},
      center:qToClient(el.x,el.y)};
    capturePointer(stage,e);
    return true;
  }
  /* 2. 涂鸦是「新建」元素，允许直接画在已有元素上 */

    const el=elDefault('draw'), q=screenToQ(cx,cy);
    el.pts=[q]; const before=JSON.stringify(state);
    state.elements.push(el); selElId=el.id;
    elDrag={mode:'stroke',id:el.id,before};
    capturePointer(stage,e);
    return true;
  }

  /* 3. 点中已有元素一律回到编辑；「点放」模式下圈内也新建，方便连续叠放 */
  const placing=typeof drawMode==='string'&&drawMode.startsWith('place');
  if(!brushing){
    if(hit0||(!placing&&(tab0||fx0))) exitDrawMode(true);
    if(!placing&&tab0){ startFxDrag(tab0,e); return true; }
    if(hit0){
      selElId=hit0.id; activeFxId=null;
      const before=JSON.stringify(state), q=screenToQ(cx,cy);
      elDrag={mode:'move',id:hit0.id,before,dx:q[0]-hit0.x,dy:q[1]-hit0.y};
      capturePointer(stage,e);

    }
    if(!placing&&fx0){ startFxDrag(fx0,e); return true; }
  }

  /* 4. 执行涂抹 / 点放 */
  if(typeof drawMode==='string'&&drawMode.startsWith('brush')){
    const type=parseInt(drawMode.slice(5),10);
    const q=screenToQ(cx,cy);
    const rr=stage.getBoundingClientRect();
    brushCursor=[cx-rr.left,cy-rr.top];
    const before=JSON.stringify(state);
    if(state.brushStrokes.length>=80) state.brushStrokes.shift();
    state.brushStrokes.push({type,pts:[q],size:state.brushSize,strength:state.brushStrength});
    elDrag={mode:'brush',before,id:'brush-tmp'};
    lastBrushDraw=performance.now();
    rebuildBrushTextures(); render();
    capturePointer(stage,e);
    return true;
  }
  if(typeof drawMode==='string'&&drawMode.startsWith('place')){
    const q=screenToQ(cx,cy);
    addFx(parseInt(drawMode.slice(5),10),q);
    return true;
  }
  if(selElId||activeFxId){ selElId=null;activeFxId=null;render();buildPanel(true); }
  return false;
}

    el.x=clamp(q[0]-elDrag.dx,-.2,1.2); el.y=clamp(q[1]-elDrag.dy,-.2,1.2);

    const c=elDrag.center, d0=Math.hypot(elDrag.sx-c[0],elDrag.sy-c[1])||1;
    const d=Math.hypot(e.clientX-c[0],e.clientY-c[1]);
    el.scale=clamp(elDrag.start.scale*d/d0,.25,4);
  } else if(elDrag.mode==='rotate'){
    const c=elDrag.center;
    const a0=Math.atan2(elDrag.sy-c[1],elDrag.sx-c[0]);
    const a=Math.atan2(e.clientY-c[1],e.clientX-c[0]);
    el.rot=elDrag.start.rot+(a-a0);
  }
  render(); return true;
}
function elPointerUp(){
  if(!elDrag) return false;
  if(elDrag.mode==='brush'){
    const st=state.brushStrokes[state.brushStrokes.length-1];
    if(st&&st.pts.length<2) st.pts.push([st.pts[0][0]+.001,st.pts[0][1]+.001]);
    rebuildBrushTextures();
    commit(elDrag.before);
    const keep=drawMode; elDrag=null; drawMode=keep;
    syncUI(); buildPanel(true); render();
    return true;
  }
  if(elDrag.mode==='stroke'){
    const el=state.elements.find(v=>v.id===elDrag.id);
    if(el&&el.pts.length<2) state.elements=state.elements.filter(v=>v.id!==el.id);
  }
  commit(elDrag.before); elDrag=null;
  syncUI(); buildPanel(true); render();
  return true;
}

stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.zoomctl')||e.target.closest('#hist')||
     e.target.closest('#splitHandle')||e.target.closest('.import-card')||
     e.target.closest('.live-bar')||e.target.closest('.live-badge')) return;
  if(tool==='bokeh'&&drawMode==='bokeh'&&!picking&&!comparing){
    startBokehPaint(e); return;
  }
  if(maskPaintIdx()>=0&&!picking&&!comparing){
    startMaskPaint(e); return;
  }
  if(elPointerDown(e)) return;
  /* 长按画面 ≈ iOS「按住看实况」：≥420ms 开始播放，移动或松手停止 */
  if(LIVE.pair&&!picking&&!comparing&&tool!=='elements'){
    LIVE.holdFired=false; LIVE.holdX=e.clientX; LIVE.holdY=e.clientY;
    clearTimeout(LIVE.holdTimer);
    LIVE.holdTimer=setTimeout(()=>{ LIVE.holdFired=true; livePlay(); },420);
  }
  capturePointer(stage,e);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    const a=[...pointers.values()];
    pinchStart={dist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom:state.zoom,
      mid:[(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2],pan:[...state.pan]};
  } else if(pointers.size===1){
    dragStart={x:e.clientX,y:e.clientY,pan:[...state.pan],zoom:state.zoom};
  }
});
stage.addEventListener('pointermove',e=>{
  if(bokDrag){
    const r=stage.getBoundingClientRect();
    brushCursor=[e.clientX-r.left,e.clientY-r.top];
    moveBokehPaint(e); render(); return;
  }
  if(maskDrag){
    const r=stage.getBoundingClientRect();
    brushCursor=[e.clientX-r.left,e.clientY-r.top];
    moveMaskPaint(e); render(); return;
  }
  /* 涂抹光标：用「画布内相对坐标」，与叠加层绘制完全一致 */
  if(typeof drawMode==='string'&&(drawMode.startsWith('brush')||drawMode==='bokeh'||drawMode.startsWith('maskpaint'))){
    const r=stage.getBoundingClientRect();
    brushCursor=[e.clientX-r.left,e.clientY-r.top];
    render();
  } else if(brushCursor){ brushCursor=null; }
  if(elPointerMove(e)) return;
  if(LIVE.holdTimer&&Math.hypot(e.clientX-LIVE.holdX,e.clientY-LIVE.holdY)>8){
    clearTimeout(LIVE.holdTimer); LIVE.holdTimer=0;
  }
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinchStart){
    const a=[...pointers.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    state.zoom=clamp(pinchStart.zoom*d/pinchStart.dist,MIN_ZOOM,8);
    const mid=[(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2];
    const r=stage.getBoundingClientRect();
    state.pan=[pinchStart.pan[0]+(mid[0]-pinchStart.mid[0])/r.width/state.zoom,
               pinchStart.pan[1]+(mid[1]-pinchStart.mid[1])/r.height/state.zoom];
    $('#zVal').textContent=Math.round(state.zoom*100)+'%'; render();
  } else if(pointers.size===1&&dragStart&&Math.abs(state.zoom-1)>0.005){
    const r=stage.getBoundingClientRect();
    state.pan=[clamp(dragStart.pan[0]+(e.clientX-dragStart.x)/r.width/state.zoom,-1,1),
               clamp(dragStart.pan[1]+(e.clientY-dragStart.y)/r.height/state.zoom,-1,1)];
    render();
  }
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,e=>{
  clearTimeout(LIVE.holdTimer); LIVE.holdTimer=0;

  endBokehPaint();

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  /* 按 deltaMode 归一化后做指数映射：鼠标一格约 8%，触控板小位移更细，
     单步最多 1.10，避免以前固定 1.12 在桌面端「一滚就跳一大截」。 */
  const unit=e.deltaMode===1?16:(e.deltaMode===2?100:1);
  const d=clamp(e.deltaY*unit,-100,100);
  const f=Math.exp(-d*0.00085);
  setZoom(state.zoom*clamp(f,1/1.10,1.10),{x:e.clientX,y:e.clientY});

function dockMax(){ return isWide()?Math.min(560,window.innerWidth*0.55):window.innerHeight*0.72; }

/* 取色笔：色相选择 / 蒙版定位 / 白平衡吸管 */
let pickMode=null, pickIdx=0;
function pickFromCanvas(e,mode,cb){
  const r=stage.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  const px=clamp(Math.floor((e.clientX-r.left)*dpr),0,canvas.width-1);
  const py=clamp(Math.floor((e.clientY-r.top)*dpr),0,canvas.height-1);
  const u=(e.clientX-r.left)/r.width, v=(e.clientY-r.top)/r.height;
  if(mode==='mask'){
    mutate(()=>{ const m=state.masks[pickIdx]; if(m){m.cx=+u.toFixed(3);m.cy=+v.toFixed(3);m.on=true;} buildPanel(); });
    toast('蒙版中心已定位'); return;
  }
  const one=new Uint8Array(4);
  gl.readPixels(px,canvas.height-1-py,1,1,gl.RGBA,gl.UNSIGNED_BYTE,one);
  const [R,G,B]=[one[0]/255,one[1]/255,one[2]/255];
  if(mode==='wb'){
    const avg=(R+G+B)/3;
    const t=clamp((R-B)/0.20,-1,1), ti=clamp((G-avg)/0.08,-1,1);
    mutate(()=>{ state.base.temp=clamp(state.base.temp-t*.55,-1,1); state.base.tint=clamp(state.base.tint-ti*.35,-1,1); buildPanel(); });
    toast('白平衡已按取样点校正'); return;
  }
  const mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn;
  let h=0;
  if(d>1e-6){ if(mx===R)h=((G-B)/d+6)%6; else if(mx===G)h=(B-R)/d+2; else h=(R-G)/d+4; h/=6; }
  let best=0,bd=9;
  HUE_CENTERS.forEach((c,i)=>{const dd=Math.abs(((h-c+.5)%1+1)%1-.5);if(dd<bd){bd=dd;best=i;}});
  const id=HUES[best];
  if(cb) cb(id); else { state.hslChannel=id; state.plateTarget=id; toast('已选中「'+TARGETS.find(t=>t.id===id).name+'」色域'); buildPanel(); }
}
function endPick(){ picking=false; pickMode=null; pickCb=null; stage.style.cursor=''; app.classList.remove('picking'); }
stage.addEventListener('click',e=>{ if(picking&&!e.target.closest('button')&&!e.target.closest('.zoomctl')&&!e.target.closest('#hist')){
  const mode=pickMode, cb=pickCb;
  endPick(); pickFromCanvas(e,mode,cb);
} });
function startPick(cb,mode,idx){
  picking=true; pickCb=cb||null; pickMode=mode||null; pickIdx=idx||0;
  stage.style.cursor='crosshair'; app.classList.add('picking');
  toast((mode==='mask'?'在照片上点一下设置蒙版中心':mode==='wb'?'点一下照片上的中性灰区域':'在照片上点一下要调整的颜色')+'（Esc 取消）');
}

/* 系统原生长按选取 / 右键菜单 / 文字拖拽：只允许在可编辑控件里发生 */
const EDITABLE_SEL='input,textarea,select,[contenteditable="true"]';
function blockNativeTextUI(e){
  let t=e.target; if(t&&t.nodeType===3) t=t.parentElement;
  if(t&&t.closest&&t.closest(EDITABLE_SEL)) return;

window.addEventListener('keydown',e=>{
  /* 全局搜索优先级最高：面板打开时独占按键 */
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault(); CMD.open?closeCmd():openCmd(); return;
  }
  if(CMD.open){
    if(e.key==='Escape'){ e.preventDefault(); closeCmd(); return; }
    return;
  }
  if(e.key==='/'&&!(e.ctrlKey||e.metaKey)&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){
    e.preventDefault(); openCmd(); return;
  }
  if(e.key==='Escape'&&picking){ e.preventDefault(); endPick(); toast('已取消取色'); return; }
  if(e.key==='Escape'&&spCurrent){ e.preventDefault(); closeSubPage(); return; }
  if(e.key==='Escape'&&tbMenuOpen){ e.preventDefault(); toggleTbMenu(false); return; }
  if(e.key==='Escape'&&exportMenuOpen){ e.preventDefault(); setExportMenu(false); return; }
  if(e.key==='Enter'&&exportMenuOpen){ e.preventDefault(); setExportMenu(false); doExport(); return; }
  const el=document.activeElement||{}, tag=el.tagName||'';
  const typing=/INPUT|TEXTAREA|SELECT/.test(tag)||el.isContentEditable;
  if(e.code==='Space'&&!typing){e.preventDefault();if(!e.repeat)setCompare(true);return;}
  if(typing)return;
  const meta=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(meta&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(meta&&k==='y'){e.preventDefault();redo();return;}
  if(meta&&k==='s'){e.preventDefault();doExport();return;}
  if(meta&&k==='o'){e.preventDefault();$('#file').click();return;}
  if(meta)return;
  if(/^[0-9]$/.test(e.key)){
    const idx=e.key==='0'?TOOLS.length-1:parseInt(e.key,10)-1;
    if(TOOLS[idx]) gotoTool(TOOLS[idx].id);
    return;
  }
  if(e.key==='Escape'&&tool==='crop'&&cropSession){ e.preventDefault(); cropCancel(); return; }
  if(e.key==='Escape'&&drawMode){const was=drawMode;drawMode=null;bokDrag=null;maskDrag=null;buildPanel(true);
    toast(was==='bokeh'?'已退出虚化涂抹':'已退出放置模式');return;}
  if(k==='\\'){$('#zMode').click();return;}
  if(k==='t'){saveCurrentTone();return;}
  if(k==='e'){doExport();return;}
  if(k==='l'&&LIVE.pair){LIVE.playing?livePause():livePlay();return;}
  if(k==='f'){app.classList.contains('dock-off')?expandDock():collapseDock();return;}
  if(k==='r'){mutate(()=>{state.splitOn=!state.splitOn;buildPanel();});return;}
});

/* ---------- 状态 / 历史（差分存储） ---------- */
function commit(before){
  let b;
  try{ b=(typeof before==='string')?JSON.parse(before):(before?deep(before):null); }
  catch(e){ return; }
  if(!b) return;
  const a=deep(state);
  const f=irisDelta(b,a);
  if(!Object.keys(f.s).length&&!f.d.length) return;      // 没变化就不记一步
  undoStack.push({f,b:irisDelta(a,b),m:stateLabel(a)});  // 正向 / 反向 / 摘要
  if(undoStack.length>60)undoStack.shift();
  redoStack=[];
  /* 文字拖拽 / 涂鸦 / 马赛克涂抹 / 蒙版涂抹 / 虚化涂抹 / 点放效果的结束
     全部只走 commit()，以前不触发自动保存 —— 只剩退出瞬间的异步落盘，
     软件被直接关掉时就来不及写。这里补一次常规落盘。 */
  if(window.IrisAutosave&&IrisAutosave.touch) IrisAutosave.touch();
}
function mutate(fn){ const b=deep(state); fn(); commit(b); syncUI(); requestRender();
  if(window.IrisAutosave) IrisAutosave.schedule(); }
function undo(){
  if(!undoStack.length)return;
  const step=undoStack.pop();
  state=irisApply(deep(state),step.b);
  redoStack.push(step);
  afterHistory();
}
function redo(){
  if(!redoStack.length)return;
  const step=redoStack.pop();
  state=irisApply(deep(state),step.f);
  undoStack.push(step);
  afterHistory();
}
function afterHistory(){ $('#zVal').textContent=Math.round(state.zoom*100)+'%'; buildPanel(); render();
  if(window.IrisAutosave) IrisAutosave.schedule(); }
$('#btnUndo').onclick=undo; $('#btnRedo').onclick=redo;
$('#btnReset').onclick=()=>mutate(()=>{
  const z=state.zoom,p=state.pan; state=defaultState(); state.zoom=z;state.pan=p;
  filterText=''; filterGroup='全部';
  selElId=null;activeFxId=null;drawMode=null;
  buildPanel();
});

/* ---------- UI 组件 ---------- */
const refs={};
function getPath(p){ let o=state; for(const k of p.split('.')) o=o[k]; return o; }
function setPath(p,v){ const ks=p.split('.'); let o=state; for(let i=0;i<ks.length-1;i++)o=o[ks[i]]; o[ks[ks.length-1]]=v; }
function fmt(v,unit){ const n=Math.round(v*100)/100; return (unit==='%'? Math.round(v*100):n)+(unit||''); }
function slider(path,label,min,max,step,unit,def){
  const wrap=document.createElement('div'); wrap.className='sld';
  const h=document.createElement('div'); h.className='sld-h';
  const nm=document.createElement('span'); nm.textContent=label;
  const val=document.createElement('b'); h.append(nm,val);
  const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step;
  inp.setAttribute('aria-label',label);
  const d=def===undefined?0:def;
  let before=null, gesture=null, vLocked=false;
  let lastFill='', lastTxt='';
  /* syncUI 会遍历所有滑杆：值没变就不碰 DOM，减少无意义的样式重算 */
  const upd=()=>{ const v=getPath(path);
    if(inp.value!=v) inp.value=v;
    const f=((v-min)/(max-min)*100)+'%';
    if(f!==lastFill){ inp.style.setProperty('--fill',f); lastFill=f; }
    const t=(unit==='%'?Math.round(v*100):(Math.round(v*100)/100))+(unit||'');
    if(t!==lastTxt){ val.textContent=t; lastTxt=t; } };
  /* 手势方向锁：手指从滑杆上起手、想上下滚页面时，数值一律还原到按下前。
     touch-action:pan-y 让浏览器接管垂直滚动；pointercancel / touchmove 双保险。 */
  const restore=()=>{
    if(!gesture) return;
    setPath(path,gesture.v); inp.value=gesture.v; upd(); requestRender();
  };
  const lockVertical=()=>{ if(vLocked) return; vLocked=true; restore(); };
  const checkMove=(x,y)=>{
    if(!gesture||vLocked) return;
    const dx=x-gesture.x, dy=y-gesture.y;
    if(Math.abs(dy)>9&&Math.abs(dy)>Math.abs(dx)*1.2) lockVertical();
  };
  inp.addEventListener('pointerdown',e=>{
    before=JSON.stringify(state);
    gesture={x:e.clientX,y:e.clientY,v:getPath(path)};
    vLocked=false;
  });
  inp.addEventListener('pointermove',e=>checkMove(e.clientX,e.clientY));
  inp.addEventListener('pointercancel',()=>lockVertical()); // 浏览器已接管垂直滚动
  inp.addEventListener('touchmove',e=>{
    const t=e.touches&&e.touches[0]; if(t) checkMove(t.clientX,t.clientY);
  },{passive:true});
  inp.addEventListener('focus',()=>{ if(!gesture) before=JSON.stringify(state); });
  inp.addEventListener('input',()=>{
    if(vLocked){ inp.value=gesture?gesture.v:getPath(path); upd(); return; }
    setPath(path,parseFloat(inp.value)); upd(); requestRender();
  });
  inp.addEventListener('change',()=>{
    if(vLocked) restore(); else commit(before);
    before=null; gesture=null; vLocked=false;
  });
  inp.addEventListener('dblclick',()=>mutate(()=>{setPath(path,d);upd();}));
  wrap.append(h,inp); refs[path]={upd}; upd();
  return wrap;
}

/* ============================================================
   Iris 检查更新 · 版本元数据 / GitHub 通道 / 独立页面
   ------------------------------------------------------------
   1) 默认零网络请求：只有用户主动点「检查更新」才发请求；
      「启动时自动检查」默认关闭，开启后每次启动也只发一次轻量请求。
   2) 请求只发往 api.github.com / raw.githubusercontent.com 的公开接口，
      credentials:omit + referrerPolicy:no-referrer + cache:no-store，
      不带 Cookie、不带照片、不带任何编辑数据、不带自定义请求头。
   3) 远端内容一律当纯文本读取，绝不插入 DOM、绝不 eval；
      所有外链先过 https / GitHub 域名白名单再交给系统浏览器。
   4) 断网、限流、404、旧版页面格式都有明确降级与提示，
      检查失败不影响任何编辑与导出功能。
   ============================================================ */
const IRIS_VERSION='1.0.4';
const IRIS_BUILD='2026-11-11';
const IRIS_CHANNEL='rc';                 /* rc = 近乎最终版 */
const IRIS_SOURCE_TAG='v1.0.3';          /* 本版基于仓库的哪个已发布版本 */
const IRIS_REPO_DEFAULT={
  owner:'david1a21',repo:'iris-palette',branch:'main',path:'web/index.html'
};
let IRIS_UPD_CFG=(()=>{
  const d=Object.assign({auto:false},IRIS_REPO_DEFAULT);
  try{ Object.assign(d,JSON.parse(localStorage.getItem('iris_update_cfg')||'{}')); }catch(e){}
  d.owner=String(d.owner||IRIS_REPO_DEFAULT.owner).replace(/[^A-Za-z0-9_.-]/g,'');
  d.repo=String(d.repo||IRIS_REPO_DEFAULT.repo).replace(/[^A-Za-z0-9_.-]/g,'');
  d.branch=String(d.branch||IRIS_REPO_DEFAULT.branch).replace(/[^A-Za-z0-9_./-]/g,'');
  d.path=String(d.path||IRIS_REPO_DEFAULT.path).replace(/[^A-Za-z0-9_./-]/g,'');
  return d;
})();
function irisUpdateSaveCfg(){
  try{ localStorage.setItem('iris_update_cfg',JSON.stringify(IRIS_UPD_CFG)); }catch(e){}
}
let IRIS_UPD_LAST=null;
try{ IRIS_UPD_LAST=JSON.parse(localStorage.getItem('iris_update_last')||'null'); }catch(e){ IRIS_UPD_LAST=null; }
let IRIS_UPD_BUSY=false;

/* 只允许 https + GitHub 系域名，防仓库配置被改成恶意地址 */
function irisSafeUrl(u){
  try{
    const x=new URL(u,String(location.href));
    if(x.protocol!=='https:') return false;
    const h=x.hostname.toLowerCase();
    return h==='github.com'||h==='api.github.com'||h==='github.io'||
           h==='raw.githubusercontent.com'||h.endsWith('.githubusercontent.com')||h.endsWith('.github.io');
  }catch(e){ return false; }
}
/* 用一个临时 <a> 触发点击：网页正常开新标签；桌面 / 移动外壳的
   既有链接拦截器会把它交给系统浏览器，不会在 WebView 里跳转。 */
function irisOpenExternal(url){
  if(!irisSafeUrl(url)){ toast('链接不在 GitHub 域名白名单内，已阻止'); return; }
  const a=document.createElement('a');
  a.href=url; a.target='_blank'; a.rel='noopener noreferrer';
  a.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none';
  document.body.appendChild(a);
  try{ a.click(); }catch(e){ try{ window.open(url,'_blank','noopener,noreferrer'); }catch(e2){} }
  setTimeout(()=>{ try{ a.remove(); }catch(e){} },0);
}

/* 宽松 semver：v1.0.3 / 1.0.4 / 1.2.0-rc.1 都能比 */
function irisSemver(v){
  const m=String(v||'').trim().replace(/^v/i,'').match(/^(\d+)\.(\d+)\.(\d+)(?:[-.]([0-9A-Za-z.-]+))?/);
  if(!m) return null;
  return {n:[+m[1],+m[2],+m[3]],pre:m[4]?String(m[4]).toLowerCase().split(/[.-]/).filter(Boolean):[]};
}
function irisSemverCmp(a,b){
  const A=irisSemver(a),B=irisSemver(b);
  if(!A||!B) return null;
  for(let i=0;i<3;i++){ if(A.n[i]!==B.n[i]) return A.n[i]<B.n[i]?-1:1; }
  if(!A.pre.length&&!B.pre.length) return 0;
  if(!A.pre.length) return 1;          /* 正式版 > 预发布 */
  if(!B.pre.length) return -1;
  const n=Math.max(A.pre.length,B.pre.length);
  for(let i=0;i<n;i++){
    const x=A.pre[i],y=B.pre[i];
    if(x===undefined) return -1;
    if(y===undefined) return 1;
    if(x===y) continue;
    const nx=/^\d+$/.test(x),ny=/^\d+$/.test(y);
    if(nx&&ny) return (+x)<(+y)?-1:1;
    if(nx) return 1; if(ny) return -1;
    return x<y?-1:1;
  }
  return 0;
}

/* 统一 fetch：8s 超时、无凭据、无 referrer、不缓存。
   headOnly 用流式读取前 16KB 再 cancel 连接，避免为了读一个 meta
   把整份 800KB 页面下载完；不支持流时自动退回全文截取。 */
async function irisFetch(url,opt){
  opt=opt||{};
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),opt.headOnly?(opt.timeout||12000):(opt.timeout||8000));
  try{
    const res=await fetch(url,{signal:ctrl.signal,cache:'no-store',
      credentials:'omit',referrerPolicy:'no-referrer',redirect:'follow'});
    const rate=res.headers.get('x-ratelimit-remaining');
    const size=Number(res.headers.get('content-length'))||0;
    let text='';
    if(opt.headOnly){
      const max=opt.max||16384;
      if(res.ok&&res.body&&typeof res.body.getReader==='function'&&typeof TextDecoder!=='undefined'){
        const rd=res.body.getReader(),dec=new TextDecoder();
        try{
          while(text.length<max){
            const r=await rd.read();
            if(r.done) break;
            text+=dec.decode(r.value,{stream:true});
            /* 版本 meta 一定在 head 里；读到 </head> / iris-version 就停，
               不必等整块 16KB 到齐，慢网络下能省掉好几秒空等。 */
            if(/<\/head>|<meta[^>]+iris-version/i.test(text)) break;
          }
        }finally{ try{ await rd.cancel(); }catch(e){} }
      }else{ text=(await res.text()).slice(0,max); }
    }else{ text=await res.text(); }
    let json=null;
    if(!opt.headOnly){ try{ json=JSON.parse(text); }catch(e){} }
    return {res,text,json,rate,size};
  }finally{ clearTimeout(timer); }
}
function irisErrMsg(e){
  if(e&&e.name==='AbortError') return '请求超时，可能是网络不通或该域名不可达';
  return (e&&e.message)||'网络连接失败';
}
function irisRepoUrls(cfg){
  const o=encodeURIComponent(cfg.owner),r=encodeURIComponent(cfg.repo);
  const b=encodeURIComponent(cfg.branch).replace(/%2F/g,'/');
  const path=String(cfg.path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
  return {
    release:'https://api.github.com/repos/'+o+'/'+r+'/releases/latest',
    version:'https://raw.githubusercontent.com/'+o+'/'+r+'/'+b+'/version.json',
    page:'https://raw.githubusercontent.com/'+o+'/'+r+'/'+b+'/'+path,
    repo:'https://github.com/'+o+'/'+r,
    releases:'https://github.com/'+o+'/'+r+'/releases'
  };
}

/* 通道 ①：最新 Release（最权威，约 2KB） */
async function irisGetRelease(U){
  try{
    const q=await irisFetch(U.release);
    const rate=q.rate;
    if(q.res.status===404) return {kind:'none',rate,note:'仓库还没有发布 Release'};
    if(!q.res.ok) return {kind:'error',rate,code:q.res.status,
      note:q.res.status===403?'GitHub 匿名接口限流（60 次/小时），请稍后再试':'HTTP '+q.res.status};
    const j=q.json||{};
    return {kind:'ok',rate,tag:String(j.tag_name||''),name:String(j.name||''),
      published:String(j.published_at||''),body:String(j.body||'').slice(0,4000),
      url:String(j.html_url||U.releases),
      assets:(Array.isArray(j.assets)?j.assets:[]).slice(0,10).map(a=>({
        name:String(a.name||''),size:Number(a.size)||0,
        url:String(a.browser_download_url||'')}))};
  }catch(e){ return {kind:'error',note:irisErrMsg(e)}; }
}
/* 通道 ②：可选的仓库根目录 version.json（读取失败静默跳过） */
async function irisGetVersionJson(U){
  try{
    const q=await irisFetch(U.version,{timeout:3500});
    if(!q.res.ok||!q.json) return null;
    const j=q.json;
    return {version:String(j.version||j.tag||''),build:String(j.build||''),note:String(j.note||'')};
  }catch(e){ return null; }
}
/* 通道 ③：线上页面最后一次提交（走 API，几 KB，国内网络比 raw 稳） */
async function irisGetLastCommit(U,cfg){
  try{
    const o=encodeURIComponent(cfg.owner),r=encodeURIComponent(cfg.repo);
    const u='https://api.github.com/repos/'+o+'/'+r+'/commits?path='
      +encodeURIComponent(cfg.path)+'&per_page=1';
    const q=await irisFetch(u,{timeout:4000});
    if(!q.res.ok) return {error:'HTTP '+q.res.status};
    const arr=Array.isArray(q.json)?q.json:[];
    const c=arr[0]; if(!c) return null;
    return {sha:String(c.sha||'').slice(0,7),
      date:String((c.commit&&c.commit.committer&&c.commit.committer.date)||''),
      msg:String((c.commit&&c.commit.message)||'').split('\n')[0].slice(0,120)};
  }catch(e){ return {error:irisErrMsg(e)}; }
}
/* 通道 ④：线上页面头部的版本 meta（深度比对时才读，流式仅取 16KB） */
async function irisGetPageMeta(U){
  try{
    const q=await irisFetch(U.page,{headOnly:true,max:16384,timeout:4000});
    if(!q.res.ok) return {error:'HTTP '+q.res.status};
    const t=q.text||'';
    const mv=t.match(/<meta\s+name=["']iris-version["']\s+content=["']([^"']+)["']/i);
    const mb=t.match(/<meta\s+name=["']iris-build["']\s+content=["']([^"']+)["']/i);
    return {version:mv?mv[1]:'',build:mb?mb[1]:'',size:q.size,
            legacy:!mv,source:U.page};
  }catch(e){ return {error:irisErrMsg(e),source:U.page}; }
}

/* 主流程：快速检查只发 1 个请求；深度比对再并行读两个 raw 文件。
   任一通道失败都自动降级，不会把「没查到」谎报成「已是最新」。 */
async function irisCheckUpdate(opt){
  opt=opt||{};
  if(IRIS_UPD_BUSY) return IRIS_UPD_LAST;
  IRIS_UPD_BUSY=true;
  const cfg=IRIS_UPD_CFG,U=irisRepoUrls(cfg),deep=!!opt.deep;
  const out={checkedAt:new Date().toISOString(),deep,
    local:{version:IRIS_VERSION,build:IRIS_BUILD,channel:IRIS_CHANNEL,sourceTag:IRIS_SOURCE_TAG},
    repo:cfg.owner+'/'+cfg.repo,urls:U,sources:[],errors:[],status:'unknown'};
  try{
    const rel=await irisGetRelease(U);
    out.release=rel;
    if(rel.kind==='ok') out.sources.push('Releases API · '+rel.tag);
    else if(rel.kind==='none') out.errors.push(rel.note);
    else out.errors.push(rel.note||('Release 接口 '+rel.code));

    let vj=null,pm=null,cm=null;
    /* Release 不可用（限流 / 404 / 断网）或用户要深度比对时，走附加通道。
       三个都设短超时并行执行，最坏 4 秒；慢网络下主结论仍由 Release 给出。 */
    const needRaw=(rel.kind!=='ok')||deep;
    if(needRaw){
      const [a,b,c]=await Promise.allSettled([
        irisGetVersionJson(U),irisGetPageMeta(U),irisGetLastCommit(U,cfg)]);
      vj=a.status==='fulfilled'?a.value:null;
      pm=b.status==='fulfilled'?b.value:null;
      cm=c.status==='fulfilled'?c.value:null;
      out.versionJson=vj; out.pageMeta=pm; out.lastCommit=cm;
      if(vj&&vj.version) out.sources.push('version.json · '+vj.version);
      if(pm&&pm.version) out.sources.push('线上页面 meta · '+pm.version);
      else if(pm&&pm.legacy) out.sources.push('线上页面 · 旧版格式（无版本 meta）');
      if(cm&&cm.sha) out.sources.push('页面最近提交 · '+cm.sha);
      if(pm&&pm.error) out.errors.push('线上页面头部未读到（版本结论仍以 Release 为准）：'+pm.error);
    }
    let base='';
    if(rel.kind==='ok'&&rel.tag) base=rel.tag;
    else if(vj&&vj.version) base=vj.version;
    else if(pm&&pm.version) base=pm.version;
    out.remote=base;
    const cmp=base?irisSemverCmp(IRIS_VERSION,base):null;
    if(cmp===null){
      const allFailed=(rel.kind==='error')&&(!pm||pm.error)&&!vj;
      out.status=allFailed?'error':'unknown';
    }else{
      out.status=cmp<0?'new':cmp===0?'same':'ahead';
    }
    if(out.status==='unknown'&&!out.errors.length) out.errors.push('没有可用的版本号来源，无法判定');
    out.rate=rel.rate;
    out.hadError=out.errors.length>0;
    /* 有明确版本结论时，通道告警只是附注，不算失败 */
    if(['new','same','ahead'].includes(out.status)) out.hadError=false;
  }catch(e){ out.status='error'; out.errors.push(irisErrMsg(e)); }
  finally{ IRIS_UPD_BUSY=false; }
  IRIS_UPD_LAST=out;
  try{ localStorage.setItem('iris_update_last',JSON.stringify(out)); }catch(e){}
  if(typeof window.__irisUpdRefresh==='function'){
    try{ window.__irisUpdRefresh(out); }catch(e){}
  }
  return out;
}
function irisUpdateStateLabel(st){
  return ({new:'发现新版本',same:'已是最新版本',ahead:'本地版本更新',
    unknown:'无法判定版本',error:'检查失败'})[st]||'未检查';
}
function irisFmtSize(n){
  if(!n||n<0) return '';
  return n>=1048576?(n/1048576).toFixed(1)+' MB':(n/1024).toFixed(0)+' KB';
}
function irisFmtTime(t){
  if(!t) return '—';
  const d=new Date(t);
  if(isNaN(d.getTime())) return String(t);
  return d.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

/* ---------------- 独立页面：检查更新 ---------------- */
function renderUpdatePage(body){

async function irisRunUpdate(btn,deep){
  if(IRIS_UPD_BUSY) return;
  const old=btn.textContent;
  btn.textContent='检查中…'; btn.disabled=true;
  const res=document.getElementById('updResult');
  if(res) res.innerHTML='<div class="upd-loading">正在读取 GitHub 的公开版本信息…</div>';
  try{
    const out=await irisCheckUpdate({deep:deep});
    if(res) renderUpdateResult(res,out);
    toast(irisUpdateStateLabel(out.status));
  }finally{ btn.textContent=old; btn.disabled=false; }
}
/* 远端文本一律 textContent；不拼 HTML，杜绝注入 */
function renderUpdateResult(box,out){
  if(!box) return;
  box.innerHTML='';
  const wrap=spEl('div','upd-card');
  if(!out){
    wrap.append(spEl('div','sk-sec','检查结果 <em>尚未检查</em>'));
    const p=spEl('div','upd-empty','还没有检查过。点上面的「检查更新」读取仓库里的最新版本；不检查就永远不会联网。');
    wrap.append(p); box.append(wrap); return;
  }
  const head=spEl('div','upd-head');
  const badge=spEl('span','upd-badge '+out.status,irisUpdateStateLabel(out.status));
  head.append(badge);
  const t=spEl('small','',irisFmtTime(out.checkedAt)+(out.deep?' · 深度比对':' · 快速检查'));
  head.append(t); wrap.append(head);

  const kv=spEl('div','upd-kv');
  const rows=[
    ['本机版本',out.local.version+(out.local.channel==='rc'?'（RC）':'')],
    ['线上版本',out.remote||'未读到版本号'],
    ['数据来源',out.sources.length?out.sources.join('、'):'无'],
    ['接口余量',out.rate!==undefined&&out.rate!==null?('剩余 '+out.rate+' 次 / 小时'):'—']
  ];
  if(out.release&&out.release.kind==='ok'){
    rows.push(['发布时间',irisFmtTime(out.release.published)]);
    rows.push(['Release',out.release.name||out.release.tag]);
  }
  if(out.pageMeta&&!out.pageMeta.error){
    /* 不显示 content-length：GitHub raw 走 gzip，那是压缩后的传输字节，
       不是文件真实大小，写出来会误导。只报告读到了什么版本标记。 */
    rows.push(['线上页面','已读取头部 · '+(out.pageMeta.legacy
      ?'旧版格式（未内嵌版本 meta）':'内嵌版本 '+out.pageMeta.version)]);
  }
  if(out.lastCommit&&out.lastCommit.sha){
    rows.push(['页面最近提交',out.lastCommit.sha+' · '+irisFmtTime(out.lastCommit.date)
      +(out.lastCommit.msg?' · '+out.lastCommit.msg:'')]);
  }
  rows.forEach(([k,v])=>{
    const a=spEl('span','upd-k',k),b=spEl('span','upd-v',''); b.textContent=v;
    kv.append(a,b);
  });
  wrap.append(kv);

  const msg=spEl('div','upd-msg');
  msg.textContent=({
    new:'仓库里已发布比本机更新的版本。下面的链接可以打开 Release 页面查看更新内容与安装包；本功能不会替你自动下载或替换文件。',
    same:'本机版本与线上最新发布一致，无需更新。',
    ahead:'本机版本比仓库里已发布的版本更新 —— 通常说明你手上这份是尚未上传 / 尚未打 tag 的开发版。把这版页面传上去并发布对应 tag 后，就会显示「已是最新版本」。',
    unknown:'没有拿到可比较的版本号。可能是仓库还没有 Release、页面是未带版本标记的旧格式，或网络受限。下面列出了具体原因。',
    error:'检查没有完成。编辑与导出功能完全不受影响，可稍后重试。'
  })[out.status]||'';
  wrap.append(msg);

  if(out.errors&&out.errors.length){
    const eb=spEl('div','upd-err');
    eb.append(spEl('b','',(['new','same','ahead'].includes(out.status)?'附注':'诊断信息')));
    out.errors.slice(0,4).forEach(e=>{ const d=spEl('div','',''); d.textContent=e; eb.append(d); });
    wrap.append(eb);
  }
  if(out.release&&out.release.kind==='ok'&&out.release.body){
    const det=document.createElement('details'); det.className='upd-fold upd-notes';
    const su=document.createElement('summary'); su.textContent='查看本次 Release 的更新说明'; det.append(su);
    const pre=spEl('div','upd-body',''); pre.textContent=out.release.body; det.append(pre);
    wrap.append(det);
  }
  if(out.release&&out.release.kind==='ok'&&out.release.assets&&out.release.assets.length){
    const ah=spEl('div','sk-sec','发布资源 <em>点击交给系统浏览器下载 · 不在页面内加载</em>');
    wrap.append(ah);
    const list=spEl('div','upd-assets');
    out.release.assets.forEach(a=>{
      const row=spEl('div','upd-asset');
      const nm=spEl('span','upd-asset-n',''); nm.textContent=a.name;
      const sz=spEl('small','',irisFmtSize(a.size));
      const bt=spEl('button','upd-mini','下载');
      if(irisSafeUrl(a.url)) bt.onclick=()=>irisOpenExternal(a.url);
      else bt.disabled=true;
      row.append(nm,sz,bt); list.append(row);
    });
    wrap.append(list);
  }
  const acts=spEl('div','upd-btns');
  const b1=spEl('button','upd-btn','↗ 打开仓库');
  b1.onclick=()=>irisOpenExternal(out.urls.repo);
  const b2=spEl('button','upd-btn','↗ 打开 Releases');
  b2.onclick=()=>irisOpenExternal(out.urls.releases);
  const b3=spEl('button','upd-btn','⧉ 复制 Release 链接');
  b3.onclick=()=>{
    const u=(out.release&&out.release.kind==='ok')?out.release.url:out.urls.releases;
    if(irisSafeUrl(u)&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(()=>toast('链接已复制'),()=>toast('复制失败，请手动打开'));
    }else toast('复制失败，请手动打开');
  };
  acts.append(b1,b2,b3); wrap.append(acts);
  box.append(wrap);
}

/* 启动时自动检查：默认关闭。开启后延迟 2.2s 发一次轻量请求，

  {id:'mist',    name:'晨雾白',en:'MIST',    desc:'冷灰白 + 靛蓝，明亮清爽',bg:'#e9edf3',panel:'#e8edf5',accent:'#3d6f9e',mode:'light'},
  {id:'paper',   name:'纸白暖',en:'PAPER',   desc:'暖米白 + 棕红，纸质杂志感',bg:'#f2ede4',panel:'#ece4d8',accent:'#a3593f',mode:'light'},
  {id:'liquid',  name:'液态玻璃',en:'LIQUID',desc:'高斯模糊玻璃 · 折射高光 · 冷蓝虹彩',bg:'#080e1c',panel:'#7e9ee0',accent:'#8fb8ff',mode:'dark',glass:true}
];
const IRIS_UIS=[
  {id:'classic',name:'原版界面',en:'CLASSIC',
   desc:'从第一版沿用到现在的紧凑布局：贴边顶栏、直角工作区、细线条层级，信息密度最高。'},
  {id:'nova',name:'Nova 全新界面',en:'NOVA',
   desc:'完整重做的视觉语言：悬浮玻璃顶栏、浮起的大圆角工作卡、卡片化分组、药丸控件与柔和光影。所有功能与位置不变。'}
];
const IRIS_RADII=[{id:'soft',name:'柔和',desc:'16px'},{id:'standard',name:'标准',desc:'26px'},
  {id:'max',name:'超大',desc:'38px'}];
function irisSkinRead(){
  const d={theme:'aurum',ui:'classic',radius:'standard',motion:true,glass:true,glassAlpha:.55};
  try{ return Object.assign(d,JSON.parse(localStorage.getItem('iris_skin')||'{}')); }catch(e){ return d; }
}
let irisSkin=irisSkinRead();
function irisTheme(){ return IRIS_THEMES.find(t=>t.id===irisSkin.theme)||IRIS_THEMES[0]; }
let lastAppliedUI=null;
function irisSkinApply(animate){
  const r=document.documentElement, t=irisTheme();
  r.dataset.theme=t.id;
  r.dataset.ui=irisSkin.ui==='nova'?'nova':'classic';
  r.dataset.radius=IRIS_RADII.some(x=>x.id===irisSkin.radius)?irisSkin.radius:'standard';
  r.dataset.glass=irisSkin.glass===false?'off':'on';
  /* 玻璃浓度：用户可调 0.20~0.90；旧存档没有这个字段时回落默认 */
  const ga=parseFloat(irisSkin.glassAlpha);
  r.style.setProperty('--glass-alpha',String((isFinite(ga)&&ga>=.2&&ga<=.9)?ga:.55));
  if(irisSkin.motion===false) r.dataset.motion='off';
  else r.removeAttribute('data-motion');
  const mc=document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute('content',t.bg);
  /* 关键容器的圆角用内联值兜底：个别 Chromium/WebView 对「样式表规则里
     纯 var() 作为 border-radius 简写值」求值时会出现级联异常（规则命中、
     变量有值、computed 仍是 0）。内联样式优先级更高且跨平台稳定。
     切回原版时移除，完全恢复第一版的直角外观。 */
  const px=({soft:16,standard:26,max:38})[r.dataset.radius]||26;
  const light=t.mode==='light';
  document.querySelectorAll('.dock,.topbar,.import-card,.more-menu,.tb-menu,.export-menu')
    .forEach(el=>{
      if(r.dataset.ui==='nova'){
        el.style.borderRadius=px+'px';
        el.style.boxShadow=light?'0 18px 46px rgba(40,48,72,.18)'
                                :'0 20px 60px rgba(0,0,0,.36)';
      } else { el.style.removeProperty('border-radius'); el.style.removeProperty('box-shadow'); }
    });
  try{ localStorage.setItem('iris_skin',JSON.stringify(irisSkin)); }catch(e){}
  if(animate){
    r.classList.remove('iris-skin-in'); void r.offsetWidth; r.classList.add('iris-skin-in');
    setTimeout(()=>r.classList.remove('iris-skin-in'),340);
  }
  /* 只有界面版本变化才会改变画布尺寸，需要重算一次视图；
     换配色 / 圆角 / 动效 / 玻璃开关纯属 CSS，别再触发全分辨率渲染。 */
  if(lastAppliedUI!==r.dataset.ui){
    lastAppliedUI=r.dataset.ui;
    try{ render(); }catch(e){}
  }
}
function setIrisSkin(patch,animate){
  Object.assign(irisSkin,patch||{});
  irisSkinApply(animate!==false);
}
function irisSkinLabel(){
  const t=irisTheme(), u=IRIS_UIS.find(x=>x.id===irisSkin.ui)||IRIS_UIS[0];
  const rd=IRIS_RADII.find(x=>x.id===irisSkin.radius)||IRIS_RADII[1];
  const gl=(t.glass?(' · 玻璃'+(irisSkin.glass===false?'关':'开')):'');
  const ga=parseFloat(irisSkin.glassAlpha);
  return t.name+' · '+u.name+' · '+rd.name+'圆角 · '
    +(irisSkin.motion===false?'动效关':'动效开')+gl
    +(irisSkin.glass===false?'':' · 玻璃 '+Math.round(((isFinite(ga)&&ga>=.2&&ga<=.9)?ga:.55)*100)+'%');
}

      const b=spEl('button','sk-theme'+(irisSkin.theme===t.id?' on':''));
      b.innerHTML='<em>'+(irisSkin.theme===t.id?'当前':(t.glass?'玻璃':(t.mode==='light'?'浅色':t.en)))+'</em>'
        +'<span class="sk-sw"><i style="background:'+t.bg+'"></i>'
        +'<i style="background:'+t.panel+'"></i><i style="background:'+t.accent+'"></i></span>'
        +'<b>'+t.name+' <span style="opacity:.5;font-size:9px">'+t.en+'</span></b>'

      const b=spEl('button','sk-pill'+((irisSkin.motion!==false)===v?' on':''),label);
      b.onclick=()=>{ setIrisSkin({motion:v}); draw(); toast(v?'界面动效已开启':'界面动效已关闭'); };
      mb.append(b);
    });
    w.append(mb);

    /* 液态玻璃主题专属：模糊很吃 GPU，给一个开关换取流畅度 */
    const hg=spEl('div','sk-sec','高斯模糊玻璃 <em>全部 9 套主题通用 · 关掉后浮层仍保留半透明底色，只是不再吃 GPU</em>');
    w.append(hg);
    const gb=spEl('div','sk-bar');
    [[true,'开 · 高斯模糊玻璃'],[false,'关 · 更省电更流畅']].forEach(([v,label])=>{
      const x=spEl('button','sk-pill'+((irisSkin.glass!==false)===v?' on':''),label);
      x.onclick=()=>{ setIrisSkin({glass:v}); draw(); toast(v?'玻璃模糊已开启':'玻璃模糊已关闭（更流畅）'); };
      gb.append(x);
    });
    w.append(gb);

    /* 玻璃浓度：连续可调，9 套主题通用。拖动只改一个 CSS 变量，
       不重建页面、不触发任何 WebGL 重绘，滑杆跟手不卡。 */
    const ga0=(()=>{const v=parseFloat(irisSkin.glassAlpha);return (isFinite(v)&&v>=.2&&v<=.9)?v:.55;})();
    const hga=spEl('div','sk-sec','玻璃浓度 <em>自行调节浮层不透明度 · 9 套主题通用</em>');
    w.append(hga);
    const garow=spEl('div','glass-ctl');
    const gain=document.createElement('input');
    gain.type='range'; gain.min='0.20'; gain.max='0.90'; gain.step='0.01';
    gain.value=String(ga0); gain.className='glass-range';
    gain.setAttribute('aria-label','玻璃浓度');
    const gaval=spEl('b','glass-val',Math.round(ga0*100)+'%');
    const gatip=spEl('small','glass-tip','偏左更透（照片更明显），偏右更实（文字更清楚）');
    garow.append(gain,gaval); w.append(garow,gatip);
    gain.oninput=()=>{
      const v=parseFloat(gain.value);
      irisSkin.glassAlpha=v;
      /* 拖动时只改一个 CSS 变量：不重建页面、不触发 WebGL 重绘，
         也不每帧同步写 localStorage（那会让滑杆发涩）。松手才落盘。 */
      document.documentElement.style.setProperty('--glass-alpha',String(v));
      gaval.textContent=Math.round(v*100)+'%';
      const st=w.querySelector('.pc-stat');
      if(st&&st.children[3]) st.children[3].querySelector('b').textContent=Math.round(v*100)+'%';
    };
    gain.onchange=()=>{ irisSkinApply(false); toast('玻璃浓度 '+Math.round(parseFloat(gain.value)*100)+'%'); };
    w.append(spEl('div','fparam-tip','当前主题：'+irisTheme().name
      +' · 开关与浓度对全部 9 套主题都生效：开启时顶栏、溢出菜单、导出菜单、提示条与欢迎卡统一走 backdrop-filter；'
      +'浓度直接改浮层底色的 alpha，拖到最左几乎全透、最右接近实色。'
      +'关闭时所有浮层的 blur 一并置 none（包括 Nova 自带的 blur），移动端滚动与切页更轻。'
      +'「液态玻璃」主题还会额外叠加折射高光与更强的 saturate。'));

    const acts=spEl('div','sk-acts');
    const reset=spEl('button','pri','↺ 恢复默认外观');
    reset.onclick=()=>{ setIrisSkin({theme:'aurum',ui:'classic',radius:'standard',motion:true,glass:true,glassAlpha:.55});
      draw(); toast('已恢复：琥珀金 · 原版界面'); };
    const hub=spEl('button','','◫ 页面中心');
    hub.onclick=()=>openSubPage('pages');
    acts.append(reset,hub); w.append(acts);

    const note=spEl('div','sk-note');
    note.innerHTML='<b>当前：'+irisSkinLabel()+'</b><br>'
      +'主题只覆盖 CSS 变量（底色、面板、文字、强调色与玻璃层），Nova 只追加视觉规则，'
      +'两者都不改任何 DOM、事件、坐标或着色器 —— 因此滤镜、调色盘、涂抹、裁剪、导出、自动保存在两套界面下逐项一致。'
      +'<br>偏好写在 <b>localStorage</b> 的一个键里，属于本机数据；清除站点数据即回到默认。';
    w.append(note);
    body.scrollTop=keep;
  }
  draw();
}

}
function applyFrameIcons(){

    zOut:'minus',zIn:'plus',zFit:'fit'};
  Object.entries(map).forEach(([id,n])=>{ const el=document.getElementById(id); if(el) el.innerHTML=svg(n,16); });

     「全屏看图」不再用另一套字符图标 / grid 居中 / 11px 字号。 */
  [['btnUndoM','撤销','undo'],['btnRedoM','重做','redo'],
   ['btnReset','全部还原','reset'],['btnFocus','全屏看图','focus'],
   ['btnSaveTone','保存这张的色调','aperture']].forEach(([id,t,ic])=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=svg(ic,15)+'<span>'+t+'</span>';
  });

}

function buildTools(){
  const t=$('#tools'); t.innerHTML='';
  PRIMARY.forEach(id=>{
    const x=TOOLS.find(v=>v.id===id), b=document.createElement('button');
    b.className='tool'+(tool===id?' active':''); b.innerHTML=`<i>${svg(x.icon,19)}</i>${x.name}`;
    b.onclick=()=>{ moreOpen=false; renderMoreMenu(); gotoTool(id); };
    t.append(b);
  });
  const inMore=!PRIMARY.includes(tool), cur=TOOLS.find(v=>v.id===tool);
  const m=document.createElement('button');
  m.className='tool'+(inMore?' active':''); m.innerHTML=`<i>${svg(cur&&inMore?cur.icon:'more',19)}</i>${inMore?cur.name:'更多'}`;
  m.onclick=e=>{ e.stopPropagation(); moreOpen=!moreOpen; renderMoreMenu(); };
  t.append(m);
  renderMoreMenu();
}

  const tools=$('#tools');
  menu.style.top=(tools.offsetTop+tools.offsetHeight+7)+'px';
  const title=document.createElement('div'); title.className='more-title';
  title.textContent='更多编辑工具 · 按用途分组'; menu.append(title);
  const groups=[

    const h=document.createElement('div'); h.className='more-group-title'; h.textContent=g.t; menu.append(h);
    const grid=document.createElement('div'); grid.className='more-grid';

/* 窄侧栏自适应：只在真的溢出时切成纵向，默认宽度保持原来的紧凑横排。
   用 clientWidth 做节流，避免改布局 → ResizeObserver → 再改的循环。 */
let lastFitWidth=-1;
/* 窄侧栏自适应：通用溢出检测。
   旧版只量 .btn-grid / .pad-row，且两者缺一就直接 return ——
   切到滤镜页（没有这两个节点）时整个检测形同虚设，搜索行、图层行、
   语义盘 chip 行照样被挤出面板。现在逐类量真实 scrollWidth，
   任何一个横排溢出就切成纵向 / 换行布局。 */
const FIT_ROWS=['.row','.fsearch','.layer-bot','.layer-top','.chip-line',
  '.pad-row','.btn-grid','.zone-chips','.pm-fold>summary','.fcat-grid',
  '.fgrid','.tpl-grid','.scope-bar','.plate-picker','.pm-grp .chips'];
function syncPanelFit(force){
  const p=$('#panel'); if(!p) return;
  const w=p.clientWidth;
  if(!force&&w===lastFitWidth) return;
  lastFitWidth=w;
  p.removeAttribute('data-fit');
  let over=p.scrollWidth>p.clientWidth+1;
  if(!over){
    for(let k=0;k<FIT_ROWS.length&&!over;k++){
      const els=p.querySelectorAll(FIT_ROWS[k]);
      for(let i=0;i<els.length;i++){
        const el=els[i];
        /* 只认「横向不可滚动」的行：.chips / .fgroup 本身允许横向滚动，不算溢出 */
        const cs=getComputedStyle(el);
        if(cs.overflowX==='auto'||cs.overflowX==='scroll') continue;
        if(el.scrollWidth>el.clientWidth+1){ over=true; break; }
      }
    }
  }
  if(over) p.setAttribute('data-fit','slim');
}

  md.append(hint('v3 引擎：自适应肤色聚类（按本张照片估计 Cr/Cb 肤色中心）+ 天空行一致性 + 区域一致性平滑 + 互斥归一化 + 边缘感知上采样。'
    +'仍是纯前端启发式软分割，不是设备端 ML，也没有 CoreImage / Metal；复杂人像、逆光、多光源下会有误差。'
    +'matte 缺失时着色器内还有一层像素级肤色软概率兜底，所以冷调也不会把脸染蓝。'));
  se.append(md);

  /* ================= 区域工作台：matte 从幕后走到台前 ================= */
  const zw=document.createElement('div'); zw.className='zone-sec';

    +'即使主盘完全回中也能独立出片；还能把 matte 一键变成局部蒙版或背景虚化的主体。'));

  zopi.oninput=()=>{ zoneUI.opacity=+zopi.value/100; zopv.textContent=zopi.value+'%'; render(); };
  zop.append(zopi,zopv); zw.append(zop);
  const zlg=document.createElement('div'); zlg.className='zone-legend';
  zlg.innerHTML=ZONE_META.map(m=>'<span><i style="background:'+m.color+'"></i>'+m.name+'</span>').join('');
  zw.append(zlg);
  if(SEM.ready){
    const mc=semPreviewCanvas(); mc.className='zone-mini'; mc.title='当前画面的语义分割伪彩图';
    zw.append(mc);
  } else zw.append(hint('尚未生成 matte：先导入一张自己的照片，分析会自动完成。'));
  zw.append(spEl('div','zone-tip','伪彩只叠加在屏幕画面上：<b>导出照片 / 视频 / GIF / 缩略图时自动关闭</b>，不会混进成品。'));

  /* ② 一键风格 */
  const zl=document.createElement('div'); zl.className='zone-preset-grid';
  ZONE_LOOKS.forEach(lk=>{
    const q=button(lk.name,()=>applyZoneLook(lk.id)); q.title=lk.desc; zl.append(q);
  });
  zw.append(zl);

  /* ③ 四区独立参数：一次只显示一区，避免 12 根滑杆刷屏 */
  let zcur=window.__zoneCur||'skin';
  const ztab=chipRow(ZONE_META.map(m=>({id:m.id,name:m.name.split(' / ')[0]})),
    zcur,id=>{ window.__zoneCur=id; buildPanel(true); });
  zw.append(ztab);
  const zm=ZONE_META.find(m=>m.id===zcur)||ZONE_META[0];
  zw.append(spEl('div','zone-tip','<b>'+zm.name+'</b> · '+zm.desc+'。三根滑杆只作用于这一区，零位严格等于原图。'));
  zw.append(slider('zones.'+zcur+'.temp','色温（冷 ← → 暖）',-1,1,.01,'',0));
  zw.append(slider('zones.'+zcur+'.lum','亮度（压暗 ← → 提亮）',-1,1,.01,'',0));
  zw.append(slider('zones.'+zcur+'.sat','饱和度（灰 ← → 艳）',-1,1,.01,'',0));

  /* ④ 把 matte 交给其它功能 */
  const za=document.createElement('div'); za.className='zone-actions';
  [['人物 → 局部蒙版 1',()=>matteToMask(0,'person')],
   ['天空 → 局部蒙版 2',()=>matteToMask(1,'sky')],
   ['人物 → 虚化主体',()=>matteToBokeh('person')],
   ['天空 → 虚化主体',()=>matteToBokeh('sky')],
   ['背景 → 局部蒙版 3',()=>matteToMask(2,'bg')],
   ['↺ 全部区域回零',()=>resetZones()]
  ].forEach(([t,fn])=>za.append(button(t,fn,'sm')));
  zw.append(za);
  zw.append(spEl('div','zone-tip','「人物 / 天空」通道同时也能在「局部」页与「更多 → 虚化」里继续编辑；'
    +'换照片后 matte 会自动重算，选区跟着新画面走。'));
  zw.append(button('◈ 打开区域工作台页面',()=>openSubPage('zones'),'accent'));
  se.append(zw);

  se.append(hint('非破坏：只存 preset_id +（tone, color, intensity）+ 四区三值 + 分割版本元数据，原图像素从不改写；撤销 / 重做 / 导入参数 JSON 都可回滚重算。换照片时单次推理并缓存，拖动调色盘只改 uniform。'));
  p.append(se);
  applyPadTone();
}

/* --- 基础调整 --- */
const ADJ=[
  ['光效','exposure','曝光',-1,1],['光效','brilliance','鲜明度',-1,1],['光效','highlights','高光',-1,1],
  ['光效','shadows','阴影',-1,1],['光效','contrast','对比度',-1,1],['光效','brightness','亮度',-1,1],['光效','black','黑点',-1,1],
  ['颜色','saturation','饱和度',-1,1],['颜色','vibrance','自然饱和度',-1,1],['颜色','temp','色温',-1,1],
  ['颜色','tint','色调',-1,1],['颜色','hue','色相偏移',-1,1],
  ['细节','clarity','清晰度',-1,1],['细节','sharpen','锐度',-1,1],['细节','noise','噪点消除',0,1],
  ['效果','vignette','暗角',0,1],['效果','grain','颗粒',0,1],['效果','fade','褪色',0,1],
  ['效果','bw','黑白',0,1],['效果','sepia','棕褐色',0,1],
  ['影调','lift','提升',-1,1],['影调','gamma','伽马',-1,1],['影调','gain','增益',-1,1]
];
const ADJ_GROUPS=['光效','颜色','细节','效果','影调','全部'];
function buildAdjust(p){
  const intro=section('调整分类');
  intro.append(chipRow(ADJ_GROUPS.map(g=>({id:g,name:g})),adjGroup,id=>{
    adjGroup=id; buildPanel(true);
  }));
  const n=(adjGroup==='全部'?ADJ:ADJ.filter(a=>a[0]===adjGroup)).length;
  intro.append(hint(`按类别收起参数，当前 ${adjGroup} · ${n} 项。−100 ~ +100，双击滑杆归零；与滤镜、调色盘独立叠加。`));
  p.append(intro);

  const list=adjGroup==='全部'?ADJ:ADJ.filter(a=>a[0]===adjGroup);
  if(adjGroup==='全部'){
    let cur=null;
    list.forEach(([grp,key,label,mn,mx])=>{
      if(grp!==cur){ cur=grp; p.append(section(grp)); }
      p.lastElementChild.append(slider('base.'+key,label,mn,mx,.01,'%',0));
    });
  } else {
    const s=section(adjGroup+' · '+list.length+' 项');
    list.forEach(([,key,label,mn,mx])=>s.append(slider('base.'+key,label,mn,mx,.01,'%',0)));
    p.append(s);
  }
  // 快速一键：按用途分组，比原来 3 个更好找
  const q=section('快捷 · 一键配方');
  const SET=(o)=>mutate(()=>{ Object.entries(o).forEach(([k,v])=>{ const key=PK[k]||k; if(key in state.base) state.base[key]=v; }); buildPanel(); });
  const quickGroups=[
    {t:'自动校正',items:[
      ['✦ 智能增强',()=>autoPlus()],
      ['自动色阶',()=>autoLevels()],
      ['自动白平衡',()=>autoWB()],
      ['明亮通透',()=>SET({br:.30,co:.10,vi:.20,ex:.06})]
    ]},
    {t:'风格速调',items:[
      ['暖阳',()=>SET({te:.26,vi:.14,br:.12})],
      ['冷调',()=>SET({te:-.30,vi:.08,co:.08})],
      ['奶油高调',()=>SET({br:.22,li:.14,sa:-.08})],
      ['浓郁暗调',()=>SET({co:.26,bl:-.16,vi:.12})],
      ['胶片褪色',()=>SET({fa:.24,gr:.14,co:-.06})],
      ['一键黑白',()=>SET({bw:1,co:.25})],
      ['高反差银盐',()=>SET({bw:1,co:.42,bl:-.20})]
    ]},
    {t:'复位',items:[['清空全部调整',()=>mutate(()=>{state.base=baseZero();buildPanel();})]]}
  ];
  quickGroups.forEach(g=>{
    const h=document.createElement('div'); h.className='sec-h';
    h.style.cssText='margin:8px 0 5px'; h.textContent=g.t; q.append(h);
    const row=document.createElement('div'); row.className='row';
    g.items.forEach(([t,fn])=>row.append(button(t,fn,t.startsWith('✦')?'accent':'')));
    q.append(row);
  });
  q.append(hint('一键配方只改「调整」里的基础参数，不影响滤镜层、调色盘与语义盘；随时可撤销。'));
  p.append(q);
}

/* --- 滤镜：可叠加的多层，每层拥有独立调色盘 --- */
function buildFilters(p){
  const sl=section('滤镜层 · 最多 '+MAX_LAYERS+' 层叠加');
  sl.append(hint('点选某一层后，下方滤镜库会替换该层。<b>每个滤镜层都有自己那套 12 色调调色盘</b>，'
    +'互不串扰，关掉某层或调低强度，它那套盘会一起减弱。点层里的「◈ 本层盘」可直接跳过去编辑。'));
  state.layers.forEach((L,i)=>{
    const d=document.createElement('div'); d.className='layer'+(state.editLayer===i?' on':'');
    const cnt=t=>TARGETS.filter(q=>{const v=t[q.id];return v&&Math.abs(v.x)+Math.abs(v.y)>.001;}).length;
    const top=document.createElement('div'); top.className='layer-top';
    const lm=document.createElement('div'); lm.className='lm';
    const ln=document.createElement('div'); ln.className='ln'; ln.textContent=`${i+1} · ${L.name}`;
    const ls=document.createElement('div'); ls.className='ls';
    ls.textContent=`强度 ${Math.round((L.strength||0)*100)}% · 本层调色盘 ${cnt(L.plates)}/12`;
    lm.append(ln,ls);
    const pw=button(L.enabled===false?'○':'●',()=>mutate(()=>{L.enabled=L.enabled===false;buildPanel();}),'sm');
    pw.title=L.enabled===false?'已关闭，点此启用':'已启用，点此关闭';
    const del=button('✕',()=>mutate(()=>{
      if(state.layers.length<=1){ state.layers=[newLayer('原图')]; }
      else state.layers.splice(i,1);
      state.editLayer=Math.max(0,Math.min(state.editLayer||0,state.layers.length-1));
      state.editLayerName=state.layers[state.editLayer].name;
      if(typeof state.plateScope==='number'&&state.plateScope>=state.layers.length)state.plateScope='global';
      buildPanel();
    }),'sm');
    del.title='删除这一层';
    top.append(lm,pw,del);
    const bot=document.createElement('div'); bot.className='layer-bot';
    const rng=document.createElement('input'); rng.type='range'; rng.min=0; rng.max=1; rng.step=.01;
    rng.value=L.strength; rng.style.setProperty('--fill',(L.strength*100)+'%');

  function applyToLayer(name){
    const ff=filterMap().get(name);
    if(ff&&ff.full&&applyFullFilter(name)) return;
    if(tryApplyToneFilter(name)) return;
    mutate(()=>{
      const L=state.layers[state.editLayer]||state.layers[0];
      const has=Object.values(L.plates).some(q=>Math.abs(q.x)+Math.abs(q.y)>.001);

      state.editLayerName=name; noteRecent(name); buildPanel(true);
    });

  function focusLibrary(){

  function tile(f){

    b.append(im,sp);

      const on=FAV_FILTERS.includes(f.name);
      fav.className='fstar'+(on?' on':''); fav.textContent=on?'★':'☆';
      fav.title=on?'取消收藏':'收藏';

      e.stopPropagation();

      if(filterGroup==='★ 收藏') renderFilterArea();

    b.append(fav);

      const rm=document.createElement('i'); rm.className='fdel'; rm.textContent='✕'; rm.title='删除我的滤镜';
      rm.onclick=e=>{ e.stopPropagation(); if(confirm('删除「'+f.name+'」？'))removeUserFilter(f.name); };

    const cats=document.createElement('div'); cats.className='fcat-grid';
    const gs=[...new Set(FILTERS.map(f=>f.group))].filter(g=>g!=='基础'&&g!=='我的');

      const list=FILTERS.filter(f=>f.group===g);
      const c=document.createElement('button'); c.dataset.group=g;
      const picks=list.filter(f=>f.name!=='原图').slice(0,3);
      const shown=picks.length?picks:list.slice(0,3);
      c.className='fcat-card n'+Math.max(1,Math.min(3,shown.length));
      shown.forEach(f=>{
        const im=lazyThumb(document.createElement('img'),f.name); im.alt=''; c.append(im);
      });

  /* 网格视图：某一分类 / 搜索结果 / 全部平铺 */
  function renderGrid(q){
    const nav=document.createElement('div'); nav.className='fnav';
    const back=button(q?'✕ 清除搜索':'← 全部分类',()=>{
      if(q){ filterText=''; inp.value=''; renderFilterArea(); }
      else backToBrowse();
    },'sm');
    const label=document.createElement('div'); label.className='fnav-t';
    nav.append(back);
    if(q) nav.append(label);
    if(!q){
      const sel=document.createElement('select'); sel.className='fsel';
      const opts=[{id:'全部',name:'全部 '+FILTERS.length},
        {id:'★ 收藏',name:'★ 收藏 '+FAV_FILTERS.length},
        {id:'我的',name:'我的 '+USER_FILTERS.length},
        ...[...new Set(FILTERS.map(f=>f.group))].filter(g=>g!=='基础'&&g!=='我的')
          .map(g=>({id:g,name:g+' '+FILTERS.filter(f=>f.group===g).length}))];
      opts.forEach(o=>{ const op=document.createElement('option'); op.value=o.id; op.textContent=o.name; sel.append(op); });
      if(!opts.some(o=>o.id===filterGroup)){
        const op=document.createElement('option'); op.value=filterGroup; op.textContent=filterGroup; sel.append(op);
      }
      sel.value=filterGroup;
      sel.onchange=()=>{ filterText=''; inp.value=''; filterGroup=sel.value; renderFilterArea(); };
      nav.append(sel);
    }
    body.append(nav);

    const list=FILTERS.filter(f=>{
      // 有搜索词时跨全部分类查找，避免被当前分组挡住
      const gm=q?true:(filterGroup==='全部'||(filterGroup==='★ 收藏'?FAV_FILTERS.includes(f.name):f.group===filterGroup));
      const qm=!q||f.name.toLowerCase().includes(q)||f.group.toLowerCase().includes(q);
      return gm&&qm;
    });
    if(q) label.textContent=`搜索「${filterText.trim()}」· ${list.length} 款`;

    const grid=document.createElement('div'); grid.className='fgrid';
    list.forEach(f=>grid.append(tile(f)));
    body.append(grid);
    if(!list.length){
      const empty=document.createElement('div'); empty.className='hint';
      empty.textContent=q?'没有匹配「'+filterText+'」的滤镜'
        :(filterGroup==='★ 收藏'?'还没有收藏，点滤镜右上角的 ☆ 收藏'
        :filterGroup==='我的'?'还没有保存自定义滤镜，点上方「＋ 存为滤镜」':'该分类暂无滤镜');
      body.append(empty);
    }
  }
  function renderFilterArea(){
    resetThumbQueue();
    body.innerHTML='';
    const q=filterText.trim().toLowerCase();
    if(filterBrowse&&!q) renderBrowse(); else renderGrid(q);
  }
  renderFilterArea(); p.append(s);
  const s2=section('当前层');
  s2.append(slider('layers.'+state.editLayer+'.strength','层强度（同时缩放该层调色盘）',0,1,.01,'%',1));
  const row=document.createElement('div'); row.className='row';
  row.append(button('编辑这层的调色盘',()=>{state.plateScope=state.editLayer;gotoTool('plate');toast('已切到「'+scopeName()+'」');}),
    button('复制当前编辑参数',copyParams));
  s2.append(row); p.append(s2);
}

/* --- 元素：文字 / 贴纸 / 形状 / 涂鸦 / 局部像素效果 --- */
function colorCtl(label,value,onInput,onDone){
  const d=document.createElement('label'); d.className='colorrow';
  const sp=document.createElement('span'); sp.textContent=label;
  const i=document.createElement('input'); i.type='color'; i.value=value||'#ffffff';
  let b=null;
  i.addEventListener('focus',()=>b=JSON.stringify(state));
  i.addEventListener('input',()=>onInput(i.value));
  i.addEventListener('change',()=>{ if(b){commit(b);b=null;} onDone&&onDone(); });
  d.append(sp,i); return d;
}
function elPath(key){
  const i=state.elements.findIndex(e=>e.id===selElId);
  return i<0?null:'elements.'+i+'.'+key;
}
function fxSlider(r,i,label,key,min,max,step,fmt){
  const wrap=document.createElement('div'); wrap.className='sld';
  const h=document.createElement('div'); h.className='sld-h';
  const nm=document.createElement('span'); nm.textContent=label;
  const val=document.createElement('b'); h.append(nm,val);
  const inp=document.createElement('input'); inp.type='range';
  inp.min=min;inp.max=max;inp.step=step;inp.value=r[key];
  const show=()=>{const v=parseFloat(inp.value);
    val.textContent=fmt?fmt(v):(Math.round(v*100)+'%');
    inp.style.setProperty('--fill',((v-min)/(max-min)*100)+'%');};
  let bf=null;
  inp.addEventListener('pointerdown',()=>bf=JSON.stringify(state));
  inp.addEventListener('input',()=>{
    const cur=state.fxRegions[i]; if(!cur)return;
    const v=parseFloat(inp.value); cur[key]=v;
    if(key==='rx') cur.ry=v;
    show(); requestRender();
  });
  inp.addEventListener('change',()=>{commit(bf);bf=null;});
  wrap.append(h,inp); show(); return wrap;
}
function buildElements(p){
  /* 0. 模式状态条：卡在涂抹 / 放置 / 涂鸦时，一眼能看见并随时退出 */
  if(drawMode){
    let dname='涂鸦';
    if(typeof drawMode==='string'&&(drawMode.startsWith('brush')||drawMode.startsWith('place'))){
      const t=FX_TYPES.find(v=>v.id===parseInt(drawMode.slice(5),10));
      dname=(drawMode.startsWith('brush')?'涂抹 · ':'点放 · ')+(t?t.name:'');
    }
    const bar=document.createElement('div'); bar.className='mode-bar';
    const txt=document.createElement('span');
    const ds=typeof drawMode==='string'?drawMode:'';
    const modeHint=ds.startsWith('brush')
      ? '金色圈＝笔刷范围，整屏可刷，不会误删元素'
      : ds.startsWith('place') ? '点照片放置圆形区域' : '拖动即可画线';
    txt.innerHTML=svg('brush',15)+' <b>正在'+dname+'</b><small>'+modeHint+'</small>';
    const quit=button('✕ 退出模式',()=>{ exitDrawMode(); toast('已退出'+dname); });
    quit.classList.add('accent');
    bar.append(txt,quit); p.append(bar);
  }
  /* 1. 添加 */
  const a=section('添加元素');
  const grid=document.createElement('div'); grid.className='add-grid';
  const mkAdd=(key,label,fn,active)=>{
    const b=document.createElement('button'); b.className='add-btn'+(active?' active':'');
    b.innerHTML=`<i>${svg(key,21)}</i><span>${label}</span>`; b.onclick=fn; return b;
  };
  grid.append(
    mkAdd('text','文字',()=>addElement('text')),
    mkAdd('sticker','贴纸',()=>addElement('sticker',{glyph:STICKERS[0]})),
    mkAdd('shape','形状',()=>addElement('shape')),
    mkAdd('draw','涂鸦',()=>{
      drawMode=drawMode==='pen'?null:'pen';
      toast(drawMode?'涂鸦模式：在照片上拖动即可画线，再点一次退出':'已退出涂鸦');
      buildPanel(true);
    },drawMode==='pen')
  );
  a.append(grid);

  const fxHead=document.createElement('div'); fxHead.className='fx-section-head';
  fxHead.innerHTML='<b>像素效果</b><small>'+(brushMode==='brush'?'在照片上涂抹':'点一下放一个可调圆形')+'</small>';
  a.append(fxHead);
  a.append(chipRow([{id:'brush',name:'涂抹笔刷'},{id:'place',name:'点放圆形'}],brushMode,id=>{
    brushMode=id; drawMode=null; buildPanel(true);
  }));
  const fxRow=document.createElement('div'); fxRow.className='add-grid fx-add';
  FX_TYPES.forEach(t=>{
    const key=(brushMode==='brush'?'brush':'place')+t.id;
    fxRow.append(mkAdd(t.icon,t.name,()=>{
      drawMode=drawMode===key?null:key;
      toast(drawMode?
        (brushMode==='brush'?'涂抹模式：在照片上拖动，把「'+t.name+'」刷到需要的位置':'点照片任意位置放置「'+t.name+'」')
        :'已取消放置');
      buildPanel(true);
    },drawMode===key));
  });
  a.append(fxRow);
  if(brushMode==='brush'){
    a.append(slider('brushSize','笔刷大小',.008,.16,.002,'%',.035));
    a.append(slider('brushStrength','效果强度',0,1,.01,'%',.9));
    const pts=state.brushStrokes.reduce((n,st)=>n+st.pts.length,0);
    const bstat=document.createElement('div'); bstat.className='row';
    bstat.append(button('撤销上一笔',()=>mutate(()=>{
      state.brushStrokes.pop(); rebuildBrushTextures(); buildPanel(true);
    }),'sm'));
    bstat.append(button('清除全部笔刷',()=>mutate(()=>{
      state.brushStrokes=[]; rebuildBrushTextures(); buildPanel(true);
    }),'sm'));
    bstat.append(hint(`已涂 ${state.brushStrokes.length} 笔 · ${pts} 点`));
    a.append(bstat);
  }
  a.append(hint(brushMode==='brush'
    ? '选一种效果后，在照片上按住拖动即可涂抹；金色圈＝笔刷实际作用范围，跟着手指走（会随照片比例呈椭圆）。涂抹时整屏都可刷，不会被文字、贴纸或效果圈挡住，也不会误删它们；笔刷可反复叠加，导出时一并合成。再点一次按钮或按 Esc 退出。'
    : '选一种效果后点照片放置圆形区域，可拖动、调范围与羽化；再点一次按钮或按 Esc 退出。'));
  p.append(a);

  /* 2. 选中元素编辑 */
  const el=selEl();
  const b=section('选中元素');
  if(!el){
    b.append(hint('还没有选中元素。先添加，或直接点照片上的元素；拖动可移动，右下角缩放、右上角旋转、左上角删除。'));
  } else {
    const i=state.elements.findIndex(e=>e.id===el.id);
    const head=document.createElement('div'); head.className='el-head';
    head.innerHTML=`<b>${EL_LABEL[el.type]} · ${i+1}</b>`;
    head.append(button('完成',()=>{selElId=null;render();buildPanel(true);},'sm'));
    b.append(head);
    const set=(key,v)=>mutate(()=>{
      const e=state.elements.find(z=>z.id===el.id); if(e)e[key]=v; buildPanel(true);
    });
    if(el.type==='text'){
      /* 旧存档没有这些排版字段：补齐默认值，滑杆才有读数、导出才一致 */
      const DEF={weight:0,tracking:fontMeta(el).trackPx||0,lineHeight:1.24,
        shadowBlur:.20,stroke:0,opacity:1};
      Object.keys(DEF).forEach(k=>{ if(el[k]===undefined) el[k]=DEF[k]; });
      const ta=document.createElement('textarea'); ta.className='el-text'; ta.rows=2;
      ta.value=el.text; ta.placeholder='输入文字，可换行';
      let tb=null;
      ta.addEventListener('focus',()=>tb=JSON.stringify(state));
      ta.addEventListener('input',()=>{ el.text=ta.value; render(); });
      ta.addEventListener('change',()=>{ if(tb){commit(tb);tb=null;} });
      b.append(ta);

      /* ---------- 字体：20 款折叠分组，展开时才构建，首屏零探测 ---------- */
      const fv0=fontMeta(el);
      const ff=document.createElement('details'); ff.className='font-fold';
      const fsum=document.createElement('summary');
      fsum.innerHTML='<b>字体</b> · <span>'+fv0.name+'</span> <em>'+FONTS.length+' 款 ▾</em>';
      ff.append(fsum); ff.open=fontFoldOpen;
      let built=false;
      const buildFonts=()=>{
        if(built) return; built=true;
        FONT_GROUPS.forEach(g=>{
          const list=FONTS.filter(f=>f.grp===g.id);
          const gh=document.createElement('div'); gh.className='font-grp';
          gh.textContent=g.name+' · '+list.length+' 款'; ff.append(gh);
          /* 切字体时把该字体的预设字距一并带过来，之后仍可用字距滑杆自由覆盖 */
          const setFont=id=>{
            const f=FONTS.find(x=>x.id===id);
            mutate(()=>{
              const e=state.elements.find(z=>z.id===el.id);
              if(e){ e.font=id; e.tracking=f?(f.trackPx||0):0; }
              buildPanel(true);
            });
          };
          const row=chipRow(list.map(f=>({id:f.id,name:f.name})),el.font,setFont);
          [...row.children].forEach((c,i)=>{
            const f=list[i]; if(!f) return;
            c.style.fontFamily=fontFamilyFor(f);
            c.style.fontStyle=f.italic?'italic':'normal';
            c.style.fontWeight=String(clamp(400+(f.weight||0),100,900));
            try{ c.style.letterSpacing=(f.trackPx||0)+'px'; }catch(e){}
            c.title=f.name+' · '+g.name+' · '+f.generic;
          });
          ff.append(row);
        });
      };
      ff.addEventListener('toggle',()=>{ fontFoldOpen=ff.open; if(ff.open) buildFonts(); });
      if(ff.open) buildFonts();
      b.append(ff);

      /* ---------- 所见即所得预览 ---------- */

      card.append(r0);
      const mini=(path,label,mn,mx)=>{

    card.append(adj);
    p.append(card);
  });

/* --- 颜色分级 / 通道混合 / LUT --- */
function hsv2rgbJS(h,s,v){
  const f=(n,k=(n+h*6)%6)=>v-v*s*Math.max(Math.min(k,4-k,1),0);
  return [f(5),f(3),f(1)];
}
function drawWheel(cv,arr){
  const x=cv.getContext('2d'),W=cv.width,R=W/2;
  x.clearRect(0,0,W,W);
  for(let a=0;a<360;a+=2){
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R,(a-1.2)*Math.PI/180,(a+1.2)*Math.PI/180);
    x.closePath();x.fillStyle=`hsl(${a},100%,50%)`;x.fill();
  }
  const g=x.createRadialGradient(R,R,0,R,R,R);
  g.addColorStop(0,'rgba(255,255,255,.92)');g.addColorStop(.75,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(0,0,0,.35)');
  x.fillStyle=g;x.beginPath();x.arc(R,R,R,0,7);x.fill();
  // 从 RGB 偏移反推色相/彩度用于显示圆点
  const mx=Math.max(...arr.slice(0,3).map(Math.abs)),rr=mx?arr[0]/mx:0,gg=mx?arr[1]/mx:0,bb=mx?arr[2]/mx:0;
  const M=Math.max(rr,gg,bb),m=Math.min(rr,gg,bb),d=M-m;
  let H=0;if(d>1e-5){if(M===rr)H=((gg-bb)/d+6)%6;else if(M===gg)H=(bb-rr)/d+2;else H=(rr-gg)/d+4;H/=6;}
  const S=clamp(mx,0,1);
  const px=R+Math.cos(H*Math.PI*2)*R*.78*S, py=R+Math.sin(H*Math.PI*2)*R*.78*S;
  x.beginPath();x.arc(px,py,6,0,7);x.fillStyle='#fff';x.fill();
  x.lineWidth=2;x.strokeStyle='rgba(0,0,0,.6)';x.stroke();
}
function wheelCard(key,label){
  const card=document.createElement('div');card.className='wheel-card';
  const t=document.createElement('div');t.className='wt';t.textContent=label;card.append(t);
  const cv=document.createElement('canvas');cv.width=cv.height=150;card.append(cv);
  const arr=state.grade[key];
  const val=document.createElement('div');val.className='wheel-val';
  const show=()=>val.textContent=`${Math.round(arr[0]*100)}, ${Math.round(arr[1]*100)}, ${Math.round(arr[2]*100)}`;
  show();
  let bf=null;
  function set(e){
    const r=cv.getBoundingClientRect();
    let dx=(e.clientX-r.left)/r.width*2-1, dy=(e.clientY-r.top)/r.height*2-1;
    const rad=clamp(Math.hypot(dx,dy),0,1);
    let h=Math.atan2(dy,dx)/(Math.PI*2);if(h<0)h+=1;
    const rgb=hsv2rgbJS(h,1,1);
    arr[0]=+( (rgb[0]-.5)*2*rad ).toFixed(3);
    arr[1]=+( (rgb[1]-.5)*2*rad ).toFixed(3);
    arr[2]=+( (rgb[2]-.5)*2*rad ).toFixed(3);
    drawWheel(cv,arr);show();requestRender();
  }
  cv.addEventListener('pointerdown',e=>{capturePointer(cv,e);bf=JSON.stringify(state);set(e);});
  cv.addEventListener('pointermove',e=>{if(bf)set(e);});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(bf){commit(bf);bf=null;}}));
  cv.addEventListener('dblclick',()=>mutate(()=>{arr[0]=arr[1]=arr[2]=0;drawWheel(cv,arr);show();}));
  const lum=document.createElement('input');lum.type='range';lum.min=-1;lum.max=1;lum.step=.01;
  lum.value=arr[3];lum.style.setProperty('--fill',((arr[3]+1)/2*100)+'%');
