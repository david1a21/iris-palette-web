function setupCurve(cv){
  const x=cv.getContext('2d'), W=cv.width,H=cv.height;
  let before=null,dragIdx=-1;
  const px=i=>30+i/5*(W-60), py=v=>H-30-v*(H-60);
  function paint(){
    x.clearRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.10)'; x.lineWidth=1;
    for(let i=0;i<=4;i++){ const g=30+i/4*(W-60); x.beginPath();x.moveTo(g,20);x.lineTo(g,H-20);x.stroke();
      const q=20+i/4*(H-40); x.beginPath();x.moveTo(20,q);x.lineTo(W-20,q);x.stroke(); }
    x.strokeStyle='rgba(255,255,255,.22)'; x.setLineDash([5,5]);
    x.beginPath();x.moveTo(30,H-30);x.lineTo(W-30,30);x.stroke(); x.setLineDash([]);
    const col=['#fff','#ff453a','#30d158','#0a84ff'][state.curveChannel];
    x.strokeStyle=col; x.lineWidth=3; x.lineJoin='round'; x.beginPath();
    state.curve.forEach((v,i)=>i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v))); x.stroke();
    state.curve.forEach((v,i)=>{ x.fillStyle=col; x.beginPath();x.arc(px(i),py(v),7,0,7);x.fill();
      x.strokeStyle='rgba(0,0,0,.6)';x.lineWidth=2;x.stroke(); });
  }
  function toLocal(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}; }
  cv.addEventListener('pointerdown',e=>{
    capturePointer(cv,e); before=JSON.stringify(state);
    const q=toLocal(e); let bi=0,bd=1e9;
    state.curve.forEach((v,i)=>{const d=Math.abs(q.x-px(i));if(d<bd){bd=d;bi=i;}});
    dragIdx=bi; state.curve[bi]=clamp((H-30-q.y)/(H-60),0,1); paint(); requestRender();
  });
  cv.addEventListener('pointermove',e=>{ if(dragIdx<0)return; const q=toLocal(e);
    state.curve[dragIdx]=clamp((H-30-q.y)/(H-60),0,1);
    if(dragIdx>0)state.curve[dragIdx]=Math.max(state.curve[dragIdx],state.curve[dragIdx-1]);
    paint(); requestRender(); });
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{if(dragIdx>=0){dragIdx=-1;commit(before);before=null;}}));
  cv.addEventListener('dblclick',()=>mutate(()=>{state.curve=[0,.2,.4,.6,.8,1];buildPanel();}));
  paint();
}

/* ============================================================
   可视化裁剪：直接在整张照片上拖框，不再靠 4 个数值滑杆
   - cropEd 是独立 2D 画布，显示未经调色的完整原图（含旋转 / 翻转方向）
   - 框坐标始终存成 state.crop（原图归一化 UV），与导出 / 渲染完全兼容
   - 命中与绘制用同一个 DOMMatrix，旋转 90° 后也不会错位
   ============================================================ */
let cropGeo=null;          // {bw,bh,M,iM}：绘制尺寸与正 / 逆变换
let cropDrag=null;         // {mode,anchor,start,before}
const CROP_MIN=.035;
/* 裁剪是一次「会话」：进入时存一份完整起点，拖动过程不写历史，
   点「完成」才一次性提交一步；「取消」连中间步一起回滚。
   这样既有了明确的完成动作，也不会一次裁剪塞满 60 步撤销历史。 */
let cropSession=null;
function startCropSession(){
  if(cropSession) return;
  try{ cropSession={from:tool,beforeStr:JSON.stringify(state),histLen:undoStack.length}; }
  catch(e){ cropSession=null; }
}
function finishCrop(save){
  if(!cropSession) return null;
  const S=cropSession; cropSession=null; cropDrag=null;
  /* 丢弃裁剪期间滑杆 / 比例 / 旋转产生的中间步 */
  if(undoStack.length>S.histLen) undoStack.length=S.histLen;
  redoStack=[];
  if(save){
    commit(S.beforeStr);
    toast('✓ 裁剪完成 · '+exportSize().join('×')+' px');
  }else{
    try{ state=JSON.parse(S.beforeStr); }catch(e){}
    syncUI(); requestRender();
    toast('已取消裁剪');
  }
  if(window.IrisAutosave) IrisAutosave.schedule();
  syncCropMode();
  return S;
}
function cropDone(){
  const S=finishCrop(true);
  gotoTool(S&&S.from&&S.from!=='crop'?S.from:'plate');
  syncCropMode();
}
function cropCancel(){
  const S=finishCrop(false);
  gotoTool(S&&S.from&&S.from!=='crop'?S.from:'plate');
  syncCropMode();
}

function cropTargetRatio(){
  const id=state.aspect||'free';
  if(id==='free') return 0;
  const px=(id==='original')?imgW/imgH:(function(){const a=id.split(':').map(Number);return a[0]/a[1];})();
  return px*(imgH/imgW);          // 换算到 UV 空间的 宽/高
}
function cropGeometry(){
  const W=cropEd.clientWidth,H=cropEd.clientHeight;
  if(W<2||H<2) return null;
  const pad=isMobile()?14:26;
  const availW=Math.max(40,W-2*pad), availH=Math.max(40,H-2*pad);
  const rot=((state.rot||0)%4+4)%4;
  const ar=imgW/Math.max(imgH,1);
  const showAr=(rot%2)?1/ar:ar;                 // 旋转后显示区域的宽高比
  let RW=availW,RH=availW/showAr;
  if(RH>availH){ RH=availH; RW=availH*showAr; }
  // 未旋转图的绘制尺寸（旋转 90° 时宽高互换）
  const bw=(rot%2)?RH:RW, bh=(rot%2)?RW:RH;
  const cx=W/2, cy=H/2;
  const M=new DOMMatrix().translateSelf(cx,cy)
    .rotateSelf(rot*90).scaleSelf(state.flipX||1,state.flipY||1)
    .translateSelf(-bw/2,-bh/2);
  return {bw,bh,RW,RH,cx,cy,M,iM:M.inverse()};
}
/* 屏幕像素 → 原图 UV */
function cropScreenToUV(px,py){
  if(!cropGeo) return [0,0];
  const q=cropGeo.iM.transformPoint(new DOMPoint(px,py));
  return [q.x/cropGeo.bw,q.y/cropGeo.bh];
}
/* 原图 UV → 屏幕像素 */
function cropUVToScreen(u,v){
  if(!cropGeo) return [0,0];
  const q=cropGeo.M.transformPoint(new DOMPoint(u*cropGeo.bw,v*cropGeo.bh));
  return [q.x,q.y];
}
function cropHandlePoints(){
  const c=state.crop;
  return {
    nw:cropUVToScreen(c[0],c[1]), ne:cropUVToScreen(c[2],c[1]),
    sw:cropUVToScreen(c[0],c[3]), se:cropUVToScreen(c[2],c[3]),
    n:cropUVToScreen((c[0]+c[2])/2,c[1]), s:cropUVToScreen((c[0]+c[2])/2,c[3]),
    w:cropUVToScreen(c[0],(c[1]+c[3])/2), e:cropUVToScreen(c[2],(c[1]+c[3])/2)
  };
}
function cropHit(px,py){
  const P=cropHandlePoints();
  const R=isMobile()?30:21;
  for(const k of ['nw','ne','sw','se','n','s','w','e']){
    if(Math.hypot(px-P[k][0],py-P[k][1])<=R) return {mode:'resize',handle:k};
  }
  const c=state.crop;
  const u=cropScreenToUV(px,py);
  if(u[0]>=c[0]&&u[0]<=c[2]&&u[1]>=c[1]&&u[1]<=c[3]) return {mode:'move',u};
  // 框外且在照片内 → 拖出新框
  if(u[0]>=0&&u[0]<=1&&u[1]>=0&&u[1]<=1) return {mode:'new',u};
  return {mode:'none'};
}
function cropClampBox(c){
  c[0]=clamp(c[0],0,1-CROP_MIN); c[2]=clamp(c[2],CROP_MIN,1);
  c[1]=clamp(c[1],0,1-CROP_MIN); c[3]=clamp(c[3],CROP_MIN,1);
  if(c[2]-c[0]<CROP_MIN) c[2]=Math.min(1,c[0]+CROP_MIN);
  if(c[3]-c[1]<CROP_MIN) c[3]=Math.min(1,c[1]+CROP_MIN);
  return c;
}
/* 比例约束：固定某条边 / 某个角，按 target 调整另一维 */
function cropApplyRatio(c,target,anchorX,anchorY){
  if(!target) return c;
  let w=c[2]-c[0], h=c[3]-c[1];
  if(w/h>target) w=h*target; else h=w/target;
  // 以锚点（固定不动的角）为基准展开
  const x0=(anchorX==='left')?c[0]-w:(anchorX==='right')?c[2]:(c[0]+c[2]-w)/2;
  const y0=(anchorY==='top')?c[3]-h:(anchorY==='bottom')?c[1]:(c[1]+c[3]-h)/2;
  c=[x0,y0,x0+w,y0+h];
  // 越界时整体回收，保持比例
  if(c[0]<0){ const d=-c[0]; c=[c[0]+d,c[1],c[2]+d,c[3]]; }
  if(c[2]>1){ const d=c[2]-1; c=[c[0]-d,c[1],c[2]-d,c[3]]; }
  if(c[1]<0){ const d=-c[1]; c=[c[0],c[1]+d,c[2],c[3]+d]; }
  if(c[3]>1){ const d=c[3]-1; c=[c[0],c[1]-d,c[2],c[3]-d]; }
  return cropClampBox(c);
}
function cropResize(start,h,u,v){
  const target=cropTargetRatio();
  const dragL=h.includes('w'), dragT=h.includes('n');
  const fixX=dragL?start[2]:start[0];      // 被拖边的对边（固定不动）
  const fixY=dragT?start[3]:start[1];
  const nx=(h.includes('w')||h.includes('e'))?clamp(u,0,1):(dragL?start[0]:start[2]);
  const ny=(h.includes('n')||h.includes('s'))?clamp(v,0,1):(dragT?start[1]:start[3]);
  let l=Math.min(nx,fixX), r=Math.max(nx,fixX),
      t=Math.min(ny,fixY), bo=Math.max(ny,fixY);
  // 最小尺寸：把被拖边推开，固定边不动
  if(r-l<CROP_MIN){ if(nx<fixX) l=fixX-CROP_MIN; else r=fixX+CROP_MIN; }
  if(bo-t<CROP_MIN){ if(ny<fixY) t=fixY-CROP_MIN; else bo=fixY+CROP_MIN; }
  if(target){
    let w=r-l, hh=bo-t;
    if(w/hh>target) w=hh*target; else hh=w/target;
    l=dragL?fixX-w:fixX;   r=dragL?fixX:fixX+w;
    t=dragT?fixY-hh:fixY;  bo=dragT?fixY:fixY+hh;
  }
  return cropClampBox([l,t,r,bo]);
}
function drawCropEditor(){
  if(tool!=='crop'||!imageReady||!LIVE.still){ cropEd.classList.remove('on'); return; }
  cropEd.classList.add('on');
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=cropEd.clientWidth,H=cropEd.clientHeight;
  const pw=Math.max(2,Math.round(W*dpr)),ph=Math.max(2,Math.round(H*dpr));
  if(cropEd.width!==pw||cropEd.height!==ph){cropEd.width=pw;cropEd.height=ph;}
  const x=cropEd.getContext('2d');
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  x.fillStyle='#0b0b0d';x.fillRect(0,0,W,H);
  cropGeo=cropGeometry(); if(!cropGeo) return;
  const {bw,bh,M}=cropGeo;
  // 完整原图（含旋转 / 翻转），带一点柔光边框
  x.save();
  x.setTransform(dpr,0,0,dpr,0,0);
  x.transform(M.a,M.b,M.c,M.d,M.e,M.f);
  x.imageSmoothingQuality='high';
  try{ x.drawImage(LIVE.still,0,0,bw,bh); }
  catch(e){ x.fillStyle='#2a2a2e';x.fillRect(0,0,bw,bh); }
  x.restore();

  const c=state.crop;
  // 框外压暗
  x.save(); x.setTransform(dpr,0,0,dpr,0,0);
  const P=cropUVToScreen(0,0),Q=cropUVToScreen(1,0),R=cropUVToScreen(1,1),S=cropUVToScreen(0,1);
  x.fillStyle='rgba(6,6,8,.68)';
  x.beginPath();
  x.moveTo(0,0);x.lineTo(W,0);x.lineTo(W,H);x.lineTo(0,H);x.closePath();
  x.moveTo(P[0],P[1]);x.lineTo(S[0],S[1]);x.lineTo(R[0],R[1]);x.lineTo(Q[0],Q[1]);x.closePath();
  x.fill('evenodd');
  x.restore();

  // 裁剪框（跟图一起旋转的矩形）
  x.save(); x.setTransform(dpr,0,0,dpr,0,0);
  x.transform(M.a,M.b,M.c,M.d,M.e,M.f);
  x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=1.4/Math.max(.6,Math.min(Math.abs(M.a)+Math.abs(M.b),2));
  x.strokeRect(c[0]*bw,c[1]*bh,(c[2]-c[0])*bw,(c[3]-c[1])*bh);
  // 九宫格
  x.strokeStyle='rgba(255,255,255,.32)';x.lineWidth=1/Math.max(.6,Math.min(Math.abs(M.a)+Math.abs(M.b),2));
  for(let i=1;i<3;i++){
    const u=c[0]+(c[2]-c[0])*i/3, v=c[1]+(c[3]-c[1])*i/3;
    x.beginPath();x.moveTo(u*bw,c[1]*bh);x.lineTo(u*bw,c[3]*bh);x.stroke();

  }

  // 手柄：在屏幕坐标画，恒为正圆，命中也用同一套点
  const hp=cropHandlePoints();

  x.save(); x.setTransform(dpr,0,0,dpr,0,0);
  ['n','s','w','e'].forEach(k=>{
    const [px,py]=hp[k];
    x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(px,py,hr*.72,0,Math.PI*2);x.fill();
  });

    const [px,py]=hp[k];

    x.beginPath();x.arc(px,py,hr+2,0,Math.PI*2);x.fill();x.stroke();
  });

  const [ew,eh]=exportSize();
  const ar=state.aspect==='free'?'自由':state.aspect;
  const label=`${ar}  ·  ${ew}×${eh} px  ·  编辑栏顶部可点「完成」`;
  x.font='600 11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif';
  const tw=x.measureText(label).width+22;
  const bx=clamp((hp.nw[0]+hp.ne[0])/2-tw/2,8,W-tw-8);
  const by=clamp(Math.min(hp.nw[1],hp.ne[1])-34,8,H-30);
  x.fillStyle='rgba(16,16,19,.88)';x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=1;
  roundRect(x,bx,by,tw,24,9);x.fill();x.stroke();
  x.fillStyle='#f2f2f5';x.textAlign='center';x.textBaseline='middle';
  x.fillText(label,bx+tw/2,by+12.5);
  x.restore();
}

function applyAspect(id){
  if(id==='free')return;
  let ratio;
  if(id==='original') ratio=imgW/imgH;
  else {const [a,b]=id.split(':').map(Number);ratio=a/b;}
  const c=state.crop, cx=(c[0]+c[2])/2, cy=(c[1]+c[3])/2;
  let cw=c[2]-c[0], ch=c[3]-c[1];
  const target=ratio*(imgH/imgW); // 宽高比换算到 UV 空间
  if(cw/ch>target) cw=ch*target; else ch=cw/target;
  cw=Math.min(cw,1);ch=Math.min(ch,1);
  state.crop=[clamp(cx-cw/2,0,1-cw),clamp(cy-ch/2,0,1-ch),clamp(cx+cw/2,cw,1),clamp(cy+ch/2,ch,1)];
  state.crop[2]=Math.max(state.crop[2],state.crop[0]+.02);
  state.crop[3]=Math.max(state.crop[3],state.crop[1]+.02);
  requestRender();
}
function exportSize(){
  let w=Math.max(1,Math.round(imgW*(state.crop[2]-state.crop[0])));
  let h=Math.max(1,Math.round(imgH*(state.crop[3]-state.crop[1])));
  if(state.rot%2) [w,h]=[h,w];
  return [w,h];
}

/* ============================================================
   色调迁移（Color Transfer）
   保存的是「这张照片成品的整体色彩分布」，不是编辑参数。
   套用时：分析当前照片的色彩分布 → 生成 16³ 3D LUT → 把整体色调
   推向目标照片，滤镜层 / 调色盘 / 文字贴纸 / 裁剪一律不动。
   ============================================================ */
const IRIS_TONE_STORE='iris_tones_v1';
function irisToneSave(){ try{ localStorage.setItem(IRIS_TONE_STORE,JSON.stringify(IRIS_TONES)); }catch(e){ toast('保存失败：本地存储已满'); } }
function irisToneLoad(){
  try{ const a=JSON.parse(localStorage.getItem(IRIS_TONE_STORE)||'[]');
    IRIS_TONES=Array.isArray(a)?a.filter(t=>t&&t.id&&t.name&&(t.fp||t.thumb||t.state)).slice(0,60):[];
  }catch(e){ IRIS_TONES=[]; }
}
function irisToneUnique(base){
  let n=base,i=2; const used=new Set(IRIS_TONES.map(t=>t.name));
  while(used.has(n)) n=base+' '+(i++);
  return n;
}
function toneAutoName(){
  const main=(state.layers||[]).map(L=>L.name).find(n=>n&&n!=='原图')||'原图';
  return irisToneUnique(main+' · 色调 '+String(IRIS_TONES.length+1).padStart(2,'0'));
}

/* ---------- sRGB ⇄ Lab（D65），Reinhard 色彩迁移的标准色彩空间 ---------- */
function srgbLin(v){ v/=255; return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4); }
function labF(t){ return t>0.008856?Math.cbrt(t):(7.787*t+16/116); }
function labFi(t){ const q=t*t*t; return q>0.008856?q:(t-16/116)/7.787; }
function rgbToLab(r8,g8,b8){
  const r=srgbLin(r8),g=srgbLin(g8),b=srgbLin(b8);
  const X=0.4124564*r+0.3575761*g+0.1804375*b,
        Y=0.2126729*r+0.7151522*g+0.0721750*b,
        Z=0.0193339*r+0.1191920*g+0.9503041*b;
  const fx=labF(X/0.95047),fy=labF(Y/1.0),fz=labF(Z/1.08883);
  return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function labToRGB(L,a,b){
  const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200;
  const X=0.95047*labFi(fx),Y=labFi(fy),Z=1.08883*labFi(fz);
  let r= 3.2404542*X-1.5371385*Y-0.4985314*Z,
      g=-0.9692660*X+1.8760108*Y+0.0415560*Z,
      bb=0.0556434*X-0.2040259*Y+1.0572252*Z;
  const enc=v=>v<=0.0031308?12.92*v:1.055*Math.pow(Math.max(v,0),1/2.4)-0.055;
  return [enc(r),enc(g),enc(bb)];
}
function smoothJS(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
/* 按亮度把像素软分到「阴影 / 中间调 / 高光」三档，权重和为 1 */
function bandWeights(L){
  const s=1-smoothJS(30,58,L), h=smoothJS(52,82,L);
  const m=Math.max(0,1-s-h), sum=s+m+h||1;
  return [s/sum,m/sum,h/sum];
}
function toneAccum(){
  return {w:0,sum:[0,0,0],sq:[0,0,0]};
}
function toneAdd(A,v,w){
  A.w+=w;
  for(let c=0;c<3;c++){ A.sum[c]+=v[c]*w; A.sq[c]+=v[c]*v[c]*w; }
}
function toneFin(A){
  const w=Math.max(A.w,1e-6), m=[0,0,0], sd=[0,0,0];
  for(let c=0;c<3;c++){
    m[c]=A.sum[c]/w;
    sd[c]=Math.max(Math.sqrt(Math.max(A.sq[c]/w-m[c]*m[c],0)), c===0?2.5:1.2);
  }
  return {m,s:sd};
}
/* 从 RGBA 像素统计「整体色调指纹」：全局 + 三档的 Lab 均值 / 标准差 */
function toneFingerprint(px){
  const G=toneAccum(), B=[toneAccum(),toneAccum(),toneAccum()];
  for(let i=0;i<px.length;i+=4){
    const v=rgbToLab(px[i],px[i+1],px[i+2]);
    toneAdd(G,v,1);
    const w=bandWeights(v[0]);
    for(let k=0;k<3;k++) toneAdd(B[k],v,w[k]);
  }
  return {v:2,g:toneFin(G),b:B.map(toneFin)};
}
/* 取当前成品画面的指纹；noTone=true 时排除已有迁移层，避免反馈循环 */
function computeToneFingerprint(noTone){
  const size=96, px=renderSmall(size,{e:effective(),noTone:!!noTone});
  render();
  return toneFingerprint(px);
}
function skinLike(r,g,b){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  return r>g&&g>=b&&r>0.28&&(r-b)>0.055&&(r-b)<0.44&&d>0.045&&d<0.48;
}
/* 生成「当前照片 → 目标色调」的 16³ LUT，atlas 布局与 .cube 完全一致。
   分档做 Lab 均值/方差迁移；限制缩放与偏移，肤色区额外收敛，避免怪色毁脸。 */
function buildTransferLUT(src,dst,N){
  const W=N*N, buf=new Uint8Array(W*N*4);
  for(let bi=0;bi<N;bi++) for(let gi=0;gi<N;gi++) for(let ri=0;ri<N;ri++){
    const r=ri/(N-1),g=gi/(N-1),b=bi/(N-1);
    const lab=rgbToLab(r*255,g*255,b*255);
    const w=bandWeights(lab[0]), out=[0,0,0], sk=skinLike(r,g,b);
    for(let k=0;k<3;k++){
      const S=src.b[k],D=dst.b[k];
      for(let c=0;c<3;c++){
        const sc=clamp(D.s[c]/Math.max(S.s[c],1.0),0.72,1.45);
        let d=((lab[c]-S.m[c])*sc+D.m[c])-lab[c];
        d=clamp(d,c===0?-30:-28,c===0?30:28);
        if(c>0&&sk) d*=0.62;
        out[c]+=w[k]*(lab[c]+d);
      }
    }
    for(let c=0;c<3;c++) out[c]=lab[c]+(out[c]-lab[c])*0.92;
    const rgb=labToRGB(out[0],out[1],out[2]);
    const o=(bi*W+gi*N+ri)*4;
    buf[o]=clamp(rgb[0]*255,0,255);
    buf[o+1]=clamp(rgb[1]*255,0,255);
    buf[o+2]=clamp(rgb[2]*255,0,255);
    buf[o+3]=255;
  }
  return buf;
}
function uploadToneLut(buf,N){
  gl.activeTexture(gl.TEXTURE8);
  gl.bindTexture(gl.TEXTURE_2D,toneLutTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,N*N,N,0,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  gl.activeTexture(gl.TEXTURE0);
}
/* 惰性重建：state 里只存「目标 id + 当前照片指纹」，LUT 可确定性重算，
   因此撤销 / 重做 / 参数 JSON 导入后都能自愈，不需要把 16³ 数据塞进存档。 */
function ensureToneLut(){
  const tt=state.toneTransfer;
  if(!tt||!tt.on||!tt.id||!tt.src){ TONE_LUT.on=false; return; }
  const tone=IRIS_TONES.find(t=>t.id===tt.id), dst=tone&&tone.fp;
  if(!dst){ TONE_LUT.on=false; return; }
  const key=tt.id+'|'+JSON.stringify(tt.src);
  if(TONE_LUT.key===key&&TONE_LUT.ready){ TONE_LUT.on=true; return; }
  try{
    uploadToneLut(buildTransferLUT(tt.src,dst,TONE_LUT.N),TONE_LUT.N);
    TONE_LUT.key=key; TONE_LUT.ready=true; TONE_LUT.on=true;
  }catch(e){ TONE_LUT.on=false; }
}
/* 旧版条目只有编辑参数 + 缩略图：从缩略图反算色彩指纹，自动升级 */
function upgradeToneFP(t){
  if(t.fp||!t.thumb) return;
  const im=new Image();
  im.onload=()=>{
    const c=document.createElement('canvas'); c.width=c.height=76;
    const x=c.getContext('2d'); x.drawImage(im,0,0,76,76);
    t.fp=toneFingerprint(new Uint8Array(x.getImageData(0,0,76,76).data));
    delete t.state;
    irisToneSave();
    try{ buildPanel(true); }catch(e){}
  };
  im.src=t.thumb;
}

function irisToneFilterName(t){ return '✦ '+t.name; }
function registerIrisTone(t){
  const fname=irisToneFilterName(t);

    /* 空 p：点击时被 tryApplyToneFilter 拦截，走「色调迁移」而不是改滤镜层 */
    FILTERS.push({name:fname,group:'我的',user:true,toneId:t.id,p:{}});
    USER_FILTERS.push(FILTERS[FILTERS.length-1]); FILTER_MAP=null;
  }
  if(!QUICK.some(q=>q.toneId===t.id)){
    QUICK.push({name:fname,cat:'我的',f:'整体色调',toneId:t.id,thumb:t.thumb,user:true});
  }

function unregisterIrisTone(id){
  const t=IRIS_TONES.find(v=>v.id===id); if(!t) return;
  const fname=irisToneFilterName(t);
  const i=FILTERS.findIndex(f=>f.toneId===id); if(i>=0) FILTERS.splice(i,1);
  USER_FILTERS=USER_FILTERS.filter(u=>u.toneId!==id);
  const qi=QUICK.findIndex(q=>q.toneId===id); if(qi>=0) QUICK.splice(qi,1);

}
function saveCurrentTone(){
  if(!imageReady){ toast('请先导入照片'); return; }

  const t={id:'tone_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),
    name:toneAutoName(),created:Date.now(),fp:toneFingerprint(px),thumb:''};
  t.thumb=dataURLFromPixels(px,96);
  render();
  IRIS_TONES.push(t); irisToneSave(); registerIrisTone(t);
  buildPanel(); toast('已保存「'+t.name+'」的整体色调 · 换照片后可一键迁移');
  try{ CMD.built=false; }catch(e){}
  return t;
}
/* 套用 = 色彩迁移：分析当前照片 → 生成 LUT → 推向上张照片的整体色调。
   不覆盖任何编辑参数、不带任何元素或构图。 */
function applyIrisTone(id){
  const t=IRIS_TONES.find(v=>v.id===id);
  if(!t){ toast('这套色调已不存在'); return false; }
  if(!t.fp){ toast('这套色调缺少色彩数据（旧版存档正在升级），请稍后再试或重新保存'); return false; }
  const src=computeToneFingerprint(true);
  mutate(()=>{
    state.toneTransfer={on:true,id,strength:1,src,name:t.name};
  });
  TONE_LUT.key=''; TONE_LUT.ready=false;
  buildPanel(true); render();
  toast('已把「'+t.name+'」的整体色调迁移到当前照片');
  return true;
}
function clearToneTransfer(){
  mutate(()=>{ state.toneTransfer={on:false,id:'',strength:1,src:null,name:''}; });
  TONE_LUT.key=''; TONE_LUT.ready=false;
  buildPanel(true); render(); toast('已清除色调迁移');
}
function setToneStrength(v){
  const b=JSON.stringify(state);
  state.toneTransfer.strength=clamp(v,0,1);
  commit(b); buildPanel(true); requestRender();
}
function renameIrisTone(id){
  const t=IRIS_TONES.find(v=>v.id===id); if(!t) return;
  const name=prompt('重命名色调',t.name); if(!name||!name.trim()) return;
  const nn=name.trim();
  if(IRIS_TONES.some(v=>v.id!==id&&v.name===nn)){ toast('已有同名色调'); return; }
  unregisterIrisTone(id);
  t.name=nn;
  IRIS_TONES=IRIS_TONES.map(v=>v.id===id?t:v);
  irisToneSave(); registerIrisTone(t);
  if(state.toneTransfer&&state.toneTransfer.id===id) state.toneTransfer.name=nn;
  buildPanel(); try{ CMD.built=false; }catch(e){}
  toast('已重命名为「'+nn+'」');
}
function deleteIrisTone(id){
  const t=IRIS_TONES.find(v=>v.id===id); if(!t) return;
  if(!confirm('删除色调「'+t.name+'」？同时移除对应的滤镜与模板。')) return;
  unregisterIrisTone(id);
  IRIS_TONES=IRIS_TONES.filter(v=>v.id!==id); irisToneSave();
  if(state.toneTransfer&&state.toneTransfer.id===id){
    state.toneTransfer={on:false,id:'',strength:1,src:null,name:''};
    TONE_LUT.key=''; TONE_LUT.ready=false;
  }
  buildPanel(); toast('已删除');
  try{ CMD.built=false; }catch(e){}
}
function exportIrisTone(id){
  const t=IRIS_TONES.find(v=>v.id===id); if(!t) return;
  downloadBlob(new Blob([JSON.stringify({_irisTone:true,v:2,name:t.name,fp:t.fp,thumb:t.thumb},null,2)],
    {type:'application/json'}),'Iris_色调_'+t.name.replace(/[\\/:*?"<>|]/g,'_')+'.json');
}
function importIrisToneJSON(text){
  const o=JSON.parse(text);
  if(!o||!o.name||(!o.fp&&!o.thumb)) throw new Error('不是有效的 Iris 色调文件');
  const t={id:'tone_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),
    name:irisToneUnique(o.name),created:Date.now(),fp:o.fp||null,thumb:o.thumb||''};
  IRIS_TONES.push(t); irisToneSave();
  if(!t.fp) upgradeToneFP(t);
  registerIrisTone(t); buildPanel();
  toast('已导入色调「'+t.name+'」');
  try{ CMD.built=false; }catch(e){}
}
function initIrisTones(){
  irisToneLoad();
  if(!TEMPLATE_CATS.includes('我的')) TEMPLATE_CATS.push('我的');
  IRIS_TONES.forEach(t=>{ if(!t.fp) upgradeToneFP(t); registerIrisTone(t); });
}
function tryApplyToneFilter(name){
  const f=filterMap().get(name);
  if(!f||!f.toneId) return false;
  if(!applyIrisTone(f.toneId)) return false;
  noteRecent(name); buildPanel(true); return true;
}

function applyTemplate(q){

  mutate(()=>{
    state.layers=[newLayer(q.f)]; state.editLayer=0; state.editLayerName=q.f;
    state.globalPlates=platesZero(); state.plateScope=0;
    Object.entries(q.pl||{}).forEach(([k,v])=>{ if(state.layers[0].plates[k]) state.layers[0].plates[k]=deep(v); });
    if(q.sem) state.sem={...state.sem,color:q.sem.c,tone:q.sem.t,intensity:q.sem.i,presetId:'custom',enabled:true};
    else state.sem={...state.sem,color:0,tone:0,intensity:1,presetId:'standard'};
    Object.entries(q.b||{}).forEach(([k,v])=>{ const key=PK[k]||k; if(key in state.base) state.base[key]=v; });
    if(q.frame) state.frame={...state.frame,...q.frame};
  });
  gotoTool('plate'); toast('已应用模板「'+q.name+'」');
}

  {name:'微距浅景深',v:{on:true,focus:.20,aperture:1,bokeh:.85,parallax:0,lightAmt:0,depthBias:0}},

];
function lfAutoFocus(){
  const st=SEM.stats||{skin:0,sky:0};
  const f=clamp(.48+.34*(st.sky||0)-.30*(st.skin||0),.06,.94);
  mutate(()=>{ state.lf.focus=f; state.lf.on=true; buildPanel(true); });
  toast('已自动对焦到主体 · 深度 '+f.toFixed(2));
}
function lfDepthPreview(p){
  const old=p.querySelector('.lf-depth'); if(old) old.remove();
  const W=SEM.W||96,H=SEM.H||72;
  if(!SEM.matteCanvas||!imageReady){ toast('请先导入照片并等待画面分析'); return; }
  const src=SEM.matteCanvas.getContext('2d').getImageData(0,0,W,H).data;
  const c=document.createElement('canvas'); c.className='lf-depth';
  c.width=W;c.height=H;c.style.cssText='width:100%;height:auto;border-radius:10px;display:block;margin:8px 0';
  const im=c.getContext('2d').createImageData(W,H);
  for(let i=0;i<W*H;i++){
    const sk=src[i*4]/255, sy=src[i*4+1]/255, hr=src[i*4+2]/255;
    const d=clamp(.48+.34*sy-.30*sk-.14*hr+(state.lf.depthBias||0),0,1);
    im.data[i*4]=Math.round(255*(1-d)); im.data[i*4+1]=Math.round(90+130*d);
    im.data[i*4+2]=Math.round(255*d); im.data[i*4+3]=255;
  }
  c.getContext('2d').putImageData(im,0,0);
  p.append(c);
  p.append(hint('深度代理伪彩：蓝＝近 / 红＝远。由语义 matte、亮度与透视位置合成，非真实测距。'));
}
function buildLightField(p){
  const LF=state.lf;
  const chip=(label,items,val,set)=>{
    const d=section(label);
    d.append(chipRow(items.map(([id,n])=>({id,name:n})),val,id=>{mutate(()=>set(id));buildPanel(true);}));
    return d;
  };
  const s=section('光场引擎 · 重聚焦 / 视差 / 重打光');
  s.append(hint('用语义分割、亮度与透视位置生成连续的<b>深度代理</b>，再按 CoC 做圆盘散景重聚焦、'
    +'按深度做视差位移、用深度梯度近似法线做定向重打光。全部在 GPU 逐像素完成，原图不改写。'
    +'<br>这是单张照片的 2.5D 近似，<b>不是光场相机射线数据</b>，复杂遮挡与透明物体会有误差。'));
  s.append(chip('开关',[[false,'关闭'],[true,'开启']],!!LF.on,v=>state.lf.on=!!v));
  const pr=document.createElement('div'); pr.className='row';
  LF_PRESETS.forEach(q=>pr.append(button(q.name,()=>mutate(()=>{
    state.lf={...state.lf,...q.v}; buildPanel(true); toast('光场预设：'+q.name);
  }))));
  pr.append(button('◎ 自动对焦主体',lfAutoFocus));
  s.append(pr); p.append(s);

  const s2=section('焦平面与光圈');
  s2.append(slider('lf.focus','焦平面深度（0 近 → 1 远）',0,1,.01,'',.5));
  s2.append(slider('lf.aperture','光圈 / 虚化强度',0,1,.01,'',.5));
  s2.append(slider('lf.bokeh','焦外光斑（高光加权）',0,1,.01,'',.45));
  s2.append(slider('lf.depthBias','深度整体偏置',-.4,.4,.01,'',0));
  const r=document.createElement('div'); r.className='row';
  r.append(button('◉ 查看深度图',()=>lfDepthPreview(s2)),
    button('全部还原',()=>mutate(()=>{state.lf={...defaultState().lf};buildPanel(true);})));
  s2.append(r); p.append(s2);

  const s3=section('视差与重打光');
  s3.append(slider('lf.parallax','视差微移（正负＝左右）',-1,1,.01,'',0));
  s3.append(slider('lf.lightAngle','光照方向（度）',0,360,1,'',125));
  s3.append(slider('lf.lightAmt','重打光强度',0,1,.01,'',0));
  s3.append(hint('视差适合配合「导出视频 / GIF」做 2.5D 微动；重打光用深度梯度估法线，'
    +'只做柔和定向明暗，不会生成新阴影或改变物体形状。'));
  p.append(s3);
}

  {id:'export',t:'13 · 导出中心',k:'导出 PNG JPG WebP GIF 视频 MP4 WebM 60fps 画质 码率 画框 拍立得 打包',
  b:'顶栏「导出 ▾」集中了照片 / GIF 动图 / 视频 / 实况配对素材 / 全格式打包。'
   +'<br><b>照片</b>：PNG / JPG / WebP，可调尺寸倍率、最长边与压缩质量；画框（纯白 / 纯黑 / 拍立得 / 胶片齿孔 / 投影 / 自定义色）只在导出时叠加。'
   +'<br><b>视频</b>：默认「原格式 / 原画质 / 不压缩 / 无变化」——不降分辨率、不主动限码率、定格无运镜；'
   +'可选画质档、自定义码率、帧率 <b>最高 60fps</b>、原始 / 4K 分辨率、自定义时长最长 24 小时、5 种运镜，导出中有进度并可中途停止保存。'
   +'要真正零重编码，用「原始视频文件」直接下载源 .MOV/.MP4。'
   +'<br><b>GIF</b>：纯前端 GIF89a 编码，256 色自适应调色板 + 抖动，可调时长 / 帧率 / 尺寸 / 动效 / 循环次数。'
   +'<br><b>打包全格式</b>：一次出 PNG + JPG + WebP 的 ZIP。'},
 {id:'live',t:'14 · iOS 实况照片',k:'实况 Live Photo HEIC MOV 播放 进度条 选帧 配对素材 快捷指令',
  b:'同时导入同名 .HEIC + .MOV 会自动认成一组，画面左上出现 LIVE 标记；长按画面、点标记或按 L 播放。'
   +'播放时所有滤镜、调色盘、文字贴纸与涂抹效果都逐帧生效。进度条可拖到任意帧并「设封面」。'
   +'<br><b>限制</b>：网页不能把结果写回 iOS 相册变成原生实况照片，需用「快捷指令 → 将图像和视频转换为实况照片」把封面与视频重新配对；'
   +'动态片段不含原音频，最长 6 秒；部分浏览器打不开 HEIC 时会自动用视频中间帧作封面。'},
 {id:'search',t:'15 · 全局搜索与快捷键',k:'搜索 Ctrl K 快捷键 命令面板 1-9 空格 对比 Esc',
  b:'顶栏放大镜或 Ctrl/⌘+K（也可按 /）打开全局搜索：工具、433 款滤镜、调整参数、78 套内置模板与我的色调、常用操作都能搜到，'
   +'↑↓ 选择、Enter 执行、Esc 关闭。搜「色温」会跳到对应滑杆并高亮；'
  +'折叠起来的 <b>20 种盘模式</b>也能直接搜名字（如「鲜艳」「人像」「红外」）一键切换。'
   +'<br>常用：Ctrl/⌘+Z 撤销、+Shift+Z 重做、空格按住看原图、R 分屏对比、E 导出、L 播放实况、'
   +'1–9/0 切换工具、F 收起编辑栏、\\ 切填满 / 适应。完整清单在预设页「关于」栏。'},
 {id:'archive',t:'16 · 参数存档与隐私',k:'参数 JSON 复制 粘贴 预设 自定义滤镜 localStorage 隐私 不上传 撤销 重做',
  b:'所有编辑都是<b>非破坏</b>的：只存 preset_id +（tone, color, intensity）+ matte 版本元数据，原图像素从不改写，'
   +'撤销重做、导入存档都能回滚重算。'
   +'<br>预设页「编辑参数」可复制 / 粘贴参数、导出 / 导入 JSON；自定义滤镜、收藏、最近使用与界面偏好存在本机 localStorage。'
      +'<br><b>「我的空间」</b>（独立页面，顶栏「⋯」与页面中心首屏都能进）：一页看到<b>历史编辑过的图片</b>（本机最多 12 张，含缩略图、参数与原图，点「继续编辑」回到那一版）、'
  +'<b>我创作的滤镜 / 全套参数 / 色调</b>（可套用、重命名、删除）、书签、导出记录与最近使用。'
  +'<br><b>「一键保存所有参数」</b>（滤镜页 / 我的空间 / 全局搜索）：点击即把滤镜层、每层独立盘、12 色调、20 种盘模式、'
  +'基础调整、HSL、曲线、分级、分色、通道混合、光效、蒙版形状、光场、虚化、画框与色调迁移目标整套存成一款滤镜；'
  +'明确不带文字贴纸、涂抹笔迹、裁剪与导出规格。套用时是整套参数而非叠一层滤镜，完全非破坏、可撤销。'
+'<br><b>自动保存</b>：每次编辑后约 1 秒自动把【照片原始字节 + 完整编辑状态 + 缩略图】写进本机 IndexedDB；退出或切后台会再补一次落盘。重新打开时会弹卡询问「是否编辑上次的照片」，可选继续编辑 / 重新开始 / 稍后，也能在「自动保存」页设为直接恢复或彻底关闭。演示图不入档；浏览器不允许 IndexedDB 时会降级为「只存参数 + 缩略图」，恢复时明确要求重新选照片，不会假装成功。'
 +'<br><b>隐私</b>：纯前端运行，默认不发起任何网络请求；唯一的例外是你主动点「检查更新」（或开启自动检查）时读取 GitHub 的公开版本元数据，照片与编辑数据始终不发送。自动保存只写本机；清除浏览器数据即清空本地记录。快照不跨设备同步，四端各自独立。'},
 {id:'bokeh',t:'17 · 背景虚化与主体检测',k:'虚化 背景 主体 人物 物品 检测 散景 光圈 景深 一键',
  b:'「更多 → 虚化」页点<b>✦ 一键检测主体并虚化背景</b>，会先在低分辨率画面上判断是<b>人物还是物品</b>：'
   +'人物走肤色色度带 + 暗发 + 中心先验，物品走边缘色差 + 局部对比 + 中心先验；生成 128×N 的软 <b>matte</b> 后由 GPU 线性上采样，'
   +'主体之外做 12 抽样黄金角圆盘散景，主体内部保持清晰。'
   +'<br>可选自动 / 人物 / 物品三种模式，也有<b>反转</b>（改成虚化主体）、强度、光圈大小、边缘羽化、主体保护，'
   +'以及中心 X/Y 与横向 / 纵向范围四根滑杆手动收框；预览里金色是主体、蓝紫是被虚化的背景。'
   +'四种一键风格：人像柔焦、产品特写、微距浅景深、轻度氛围。'
   +'<br>导出照片 / 视频 / GIF 都会带上虚化；matte 不写进参数 JSON，换照片时按需重算。'
   +'<br><b>如实说明</b>：纯前端显著性 + 肤色先验软分割，不是设备端 ML 人像分割；多人、遮挡、透明物体、主体与背景同色会有误差。'},
 {id:'tone',t:'18 · 换照片与色调迁移',k:'换照片 导入 重置 编辑 继承 色调 保存 迁移 色彩指纹 Lab 均值 方差 3D LUT 强度 JSON',
  b:'<b>导入新照片会自动清空上一张的全部编辑</b>（滤镜层、调色盘、文字贴纸、裁剪、局部效果、虚化等），'
   +'只保留导出规格、分割精度、笔刷大小这类与照片无关的偏好。'
   +'<br><b>「保存这张照片的色调」保存的不是编辑参数，而是成品画面的整体色彩指纹</b>：'
   +'把成品缩略图转到 Lab 空间，统计全局与「阴影 / 中间调 / 高光」三档的亮度和色度均值、标准差。'
   +'所以没编辑过的原图色调也能存，编辑过的存的就是你看到的那个色调。'
   +'<br><b>「迁移到这张」是色彩迁移，不是套用编辑</b>：先分析当前照片的色彩指纹，再生成一张 <b>16³ 3D LUT</b>，'
   +'按三档分别做 Lab 均值 / 方差匹配，把当前照片的整体色调推向保存的那张。'
   +'每张新照片都会得到一套专属映射；滤镜层、调色盘、基础调整、文字贴纸、裁剪一个都不会被改动或带上。'
   +'<br>入口：顶栏「⋯ → 保存这张的色调」、按 <b>T</b>、或「预设 → 风格 → ✦ 保存这张照片的色调」。'
   +'保存后同时出现在滤镜库「我的」、模板库「我的」和全局搜索里，点一下即触发迁移。'
   +'面板里可调 <b>迁移强度</b>（0% = 原图，100% = 完全匹配），也能一键 50% 融合或关闭迁移。'
   +'<br>色调可重命名 / 删除 / 导出 JSON，也能导入别人分享的色调文件；老功能「＋ 存为滤镜」（把编辑参数存成滤镜）'
   +'与「参数复制 / JSON 存档」仍然保留，是另一条独立链路。'
   +'<br>非破坏：存档里只记「目标 id + 当前照片指纹 + 强度」，LUT 运行时确定性重算，撤销 / 重做 / 参数 JSON 导入后都能自愈。'},
 {id:'bokehpaint',t:'19 · 涂抹选取虚化范围与六种模糊',k:'虚化 涂抹 笔刷 主体 虚化区域 模糊 高斯 光斑 拖影 径向 旋转 旋焦',
  b:'「更多 → 虚化」里除了自动检测，还能<b>直接在照片上涂抹</b>：选「涂主体（保清晰）」或「涂虚化区域」，'
   +'点「✎ 开始涂抹」，金色圈跟着手指走；可撤销上一笔、清除涂抹，笔刷大小可调。'
   +'「起手方式」支持基于自动检测、全图清晰起手、全图虚化起手 —— 后者适合只把主体刷回来。'
   +'笔迹会栅格化成软 matte，与自动检测结果融合，导出照片 / 视频 / GIF 都一致。'
   +'<br><b>六种模糊</b>：圆盘散景（经典镜头）、柔和高斯（边缘最干净）、光斑散景（亮部成光斑）、'
   +'动态拖影（沿方向线性积分）、径向缩放（中心向外）、旋转旋焦（绕中心旋转）。'
   +'方向角度滑杆控制拖影 / 旋转的方向；六种都只作用于主体之外，主体清晰度不变。'},
 {id:'limits',t:'20 · 已知限制',k:'限制 WebGL 浏览器 编码 性能 内存 误差 不是ML',
  b:'<b>色调迁移是统计色彩匹配</b>，只对齐整体亮度 / 色温 / 色彩分布，不重建光影方向、局部对比或物体颜色；'
   +'两张内容差异极大的照片（如雪景 → 夜景）会趋近色调但不会变成同一张图。'
   +'为防偏色已限制方差缩放与 Lab 偏移、肤色区额外收敛，极端色调建议把「迁移强度」调到 50–80%。'
   +'<br>需要支持 <b>WebGL</b> 的浏览器；视频 / GIF 导出依赖 MediaRecorder 与 captureStream，不支持时页面会提示。'
   +'<br>浏览器录制一律有损编码，「原画质」指不降分辨率、不主动限码率；超长视频持续占用内存，'
   +'60fps + 4K 同时开启明显吃资源，手机端注意发热与电量。'
   +'<br>语义分割与光场深度都是前端近似，不是设备端 ML / 光场相机数据；复杂人像、逆光、多光源、透明物体会有误差，'
   +'但肤色兜底保证冷调不毁脸。背景虚化同样是前端显著性软分割，不是设备端 ML。GIF 上限 400 帧、256 色。'
   +'<br>关于作者、开发方式、版本状态、完整隐私说明与联系方式，见独立的「关于 Iris 与作者」页（顶栏「⋯」或全局搜索「关于」）。'
   +'<br>想了解这些功能具体是怎么实现的（渲染管线、着色器生成、坐标系统、语义 matte、涂抹遮罩、色彩迁移与导出），'
   +'请打开独立页面「<b>技术实现</b>」，共 18 章，带目录与搜索；本篇只讲怎么用。'},
 {id:'appearance',t:'21 · 外观、主题与双界面',k:'主题 外观 皮肤 配色 Nova 原版界面 圆角 动效 浅色 深色 切换',
  b:'顶栏「⋯ → 外观与主题」或全局搜索「主题」打开独立设置页，里面有<b>三件事</b>：'
   +'<br><b>① 9 套配色主题</b>：琥珀金（默认）、曜石黑、石墨蓝、青瓷、樱粉、熔金六套深色，'
   +'晨雾白、纸白暖两套浅色，外加一套<b>液态玻璃</b>（高斯模糊玻璃 + 折射高光 + 冷蓝虹彩）。'
   +'主题只覆盖 CSS 变量（底色 / 面板 / 文字 / 强调色 / 玻璃层），'
   +'界面里每一处颜色都跟着变，包括选中态、滑杆、浮层、二级页面与导引卡。'
   +'<br><b>② 两套完整界面</b>：<b>原版</b>是从第一版沿用到现在的紧凑布局；'
   +'<b>Nova</b> 是全新重做的视觉语言 —— 悬浮玻璃顶栏、浮起的大圆角工作卡、卡片化分组、药丸控件、柔和光影与更宽的留白。'
   +'两套共用同一套 DOM、事件、坐标与着色器，所有滑杆、拖拽、裁剪手柄、涂抹、导出在任意一套下逐项一致，随时可切回。'
   +'<br><b>③ 三档圆角、玻璃模糊与动效开关</b>：圆角只作用于 Nova（柔和 16px / 标准 26px / 超大 38px）；'
   +'<b>高斯模糊开关对所有 9 套主题都生效</b>：开则顶栏、菜单、提示条与欢迎卡统一走 backdrop-filter，关则包括 Nova 自带 blur 在内全部置 none，移动端明显更轻；'
   +'动效可一键全关，系统开启「减少动画」时也会自动关闭。'
   +'<br><b>④ 文字元素</b>提供 20 款分组字体与字重 / 字距 / 行高 / 投影 / 描边 / 透明度等完整排版参数，'
   +'折叠收纳、实时预览，导出与预览一致。'
   +'<br>偏好写在本机 localStorage，刷新不闪回默认；清除站点数据即恢复。'
   +'<b>切换外观不影响照片、任何编辑参数、自动保存快照与导出结果。</b>'},
 {id:'update',t:'22 · 检查更新与版本',k:'检查更新 版本 GitHub Release 最新 tag 自动检查 联网 限流 版本比对 发布',
  b:'顶栏「⋯ → 页面中心 → 设备与状态 → 检查更新」、全局搜索「检查更新」，或桌面「帮助 → 检查更新」打开独立页面。'
   +'<br><b>① 默认不联网</b>：不点检查、不开自动检查时，页面依然零外部请求，断网可完整使用。这是本软件唯一会发起网络请求的功能，而且必须你主动触发。'
   +'<br><b>② 快速检查</b>只读取一次 GitHub Releases API 的公开元数据（约 2KB）：tag、发布时间、更新说明与发布资源列表，用宽松 semver 与页面内嵌版本号比较。'
   +'<br><b>③ 深度比对</b>会再读取仓库 <b>web/index.html</b> 的头部 16KB，提取内嵌的 <code>iris-version</code> 版本标记，以及可选的 <code>version.json</code>；'
   +'用来确认仓库里那份页面究竟是哪一版。用流式读取后立刻 cancel 连接，不会下载整份 800KB 文件。'
   +'<br><b>④ 三种结论</b>：线上更新 → 「发现新版本」；一致 → 「已是最新版本」；本地更超前 → 「本地版本更新」'
   +'（通常说明你手上这份还没上传 / 还没打 tag）。查不到版本号时如实列出原因，不会假装成功。'
   +'<br><b>⑤ 自动检查</b>默认关闭；开启后每次启动延迟 2 秒发一次快速检查，只有确实发现新版本才提示一次，其余完全静默。'
   +'<br><b>⑥ 发布新版本</b>：把这版 HTML 传到仓库（web/index.html 等几处同源副本），再打一个形如 <code>v1.0.4</code> 的 Release tag，'
   +'页面里的版本 meta 与 tag 就会一起生效。想让限流时也能比对，可在根目录放一个 <code>version.json</code>。'
   +'<br><b>隐私</b>：请求不带 Cookie / Referrer / 自定义头，不发送照片、编辑参数或本机存档；远端文本只用于显示，'
   +'绝不插入页面或执行；外链只放行 https 的 GitHub 域名。检查更新不会自动下载或替换文件。'
   +'<br>GitHub 匿名接口限流 60 次/小时，达到上限会自动降级到 raw 文件通道，并在结果里显示剩余次数。'}
];

let spCurrent=null, spAnchor=null, tbMenuOpen=false;

function spEl(tag,cls,html){
  const e=document.createElement(tag); if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html; return e;
}
function spWrap(body){ const w=spEl('div','sp-wrap'); body.append(w); return w; }
function spSection(w,title){
  const h=spEl('div','sp-cat'); if(title) h.append(spEl('h4','',title)); w.append(h); return h;
}
function closeSubPage(){
  if(!spCurrent) return;
  /* 技术页的目录跟随监听挂在 #spBody 上，关闭时统一摘掉，避免切到别的页面后空跑 */
  if(window.__irisTechScroll){
    $('#spBody').removeEventListener('scroll',window.__irisTechScroll);
    window.__irisTechScroll=null;
  }
  spCurrent=null; spAnchor=null;
  const sp=$('#subPage'); sp.classList.remove('show'); sp.setAttribute('aria-hidden','true');
  app.classList.remove('sp-open'); $('#spBody').innerHTML='';
}
function openSubPage(id,anchor){
  const meta=SUBPAGES[id]||(id==='pages'?PAGE_HUB:null);
  if(!meta){ toast('页面不存在'); return; }
  closeCmd?.(); toggleTbMenu(false); setExportMenu(false);
  noteRecentPage(id);
  spCurrent=id; spAnchor=anchor||null;
  $('#spTitle').textContent=meta.title; $('#spSub').textContent=meta.sub||'';
  const body=$('#spBody'); body.innerHTML=''; body.scrollTop=0;
  meta.render(body);
  if(!anchor) body.scrollTop=0;
  const sp=$('#subPage'); sp.classList.add('show'); sp.setAttribute('aria-hidden','false');
  app.classList.add('sp-open');
  if(anchor) setTimeout(()=>spScrollTo(anchor),80);
}
function spScrollTo(id){
  const body=$('#spBody'), el=body.querySelector('#spc-'+id);
  if(!el) return;
  const top=el.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop-10;
  body.scrollTo({top:Math.max(0,top),behavior:'auto'});
  body.querySelectorAll('.sp-toc button').forEach(b=>b.classList.toggle('on',b.dataset.spid===id));
}

function renderGuidePage(body){

  search.placeholder='搜索说明书，如「肤色锁」「60fps」「涂抹」「光场」…';
  w.append(search);

  GUIDE_CHAPTERS.forEach(c=>{
    const b=spEl('button','',c.t); b.dataset.spid=c.id;
    b.onclick=()=>{ if(search.value){ search.value=''; spGuideFilter(doc,''); } spScrollTo(c.id); };
    toc.append(b);
    const d=spEl('section','sp-chapter'); d.id='spc-'+c.id;
    d.dataset.gtext=(c.t+' '+c.k+' '+c.b).toLowerCase();
    d.append(spEl('h3','',c.t));

    back.onclick=()=>{ body.scrollTo({top:0,behavior:'auto'}); };
    d.append(back);
    chapters.append(d);

function spGuideFilter(doc,q){
  doc.querySelectorAll('.sp-chapter').forEach(d=>{
    d.style.display=(!q||d.dataset.gtext.includes(q))?'':'none';
  });
  doc.querySelectorAll('.sp-toc button').forEach(b=>{
    b.style.display=(!q||b.textContent.toLowerCase().includes(q)||
      (doc.querySelector('#spc-'+b.dataset.spid)?.style.display!=='none'))?'':'none';
  });
}

function renderFiltersPage(body){

  search.placeholder='搜索 '+FILTERS.length+' 款滤镜…'; w.append(search);
  const groups={};

    box.innerHTML='';

    const q=state.zones[m.id]||{temp:0,lum:0,sat:0};
    const l=spEl('div','sp-line');
    l.append(spEl('span','','<i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:'
      +m.color+';margin-right:6px"></i>'+m.name),
      spEl('b','',[['色温',q.temp],['亮度',q.lum],['饱和',q.sat]]
        .map(([n,v])=>n+' '+(v>0?'+':'')+Math.round(v*100)).join(' · ')));
    grid.append(l);
  });
  w.append(grid);
  const looks=spEl('div','zone-preset-grid');
  ZONE_LOOKS.forEach(lk=>{
    const b=spEl('button','btn',lk.name); b.title=lk.desc;
    b.onclick=()=>{ applyZoneLook(lk.id); renderZonesPageRefresh(body); };
    looks.append(b);
  });
  w.append(looks);
  const go=spEl('button','btn','◈ 去调色盘里逐区微调（12 根滑杆按区折叠）');
  go.onclick=()=>{ closeSubPage(); gotoTool('plate'); toast('在「语义引擎 → 区域工作台」里调四区参数'); };
  w.append(go);

  /* ④ 把 matte 交给其它功能 */
  spSection(w,'③ 把 matte 变成可继续编辑的选区');
  w.append(spEl('div','sp-note','分割结果不再只服务于肤色锁：它可以一键成为局部蒙版的选区、背景虚化的主体，换照片会自动跟着重算。'));
  const acts=spEl('div','sp-card');
  [['人物 → 局部蒙版 1',()=>matteToMask(0,'person')],
   ['天空 → 局部蒙版 2',()=>matteToMask(1,'sky')],
   ['背景 → 局部蒙版 3',()=>matteToMask(2,'bg')],
   ['人物 → 背景虚化主体',()=>matteToBokeh('person')],
   ['天空 → 背景虚化主体',()=>matteToBokeh('sky')]]
    .forEach(([t,fn])=>{
      const b=spEl('button','btn',t);
      b.onclick=()=>{ fn(); renderZonesPageRefresh(body); };
      acts.append(b);
    });
  w.append(acts);
  const rs=spEl('button','btn','↺ 四区参数全部回零');
  rs.onclick=()=>{ resetZones(); renderZonesPageRefresh(body); };
  w.append(rs);

  /* ⑤ matte 的四条链路 */
  spSection(w,'④ 这张 matte 一共用在哪');
  const uses=spEl('div','sp-list');
  [['主调色盘肤色锁','冷调时皮肤少吃 Color/Tone，天空与背景吃满；主盘零位时整层跳过保证恒等'],
   ['区域工作台','本页的四区独立调色 + 画面内伪彩预览，不依赖主盘是否偏离'],
   ['光场计算','天空最远、皮肤最近、暗部居中，用它构造 2.5D 深度代理做重聚焦与视差'],
   ['局部蒙版 / 背景虚化','作为选区或主体 matte，一键生成后仍可继续用涂抹微调']]
    .forEach(([k,v])=>{ const l=spEl('div','sp-line'); l.append(spEl('b','',k),spEl('span','',v)); uses.append(l); });
  w.append(uses);
  w.append(spEl('div','sp-note','<b>如实说明</b>：这是纯前端启发式软分割（自适应肤色聚类 + 天空行一致性 + 区域一致性平滑 + 互斥归一化），'
    +'不是设备端 ML，也没有 CoreImage / Metal；复杂遮挡、逆光、多光源人像会有误差。'
    +'matte 缺失时着色器里还有一层像素级肤色软概率兜底，所以冷调不会把脸染蓝。'));
}
/* 页面内动作后局部刷新：保留滚动位置，不重开整个页面 */
function renderZonesPageRefresh(body){
  const sp=$('#spBody'); if(!sp) return;
  const top=sp.scrollTop;
  sp.innerHTML=''; renderZonesPage(sp);
  sp.scrollTop=top;
}

function renderInfoPage(body){
  const w=spWrap(body);
  const [ew,eh]=exportSize();
  const sem=window.SEM_STATS||{};
  const rows=[
    ['文件名',photoName||'—'],['原始尺寸',imgW+' × '+imgH+' px'],
    ['裁剪后导出',ew+' × '+eh+' px'],['实况照片',LIVE.pair?'是（'+(LIVE.video?.duration?.toFixed(2)||'?')+'s）':'否'],
    ['滤镜层数',state.layers?.length||0],['当前滤镜',state.editLayerName||'原图'],
    ['独立色调',TARGETS.length],['一键模板',QUICK.length+' 套'],
    ['语义 matte','v3 · '+(state.matteQuality||'标准')],
    ['局部效果区域',(state.fxRegions?.length||0)+' 个'],['涂抹笔数',(state.brushStrokes?.length||0)+' 笔'],
    ['叠加元素',(state.elements?.length||0)+' 个'],
    ['背景虚化',(state.bokeh?.on?'开启 · '+(state.bokeh.detected?(state.bokeh.detected.mode==='person'?'人物':'物品'):'未检测'):'关闭')]
  ];
  const box=spEl('div','sp-list');
  rows.forEach(([k,v])=>{ const l=spEl('div','sp-line'); l.append(spEl('span','',k),spEl('b','',String(v))); box.append(l); });
  w.append(box);
  w.append(spEl('div','sp-note','照片只在本机处理；语义分割与光场深度都是前端近似，不是设备端 ML。'
    +'渲染管线：WebGL 着色器逐帧应用滤镜 / 调色盘 / 局部效果，叠加元素在导出时合成，主图分辨率不因预览缩放而降低。'
    +'参数只记录 preset_id 与（tone, color, intensity）+ matte 版本，原图像素从不改写。'));
}

{id:'origin',n:'01',eyebrow:'ORIGIN',t:'缘起 · 从 iPhone 调色盘出发',html:`
<p>iPhone 16 / iOS 18 的「摄影风格」里有一块方形调色盘：白点上下调 <b>Tone</b>（影调、对比与暗部深度），左右调 <b>Color</b>（色温偏置与色度），下方一条强度滑杆，顶部实时给出数值。它真正厉害的地方不是这个二维控件，而是背后的<b>语义感知</b> —— 系统会先分清皮肤、天空、背景，再对不同区域做不等权映射：拖冷调脸不泛蓝，拖艳度天不爆、肤不橙。</p>
<p>但在原生里，这块盘是绑定在某一个风格下面的：选一个滤镜，就只能改这一个滤镜的色调。它用自由度换来了直出的一致性与可逆性；而普通滤镜 / LUT 是全局像素变换，相册调整是人工解耦的全局参数，专业软件则要靠手动蒙版补局部。</p>
<p>Iris 是从「把这层绑定拆掉」开始的。盘还是那块盘，但<b>每一层滤镜、每一种色调都能拥有自己独立的一套参数</b>；再往后，才一轮一轮长成现在这个完整的编辑器。</p>
<div class="ab-quote">二维直觉 + 语义保肤，比一长串滑杆更接近人看照片的方式。<em>—— Iris 的设计起点</em></div>`},
{id:'product',n:'02',eyebrow:'PRODUCT',t:'这是什么 · 一句话与全貌',html:`
<p><b>Iris 调色盘是一个完全运行在浏览器里的照片编辑器。</b>一个 HTML 文件，双击就能用；改名为 <code>index.html</code> 传到任意静态托管，就变成一个在线网页。没有账号、没有后端、没有构建步骤、没有第三方依赖。</p>
<p>它把「调色」拆成三层可叠加的能力：底层是滤镜与基础参数，中层是语义感知的二维调色盘与 12 种独立色调，上层是局部、空间与元素编辑。所有调整都是<b>非破坏</b>的：原图像素从不改写，只记录 preset_id 与（tone, color, intensity）+ 分割版本元数据，随时撤销、重算、回滚。</p>
<div class="ab-metrics">
  <div class="ab-metric"><b>433</b><small>款滤镜</small></div>
  <div class="ab-metric"><b>78</b><small>套一键模板</small></div>
  <div class="ab-metric"><b>12</b><small>种独立色调</small></div>
  <div class="ab-metric"><b>4</b><small>层滤镜叠加</small></div>
  <div class="ab-metric"><b>6</b><small>种虚化模糊</small></div>
  <div class="ab-metric"><b>20</b><small>章说明书</small></div>
  <div class="ab-metric"><b>19</b><small>个二级页面</small></div>
  <div class="ab-metric"><b>60</b><small>fps 视频导出</small></div>
  <div class="ab-metric"><b>1</b><small>个 HTML 文件</small></div>
</div>
<p class="ab-dim">它不是「套滤镜的 App」，也不是把桌面专业软件搬进网页；它想保留的是<b>用两个轴就能直出成片</b>的那份轻松，同时把专业用户需要的 HSL、曲线、局部笔刷、LUT、分层与导出都留在手边。</p>`},
{id:'features',n:'03',eyebrow:'FEATURES',t:'功能地图 · 六组能力',html:`
<div class="ab-grid">
 <div class="ab-item"><b>◉ 色彩系统</b><small>iPhone 式二维调色盘（Tone × Color + 强度，盘面随照片主色变化）、12 种独立色调、每层滤镜各自的调色盘、433 款分类滤镜、78 套模板、语义保肤渲染、<b>区域工作台（matte 可视化 + 四区独立调色 + 一键生成蒙版 / 虚化）</b>、色彩迁移（Lab 均值方差 → 16³ 3D LUT）、HSL 分色、曲线、三色轮、通道混合与 .cube LUT。</small></div>
 <div class="ab-item"><b>◐ 局部与空间</b><small>涂抹式局部蒙版（直接刷出选区，可擦除 / 撤销 / 伪彩预览，形状渐变保留为可选）、背景虚化（一键检测人物或物品 + 涂抹选取主体或虚化区域 + 六种模糊）、光场计算（重聚焦、视差微动、方向重打光）、涂抹式马赛克 / 柔焦 / 动态 / 径向模糊，最多 6 块区域、可调范围与羽化。</small></div>
 <div class="ab-item"><b>▣ 构图与元素</b><small>可视化拖拽裁剪（角点、边框、比例锁、精确数值兜底）、文字 / 贴纸 / 形状 / 涂鸦（可拖动、缩放、旋转、改字体颜色描边）、留白画框、旋转翻转与透视矫正。</small></div>
 <div class="ab-item"><b>▷ 动态与输出</b><small>iOS 实况照片逐帧编辑与选封面、不限时长视频（默认原格式 / 原画质 / 不压缩 / 无变化，最高 60fps）、GIF 动图、PNG / JPG / WebP、原始视频零重编码直出、实况配对素材与全格式 ZIP 打包。</small></div>
 <div class="ab-item"><b>⌕ 效率</b><small>全局搜索（工具 / 滤镜 / 参数 / 模板 / 操作一处直达）、12 个一键快捷、22 章说明书 + 18 章技术实现、22 个独立二级页面（收拢进「页面中心」分组浏览）、本机自动保存与恢复、撤销重做、参数复制与 JSON 存档、自定义滤镜与我的色调、20 种主盘模式、「我的空间」历史图片与一键保存整套参数。</small></div>
 <div class="ab-item"><b>◇ 体验</b><small>移动端大图优先、编辑栏可拖动可收起、25%–800% 缩放、按住看原图与可拖动分屏线、直方图三模式、轻动画（尊重系统「减少动画」）、统一细线图标、桌面与手机自适应。</small></div>
</div>`},
{id:'architecture',n:'04',eyebrow:'ARCHITECTURE',t:'技术架构 · 四层与实现',html:`
<p>这是按「语义感知的二维渲染控制器」思路做的<b>工程对标</b>，分四层：</p>
<div class="ab-grid">
 <div class="ab-item"><b>① 前端 2D pad</b><small>x = Color（白平衡偏置 + chroma 增益），y = Tone（暗部深度 + 对比斜率），配一条强度滑杆；底风格只改偏移量。12 种作用范围各自记忆参数，互不串扰。</small></div>
 <div class="ab-item"><b>② 端侧轻量分割</b><small>1/8 分辨率生成皮肤 / 天空 / 头发 / 亮部软 matte，边缘感知平滑后由 GPU 线性上采样对齐；v3 按每张照片自适应估计肤色，深浅肤色与暖光人像更稳。</small></div>
 <div class="ab-item"><b>③ 渲染层</b><small>不同区域不等权映射：非皮肤区吃满用户值，皮肤区乘 skin_mask 压回肤色流形并 clamp 偏移；matte 缺失时着色器内还有像素级肤色软概率兜底，保证冷调不毁脸。</small></div>
 <div class="ab-item"><b>④ 非破坏存储</b><small>只存 preset_id +（tone, color, intensity）+ matte 版本 / 指纹，原图像素从不改写，可重算回滚。色调迁移另走 Lab 三档均值 / 方差匹配生成 16³ 3D LUT，与用户导入的 .cube 完全独立。</small></div>
</div>
<p>性能上：导入照片时单次推理并缓存 matte，实时预览用 1/4–1/8 分辨率估 mask；连续拖动时主画布临时降采样，停手约 140ms 恢复全清晰，叠加层始终不降质。<b>全部由 WebGL 着色器逐帧计算</b>，没有服务端渲染。</p>
<div class="ab-tags">
 <span class="ab-tag">HTML5</span><span class="ab-tag">CSS3</span><span class="ab-tag">Vanilla JS</span>
 <span class="ab-tag">WebGL 1.0</span><span class="ab-tag">GLSL ES</span><span class="ab-tag">Canvas 2D</span>
 <span class="ab-tag">MediaRecorder</span><span class="ab-tag">captureStream</span><span class="ab-tag">GIF89a</span>
 <span class="ab-tag">CIE-Lab</span><span class="ab-tag">3D LUT</span><span class="ab-tag">localStorage</span>
 <span class="ab-tag">FileReader</span><span class="ab-tag">零依赖</span><span class="ab-tag">零构建</span>
</div>
<p><b>双界面与主题</b>：9 套配色（含液态玻璃高斯模糊玻璃）只覆盖 CSS 变量；Nova 全新界面只追加视觉规则（悬浮玻璃顶栏、浮起的大圆角工作卡、卡片化分组、药丸控件与柔和光影）。二者都不触碰 DOM、事件、坐标与着色器，所以原版与 Nova 下全部编辑行为逐项一致，随时可切回。</p>
<p class="ab-dim">渲染管线与 Apple 的 CoreImage / Metal 无关，语义判断也不是设备端机器学习模型，而是纯前端的启发式软分割；复杂场景会有误差，但兜底策略保证不会出现怪色。</p>
<button class="tech-golink" data-gotech="pipeline">⌘ 阅读 18 章技术实现全文 →</button>`},
{id:'privacy',n:'05',eyebrow:'PRIVACY',t:'隐私与数据 · 全部在本机',html:`
<p><b>这是一个纯前端作品：没有服务器，也不会把照片上传到任何地方。</b>从导入到导出的每一步，都发生在你这台设备的浏览器里。</p>
<div class="ab-grid">
 <div class="ab-item"><b>照片不外传</b><small>照片、视频、每一帧都只存在于内存、Canvas 与 WebGL 纹理中。编辑过程默认不发起任何网络请求，没有上传接口、没有账号、没有埋点、没有第三方统计。</small></div>
 <div class="ab-item"><b>唯一的联网行为</b><small>只有你主动点「检查更新」（或在设置里开启自动检查）时，才会读取 api.github.com / raw.githubusercontent.com 上的公开版本元数据。请求不带 Cookie 与 Referrer，不发送照片、编辑参数或本机存档，也不下载或执行远端代码；默认状态与断网时完全离线。</small></div>
 <div class="ab-item"><b>导出是本地下载</b><small>PNG / JPG / WebP / GIF / MP4 / WebM / ZIP 全部通过浏览器本地 Blob 生成并下载，不经过任何服务器中转。</small></div>
 <div class="ab-item"><b>本地存档与自动保存</b><small>自定义滤镜、我的色调、收藏、界面偏好在 localStorage；照片原始字节、完整编辑状态与缩略图写进本机 IndexedDB（浏览器不允许时降级为「只存参数」并明确提示）。重新打开时会询问「是否编辑上次的照片」，也可设为直接恢复或关闭。演示图不入档；「自动保存」页可一键清除。清理站点数据即全部抹掉。</small></div>
 <div class="ab-item"><b>外观偏好</b><small>主题、界面版本、圆角与动效只写一个 JSON 键到 localStorage，不含照片、不含编辑参数；「外观与主题」页可一键还原，清除站点数据也会回到默认。</small></div>
 <div class="ab-item"><b>导出记录</b><small>只记录文件名 / 格式 / 大小 / 时间等元数据，不保存成品文件；可在「导出记录」页关闭或清空。</small></div>
 <div class="ab-item"><b>关于「在线访问」</b><small>部署到静态托管时，托管方只是把这个 HTML 文件发给浏览器。和所有网站一样，托管服务会有常规访问日志（如 IP），但<b>画面内容与编辑数据始终不离开设备</b>；直接双击本地文件使用，默认完全离线，只有主动检查更新才会联网。</small></div>
</div>
<p>唯一的硬性要求是浏览器支持 <b>WebGL</b>；不支持时页面会明确提示。不读取相册、不请求相机或定位权限，除非你主动点「换照片」从设备里选一张。</p>
<p class="ab-dim">关于「照片不上传」：自动保存写的是本机存储，不是服务器。桌面版写在这台电脑的用户数据目录，移动版写在 App 自己的沙盒里，网页版写在当前浏览器的站点存储 —— 四端行为一致，但快照<b>不会跨设备同步</b>。想彻底不留痕，到「自动保存」页点「清除上次的编辑」，或清除站点数据。</p>`},
{id:'version',n:'06',eyebrow:'RELEASE',t:'版本状态 · 近乎最终版',html:`
<p>外观系统加入后，界面提供<b>原版 / Nova 双版本</b>与<b>9 套配色主题（含液态玻璃）</b>，可在「外观与主题」页随时切换或一键还原，照片与编辑参数不受影响。</p>
<p>当前版本是 <b>Release Candidate（近乎最终版）</b>。功能面已经完整，接下来<b>只会小修小改</b>：兼容性、边界情况、文案与手感、性能、以及 bug 修复，不再堆叠新模块。</p>
<p>理由很简单：一个工具的价值不在于功能数量，而在于每次打开都稳定、可预期、不会在你赶时间的时候出岔子。所以这一版把力气花在了收敛上 —— 界面分组、目录式说明书、独立二级页面、逐项回归与像素级验证，而不是再加一层新东西。</p>
<div class="ab-steps">
 <div class="ab-step"><b>起点 · 还原那块盘</b>白点拖拽、强度滑杆、数值显示，以及放大照片。</div>
 <div class="ab-step"><b>拆掉绑定 · 让色调自由</b>4 层滤镜各自独立调色盘、12 种色调、语义主盘与肤色锁。</div>
 <div class="ab-step"><b>长成编辑器</b>文字贴纸涂鸦、涂抹式马赛克与模糊、可视化裁剪、背景虚化与光场。</div>
 <div class="ab-step"><b>动态与输出</b>实况照片、不限时长视频、GIF、多格式与全格式打包。</div>
 <div class="ab-step"><b>工程化与收敛</b>色彩迁移、22 章说明书、18 章技术实现、22 个二级页面与「页面中心」分组浏览、自动保存与恢复、界面精简与移动端重排。</div>
 <div class="ab-step"><b>现在 · 近乎最终</b>作者与关于页、细节修复、稳定性优先。</div>
</div>
 <p style="margin-top:14px">当前内嵌版本 <b>1.0.4</b>（构建 2026-11-11，Release Candidate）。页面头部写有版本 meta，可在独立「检查更新」页与 GitHub 上发布的最新 Release 对比；<b>默认不联网</b>，只有主动点击才会读取公开版本信息。</p>
 <div class="sp-row"><button data-goupdate="1">⟳ 检查更新</button></div>`},
{id:'limits',n:'07',eyebrow:'BOUNDARIES',t:'已知边界 · 如实说明',html:`
<div class="ab-grid">
 <div class="ab-item"><b>不是设备端 ML</b><small>语义分割、主体检测与光场深度都是前端启发式近似；多人、遮挡、逆光、透明物体、主体与背景同色会有误差。肤色兜底保证冷调不毁脸，但不等于专业人像分割。</small></div>
 <div class="ab-item"><b>色调迁移是统计匹配</b><small>只对齐整体亮度 / 色温 / 色彩分布，不重建光影方向、局部对比或物体颜色；内容差异极大的两张照片会趋近色调但不会变成同一张图，极端色调建议把强度调到 50–80%。</small></div>
 <div class="ab-item"><b>视频与实况</b><small>浏览器录制一律有损编码；「原画质」指不降分辨率、不主动限码率。网页不能把结果写回 iOS 相册变原生实况照片，需用系统快捷指令重新配对；动态片段不含原音频。</small></div>
 <div class="ab-item"><b>资源与格式</b><small>GIF 上限 400 帧、256 色；60fps + 4K 同时开启明显吃资源，手机端注意发热与电量。部分浏览器打不开 HEIC 时会自动用视频帧作封面；桌面导出的 WebM 需转 H.264 才能与 HEIC 配对。</small></div>
</div>
<p class="ab-dim">更完整的逐条说明见「使用说明书」第 20 章。</p>`},

{id:'constraints',n:'01',eyebrow:'CONSTRAINTS',t:'工程约束 · 先定下不能做什么',k:'单文件 零依赖 零构建 纯前端 WebGL 约束 取舍 离线 静态托管',html:`
<p>动手之前先定了四条硬约束，后面所有技术选择都是从它们推出来的：</p>
<div class="tech-kv">
 <div><b>一个文件</b><span>HTML、CSS、JavaScript、GLSL 着色器源码、图标 SVG、演示图，全部内联在同一个 <code>.html</code> 里。双击可用，改名 <code>index.html</code> 传到静态托管就能在线访问。</span></div>
 <div><b>零依赖零构建</b><span>没有 npm、没有打包器、没有框架、没有外部字体与 CDN。原生 Vanilla JS + 原生 DOM，避免版本漂移，也避免「过了两年装不上依赖就跑不起来」。</span></div>
 <div><b>纯前端</b><span>没有服务器、没有账号、没有上传接口、没有埋点。照片只存在于内存、Canvas 与 WebGL 纹理；导出是本地 Blob。默认零网络请求，唯一的例外是用户主动触发的「检查更新」。</span></div>
 <div><b>WebGL 1.0</b><span>选 GLSL ES 1.0 而不是 WebGL2 / WebGPU，是为了覆盖尽可能多的手机浏览器。代价是要自己处理纹理单元上限、没有动态循环、没有整数纹理等限制。</span></div>
</div>
<p>这四条带来一个很实际的结果：<b>整个应用没有「编译」这一步，也没有「发布」这一步</b>。改完保存，刷新就是新版。代价是文件接近 550 KB、着色器要用字符串拼、所有工具函数都得自己写。对一个个人作品来说，这个交换是划算的 —— 可移植性比工程整洁度更重要。</p>
<div class="tech-note">唯一的硬性运行要求是浏览器支持 WebGL；不支持时页面会明确提示，而不是白屏。桌面版 Electron 外壳也沿用同一份 HTML，不改一行。</div>`},

{id:'anatomy',n:'02',eyebrow:'ANATOMY',t:'一个 HTML 里是怎么分层的',k:'文件结构 分层 DOM CSS JS 模块 组织 IIFE 全局 状态 着色器',html:`
<p>文件从上到下是一条清晰的纵切，不是按功能拆成几十个模块，而是按「加载顺序」排成七段：</p>
<div class="tech-flow">
 <span>① CSS 变量与全站样式</span><span>② DOM 骨架</span><span>③ 常量与工具函数</span>
 <span>④ 数据：滤镜 / 模板 / 说明书 / 关于 / 技术章节</span><span>⑤ GLSL 源码与生成</span>
 <span>⑥ 状态 / 渲染 / 交互</span><span>⑦ 导出 / 独立页面 / 搜索 / 启动</span>
</div>
<p><b>① 样式</b>：用 CSS 自定义属性收拢配色（深灰底、暖金强调色、次级文字色），后面所有组件、二级页面、关于页、技术页都引用同一组变量，所以改一个色值整站同步。响应式不是两套 UI，而是同一套 DOM 在 <code>760px</code> / <code>520px</code> 断点上重排。</p>
<p><b>② DOM</b>：顶栏、画布（<code>#stage</code> 里的 WebGL canvas + 2D 叠加层 canvas）、编辑栏、底栏工具、隐藏的 <code>&lt;input type="file"&gt;</code>、二级页面容器、导出菜单、全局搜索、提示条。两个 canvas 叠在一起是关键：<b>一个只画照片，一个只画框、圈、文字元素</b>，互不干扰，也方便「对比原图」时只隐藏叠加层。</p>
<p><b>③ 工具层</b>：<code>$()</code>、<code>clamp()</code>、<code>svg()</code>（内联 ICONS 字典生成细线图标）、<code>toast()</code>、<code>deep()</code>、<code>normalizeState()</code>。图标是一套 stroke 风格 SVG 字符串，保证任何缩放都清晰、不需要字体文件。</p>
<p><b>④ 数据层</b>：433 款滤镜、78 套模板、HSV 分色表、22 章说明书、10 章关于、18 章技术文章，全都是字面量数组。新增一款滤镜就是往数组里加一个对象；模板则是「滤镜层 + 分色调盘 + 语义主盘 + 基础参数 + 画框」的组合描述，<b>不是把参数复制一遍</b>。</p>
<p><b>⑤ 着色器</b>：VS / FS 是模板字符串，其中几段用代码生成后插入占位符（下一章详述）。</p>
<p><b>⑥ 运行时</b>：<code>state</code> 单一状态树 + <code>render()</code> 单一渲染入口 + pointer 事件分发。</p>
<p><b>⑦ 外围</b>：导出、独立页面系统 <code>SUBPAGES</code>、全局搜索 <code>CMD</code>、启动逻辑 <code>uploadImage(demoImage())</code>。</p>
<div class="tech-note">整个文件没有打包器，所以「模块」靠的是命名与注释分区，而不是 import。这也是为什么每段的开头都有一块块注释横幅 —— 它们就是这个文件里的目录。</div>`},

{id:'pipeline',n:'03',eyebrow:'PIPELINE',t:'渲染管线 · 一帧像素走过的路',k:'渲染管线 shader 逐帧 顺序 采样 滤镜 调色盘 LUT 合成 导出 一致',html:`
<p>所有编辑最终都收敛到<b>一个片元着色器</b>。不管你在界面上拖了滑杆、涂了蒙版还是叠了四层滤镜，<code>render()</code> 只是把状态翻译成 uniform，再画一个铺满屏幕的四边形。一帧的顺序大致是：</p>
<div class="tech-flow">
 <span>src(uv) 取原图</span><span>裁剪 / 旋转 / 翻转 / 填满适应</span><span>基础调整</span>
 <span>滤镜层 ×4</span><span>二维调色盘 ×12 色调</span><span>语义分区渲染</span>
 <span>HSL / 曲线 / 三色轮 / LUT</span><span>局部蒙版与涂抹效果</span>
 <span>背景虚化 / 光场</span><span>暗角 / 颗粒</span><span>分屏 / 原图短路</span>
</div>
<p><b>采样与几何</b>：<code>src(uv)</code> 先把屏幕坐标映射到照片坐标，处理裁剪框、旋转、翻转与「填满 / 适应」两种预览方式。这一步保证预览缩放（25%–800%）只影响取景，<b>不降低主图分辨率</b>。</p>
<p><b>全局调整</b>：曝光、对比、高光阴影、色温、饱和度、清晰度、去雾、暗角、颗粒等，按一组 uniform 依次作用在 <code>c</code>（当前颜色）上。顺序很重要：先亮度与影调，再颜色，最后颗粒与暗角，否则暗角会被后续对比度拉坏。</p>
<p><b>滤镜层</b>：四层各自有 <code>preset_id</code> 与强度，层与层之间做加权混合；每层还挂着自己那套 12 色调调色盘参数。这是「拆掉 iPhone 原生绑定」的核心：滤镜不再是只能整体开关的一张 LUT。</p>
<p><b>调色盘与语义</b>：12 个色调槽各自持有 (tone, color, intensity)，再叠加一张语义主盘。皮肤区走独立约束，非皮肤区吃满用户值（第 08、09 章）。</p>
<p><b>局部与空间</b>：3 个局部蒙版（涂抹或形状渐变）、最多 6 块像素效果区域、涂抹笔刷遮罩、背景虚化 matte、光场深度代理，都在同一帧里按遮罩权重混合。</p>
<p><b>收尾</b>：<code>c = clamp(c, 0, 1)</code>，分屏对比时左半边直接短路回 <code>src(uv)</code>（未经任何处理的真原图），最后写入 <code>gl_FragColor</code>。</p>
<div class="tech-note"><b>导出为什么和预览一致？</b>因为导出时用的还是这同一个程序：只是把输出目标从屏幕换成离屏 FBO / 更大尺寸的 canvas，把 uniform 里的输出尺寸改成成品尺寸，再 <code>readPixels</code> 或 <code>toBlob</code>。没有第二套「导出专用」的图像处理代码，这是减少不一致 bug 最有效的办法。</div>`},

{id:'shader',n:'04',eyebrow:'SHADER',t:'着色器是「生成」出来的',k:'GLSL 代码生成 模板字符串 循环展开 uniform 数组 PLATE_CODE MASK_CODE 编译 链接',html:`
<p>WebGL 1.0 / GLSL ES 1.0 里数组索引必须是常量表达式，循环上界必须恒定，写一个「对 12 个色调做 for 循环」很容易在手机上编译失败。解决办法是<b>在 JavaScript 里把重复代码生成出来</b>，再插进片段着色器模板：</p>
<pre class="tech-code">const PLATE_CODE = Array.from({length:12}, (_,k) =&gt;
  '  c = plateTone(c, u_plate[' + k + '], u_plateInt[' + k + ']);'
).join('\n');</pre>
<p>着色器里有五段这样的生成器：<code>PLATE_CODE</code>（12 色调）、<code>FX_CODE</code>（6 块局部像素效果）、<code>MASK_CODE</code>（3 个局部蒙版）、<code>HSL_CODE</code>（8 色相）、<code>CURVE_CODE</code>（曲线分段）。它们都是「拼字符串 → 替换占位符 → 交给 <code>gl.shaderSource</code>」：</p>
<pre class="tech-code">const fs = FS
  .replace(PLACEHOLDER_PLATE, PLATE_CODE)
  .replace(PLACEHOLDER_FX,    FX_CODE)
  .replace(PLACEHOLDER_MASK,  MASK_CODE)
  .replace(PLACEHOLDER_HSL,   HSL_CODE)
  .replace(PLACEHOLDER_CURVE, CURVE_CODE);
gl.shaderSource(sh, fs); gl.compileShader(sh);
gl.linkProgram(prog);</pre>
<p>生成的好处除了兼容老设备，还有<b>分支可控</b>：每个槽都写成 <code>if (u_xxx[k] &gt; 0.5) { ... }</code>，关掉的槽在 GPU 上走的是极短的短路分支；而且 WGSL / GLSL 的编译错误在启动时就能一次性暴露，不会拖到用户拖滑杆的那一刻。</p>
<p>对应的 uniform 用<b>数组</b>管理：<code>u_plate[12]</code>（vec3）、<code>u_maskType[3]</code>、<code>u_maskGeo[3]</code>、<code>u_maskAdj[3]</code>、<code>u_fxType[6]</code> 等。JS 侧用 <code>gl.uniform1fv / uniform3fv / uniform4fv</code> 一次性上传，并且用一张 <code>UA</code> 缓存复用 <code>Float32Array</code>，避免播放实况时每帧 new 一堆 typed array 触发 GC 抖动。</p>
<div class="tech-note">着色器源码在文件里是普通字符串，所以调试时可以直接把它取出来单独编译。项目里配套的验证脚本就是这么做的：用 EGL + GLES2 建离屏上下文，编译 VS/FS、链接、设 uniform、<code>glReadPixels</code> 读回像素做统计比对。</div>`},

{id:'textures',n:'05',eyebrow:'TEXTURES',t:'纹理单元预算与降级',k:'纹理单元 WebGL1 8 个 sampler2D 降级 LUMINANCE RGB matte 遮罩 兼容性',html:`
<p>WebGL 1.0 规范只保证<b>至少 8 个片元纹理单元</b>，而这个编辑器需要同时挂很多张图。规划如下：</p>
<div class="tech-kv">
 <div><b>0</b><span>原始照片</span></div>
 <div><b>1</b><span>用户导入的 .cube 3D LUT / 色彩迁移 LUT</span></div>
 <div><b>2–5</b><span>四种涂抹笔刷遮罩（马赛克 / 柔焦 / 动态 / 径向），各一张单通道 LUMINANCE 纹理</span></div>
 <div><b>6</b><span>语义 matte（皮肤 / 天空 / 头发 / 亮部四通道软分割）</span></div>
 <div><b>7</b><span>背景虚化的主体 matte</span></div>
 <div><b>8</b><span>Tone 曲线 LUT</span></div>
 <div><b>9</b><span>局部蒙版涂抹选区：一张 RGB 纹理，R/G/B 分别装 3 个蒙版槽</span></div>
</div>
<p>第 9 号单元超出了规范保底，所以启动时读 <code>MAX_TEXTURE_IMAGE_UNITS</code>（枚举 <code>0x8872</code>）；不足 10 时<b>自动禁用涂抹选区、保留形状渐变</b>，界面上给出明确提示，而不是让整个渲染管线报错黑屏。</p>
<p>把 3 个蒙版塞进一张 RGB 纹理也是同一个思路：与其申请 3 张纹理，不如用三个颜色通道当三个独立的 8bit 遮罩，采样一次就能拿到全部权重。着色器里对应写成 <code>texture2D(u_maskPaint, uv).r / .g / .b</code>。</p>
<p>所有遮罩都用 <code>CLAMP_TO_EDGE</code> + <code>LINEAR</code> 过滤：硬边圈会像贴纸，线性上采样后才有羽化感。低分辨率 matte 配合 GPU 双线性插值，正好等价于「便宜的软边」。</p>
<div class="tech-note">纹理都用 <code>gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false)</code> 显式关掉翻转。Canvas 的 Y 向下、GL 纹理的 V 方向容易反，一次设错就会让涂抹笔迹上下颠倒 —— 这类 bug 肉眼很难归因，所以宁可每次上传都写清楚。</div>`},

{id:'coords',n:'06',eyebrow:'COORDINATES',t:'坐标系统 · 两次错位都出在这里',k:'q uv 坐标 错位 screenToQ qToScreen qToClient photoUnits 宽高比 缩放 平移',html:`
<p>这是整个项目里最容易写错、也最难自查的部分。系统里同时存在四套坐标：</p>
<div class="tech-kv">
 <div><b>client</b><span>浏览器视口坐标，来自 <code>pointerdown</code> 的 <code>clientX/Y</code>。</span></div>
 <div><b>画布内坐标</b><span>减去 <code>#stage.getBoundingClientRect()</code> 左上角，2D 叠加层画框用这个。</span></div>
 <div><b>q（照片归一化坐标）</b><span>分别归一化到照片宽 / 高，<code>[0,1]</code>。所有元素、笔迹、蒙版都以 q 存储，所以换照片、缩放、旋转后都能重算。</span></div>
 <div><b>uv / p</b><span>着色器里的采样坐标，含填满适应、裁剪、旋转、翻转与缩放平移的换算。</span></div>
</div>
<p>换算函数是三兄弟：<code>screenToQ(clientX, clientY)</code> 把手指位置变成 q；<code>qToScreen(qx, qy)</code> 把 q 变成画布内坐标（画框用）；<code>qToClient(qx, qy)</code> 再补上画布在视口里的偏移（命中判定用）。</p>
<p><b>第一次错位</b>：把「画布内坐标」当「视口坐标」用。手机顶栏占约 44px，于是看到框在这里、点它却点不中，删除 / 旋转手柄尤其明显。修法是命中判定统一走 <code>qToClient()</code>。</p>
<p><b>第二次错位更隐蔽</b>：照片横向 1 单位和纵向 1 单位对应的屏幕像素数<b>并不相等</b>（差一个照片宽高比）。以前所有框、圈、元素都拿同一个标量同时算宽和高，纵向被系统性放大 —— 桌面虚线框高度偏 56px、手机偏 37px。于是有了 <code>photoUnits()</code>：<b>横、纵分别换算</b>；遮罩在 q 空间是正圆，映射到屏幕就该是椭圆，笔刷光标也跟着改成 <code>ctx.ellipse</code>。</p>
<pre class="tech-code">function fitScaleXY(){
  const r = $('#stage').getBoundingClientRect(), W=r.width, H=r.height;
  const ratio = imageAspect() / Math.max(W/Math.max(H,1), 1e-4), s=[1,1];
  if(ratio &gt; 1){ if(viewFit==='cover') s[0]=ratio; else s[1]=1/ratio; }
  else { if(viewFit==='cover') s[1]=1/ratio; else s[0]=ratio; }
  return {s,W,H};
}</pre>
<div class="tech-note">验证方式不是「看一眼」，而是把框的屏幕矩形和实际遮罩的作用区域都算出来，要求误差小于 1px；再在放大 1.8 倍并平移后重复一次。坐标类 bug 必须靠数值断言，靠截图一定会漏。</div>`},

{id:'state',n:'07',eyebrow:'STATE',t:'状态、撤销与非破坏编辑',k:'state normalizeState mutate commit undo redo JSON 非破坏 换照片 重置 存档',html:`
<p>整个应用只有一棵状态树 <code>state</code>，由 <code>defaultState()</code> 生成、<code>normalizeState()</code> 兜底。后者很关键：旧存档、导入的 JSON、预设里缺字段或字段类型不对时，会逐项补默认值，避免渲染时读到一个 <code>undefined</code> 去算颜色。</p>
<p>编辑全部走两个函数：</p>
<pre class="tech-code">function commit(before){
  if(before &amp;&amp; before !== JSON.stringify(state)){
    undoStack.push(before);
    if(undoStack.length &gt; 60) undoStack.shift();
    redoStack=[];
  }
}
function mutate(fn){
  const b = JSON.stringify(state);
  fn(); commit(b); syncUI(); requestRender();
}</pre>
<p>也就是说：<b>历史里存的是「改动前的完整状态快照」，而不是操作命令</b>。用 <code>JSON.stringify</code> 做快照听起来暴力，但状态树是纯数据（没有 DOM 引用、没有函数、没有 Blob），序列化几 KB 一次的成本远低于写一套可逆命令系统；换来的是撤销 / 重做 / 参数存档 / 自定义预设 / 我的滤镜可以共用同一条链路。</p>
<p><b>非破坏</b>体现在三层：</p>
<ul class="tech-list">
 <li>原图像素从不改写，只作为纹理 0 被采样；所有效果都是着色器里的函数变换。</li>
 <li>调色盘只记 <code>preset_id + (tone, color, intensity) + matte 版本 / 指纹</code>，换分割版本时可以用同一组参数重算。</li>
 <li>笔迹、涂抹选区、元素位置都存归一化坐标，缩放、旋转、换预览方式都不影响复现。</li>
</ul>
<p>换照片时调用 <code>resetEditsForNewPhoto()</code>：滤镜层、调色盘、语义盘、文字贴纸、裁剪、局部效果、虚化、撤销历史全部清零，只保留与照片无关的偏好（导出规格、分割精度、笔刷大小）。这个 bug 修过一次 —— 上一张的整套编辑会悄悄套到新照片上。</p>
<p>持久化分三处：自定义滤镜、我的色调、收藏、最近使用、界面偏好与恢复设置、历史书签在 <code>localStorage</code>；参数复制 / 粘贴与 JSON 导出导入是纯文本；<b>照片原始字节、完整状态与缩略图</b>写进本机 <code>IndexedDB</code>（v1，三个 store：snapshot / exports / bookmarks）。</p>
<p>自动保存的挂钩点只有四个：<code>mutate()</code> 后 900ms 防抖、<code>uploadImage()</code> 后 350ms、<code>afterHistory()</code>、以及 <code>pagehide / beforeunload / visibilitychange</code> 时兜底 flush。Web 端的 beforeunload 无法等待异步 IDB 事务完成，所以<b>常规防抖才是主力</b>，退出兜底只是尽量补一次。桌面与移动外壳各自在退出 / 切后台时再调一次 <code>IrisAutosave.flush()</code>。</p>
<p>恢复不是直接覆盖：启动读 meta，按设置弹「继续上次的照片 / 重新开始 / 稍后」卡片，或设为自动恢复。恢复时 <code>suspend</code> 先挂起保存，避免把「照片已换、参数还没套上」的中间态写回快照；实况视频 ≤ 24MB 随存，超过则如实标注未随存。IndexedDB 不可用时降级为「只存参数 + 缩略图」，等用户重新选照片再套用参数，绝不假装恢复成功。</p>
<p class="ab-dim">注意：这些存储全在<b>本机</b>，不是服务器；桌面 / 移动 / 网页各自独立，快照不跨端同步。清除站点数据或「清除上次的编辑」即可抹掉。</p>`},

{id:'plate',n:'08',eyebrow:'PLATE',t:'二维调色盘 · 两根轴到底在改什么',k:'Tone Color 二维盘 强度 语义 保肤 偏色 加性亮度 色温 肤色流形 12 色调',html:`
<p>盘面是一个方形 2D pad：白点横坐标 <b>Color</b>、纵坐标 <b>Tone</b>，下面一条强度滑杆，顶部实时显示数值。它对应 iPhone 摄影风格的那块盘，但实现上完全是自己写的渲染映射。</p>
<div class="tech-kv">
 <div><b>Color 轴</b><span>轻量的白平衡偏置（红蓝通道小幅反向调整）+ chroma 增益。不是整片染色，而是沿中性灰做温和推移。</span></div>
 <div><b>Tone 轴</b><span>加性亮度曲线 + 对比斜率 + 暗部保底。向上是明亮奶油、向下是浓郁暗调，但<b>不动色度</b>。</span></div>
 <div><b>强度</b><span>把上述变换整体做 0–100% 混合；0 时逐像素等于原图。</span></div>
 <div><b>12 个色调槽</b><span>全部 / 高光 / 中间调 / 阴影 / 红橙黄绿青蓝紫品红，各存一份参数，互不串扰；4 层滤镜又各自挂一整套。</span></div>
</div>
<p><b>这里踩过一个很严重的坑</b>：早期版本把色温做成「暖端蓝通道 ×0.68、冷端 ×1.34」，再叠暗部染色，Tone 又用「整条颜色乘亮度比例」，结果暖调整片黄绿、冷调死蓝、暗调全黑；肤色锁还把夕阳和砖墙误判成皮肤，整片拉橙。真实渲染逐帧复现后的改法是四条：</p>
<ul class="tech-list">
 <li>色温改成轻推，最多 ±7%，中性灰仍是中性灰；暗部分离染色降到原来的四分之一。</li>
 <li>Tone 改成<b>加性亮度曲线</b>，只动明暗不动色度，并加暗部保底，浓郁但不死黑。</li>
 <li>肤色锁收紧：只认「原像素本来就在肤色色相 / 饱和带内」且确实偏出流形的区域，主要信 matte，天空明确不算皮肤。</li>
 <li>「复制全部」在语义盘下按 35% 强度复制，避免和主盘双重染色。</li>
</ul>
<p>改完后用离屏渲染量化：极端角的通道截断从 65% 降到 10%（原图自身 2.5%），色卡基本保住原色；影调亮度差仍有 45.8，<b>效果明显但不再出怪色</b>。极冷调下皮肤区红蓝差只变 9.8，脸不会发蓝。零位与强度 0 都与原图逐像素一致。</p>
<div class="tech-note">盘面配色本身也会跟随照片：导入时取 48×48 缩略图，按饱和度加权算主色相，重新生成横轴渐变（中性灰 → 照片主色）。它只改控件观感，<b>不改任何调色参数与导出结果</b>，也可以一键切回原生黄橙盘。</div>`},

{id:'matte',n:'09',eyebrow:'MATTE',t:'端侧软分割与肤色锁',k:'语义分割 matte 皮肤 天空 头发 亮部 上采样 肤色流形 clamp 启发式 不是ML',html:`
<p>iPhone 那块盘最厉害的不是二维控件，而是背后的语义感知。网页里没有设备端 ML 模型，所以用一套<b>纯前端启发式软分割</b>做工程对标：</p>
<div class="tech-flow">
 <span>导入照片</span><span>缩到约 128×N</span><span>四通道软概率</span><span>边缘感知平滑</span><span>上传为纹理 6</span><span>GPU 线性上采样</span><span>着色器按区域加权</span>
</div>
<p>四个通道：皮肤（肤色色度带 + 中心先验）、天空（蓝青 + 上部位置先验）、头发（暗部低饱和）、亮部。v3 之后改成<b>按每张照片自适应估计肤色</b>，深浅肤色与暖光人像更稳，顺手修掉过暗肤色预览整片发黑的问题。matte 只在导入 / 换照片时推理一次并缓存，拖盘不重算。</p>
<p>渲染层的不等权映射是核心：</p>
<pre class="tech-code">// 概念示意：非皮肤区吃满用户值，皮肤区压回肤色流形
float w = mix(1.0, skinLock, skinMask);
vec3  shifted = colorShift(c, u_plateColor * w, u_plateTone);
c = mix(shifted, clampToSkin(shifted, src), skinMask * u_semLock);</pre>
<p>再加一层<b>像素级肤色软概率兜底</b>：即使 matte 缺失或判断失误，着色器也能靠当前像素的色度位置收敛，保证「拖冷调不会把脸染蓝」。</p>
<p><b>区域工作台</b>把这同一张 matte 从幕后搬到台前。着色器里 <code>zoneWeights(srcUV)</code> 把四通道做互斥与归一化，得到每个像素的软权重 <code>w</code>（总权重恒为 1）；<code>applyZones()</code> 用 <code>dot(w, u_zoneTemp / u_zoneLum / u_zoneSat)</code> 把四套独立参数按权重混合成当前像素的参数，色温走轻推白平衡、亮度走加性、饱和走色度增益，零位严格逐像素恒等。因为权重归一化，主盘是否偏离零位都不影响它 —— 这正好补上了「三滑块必须先把主盘推开才看得见」的体验缺口。<code>zonePseudo()</code> 再按同一组权重叠加伪彩，由 <code>u_zonePrev</code> 控制，导出 / 缩略图 / 录制时强制关闭（<code>thumb</code> 或 <code>LIVE.recording</code>）。CPU 侧 <code>semChannelMask()</code> 把任意通道重采样成灰度 mask，<code>matteToMask()</code> 与 <code>matteToBokeh()</code> 分别写进局部蒙版纹理与主体 matte，signature 里带上 <code>SEM.hash</code> 保证换照片重算。整条链路只多 3 个 <code>vec4</code> + 4 个标量 uniform，没有新增纹理或着色器程序。</p>
<p>三个语义增益滑杆曾出现过「调了没效果」的 bug：根因是主盘零位时语义层整体短路（为了严格恒等原图），且天空区在无 matte 时恒为 0。修法是让三滑块同时作用于 Color 与 Tone、补像素级天空先验、加一个只改对比与亮度不推色相的显式项；面板里也加了「◐ 试调主盘」把白点推开，方便对比。<b>零位恒等</b>这条原则仍然保留：所有参数为 0 时，输出必须逐像素等于原图。</p>
<div class="tech-note">如实说明：这是启发式软分割，不是设备端机器学习；复杂人像、逆光、多光源、透明物体会有误差。兜底策略的目标不是「分得准」，而是「分错也不毁脸」。关于页里也写明了这一点。</div>`},

{id:'paint',n:'10',eyebrow:'PAINT',t:'涂抹 · 从手指轨迹到 GPU 遮罩',k:'涂抹 笔迹 遮罩 BRUSH_N MASK_N destination-out 增量指纹 擦除 软边 局部蒙版',html:`
<p>涂抹系统有两套，共用同一套坐标与遮罩思路：</p>
<p><b>① 像素效果笔刷</b>（马赛克 / 柔焦 / 动态 / 径向模糊）：笔迹存成 <code>{type, pts:[q...], size, strength}</code>，栅格化到 <code>BRUSH_N × BRUSH_N</code> 的单通道 LUMINANCE 纹理，四种效果各占一个纹理单元。Canvas 2D 用 <code>globalCompositeOperation='lighter'</code> 把笔画累加成灰度遮罩，再 <code>getImageData</code> 取 R 通道上传。</p>
<p><b>② 局部蒙版涂抹</b>（这一版的重点）：3 个蒙版槽共用一张 RGB 纹理，每槽一个颜色通道。<code>rebuildMaskPaint()</code> 把笔迹画成软边 matte：</p>
<ul class="tech-list">
 <li>每一笔按笔刷半径的约 1/3 步长插值 stamp，得到连续、方向无关的选区；</li>
 <li>stamp 是径向渐变（中心不透明 → 边缘透明），「边缘柔和度」控制内圈比例；</li>
 <li>「− 擦除」用 <code>destination-out</code>，从已有选区里挖掉；</li>
 <li>「＋ 加选区」用 <code>source-over</code> 叠加；</li>
 <li>每次渲染前用<b>增量指纹</b>判断笔迹有没有变，没变就不重传纹理；</li>
 <li>「范围预览」把同一份 matte 染成半透明伪彩画到叠加层，指哪看哪。</li>
</ul>
<p>着色器里只需一次采样：</p>
<pre class="tech-code">if (u_maskSrc.r &gt; 0.5) {
  mm = clamp(texture2D(u_maskPaint, uv).r, 0.0, 1.0);
} else { /* 退回线性 / 径向形状渐变 */ }</pre>
<p>所以「涂抹」和「形状渐变」不是两个功能，而是<b>同一个蒙版的两种范围来源</b>，切换时各自参数都保留。笔迹以归一化坐标存进状态树，撤销 / 重做 / 参数 JSON 存档都能确定性重算；导出照片、视频、GIF 走的是同一着色器，自然一致。</p>
<p>交互上还修过两次：一次是画面上有文字 / 贴纸时点击被静默打断、刷不动，还误删元素；改成「整屏画笔」后，涂抹模式跳过一切元素命中判定。另一次是手指起手在滑杆上上下滑会误改数值 —— 现在起手方向被锁住：上下滑滚页面并还原数值，横向拖才调参数。</p>
<div class="tech-note">动态模糊之所以「像」动态模糊，是因为它按<b>单一方向等权线性积分</b>（box kernel）取样，而不是斜着糊一片；涂抹时方向自动跟随手势、拖影长度随强度变化。离屏渲染验证过「沿方向有拖影、垂直方向无拖影」。</div>`},

{id:'blur',n:'11',eyebrow:'BLUR',t:'虚化家族与主体检测',k:'背景虚化 主体检测 六种模糊 圆盘散景 高斯 光斑 拖影 径向 旋焦 matte 反转',html:`
<p>背景虚化也是一套 matte 驱动的渲染：先判断主体，再对主体之外做模糊。</p>
<p><b>主体检测</b>：可选自动 / 人物 / 物品。人物走肤色色度带 + 暗发 + 中心先验，物品走边缘色差 + 局部对比 + 中心先验；生成低分辨率软 matte，3×3 均值模糊两轮得到软边，再由 GPU 线性上采样。也支持直接在照片上涂抹「主体（保清晰）」或「虚化区域」，笔迹栅格化后与自动结果融合；「反转」可以把模糊对象换成主体。</p>
<p><b>六种模糊</b>共享同一个采样框架，只是采样轨迹不同：</p>
<div class="tech-kv">
 <div><b>圆盘散景</b><span>沿圆盘均匀取样，模拟大光圈光斑。</span></div>
 <div><b>柔和高斯</b><span>多 taps 加权平均，过渡最自然。</span></div>
 <div><b>光斑散景</b><span>保留高亮、拉开光点，夜景更讨喜。</span></div>
 <div><b>动态拖影</b><span>沿方向等权积分，方向角度可调。</span></div>
 <div><b>径向缩放</b><span>由中心向外拉出 zoom blur。</span></div>
 <div><b>旋转旋焦</b><span>绕中心旋转取样，做旋焦效果。</span></div>
</div>
<p>每种都带强度、光圈、羽化、主体保护参数，配人像 / 产品 / 微距 / 轻度氛围四种一键风格。离屏渲染逐种验证：六种都真实生效、主体区纹理完整保留，背景高频从 40 降到 7.9–32.1，任意两种之间都有明显差异（15 对全通过）。</p>
<p>「光场计算」是另一条独立链路：单张照片没有真实光场射线，所以做的是 <b>2.5D 深度代理</b>（亮度 / 边缘 / 中心先验推一个粗略深度），再支持重聚焦虚化、视差微动与按方向重新打光。复杂遮挡、透明物体、发丝边缘会有误差 —— 关于页与说明书都写明了这不是光场相机数据。</p>`},

{id:'tone',n:'12',eyebrow:'TONE MATCH',t:'色彩迁移 · 保存「色调」而不是「编辑」',k:'色彩迁移 Lab 均值 方差 三档 3D LUT 16 强度 指纹 不套用编辑 自映射恒等',html:`
<p>「保存这张照片的色调」存的不是编辑参数，而是<b>成品画面的色彩指纹</b>。这点和「存为滤镜 / 模板」是两条独立链路。</p>
<div class="tech-flow">
 <span>取成品画面</span><span>转 CIE-Lab</span><span>全局 + 阴影 / 中间调 / 高光三档</span>
 <span>各算亮度与色度均值 / 标准差</span><span>与新照片的指纹做匹配</span><span>生成 16³ 3D LUT</span><span>按强度混合输出</span>
</div>
<p>实现要点：</p>
<ul class="tech-list">
 <li>指纹包含三档统计量，所以「亮部偏暖、暗部偏冷」这种结构能保留，不是一条全局曲线。</li>
 <li>匹配结果写成一张 <b>16³ 的 3D LUT 独立纹理</b>，与用户导入的 .cube 完全分开，不互相覆盖。</li>
 <li>方差缩放与 Lab 偏移都做了限幅，肤色区额外收敛，避免两张差异极大的照片（雪景 → 夜景）被硬拉成怪色。</li>
 <li>「迁移强度」0–100% 做线性混合：0 逐像素等于原图，50% 是轻度融合，100% 完全匹配；配一键关闭。</li>
</ul>
<p>验证用真实 GLES2 离屏渲染：冷色 → 暖色格点红增 43、暖化位移 40，<b>自映射恒等误差仅 1</b>；恒等 LUT 开关差 0、暖化 LUT 红 +55 / 蓝 −52、50% 强度正好落在中间。也修过两个隐藏 bug：导入照片时没锁定纹理单元可能仍显示上一张；参数 JSON 导入 / 载入预设会悄悄丢掉迁移状态。</p>
<div class="tech-note">旧版存过的「色调」会自动从缩略图反算指纹升级，不需要用户手动迁移。指纹只是几十个浮点数，不含任何画面像素。</div>`},

{id:'data',n:'13',eyebrow:'DATA',t:'滤镜、模板与预设的数据驱动',k:'433 滤镜 78 模板 索引表 缩略图懒生成 分类目录 4 层 每层独立盘 我的滤镜',html:`
<h3>外观系统：变量层 + 两套皮肤 + 液态玻璃</h3>
<p>做主题前，界面里有约 200 处硬编码颜色（<code>rgba(255,255,255,.07)</code>、<code>rgba(227,182,92,.13)</code>、<code>#151517</code> 与深色浮层）。先把它们全部收敛成变量：<code>--w*</code> 表示白色 alpha 层、<code>--accent-rgb</code> 让 rgba 形式的强调色也能跟随主题、<code>--on-accent</code> 管强调色背景上的文字，<code>--overlay / --topbar-bg / --stage-bg</code> 管玻璃浮层。批量替换<b>只作用于 <code>&lt;style&gt;</code> 块</b>，因为 Canvas 2D 的 <code>fillStyle</code> 不认 CSS 变量。</p>
<p>9 套主题只覆盖这些变量：深色主题主要改底色与强调色；两套浅色主题把 ≤0.4 的 <code>--w*</code> 整体翻成深色 alpha 层，保证边框、填充与 hover 在白底上依然可见，同时把纯黑阴影调柔。第 9 套「液态玻璃」再叠加一层高斯模糊玻璃：多层半透明渐变 + 折射高光边 + <code>backdrop-filter: blur(22px) saturate(185%)</code>。高斯模糊开关<b>对全部 9 套主题生效</b>，用 <code>html[data-glass]</code> 统一控制顶栏与浮层，关闭时显式 <code>none !important</code> 连 Nova 自身的 blur 也一并关掉；只作用于真正浮在照片上的少数容器，面板卡片用渐变模拟而不加 blur。流畅度上还做了三件事：Nova 的 blur 半径从 30px 降到 18px、去掉不透明容器上无意义的 backdrop-filter、主题切换不再无条件触发全分辨率 WebGL 重绘，433 款平铺用 <code>content-visibility:auto</code> 跳过视口外卡片。</p>
<p>界面版本是 <code>html[data-ui="nova"]</code> 下的一整套追加 CSS：不改 DOM、定位与 flex 方向，只重做圆角、间距、玻璃、阴影与卡片化分组；<code>--nova-r</code> 由三档圆角控制。偏好在 <code>head</code> 的内联脚本里<b>于首屏绘制前</b>从 localStorage 读出并写到 <code>documentElement.dataset</code>，避免刷新闪回默认皮肤；主脚本启动再同步一次 <code>theme-color</code>。<code>data-motion="off"</code> 与系统 <code>prefers-reduced-motion</code> 一起关闭全部动效。</p>
<p><b>滤镜</b>是 433 个字面量对象（名称、分类、一组参数）。运行期建一张「名称 → 对象索引」的查表，播放实况 / 拖动时每帧只做一次哈希查找，不再线性扫 300 多款。缩略图改成<b>用到才生成</b>：打开滤镜库时才为可见的那批画小图，启动不卡。</p>
<p>库的组织是「分类目录 → 分类 → 滤镜」三级：十几张分类卡用该分类 3 款滤镜的缩略图拼成预览，点进去只看这十几款；顶部有最近使用、★ 收藏、全部、我的、原图等快捷行；搜索框跨全部分类查找。分类里还能用下拉直接跳到另一个分类，不必回目录。</p>
<p><b>最多 4 层滤镜叠加</b>，每层单独强度、开关，并且<b>每层都挂自己那套 12 色调调色盘</b>。关掉某层或调低强度，它那套盘会跟着一起减弱 —— 这就是最初「拆掉 iPhone 调色盘绑定」的落点。</p>
<p><b>模板</b>是 78 套组合描述：滤镜层 + 分色调盘 + 语义主盘 + 基础参数 + 画框，按人像 / 风景 / 街拍 / 胶片 / 夜景 / 极简等分类。点一下整套套用，但所有参数仍然可继续编辑。<b>「我的色调」</b>与 <b>「我的滤镜」</b>把当前整套色彩效果注册成一个可复用条目，刷新后仍在（localStorage）。</p>
<p>这套数据驱动的好处：加功能基本是「加数据 + 加一段着色器分支」，不用给每个滤镜写一遍渲染代码；坏处是文件体积会随内容增长，所以缩略图必须懒生成、长文必须用纯文本存。</p>`},

{id:'interaction',n:'14',eyebrow:'INTERACTION',t:'交互系统 · pointer 事件与模式管理',k:'pointer 事件 capturePointer 模式状态条 手势方向锁 长按对比 缩放 裁剪 拖拽 键盘 全局搜索',html:`
<p>画面上所有操作都由 <code>#stage</code> 的 <code>pointerdown / move / up</code> 分发，按优先级短路：</p>
<div class="tech-flow">
 <span>涂抹模式</span><span>元素命中 / 手柄</span><span>裁剪框拖拽</span><span>取色吸管</span><span>双指捏合</span><span>缩放后平移</span><span>长按播放实况</span>
</div>
<p><code>capturePointer()</code> 保证手指移出画布后仍能收到 move / up；<code>releasePointer</code> 与窗口失焦、切后台、pointercancel 都会把状态收回，避免卡在「正在看原图」或「正在涂抹」。</p>
<p>曾经有个很典型的 bug：点过马赛克后画面一直停在涂抹态，之后点文字、贴纸、删除全都变成「接着涂」，看起来像整个元素组件坏了。修法是加<b>模式状态条 + 明确退出路径</b>（点状态条 / Esc / 切换工具），并且让涂抹跳过元素命中判定、点元素立刻回到编辑态并选中、文字输入框自动出现并滚到眼前。</p>
<p>几个手感细节都是被真实反馈逼出来的：</p>
<ul class="tech-list">
 <li><b>滑杆方向锁</b>：起手在滑杆上，上下滑只滚页面并还原数值，横向拖才调参数；键盘方向键与双击归零照常。</li>
 <li><b>长按对比</b>：整个界面禁掉原生文字选取与 iOS 长按菜单（输入框例外），否则按住对比会弹出「复制 / 选择」。</li>
 <li><b>缩放</b>：25%–800%，滚轮按 <code>deltaMode</code> 归一化后做指数映射、单步上限 10%，桌面端不再「一滚跳一大截」；点百分比回 100%。</li>
 <li><b>裁剪</b>：完整原图 + 裁剪框，拖四角 / 边 / 框内 / 框外重框 / 双击重置，精确数值折叠在下面兜底。</li>
 <li><b>全局搜索</b>：<code>Ctrl/⌘+K</code> 或 <code>/</code>，把工具、滤镜、参数、模板、预设、操作与独立页面都放进一个索引；每个词按「名称 / 别名 / 说明」做 AND 打分，Enter 直接执行（搜「色温」会跳到调整页并高亮那根滑杆）。</li>
</ul>`},

{id:'export',n:'15',eyebrow:'EXPORT',t:'导出 · 一条渲染管线，五种产物',k:'导出 PNG JPG WebP GIF89a MediaRecorder captureStream 60fps 视频 ZIP 实况 离屏 FBO 一致',html:`
<p>因为预览与导出共用同一个着色器，导出做的事情主要是「换输出目标」：</p>
<div class="tech-kv">
 <div><b>静态图片</b><span>把输出尺寸 uniform 改成成品尺寸，渲染到离屏缓冲，出 PNG / JPG / WebP，可设质量与最长边；画框与文字贴纸等叠加元素在 2D 层合成进去。</span></div>
 <div><b>PNG 无损瘦身</b><span>浏览器 <code>toBlob('image/png')</code> 的默认编码偏保守。现在自己写了一遍 PNG 编码：全不透明时改用 <b>RGB（colorType 2）</b> 去掉多余 Alpha 通道、每一行在 5 种滤波里挑残差绝对值之和最小的（自适应 Paeth）、再用 <code>CompressionStream('deflate')</code> 重新压缩；最后和浏览器原始 PNG <b>比大小取较小者</b>。这是纯无损重编码，实测逐像素 <code>diff=0</code>，体积减少约 <b>60–70%</b>。手写 CRC32、IHDR / IDAT / IEND chunk，不支持的环境自动回退。</span></div>
 <div><b>视频</b><span><code>canvas.captureStream(fps)</code> + <code>MediaRecorder</code>，逐帧套用全部编辑。时长可自定义（不限时长）、最高 60fps，默认「原格式 / 原画质 / 不压缩 / 无变化」：不缩小画面、不主动限码率、不加运镜。带进度与中途停止保存已录部分。</span></div>
 <div><b>GIF</b><span>纯前端 GIF89a 编码：256 色自适应调色板 + 抖动、可选时长 / 帧率 / 尺寸 / 动效 / 循环次数，没有引入任何编码库。</span></div>
 <div><b>实况配对素材</b><span>封面 + 已逐帧调色的视频 + 配对说明打成一个 ZIP。网页不能把结果写回 iOS 相册，说明里写了用快捷指令重新配对的步骤。</span></div>
 <div><b>零重编码直出</b><span>「原始视频文件」按钮直接下载用户导入的原片，不经过录制管线。</span></div>
</div>
<p>实况照片导入时按同名配对 HEIC + MOV：静态封面走纹理 0，视频解码到隐藏 <code>&lt;video&gt;</code>；长按画面 / 点 LIVE / 按 L 播放，播放期间每一帧都重新走同一套着色器，因此调色盘、文字贴纸、马赛克都会跟着动。进度条可以挑一帧「设为封面」；它移到画面上方，打开「更多」时自动收起，不挡工具栏。</p>
<div class="tech-note">诚实边界：MediaRecorder 一律<b>有损编码</b>，「原画质」指的是不主动降分辨率与不限码率；HEIC 与部分专利编解码器在 Chromium 里未必可解码，失败时会用视频中间帧作封面并提示；GIF 上限 400 帧、256 色；桌面浏览器导出的 WebM 需要转 H.264 才能在 iOS 相册里重新配对。</div>`},

{id:'perf',n:'16',eyebrow:'PERFORMANCE',t:'性能与流畅度 · 让拖动手不顿',k:'性能 降采样 拖动 140ms uniform 缓存 跳过叠加层 缩略图懒生成 增量指纹 DOM 复用',html:`
<p>纯前端做实时全分辨率着色器，最怕的是拖动时每帧都做满计算。策略是「<b>交互时降精度，静止后立刻恢复</b>」：</p>
<ul class="tech-list">
 <li>连续拖滑杆 / 拖白点 / 拖元素时，主画布临时降到约 65% 分辨率；停手约 140ms 自动恢复全清晰。<b>文字、贴纸、选框等叠加层始终不降质</b>，所以看起来不会糊。</li>
 <li>模糊与颗粒这类对分辨率敏感的效果仍按全分辨率计算，松手时不会突然跳一下。</li>
 <li>所有 uniform 用 <code>Float32Array</code> 缓存复用（<code>UA</code> / <code>fa()</code>），播放实况逐帧上传不再反复分配。</li>
 <li>没有叠加元素、不在元素编辑态、没开蒙版可视化时，2D 叠加层<b>整块跳过</b>，连 clearRect 都不做。</li>
 <li>滤镜缩略图按需生成；滤镜查索引表；顶栏文字没变化就不写 DOM。</li>
 <li>笔刷与蒙版遮罩用<b>增量指纹</b>判断是否需要重新栅格化 / 上传，长笔画不再每帧序列化全部轨迹。</li>
 <li>面板刷新时不重播每一项的入场动画，点选与拖动时整页不闪。</li>
 <li>桌面 Electron 版设 <code>backgroundThrottling:false</code>，长视频导出时窗口失焦也不掉帧。</li>
</ul>
<p><b>本轮又做了一轮系统性提速</b>，重点从「少画一点」转向「别做重复功」：</p>
<ul class="tech-list">
 <li><b>uniform 值缓存</b>：<code>u1/u2/u4/uArr</code> 先比对上一次上传的值，没变就跳过 <code>gl.uniform*</code>。同一个 program 的 uniform 是持久状态，静止画面上一次上传都不必发；实测同一状态连续两帧，第二次上传次数从 105 降到 <b>0</b>，且逐项比对缓存值与全量上传值完全一致 —— 跳过不会改变任何一个像素。</li>
 <li><b>零分配 setUniforms</b>：局部效果、蒙版、HSL、调色盘的临时数组全部改成模块级复用缓冲（<code>SU</code>），<code>PARAMS.forEach</code> / <code>HUES.forEach</code> 改 for 循环，<code>plateUniform()</code> 原地写 <code>PLATE_BUF</code>；查找最后一笔笔迹也从「复制数组 + reverse + find」改成从尾部反向遍历。每帧不再产生几十个短命数组，GC 抖动明显减少。</li>
 <li><b>帧内布局缓存</b>：一个像素坐标换算可能在同帧触发多次 <code>getBoundingClientRect()</code>，每次都强制同步布局。<code>stageRect()</code> 每帧失效一次、帧内复用，实测 12 次换算只做 <b>1 次</b>布局读取、11 次命中；滚动、resize、切页时主动失效。</li>
 <li><b>直方图让帧</b>：<code>renderSmall</code> 里的 <code>readPixels</code> 会同步等 GPU，连续拖动时每 260ms 一次就足以顿一下。现在拖动帧直接跳过并顺延，停手由恢复计时器补算；标签页隐藏也不算。</li>
 <li><b>缩略图参数缓存</b>：单款滤镜的 <code>effective(name, 1)</code> 是常量，按「名称 + 强度」存进 <code>EFF_SOLO</code>，浏览 433 款滤镜不再反复叠加 30 项参数。</li>
 <li><b>自动保存不再重编码原图</b>：以前每次防抖落盘都把整张照片 <code>drawImage</code> + <code>toBlob('image/png')</code> 一遍，大图会卡住主线程几百毫秒。现在按「原图对象引用 + 实况视频标识」缓存字节与缩略图，只有换照片才重编码；之后每次保存只序列化几 KB 状态。实测连续 5 次保存只编码 1 次，状态依然逐次更新。</li>
 <li><b>小处收紧</b>：<code>bindTextures()</code> 抽掉主画布与缩略图的重复绑定；滑杆 <code>upd()</code> 值没变就不写 DOM；诊断页新增实时帧率与缓存命中面板，流畅度变得可观测。</li>
 <li><b>撤销历史改差分存储</b>：以前每步都把整份 <code>state</code> 序列化成字符串（含笔迹、元素、蒙版、图层），60 步就是 60 份完整副本。现在 <code>irisDiff / irisApply</code> 只记录「相对上一步变化了的叶子路径」，undo / redo 共用一个 <code>{f, b, m}</code> step（正向、反向、摘要）；<code>irisEqual</code> 做深度相等，数组里装数组（笔迹坐标点）内容相同就不误记；<code>irisApply</code> 对对象值深拷贝，避免历史 step 与当前 state 共享引用被后续编辑污染。</li>
 <li><b>书签与自动保存快照</b>改成「相对默认状态的差分」打包（<code>packState / unpackState</code>），带版本标记并兼容旧版完整 JSON；历史页新增占用面板与「压缩旧书签」「清空撤销历史」。实测单份状态 4479 B → 733 B（<b>−84%</b>），13 步历史 2116 B，60 步上限 6931 B（旧方案约 269 KB）。</li>
 <li><b>裁剪会话</b>：拖动过程不逐步写历史，点「完成裁剪」才一次性提交一步，「取消」连中间步一起回滚；切走工具自动完成。既减少历史占用，也让「什么时候算裁完」变得明确。</li>
 <li><b>页面中心</b>：22 个页面从一次全铺改成 6 张常用卡 + 5 个<b>懒构建折叠分组</b>（收起时连 DOM 都不创建），全局搜索里页面类结果限流 3 条。</li>
 <li><b>字体确实生效</b>：旧版把 <code>PingFang SC</code> / <code>Georgia</code> 直接写死，Windows 与 Linux 上大多不存在，"
    "中文静默回落到与黑体相同的 <code>sans-serif</code>，实测 4 款只有 3 种画面。现在启动时用「候选字体 + 基准通用族」"
    "对 <code>measureText</code> 宽度差做探测（<code>document.fonts.check</code> 对系统字体恒为 true，不能判存在），"
    "只保留设备上真有的字体；每款再配不同的通用族、字重与 <code>letterSpacing</code> 兜底，8 款逐像素互不相同。"
    "<code>applyFont()</code> 让 <code>elMetrics</code> 与 <code>drawEl</code> 共用同一设置，测量框与导出不会错位。</li>
 <li><b>20 种盘模式表驱动</b>：每款只声明 <code>参数 = (ax·x + ay·y)·强度 + aa·amt</code>，启动时预编译成扁平数组并建 <code>Map</code> 索引；"
        "逐帧只做一次定长循环，无 <code>Object.keys</code>、无临时对象、无 20 路分支，模式数从 4 增到 20 但每帧成本不变。"
        "<code>amt = min(1, hypot(x,y))·强度</code> 让黑白 / 棕褐这类效果「离开中心才生效」，零位严格恒等。折叠面板收起时连 20 个 chip 的 DOM 都不创建。</li>
     <li><b>433 款缩略图懒加载</b>：<code>renderSmall</code> 每张都要一次同步 <code>gl.readPixels</code> + <code>toDataURL</code>。"
        "现在图片先挂 1×1 占位，<code>IntersectionObserver</code> 提前 180px 才真正生成，每批最多 3 张、批间让出一帧；"
        "生成后的主画面重绘合并成一次 rAF。433 款平铺与 44 张分类卡都不再一口气阻塞主线程。</li>
     <li><b>20 种盘模式共用一条渲染路径</b>：<code>state.padMode</code> + <code>state.padVals[mode]</code> 各存一份两轴与强度，"
    "<code>applyPadModeToEffective()</code> 在 <code>effectiveRaw()</code> 末尾只把<b>当前模式</b>展开成已有 uniform 的增量（O(1)、零分配），"
    "语义模式仍走原本的 matte + 肤色锁通道。零位增量全为 0，逐像素恒等；不新增纹理 / 分支，切换与拖动不掉帧。"
    "<code>normalizeState()</code> 会把旧存档的语义盘与全局盘迁移成对应模式的值。</li>
 <li><b>「我的」页与历史图片</b>：IndexedDB v2 新增 <code>gallery</code> store，换照片时在 <code>requestIdleCallback</code> 里异步建档，"
    "编辑更新按 2.5s 节流只更新同一条记录；缩略图复用自动保存已算好的那张，不重复 <code>drawImage</code>。上限 12 条 / 60MB，超了删最旧。"
    "页面打开时 <code>Promise.all</code> 一次并行取回，用 <code>DocumentFragment</code> 一次性写入 DOM，图片全部 <code>loading="lazy"</code>。</li>
 <li><b>一键保存所有参数</b>：<code>fullParamsSnapshot()</code> 挑出可复用的调色子集存进 <code>USER_FILTERS</code> 的 <code>p.__full</code>，"
    "套用时 <code>normalizeState(合并当前照片绑定字段)</code> 整套换参数，保留元素 / 笔迹 / 构图 / 导出规格，走一次 <code>mutate()</code> 可撤销。</li>
 <li><b>元素类编辑也进自动保存</b>：<code>commit()</code> 现在会触发一次常规落盘（文字拖拽 / 涂鸦 / 马赛克涂抹 / 蒙版涂抹 / 虚化涂抹 / 点放效果的结束都走它）；再加一个每 1.2s 比对 <code>packState(state)</code> 与「上次成功落盘版本」的<b>状态哨兵</b>，任何直接改 state 的路径都能兜住；<code>flush()</code> 在退出瞬间先同步写一份 localStorage 轻量 meta，不等异步 IndexedDB。恢复时清空 signature 缓存并强制重建笔迹 / 蒙版 GPU 遮罩，画面而不只是参数能回来。</li>
</ul>
<p>另外专门处理过「播放实况时每帧都重复请求渲染」的问题：取消重复帧请求，统一由一条 rAF 循环驱动。所有这些都是为了让单文件在手机上也能跟手，同时把「体积小」也当成一种性能：历史、存档、导出文件都尽量不留冗余字节。</p>`},

{id:'ui',n:'17',eyebrow:'UI',t:'界面、动画与独立页面系统',k:'CSS 变量 响应式 大图优先 编辑栏可拖 动画 prefers-reduced-motion 二级页面 SUBPAGES 目录 搜索',html:`
<p><b>布局</b>：手机是「大图 + 底部工具」，宽屏自动变成左右分栏；编辑栏有可拖动把手，可自由改尺寸、可点一下收起全屏看图，尺寸会记住。「填满 / 适应」只改预览方式，导出仍是完整照片。</p>
<p><b>动画</b>：开机时顶栏 / 画面 / 编辑区依次轻浮起，按钮按压回弹、折叠盒内容淡入滑下、选中态短脉冲、换照片轻微淡入、提示条弹起。全部用 CSS transition / keyframes，并且包在 <code>@media (prefers-reduced-motion: reduce)</code> 里 —— 系统开了「减少动画」就自动关掉。</p>
<p><b>独立页面系统</b>是后期为「界面太挤」做的重构：一个 <code>#subPage</code> 容器 + 一张 <code>SUBPAGES</code> 注册表，每项提供 <code>{title, sub, render(body)}</code>。<code>openSubPage(id, anchor)</code> 负责清容器、改标题、调 render、加 <code>show</code>、按锚点滚动；<code>closeSubPage()</code> 与 Esc / 返回按钮统一收口。</p>
<p>技术实现页、自动保存、编辑历史、最近使用、导出记录、诊断、版本演进、手势地图与色彩术语页，都是这张 <code>SUBPAGES</code> 表里的项，和说明书、关于页共用同一套排版语言：左侧粘性目录（手机变横向可滚动目录）、右上搜索框、章节卡片、每章「↑ 回目录」，点目录即定位并高亮；滚动时目录也会跟着高亮当前章。搜索直接过滤章节正文，不是只搜标题。</p>
<p>入口统一收敛：顶栏「⋯」与「更多」里只留一个「<b>页面中心</b>」入口（外加说明书一个快捷），22 个页面在页面中心按 5 组折叠，首屏只显示 6 张常用卡；全局搜索搜「渲染管线」「涂抹」「3D LUT」「坐标」等可直达对应章节，但页面类结果最多 3 条，不再刷屏。说明书末章与关于页的架构章都留了交叉引用，不重复堆内容。</p>
<div class="tech-note">页面内容全部是字面量字符串，不是运行时再去 fetch 一个 Markdown。这样离线双击、静态托管、Electron 打包三种分发方式的行为完全一致。</div>`},

{id:'verify',n:'18',eyebrow:'VERIFY & LIMITS',t:'验证方法、已知边界与桌面移植',k:'验证 node --check GLSL 编译链接 离屏渲染 像素比对 Playwright 回归 边界 Electron 主进程 适配层',html:`
<p><b>怎么确认这么多改动没把前面弄坏？</b>项目里配了四层验证，都不依赖服务器：</p>
<div class="tech-kv">
 <div><b>① 语法</b><span>把内联 <code>&lt;script&gt;</code> 抽出来跑 <code>node --check</code>，主进程 / preload / 适配层每个 JS 文件单独过一遍。</span></div>
 <div><b>② 着色器</b><span>用 EGL + GLES2 建离屏上下文，编译 VS / FS、链接、枚举全部 uniform 并设默认值，检查 <code>glGetError</code>。</span></div>
 <div><b>③ 像素级</b><span>在离屏渲染里构造已知图案，逐像素比对：零位恒等、冷暖两端差异、肤色锁开关、动态模糊方向性、六种模糊两两可分、色调迁移自映射、涂抹遮罩「中心变 / 角落不变」。</span></div>
 <div><b>④ 浏览器交互</b><span>Playwright 在桌面 / 宽屏 / 窄屏 / 手机四种视口跑真实点击、拖拽、滚轮、触摸模拟、导入导出、独立页面与搜索，收集 pageerror。</span></div>
</div>
<p>每次交付还会核对四份 HTML 副本（根目录、桌面工程 <code>app/</code>、网页部署包、桌面版 zip）<b>逐字节一致</b>，以及 zip 内中文文件名不乱码。坐标类 bug 用数值断言而不是截图，动画类改动用「减少动画」开关验证降级。</p>
<p><b>桌面移植</b>（Electron 33 + electron-builder 25）刻意做成「外壳」，不是把网页重写一遍：主进程负责窗口、三端原生菜单、系统打开 / 保存对话框、真实 <code>fs.writeFile</code>、最近文件、窗口几何、单实例与文件带入；<code>preload.js</code> 用 <code>contextBridge</code> 暴露一小组白名单；<code>adapter.js</code> 在页面加载完成后注入主世界，直接复用网页已有的 <code>loadFiles / downloadBlob / openSubPage / toast</code>。<code>nodeIntegration:false + contextIsolation:true + sandbox:true</code>，快捷键不重复注册，HTML 一行不改。</p>
<p><b>已知边界</b>，也都写在关于页和说明书里：</p>
<ul class="tech-list">
 <li>语义分割是启发式软分割，不是设备端 ML；光场是单张照片的 2.5D 近似，不是光场相机数据。</li>
 <li>色调迁移是统计色彩匹配，不重建光影方向、局部对比或物体颜色；差异极大的两张图建议把强度调到 50–80%。</li>
 <li>MediaRecorder 有损；HEIC / 部分专利编解码器依赖浏览器；GIF 上限 400 帧、256 色。</li>
 <li>WebGL 1.0 只保证 8 个片元纹理单元，不足时涂抹选区自动降级为形状渐变。</li>
 <li>超长视频、60fps + 4K 同时开启很吃内存与电量，手机端注意发热。</li>
 <li>单文件、零构建换来的是可移植性，代价是没有模块隔离、没有类型检查、没有单元测试框架 —— 所以才用上面那套外部回归脚本补上。</li>
</ul>
<div class="tech-note">这篇文章本身也是「零构建」思路的一部分：内容存在 <code>TECH_CHAPTERS</code> 数组里，由和说明书、关于页完全相同的渲染函数画出来。加一章就是往数组里加一个对象。</div>`}
];
function renderTechPage(body){
  const w=spWrap(body);

  const hero=spEl('div','tech-hero');
  hero.innerHTML='<div class="tech-hero-mark">'+(typeof irisMark==='function'?irisMark(64):'◉')+'</div>'
    +'<div class="tech-hero-t"><div class="ab-eyebrow">IRIS · ENGINEERING NOTES</div>'
    +'<h2>技术实现 <span>· 一个 HTML 是怎么长成编辑器的</span></h2>'
    +'<p>从渲染管线、着色器生成、坐标系统，到语义 matte、涂抹遮罩、色彩迁移与导出 —— 18 章源码级拆解，讲清楚每一步为什么这么做、哪里踩过坑、以及怎么验证它真的对了。</p>'
    +'<div class="tech-hero-meta">单文件 / 零依赖 / 零构建　·　WebGL 1.0 + GLSL ES　·　纯前端，照片不上传　·　Release Candidate</div></div>';
  w.append(hero);

  const search=spEl('input','sp-search'); search.type='search';
  search.placeholder='搜索技术文章，如「着色器」「坐标」「肤色锁」「3D LUT」「导出」…';
  w.append(search);

  const doc=spEl('div','ab-doc tech-doc'); w.append(doc);
  const toc=spEl('div','sp-toc ab-toc tech-toc');
  toc.append(spEl('div','sp-toc-t','目录 · '+TECH_CHAPTERS.length+' 章'));
  TECH_CHAPTERS.forEach((c,i)=>{
    const b=spEl('button','',String(i+1).padStart(2,'0')+'　'+c.t);
    b.dataset.spid=c.id;
    b.onclick=()=>{ if(search.value){ search.value=''; spGuideFilter(doc,''); } spScrollTo(c.id); };
    toc.append(b);
  });
  const chapters=spEl('div','ab-chapters tech-chapters');
  TECH_CHAPTERS.forEach(c=>{
    const d=spEl('section','sp-chapter ab-chapter tech-chapter'); d.id='spc-'+c.id;
    d.append(spEl('div','ab-eyebrow',c.n+' / '+c.eyebrow));
    d.append(spEl('h3','',c.t));
    const box=spEl('div','ab-body tech-body'); box.innerHTML=c.html; d.append(box);
    d.dataset.gtext=(c.t+' '+c.k+' '+d.textContent).toLowerCase();
    const back=spEl('button','sp-backtop','↑ 回目录');
    back.onclick=()=>body.scrollTo({top:0,behavior:'auto'});
    d.append(back);
    chapters.append(d);
  });
  doc.append(toc,chapters);
  search.oninput=()=>spGuideFilter(doc,search.value.trim().toLowerCase());

  /* 滚动时目录跟随高亮；每次打开页面先摘掉旧监听，避免重复叠加 */
  if(window.__irisTechScroll){
    body.removeEventListener('scroll',window.__irisTechScroll);
  }
  window.__irisTechScroll=()=>{
    const base=body.getBoundingClientRect().top+90;
    let cur=null;
    TECH_CHAPTERS.forEach(c=>{
      const el=doc.querySelector('#spc-'+c.id);
      if(el&&el.getBoundingClientRect().top<=base) cur=c.id;
    });
    toc.querySelectorAll('button').forEach(b=>{
      const on=b.dataset.spid===cur;
      b.classList.toggle('on',on);
      /* 手机端目录是横向条：把当前章滑到可见位置 */
      if(on&&toc.scrollWidth>toc.clientWidth+4){
        const t=Math.max(0,b.offsetLeft-toc.clientWidth/2+b.offsetWidth/2);
        if(Math.abs(toc.scrollLeft-t)>toc.clientWidth*.35) toc.scrollTo({left:t,behavior:'auto'});
      }
    });
  };
  body.addEventListener('scroll',window.__irisTechScroll,{passive:true});

  const row=spEl('div','sp-row');
  [['▤ 阅读使用说明书',()=>openSubPage('guide')],
   ['◉ 阅读关于页',()=>openSubPage('about')],

  w.append(row);

  ft.innerHTML='<b>Iris 调色盘 · 技术实现</b>　|　'+TECH_CHAPTERS.length+' 章 · 单文件纯前端 · 零依赖零构建<br>'
    +'由 <b>Petrichor（Patrick）</b> 通过 VibeCoding 完成　|　© 2026 Petrichor<br>'
    +'本文描述的是本网页的实际实现方式；与 Apple CoreImage / Metal 及设备端机器学习无关。';
  w.append(ft);
