<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iris 调色盘 · 语义感知的在线照片编辑器</title>
<meta name="theme-color" content="#0b0b0d">
<!-- 版本元数据：检查更新时远端只需读取文件头部即可比对，不必下载整份页面 -->
<meta name="iris-version" content="1.0.4">
<meta name="iris-build" content="2026-11-11">
<meta name="iris-repo" content="david1a21/iris-palette">
<meta name="description" content="Iris 调色盘：语义感知的二维色彩控制器。Tone × Color 两轴、端侧区域分割与肤色锁，433 款滤镜、78 套模板，支持照片 / 视频 / GIF 导出，纯前端不上传。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="irisFavicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101014'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23e3b65c' stroke-width='5' stroke-dasharray='9 3'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Iris 外观系统 · 变量层
   所有界面颜色都走 CSS 变量；主题只覆盖变量，不改任何结构。
   --w* 是「白色 alpha 层」，浅色主题会整体换成深色 alpha 层。
   --accent-rgb 让 rgba(...) 形式的强调色也能随主题走。
   ============================================================ */
:root{
  --bg:#08080a; --panel:#111114; --panel2:#1a1a1e; --line:rgba(255,255,255,.075);
  --txt:#f3f3f5; --sub:#85858e; --accent:#e3b65c; --blue:#0a84ff; --radius:18px;
  --accent-rgb:227,182,92; --on-accent:#151517;
  --body:#c9c9d0;
  --stage-bg:#0b0b0d;
  --topbar-bg:rgba(9,9,11,.78);
  --topbar-grad:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0));
  --overlay:rgba(24,24,28,.92);
  /* 玻璃开关开启时浮层用的半透明底。之前只加 backdrop-filter，
     而 --overlay 是 .92~.94 的实色，模糊被自己的背景完全盖住，
     所以「只有液态玻璃主题看得见效果」。这层底色让 9 套主题都透得出来。 */
  /* 玻璃浓度：--glass-alpha 由外观页滑杆实时写入（0.20~0.90，默认 .55）。
     主题只改 --glass-rgb，用户在任何主题下调的都是同一个透明度。 */
  --glass-rgb:20,23,31; --glass-alpha:.55;
  --glass-bg:rgba(var(--glass-rgb),var(--glass-alpha));
  --glass-line:rgba(255,255,255,.22);
  --glass-sheen:linear-gradient(122deg,rgba(255,255,255,.17),rgba(255,255,255,.035) 36%,
                  rgba(255,255,255,0) 60%,rgba(255,255,255,.07));
  --shadow:0 18px 46px rgba(0,0,0,.6);
  --nova-r:24px;
  --w1:rgba(255,255,255,.1);
  --w02:rgba(255,255,255,.02);
  --w03:rgba(255,255,255,.03);
  --w04:rgba(255,255,255,.04);
  --w05:rgba(255,255,255,.05);
  --w06:rgba(255,255,255,.06);
  --w07:rgba(255,255,255,.07);
  --w08:rgba(255,255,255,.08);
  --w09:rgba(255,255,255,.09);
  --w9:rgba(255,255,255,.9);
  --w10:rgba(255,255,255,.10);
  --w11:rgba(255,255,255,.11);
  --w12:rgba(255,255,255,.12);
  --w13:rgba(255,255,255,.13);
  --w14:rgba(255,255,255,.14);
  --w15:rgba(255,255,255,.15);
  --w16:rgba(255,255,255,.16);
  --w18:rgba(255,255,255,.18);
  --w018:rgba(255,255,255,.018);
  --w022:rgba(255,255,255,.022);
  --w22:rgba(255,255,255,.22);
  --w24:rgba(255,255,255,.24);
  --w025:rgba(255,255,255,.025);
  --w028:rgba(255,255,255,.028);
  --w28:rgba(255,255,255,.28);
  --w30:rgba(255,255,255,.30);
  --w34:rgba(255,255,255,.34);
  --w035:rgba(255,255,255,.035);
  --w038:rgba(255,255,255,.038);
  --w045:rgba(255,255,255,.045);
  --w055:rgba(255,255,255,.055);
  --w065:rgba(255,255,255,.065);
  --w66:rgba(255,255,255,.66);
  --w72:rgba(255,255,255,.72);
  --w075:rgba(255,255,255,.075);
  --w92:rgba(255,255,255,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 长按「对比原图」/ 拖动画面时，禁止浏览器原生文字选取与长按弹出菜单。
   输入框、文本域、下拉框仍保留原生编辑、选中与复制粘贴能力。 */
#app,#app *,#app *::before,#app *::after,.toast,.cmd-mask{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea,#app select,#app [contenteditable="true"],
.cmd-mask input,.cmd-mask textarea{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ---------- 顶栏 ---------- */
.topbar{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 14px 8px;
  background:var(--topbar-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:22}
.tb-side{display:flex;gap:4px;align-items:center;min-width:0;flex:0 0 auto}
.tb-side.right{justify-content:flex-end}
.tb-full{display:inline}.tb-compact{display:none}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:17px;color:var(--txt);background:var(--w07)}
.iconbtn:disabled{opacity:.3}
.iconbtn:active{background:var(--w18)}
.tb-title{flex:1;text-align:center;min-width:0}
.tb-main{font-size:15px;font-weight:600;letter-spacing:.3px}
.tb-sub{font-size:11px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{font-size:13px;padding:7px 11px;border-radius:9px;background:var(--w08)}
.tbtn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}

/* ---------- 画布区 ---------- */
.stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;background:var(--stage-bg);touch-action:none}
#gl{display:block;width:100%;height:100%}
#hist{position:absolute;right:10px;top:10px;width:130px;height:52px;border-radius:8px;
  background:rgba(0,0,0,.42);border:1px solid var(--line);pointer-events:auto;cursor:pointer;opacity:.92;z-index:3}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
/* 可视化裁剪画布：盖住 WebGL 预览，但底部控件仍在最上层 */
#cropEd{position:absolute;inset:0;width:100%;height:100%;z-index:3;display:none;
  touch-action:none;cursor:crosshair;background:var(--stage-bg)}
#cropEd.on{display:block}
/* 裁剪页整块画面都要可拖：所有浮动控件暂时让位，避免角手柄被缩放条挡住 */
#app.crop-mode .import-card,#app.crop-mode #hist,#app.crop-mode #splitHandle,
#app.crop-mode .cmp,#app.crop-mode .zoomctl,#app.crop-mode .dock-float,
#app.crop-mode .live-bar,#app.crop-mode .live-badge{display:none}
#app.crop-mode #gl,#app.crop-mode #ov{opacity:0}
/* 裁剪完成条：放在编辑栏顶部，占据自己的一行，不再浮在照片上。
   无论桌面右侧栏还是手机底部栏，都不进入 stage，因此绝不遮挡画面。 */
#cropBar{display:none;flex:0 0 auto;gap:8px;align-items:center;
  padding:9px 12px 10px;border-bottom:1px solid var(--line);
  background:rgba(var(--accent-rgb),.055);white-space:nowrap}
#app.crop-mode #cropBar{display:flex}
#cropBarInfo{color:var(--sub);font-size:11px;font-weight:600;padding:0 4px;
  overflow:hidden;text-overflow:ellipsis;max-width:40vw}
/* 编辑栏被收起时不显示完成条；面板里与画面双击仍可完成 */
#app.dock-off #cropBar{display:none}
.crop-btn{border:1px solid var(--w16);background:var(--w07);
  color:var(--txt);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;
  min-height:38px;cursor:pointer;flex:0 0 auto}
.crop-btn:active{transform:scale(.96)}
.crop-btn.done{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:800}
@media(max-width:620px){
  #cropBar{gap:6px;padding:8px 10px;justify-content:space-between}
  #cropBarInfo{display:none}
  .crop-btn{flex:1 1 0;padding:10px 6px;font-size:13px;min-height:44px}
}
#splitHandle{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;
  border-radius:50%;background:var(--accent);color:var(--on-accent);display:none;place-items:center;
  font-size:13px;font-weight:700;z-index:3;touch-action:none;cursor:ew-resize;
  box-shadow:0 2px 12px rgba(0,0,0,.6);border:2px solid #fff}
#app.split-on #splitHandle{display:grid}
#app.picking #splitHandle{pointer-events:none;opacity:.35}
#app.picking #hist{pointer-events:none}
#app.picking .import-card{pointer-events:none;opacity:.22}
#splitHandle::after{content:"";position:absolute;left:13px;top:-100vh;height:200vh;width:2px;
  background:rgba(var(--accent-rgb),.85);z-index:-1}
.zoomctl{position:absolute;left:10px;bottom:10px;z-index:7;display:flex;align-items:center;gap:2px;
  background:var(--overlay);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:11px;padding:3px;z-index:3}
.zoomctl button{width:30px;height:28px;border-radius:8px;font-size:15px}
.zoomctl button.wide{width:auto;padding:0 8px;font-size:11px;color:var(--sub)}
.zoomctl button.wide.on{color:var(--accent)}
.zoomctl button:active{background:var(--w14)}
.zoomctl span{font-size:11px;color:var(--sub);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.cmp{position:absolute;right:10px;bottom:10px;z-index:7;padding:8px 12px;border-radius:11px;font-size:12px;
  background:var(--overlay);backdrop-filter:blur(14px);border:1px solid var(--line);z-index:3;
  touch-action:none}
.cmp.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:var(--sub);font-size:14px;line-height:2;pointer-events:none;padding:20px}
.drop b{color:var(--txt);font-size:17px}
.err{position:absolute;inset:0;display:none;place-items:center;padding:24px;color:#ff9b9b;
  font-size:12px;white-space:pre-wrap;overflow:auto;background:#000}

/* ---------- 底部工具区（可拖大小 / 可收起） ---------- */
.dock{flex:0 0 36dvh;min-width:0;max-width:100%;display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--line);z-index:4;overflow:hidden}
.dock-grip{flex:0 0 18px;display:grid;place-items:center;touch-action:none;cursor:ns-resize;
  background:var(--panel);border-bottom:1px solid var(--w04)}
.dock-grip span{width:36px;height:4px;border-radius:3px;background:var(--w28);
  transition:background .2s,width .2s}
.dock-grip:active span{background:var(--accent);width:52px}
.dock-float{position:absolute;right:10px;bottom:56px;display:none;padding:9px 14px;border-radius:11px;
  font-size:12px;font-weight:600;background:var(--accent);color:var(--on-accent);z-index:6;
  box-shadow:0 4px 18px rgba(0,0,0,.5)}
#app.dock-off .dock-float{display:block}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;flex:0 0 auto;
  padding:7px 8px 6px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tools::-webkit-scrollbar{display:none}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-width:0;padding:5px 2px 7px;border-radius:11px;font-size:10.5px;color:var(--sub);
  white-space:nowrap;overflow:hidden;transition:background .18s,color .18s}
/* 图标是唯一的对齐基准：固定 20×20 网格，选中线挂在图标上，不再随文字宽度漂移 */
.tool i{position:relative;display:grid;place-items:center;width:20px;height:20px;
  font-style:normal;font-size:18px;line-height:1}
.tool .ic{width:19px;height:19px}
.tool.active{color:var(--accent);background:rgba(var(--accent-rgb),.10)}
.panel{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:8px 12px 18px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.sec{margin-bottom:11px}
.sec-h{font-size:10.5px;color:var(--sub);letter-spacing:1px;margin:0 0 6px;text-transform:uppercase}
.hint{font-size:11px;color:var(--sub);line-height:1.45;margin:4px 0 7px}
.row{display:flex;gap:6px;flex-wrap:wrap}
/* 模板库：两列紧凑网格，内置模板 + 我的色调，不占满整屏 */
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.tpl-grid .btn{width:100%;text-align:left;font-size:11px;padding:8px 9px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.frame-preview{display:block;margin:8px auto 0;max-width:100%;height:auto;border-radius:8px;
  border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35)}
@media(max-width:520px){ .tpl-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--w07);
  font-size:12px;color:var(--txt);border:1px solid transparent;white-space:nowrap}
.chip.active{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;
  margin-right:6px;vertical-align:1px;background:var(--d,#fff)}
.btn{padding:7px 10px;border-radius:9px;background:var(--w08);font-size:12px}
.btn:active{background:var(--w18)}
.btn.accent{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.sm{padding:6px 9px;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.fold summary{font-size:11px;color:var(--sub);cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary::before{content:"›";display:inline-block;margin-right:6px;transition:transform .2s}
.fold[open] summary::before{transform:rotate(90deg)}
.fold[open] summary{margin-bottom:6px;color:var(--txt)}

/* 滤镜层 / 作用域 */
.chip-line{display:flex;align-items:center;gap:5px;margin-bottom:5px;
  flex-wrap:wrap;min-width:0}
.chip-line>span{font-size:10px;color:var(--sub);flex:0 0 auto;white-space:nowrap}
.chip-line .chips{flex:1;min-width:0;padding-bottom:0}
.chip-line .chip{padding:5px 9px;font-size:11px}
/* 盘模式说明：默认不占画面，点 ⓘ 才展开一张轻量卡片 */
.pm-label{display:inline-flex;align-items:center;gap:5px}
.pm-info-btn{width:15px;height:15px;flex:0 0 15px;padding:0;border-radius:50%;
  border:1px solid var(--w28);background:transparent;color:var(--sub);
  font-size:9px;line-height:13px;text-align:center;cursor:pointer;opacity:.75;
  transition:border-color .18s,color .18s,opacity .18s}
.pm-info-btn:hover,.pm-info-btn.on{opacity:1;border-color:var(--accent);color:var(--accent)}
/* 移动端通用规则会隐藏 .chip-line>span 以省空间，但盘模式的 ⓘ 必须留着可点 */
.chip-line>span.pm-label{display:inline-flex}
.pm-info-card{margin:2px 0 7px;padding:9px 11px;border-radius:10px;
  border:1px solid rgba(var(--accent-rgb),.22);background:rgba(var(--accent-rgb),.055);
  font-size:10.5px;line-height:1.65;color:var(--sub);animation:pmIn .22s ease both}
.pm-info-card b{display:block;margin-bottom:3px;font-size:11px;color:var(--accent);font-weight:700}
.fitem img,.fcat-card img,.frecent img{background:#2a2a30;color:transparent;font-size:0}
.fitem img::before,.fcat-card img::before{content:""}
.font-preview{margin:2px 0 8px;padding:11px 12px;border-radius:10px;text-align:center;
  font-size:21px;line-height:1.3;color:var(--txt);letter-spacing:normal;
  border:1px solid var(--w11);background:var(--w028);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-line .chips .chip{font-size:11.5px}
/* 20 种盘模式：默认整体折叠成一行，展开才按 5 组显示，收起时连 DOM 都不建 */
.pm-fold{margin:0 0 7px;border:1px solid var(--w11);border-radius:10px;
  background:var(--w022);overflow:hidden}
.pm-fold>summary{list-style:none;display:flex;align-items:center;gap:7px;
  padding:7px 9px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.pm-fold>summary::-webkit-details-marker{display:none}
.pm-fold>summary:hover{background:var(--w035)}
.pm-sum-t{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.pm-sum-t b{font-size:10.5px;color:var(--sub);font-weight:500}
.pm-sum-t em{font-style:normal;font-size:12px;color:var(--txt);font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-sum-n{font-size:9.5px;color:var(--accent);white-space:nowrap;
  padding:2px 6px;border-radius:6px;background:rgba(var(--accent-rgb),.11)}
.pm-caret{font-size:10px;color:var(--sub);transition:transform .2s ease;width:9px;text-align:center}
.pm-fold[open] .pm-caret{transform:rotate(180deg)}
.pm-body{padding:2px 9px 9px;border-top:1px solid var(--w08)}
.pm-grp{margin-top:8px}
.pm-grp>h5{margin:0 0 5px;font-size:9.5px;color:var(--sub);font-weight:600;letter-spacing:.6px;
  display:flex;align-items:center;gap:6px}
.pm-grp>h5::after{content:"";flex:1;height:1px;background:var(--w07)}
.pm-grp .chips{display:flex;flex-wrap:wrap;gap:5px}
.pm-grp .chip{flex:1 1 calc(25% - 4px);min-width:60px;padding:6px 4px;
  font-size:10.5px;text-align:center;border-radius:8px}
.pm-grp .chip.active{background:rgba(var(--accent-rgb),.19);border-color:rgba(var(--accent-rgb),.5);color:var(--accent)}
.pm-foot{margin-top:9px;font-size:9.5px;color:var(--sub);line-height:1.6}
@media(prefers-reduced-motion:reduce){.pm-caret{transition:none}}
@media(max-width:520px){.pm-grp .chip{flex:1 1 calc(25% - 4px);min-width:0;font-size:10px}}


@keyframes pmIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pm-info-card{animation:none}}

.scope-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.scope-tag{font-size:10px;color:var(--sub);padding:3px 7px;border-radius:6px;
  background:var(--w06);border:1px solid var(--line)}
.scope-tag b{color:var(--accent);font-weight:600}
.layer{display:flex;flex-direction:column;gap:6px;padding:8px 9px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.layer.on{border-color:rgba(var(--accent-rgb),.45)}
.layer-top,.layer-bot{display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;min-width:0;max-width:100%}
.layer .lm{flex:1;min-width:0}
.layer .ln{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .ls{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer input[type=range]{flex:1;min-width:36px;width:auto}
.layer .btn{flex:0 0 auto}
.layer input[type=range]::-webkit-slider-runnable-track{height:3px}
.layer input[type=range]::-webkit-slider-thumb{width:15px;height:15px;margin-top:-6px}
.fgroup{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.fgroup::-webkit-scrollbar{display:none}
.fsearch{display:flex;align-items:center;gap:6px;margin-bottom:7px;
  flex-wrap:wrap;min-width:0;max-width:100%}
.fsearch>.btn{flex:0 1 auto;min-width:0}
.fsearch input{flex:1;min-width:0;height:30px;padding:0 10px;font-size:12px;
  background:var(--w07);border:1px solid var(--line);border-radius:9px;outline:none}
.fsearch input:focus{border-color:rgba(var(--accent-rgb),.55)}
.fsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.fitem{position:relative}
.fitem i.fstar,.fitem i.fdel{position:absolute;font-style:normal;font-size:13px;line-height:1;
  width:19px;height:19px;border-radius:6px;display:grid;place-items:center;z-index:2;
  background:rgba(0,0,0,.55);color:#fff;top:3px}
.fitem i.fstar{right:3px}
.fitem i.fstar.on{color:var(--accent)}
.fitem i.fdel{left:3px;font-size:11px}
.fitem i.fstar:active,.fitem i.fdel:active{background:var(--w28)}

/* 色轮 */
.wheels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wheel-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:7px 5px 8px;text-align:center}
.wheel-card .wt{font-size:10.5px;color:var(--sub);margin-bottom:5px}
.wheel-card canvas{width:100%;max-width:96px;aspect-ratio:1;border-radius:50%;touch-action:none;display:block;margin:0 auto}
.wheel-card input[type=range]{height:18px;margin-top:5px}
.wheel-card input[type=range]::-webkit-slider-runnable-track{height:3px}
.wheel-card input[type=range]::-webkit-slider-thumb{width:15px;height:15px;margin-top:-6px}
.wheel-val{font-size:9.5px;color:var(--accent);margin-top:2px;font-variant-numeric:tabular-nums}

/* 蒙版卡片 */
.mask-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:9px 10px;margin-bottom:8px}
.mask-card.off{opacity:.55}
.mask-h{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.mask-h strong{font-size:12px;flex:1}
.mask-h .btn{padding:5px 8px;font-size:11px}
.mini-sld{margin:0 0 5px}
.mini-sld .sld-h{font-size:11px}
.mini-sld input[type=range]{height:18px}
.mini-sld input[type=range]::-webkit-slider-runnable-track{height:3px}
.mini-sld input[type=range]::-webkit-slider-thumb{width:15px;height:15px;margin-top:-6px}
.lut-badge{font-size:10.5px;color:var(--accent)}
.numrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.numcell{font-size:10.5px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.numcell input{width:100%;height:28px;background:var(--w08);border:1px solid var(--line);
  border-radius:8px;color:var(--txt);text-align:center;font-size:12px;outline:none;
  font-variant-numeric:tabular-nums}
.numcell input:focus{border-color:rgba(var(--accent-rgb),.6)}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.matrix label{font-size:10px;color:var(--sub);text-align:center}
.matrix input{width:100%;height:22px;background:var(--w08);
  border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:11px;text-align:center;padding:1px 2px}

/* 滑杆 */
.sld{margin:0 0 6px}
.sld-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:2px}
.sld-h span{color:var(--txt)}
.sld-h b{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600}
.sld-h{user-select:none;-webkit-user-select:none}
/* 手指从滑杆上上下滑时，把垂直手势交给页面滚动，只有横向拖动才改数值 */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;
  touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0 var(--fill,50%),var(--w16) var(--fill,50%) 100%)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--w16)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:#fff;margin-top:-7.5px;box-shadow:0 1px 5px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border:0;border-radius:50%;background:#fff}
.sld.big input[type=range]{height:30px}
.sld.big input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-10px}

/* 调色盘 pad：盘 + 侧栏横向排布，省竖向空间 */
.pad-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pad-col{flex:0 0 auto}
.pad-col .padwrap{margin:0}
.pad-side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px;padding-top:2px}
.pad-side .readout{flex-wrap:wrap;justify-content:flex-start;gap:5px 12px;margin:0;font-size:10.5px}
.pad-side .sld{margin:0}
.btn-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.btn-grid .btn{padding:6px 3px;font-size:11px;text-align:center;white-space:nowrap;min-width:0}
/* 按钮内两套标签：宽侧栏用全称，窄侧栏自动换短名，绝不靠截断文字 */
.bt-short{display:none}
@media(max-width:520px){.bt-full{display:none}.bt-short{display:inline}}

/* 桌面端把右侧栏拖窄时，盘 168px 固定宽会把「🎯 取色」挤出面板。
   实测 Nova 330px / 原版 250px 时 btn-grid 的 min-content 撑出 30~120px。
   检测到溢出才切成纵向：盘居中放大、四个按钮全宽四列短标签。 */
.panel[data-fit="slim"] .pad-row{flex-direction:column;align-items:stretch;gap:10px}
.panel[data-fit="slim"] .pad-col{width:100%;flex:1 1 100%}
.panel[data-fit="slim"] .padwrap{justify-content:center}
.panel[data-fit="slim"] .pad{width:min(190px,100%)}
.panel[data-fit="slim"] .pad-side{width:100%;flex:1 1 100%;gap:8px}
.panel[data-fit="slim"] .pad-side .readout{justify-content:center}
.panel[data-fit="slim"] .btn-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.panel[data-fit="slim"] .btn-grid .btn{padding:6px 1px!important;font-size:9.5px;letter-spacing:0}
.panel[data-fit="slim"] .bt-full{display:none}
.panel[data-fit="slim"] .bt-short{display:inline}
/* 窄侧栏通用兜底：不只修调色盘那一处。滤镜页的搜索行 / 图层行、
   语义引擎的 chip 行、区域工作台的按钮组，在 250~330px 下同样会撑出去。
   只在 data-fit=slim（真的检测到溢出）时生效，宽侧栏完全不受影响。 */
.panel[data-fit="slim"] .row,
.panel[data-fit="slim"] .fsearch,
.panel[data-fit="slim"] .layer-bot,
.panel[data-fit="slim"] .layer-top,
.panel[data-fit="slim"] .chip-line,
.panel[data-fit="slim"] .zone-chips,
.panel[data-fit="slim"] .pm-fold>summary,
.panel[data-fit="slim"] .sec-h{flex-wrap:wrap}
.panel[data-fit="slim"] .fsearch>input{flex:1 1 100%;width:100%;min-width:0}
.panel[data-fit="slim"] .fsearch>.btn{flex:1 1 auto;min-width:0;font-size:10.5px}
.panel[data-fit="slim"] .layer-bot>input[type=range]{flex:1 1 100%;width:100%;min-width:0}
.panel[data-fit="slim"] .layer-bot>.btn{flex:1 1 0;min-width:0;font-size:10px;padding:6px 2px}
.panel[data-fit="slim"] .layer-top>.btn{flex:0 0 auto}
.panel[data-fit="slim"] .sec,
.panel[data-fit="slim"] .layer,
.panel[data-fit="slim"] .fitem,
.panel[data-fit="slim"] .fcat-card,
.panel[data-fit="slim"] .pm-fold{min-width:0;max-width:100%}
.panel[data-fit="slim"] .fgrid,
.panel[data-fit="slim"] .fcat-grid,
.panel[data-fit="slim"] .tpl-grid{grid-template-columns:repeat(auto-fit,minmax(68px,1fr))}
.panel[data-fit="slim"] .pm-sum-n{display:none}
.panel[data-fit="slim"] .padwrap{width:100%}
.padwrap{display:flex;justify-content:center;margin:2px 0 8px}
.pad{position:relative;width:min(190px,42vw);aspect-ratio:1;border-radius:16px;touch-action:none;
  overflow:hidden;border:1px solid var(--w18);
  background:
    linear-gradient(to bottom,var(--w30),rgba(255,255,255,0) 45%,rgba(0,0,0,.42)),
    var(--pad-base,linear-gradient(to right,#6e6e72 0%,#8a8a8e 18%,#c98f64 40%,#e06a52 62%,#f1b03c 82%,#ffd60a 100%));
  box-shadow:inset 0 0 40px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.4)}
.pad.photo-tone{transition:background .45s ease}
.pad::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,transparent 49.7%,var(--w34) 49.7%,var(--w34) 50.3%,transparent 50.3%),
             linear-gradient(to bottom,transparent 49.7%,var(--w34) 49.7%,var(--w34) 50.3%,transparent 50.3%)}
.pad .plabel{position:absolute;font-size:9px;color:var(--w72);pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pad .lt{top:8px;left:10px}.pad .rt{top:8px;right:10px}
.pad .lb{bottom:8px;left:10px}.pad .rb{bottom:8px;right:10px}
.pad .ax{display:none}
.axis-tip{text-align:center;font-size:10px;color:var(--sub);margin:0 0 4px;letter-spacing:.3px}
.knob{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;
  border:2px solid var(--w9);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 10px rgba(0,0,0,.6);
  transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.readout{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--sub);
  margin:-2px 0 8px;font-variant-numeric:tabular-nums}
.readout b{color:var(--txt);font-weight:600}

/* 滤镜 */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fitem{border-radius:10px;overflow:hidden;background:var(--panel2);border:2px solid transparent;
  position:relative;padding:0}
.fitem img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#2a2a2e}
.fitem span{display:block;font-size:10px;text-align:center;padding:4px 1px 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.fitem.active{border-color:var(--accent)}
.fitem.active span{color:var(--accent);font-weight:600}

/* 曲线 */
#curveCanvas{width:100%;max-width:320px;height:170px;display:block;margin:0 auto;
  background:#101013;border-radius:12px;border:1px solid var(--line);touch-action:none}
input[type=color]{-webkit-appearance:none;appearance:none;width:44px;height:30px;padding:0;
  border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.colorrow{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.colorrow span{flex:1}

/* 桌面分栏 */
@media(min-width:900px){
  #app{flex-direction:row}
  .topbar{position:absolute;top:0;left:0;right:0;background:var(--topbar-grad);border:0}
  .stage{height:100dvh;flex:1}
  .dock{flex:0 0 330px;height:100dvh;border-top:0;border-left:1px solid var(--line);padding-top:54px}
  .dock-grip{cursor:ew-resize;flex:0 0 18px}
  .tools{padding-top:6px;grid-template-columns:repeat(5,minmax(0,1fr))}
  .panel{padding-bottom:30px}
  .tb-side{min-width:0}
  .fgrid{grid-template-columns:repeat(4,1fr)}
  #hist{top:66px}
  .dock{position:relative}
  /* 桌面 Nova 顶栏的悬浮胶囊规则在后面 Nova 段里（带 !important），
     这里不再重复。 */
  /* 桌面：进度条靠画布顶端，不与任何底部工具 / 右侧编辑栏重叠 */
  .live-bar{top:62px;left:12px;transform:none;width:min(340px,calc(100% - 24px))}
  #app.more-open .live-bar{transform:translateY(-6px)}
}
@media(max-width:520px){
  .dock{flex:0 0 36dvh}
  .pad{width:min(140px,38vw)}
  .pad-side{gap:6px}
  .chip-line .chip{padding:4px 8px;font-size:10.5px}
  .hint{font-size:10.5px;line-height:1.4}
  #hist{width:104px;height:44px}
  .zoomctl button.wide{padding:0 6px}
}
.toast{position:fixed;left:50%;bottom:52%;transform:translateX(-50%);z-index:30;
  background:var(--overlay);border:1px solid var(--line);padding:10px 16px;border-radius:12px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}

/* ============================================================
   精炼界面：更少线条、更统一的层级、可折叠的进阶选项
   ============================================================ */
body{letter-spacing:.15px}
.topbar{padding:12px 16px 10px;gap:10px;background:var(--topbar-bg);
  border-bottom:1px solid var(--w045)}
.tb-side{gap:5px}
.iconbtn{width:32px;height:32px;border-radius:11px;background:var(--w05);
  border:1px solid var(--w04);font-size:15px;color:var(--body)}
.iconbtn:hover{background:var(--w12);color:var(--txt)}
.iconbtn:active{background:var(--w18)}
.tb-main{font-size:14px;font-weight:650;letter-spacing:1.6px}
.tb-sub{font-size:10.5px;color:var(--sub);letter-spacing:.2px}
.tbtn{font-size:12px;padding:8px 13px;border-radius:11px;background:var(--w065);
  border:1px solid var(--w045);font-weight:500;white-space:nowrap}
.tbtn:hover{background:var(--w13)}
.tbtn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700}

.stage{background:var(--stage-bg)}
#gl{filter:none}
#hist{width:112px;height:46px;border-radius:12px;opacity:.6;
  border:1px solid var(--w07);transition:opacity .2s}
#hist:hover{opacity:.95}
.zoomctl,.cmp{background:var(--overlay);border:1px solid var(--w07);
  border-radius:13px;font-size:11.5px;letter-spacing:.2px}
.zoomctl{padding:3px;gap:1px}
.zoomctl button{width:28px;height:26px;border-radius:9px;font-size:14px}
.zoomctl span{min-width:38px;font-size:10.5px}
.cmp{padding:9px 12px}
.cmp.on{background:var(--accent);color:var(--on-accent);font-weight:700}
#splitHandle{background:var(--accent);border:2px solid #fff;width:28px;height:28px;margin:-14px 0 0 -14px}
#splitHandle::after{left:12px;background:rgba(var(--accent-rgb),.8)}

/* 导入引导：明确告诉用户怎么换成自己的照片 */
.import-card{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);z-index:5;
  width:min(288px,80vw);padding:20px 18px 18px;text-align:center;border-radius:22px;
  background:rgba(20,20,24,.84);backdrop-filter:blur(14px);
  border:1px solid var(--w13);box-shadow:0 22px 60px rgba(0,0,0,.6);
  cursor:pointer;color:var(--txt);transition:transform .2s,border-color .2s}
.import-card:hover{transform:translate(-50%,-52%);border-color:rgba(var(--accent-rgb),.5)}
.import-card.hidden{display:none}
.ic-close{position:absolute;right:10px;top:9px;width:24px;height:24px;border-radius:8px;
  color:var(--sub);font-size:15px;line-height:24px}
.ic-close:hover{background:var(--w1);color:var(--txt)}
.ic-icon{width:46px;height:46px;margin:2px auto 12px;border-radius:15px;display:grid;place-items:center;
  font-size:21px;background:rgba(var(--accent-rgb),.13);border:1px solid rgba(var(--accent-rgb),.26);color:var(--accent)}
.import-card b{display:block;font-size:14px;font-weight:650;margin-bottom:6px;letter-spacing:.3px}
.import-card small{display:block;color:var(--sub);font-size:11px;line-height:1.65}
.ic-cta{display:inline-block;margin-top:14px;padding:9px 20px;border-radius:11px;
  background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;letter-spacing:.3px}
.stage.dragover::after{content:"松手即可载入照片";position:absolute;inset:10px;z-index:8;
  display:grid;place-items:center;border:2px dashed var(--accent);border-radius:22px;
  background:rgba(var(--accent-rgb),.08);color:var(--accent);font-size:14px;font-weight:600;
  letter-spacing:1px;pointer-events:none}

/* 工具导航：只留 4 个常用入口 + 更多 */
.dock{position:relative;background:var(--panel)}
.dock-grip span{background:var(--w22);width:32px;height:3px}
.tools{padding:9px 12px;gap:5px;grid-template-columns:repeat(5,minmax(0,1fr));
  border-bottom:1px solid var(--w05)}
.tool{gap:5px;padding:7px 2px 9px;border-radius:13px;
  font-size:10.5px;letter-spacing:.2px}
.tool i{opacity:.8}
.tool:hover{background:var(--w05)}
.tool.active{background:rgba(var(--accent-rgb),.11);color:var(--accent)}

/* 更多工具浮层 */
.more-menu{position:absolute;left:10px;right:10px;z-index:20;display:none;
  max-height:min(64dvh,420px);overflow-y:auto;
  background:var(--overlay);backdrop-filter:blur(28px);
  border:1px solid var(--w1);border-radius:18px;padding:11px;
  box-shadow:0 20px 60px rgba(0,0,0,.65)}
.more-menu.show{display:block}
.more-title{font-size:10.5px;color:var(--sub);letter-spacing:1px;margin:2px 4px 10px}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.more-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:14px 4px;border-radius:14px;background:var(--w045);
  border:1px solid transparent;font-size:11.5px;color:var(--txt)}
.more-item i{font-style:normal;font-size:19px;color:var(--accent);opacity:.9}
.more-item:hover{background:var(--w1)}
.more-item.active{background:rgba(var(--accent-rgb),.13);border-color:rgba(var(--accent-rgb),.35)}
.more-tip{font-size:10.5px;color:var(--sub);margin:10px 4px 1px;line-height:1.5}

/* 面板：标题条 + 折叠进阶选项 + 说明按需展开 */
.panel{padding:12px 16px 26px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px}
.panel-head h2{margin:0;font-size:17px;font-weight:650;letter-spacing:.4px;line-height:1.2}
.panel-head .ph-sub{font-size:10.5px;color:var(--sub);margin-top:4px;line-height:1.35}
.help-btn{flex:0 0 auto;width:29px;height:29px;border-radius:50%;font-size:12px;
  background:var(--w04);border:1px solid var(--line);color:var(--sub)}
.help-btn.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1)}
#panel .hint.auto-hide{display:none}
#panel.show-help .hint.auto-hide{display:block}
.sec{margin-bottom:14px}
.sec-h{font-size:10px;color:var(--sub);letter-spacing:1.4px;font-weight:600;margin:0 0 8px}
.hint{font-size:10.5px;color:var(--sub);line-height:1.6;margin:5px 0 9px;
  padding-left:9px;border-left:2px solid rgba(var(--accent-rgb),.28)}
.chip{padding:6px 12px;border-radius:10px;background:var(--w055);
  border:1px solid var(--w045);font-size:11.5px}
.chip.active{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn{padding:8px 12px;border-radius:11px;background:var(--w065);
  border:1px solid var(--w04);font-size:11.5px}
.btn:hover{background:var(--w13)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sld{margin:0 0 9px}
.sld-h{font-size:11.5px;margin-bottom:3px}
.sld-h b{color:var(--accent);font-size:11px;font-weight:650;opacity:.9}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background:linear-gradient(90deg,var(--accent) 0 var(--fill,50%),var(--w11) var(--fill,50%) 100%)}
input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-6.5px;

.fitem{border-radius:12px;border:2px solid transparent}

.pad-axis{position:absolute;inset:0;pointer-events:none;z-index:2;
  display:flex;flex-direction:column;justify-content:space-between;padding:30px 8px 26px}
.pad-axis span{display:block;text-align:center;font-size:8.5px;letter-spacing:1.1px;

.sem-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

  margin:7px 0;image-rendering:auto;background:#111}

.sem-stat{font-size:10px;color:var(--sub);line-height:1.7;font-variant-numeric:tabular-nums}

.sem-badge{display:flex;align-items:center;gap:6px;width:100%;margin-top:7px;padding:6px 8px;
  border-radius:8px;border:1px solid rgba(var(--accent-rgb),.30);background:rgba(var(--accent-rgb),.08);
  color:var(--sub);font-size:9.5px;text-align:left;white-space:nowrap;overflow:hidden}

.sem-badge:hover{border-color:var(--accent);color:var(--txt)}

  .sem-presets button{font-size:9.5px;padding:8px 2px} }

.plate-picker{display:flex;align-items:center;gap:7px}
.plate-picker .plate-scope{flex:0 0 96px;max-width:96px}

.el-head b,.fx-h b{flex:1;min-width:0;font-size:12px;font-weight:600;letter-spacing:.2px}
.sticker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:9px}
.sticker-chip{aspect-ratio:1;border-radius:10px;background:var(--w045);
  border:1px solid var(--line);font-size:17px;line-height:1}
.sticker-chip:hover{background:var(--w12)}
.sticker-chip.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.14)}
.fx-card{background:var(--w035);border:1px solid var(--line);
  border-radius:13px;padding:9px 11px;margin-bottom:9px}
.fx-card.on{border-color:rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.05)}
.fx-card .sld{margin-bottom:7px}
.fx-card .btn{margin-top:3px}
.el-row{display:flex;align-items:center;gap:5px;padding:6px 8px;margin-bottom:5px;
  border-radius:10px;background:var(--w035);border:1px solid transparent}
.el-row.on{border-color:rgba(var(--accent-rgb),.4)}
.el-row.off{opacity:.5}
.el-nm{flex:1;min-width:0;font-size:11px;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el-row .btn{padding:4px 7px;font-size:10.5px}
@media(max-width:520px){
  .add-grid{gap:6px}
  .add-btn{padding:9px 2px 7px;font-size:10px}
  .add-btn i{font-size:17px}
  .sticker-grid{grid-template-columns:repeat(8,1fr);gap:4px}
  .sticker-chip{font-size:15px}
  .fx-card{padding:8px 10px}
  .el-row .btn{padding:4px 6px}
}

@media(max-width:520px) and (max-height:720px){
  .panel{padding:8px 13px 14px}
  .panel-head{margin:0 0 7px}
  .sec{margin-bottom:9px}
  .pad-side{gap:6px}
  .foldbox>summary{padding:8px 12px}
}

/* ============================================================
   统一图标 · 笔刷设置 · 轻量动画
   ============================================================ */
.ic{display:block;flex:0 0 auto;stroke:currentColor}
.tool i,.more-item i,.add-btn i{display:inline-flex;align-items:center;justify-content:center;
  font-style:normal;line-height:1}
.tool i .ic,.more-item i .ic{width:19px;height:19px}
.add-btn i .ic{width:21px;height:21px}
.iconbtn{display:grid;place-items:center}
.fx-h b{display:flex;align-items:center;gap:6px}
.fx-h b .ic{width:15px;height:15px}
.fx-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin:13px 2px 7px;font-size:11.5px;color:var(--txt)}
.fx-section-head b{font-weight:600;letter-spacing:.3px}
.fx-section-head small{font-size:10px;color:var(--sub)}
#zVal{cursor:pointer;user-select:none}
#zVal:hover{color:var(--accent)}

/* 克制的动效：只做淡入 / 轻微位移，不改变布局，也不拖慢交互 */
@keyframes panelFade{from{opacity:.42}to{opacity:1}}
@keyframes floatIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes softPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* 切页淡入只作用在面板本身：分区各自做动画会生成层叠上下文，
   反而让调色盘的浮层被后面的分区盖住 */
#panel.anim-in{animation:panelFade .26s ease-out both}
.more-menu.show{animation:floatIn .2s ease-out both}
/* 卡片靠 transform 居中，动画只碰透明度，不能覆盖定位 */
@keyframes cardFade{from{opacity:0}to{opacity:1}}
.import-card{animation:cardFade .38s ease-out}
.toast{transition:opacity .24s ease,transform .24s ease;transform:translateX(-50%) translateY(8px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.tool,.add-btn,.fitem,.fcat-card,.sticker-chip,.chip,.btn,.more-item{
  transition:background-color .18s ease,border-color .18s ease,transform .18s ease,color .18s ease}
.add-btn:hover{transform:translateY(-2px)}
.fitem:hover,.fcat-card:hover{transform:translateY(-2px)}
.sticker-chip:hover{transform:scale(1.08)}
.tool.active i{animation:softPop .28s ease-out both}
.layer,.fx-card,.el-row,.fcat-card,.fitem{animation:softPop .2s ease-out}
/* 刷新式重建：本次不再重播任何动画，避免拖动/点选时整页闪动 */
#panel.no-anim,#panel.no-anim *{animation:none!important}

/* ---------- 顶栏导出菜单（fixed，位置由按钮实时计算，不影响顶栏自身布局） ---------- */
.export-menu{position:fixed;right:12px;top:56px;z-index:20;display:none;
  width:238px;max-height:min(72vh,430px);overflow-y:auto;padding:7px;border-radius:14px;background:rgba(22,22,26,.97);
  backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.6);
  animation:floatIn .18s ease-out both}
.export-menu.show{display:block}
.em-title{padding:5px 9px 7px;font-size:10.5px;color:var(--sub);letter-spacing:.4px}
.em-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px;border-radius:10px;
  text-align:left;color:var(--txt)}
.em-item:hover{background:var(--w07)}
.em-item:active{transform:scale(.985)}
.em-item>i{flex:0 0 22px;height:22px;border-radius:7px;background:rgba(var(--accent-rgb),.14);
  border:1px solid rgba(var(--accent-rgb),.3);position:relative}
.em-item>i:empty::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:8px;
  border:1.5px solid var(--accent);border-radius:2px}
.em-item>i .ic{color:var(--accent)}
.em-item>span{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.em-item b{font-size:12px;font-weight:600}
.em-item small{font-size:10px;color:var(--sub)}
.em-item>em{flex:0 0 auto;font-style:normal;font-size:9.5px;color:var(--sub);
  border:1px solid var(--line);border-radius:5px;padding:2px 5px}
.em-item.disabled{opacity:.4;pointer-events:none}

/* ---------- 全局搜索（命令面板） ---------- */
.cmd-mask{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.55);
  backdrop-filter:blur(3px);align-items:flex-start;justify-content:center;padding:12vh 14px 14px}
.cmd-mask.show{display:flex;animation:cmdMaskIn .16s ease-out}
@keyframes cmdMaskIn{from{opacity:0}to{opacity:1}}
.cmd-panel{width:min(520px,100%);max-height:72dvh;display:flex;flex-direction:column;
  border-radius:18px;background:#16161a;border:1px solid var(--w1);
  box-shadow:0 24px 70px rgba(0,0,0,.7);overflow:hidden;animation:floatIn .2s ease-out}
.cmd-input{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid var(--line)}
.cmd-ic{font-size:20px;color:var(--accent);line-height:1}
.cmd-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-size:14px;color:var(--txt)}
.cmd-input input::placeholder{color:var(--sub)}
.cmd-input input::-webkit-search-cancel-button{-webkit-appearance:none}
.cmd-input button{width:26px;height:26px;border-radius:8px;color:var(--sub);
  background:var(--w07);font-size:12px}
.cmd-results{flex:1;overflow-y:auto;padding:6px;overscroll-behavior:contain}
.cmd-group{padding:8px 9px 4px;font-size:10px;color:var(--sub);letter-spacing:.4px}
.cmd-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;
  border-radius:10px;text-align:left;color:var(--txt)}
.cmd-item.sel{background:rgba(var(--accent-rgb),.14)}
.cmd-item .ci{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:12px;background:var(--w06);color:var(--accent)}
.cmd-item .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cmd-item .ct b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-item .ct small{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-item .ck{flex:0 0 auto;font-size:9.5px;color:var(--sub);border:1px solid var(--line);
  border-radius:5px;padding:2px 5px}
.cmd-empty{padding:26px 12px;text-align:center;color:var(--sub);font-size:12px}
.cmd-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;
  border-top:1px solid var(--line);font-size:10px;color:var(--sub)}
@media(max-width:520px){
  .cmd-mask{padding:9vh 10px 10px}
  .cmd-panel{max-height:76dvh;border-radius:15px}
  .export-menu{right:auto;width:min(250px,calc(100vw - 16px))}
  .cmd-foot span:first-child{font-size:9px}
}
/* 搜索定位到某个滑杆时高亮一下 */
@keyframes paramFlash{0%{background:rgba(var(--accent-rgb),.22)}100%{background:transparent}}
.sld.flash{animation:paramFlash 1.4s ease-out;border-radius:8px}

/* ---------- iOS 实况照片 ---------- */
.live-badge{position:absolute;left:10px;top:10px;z-index:6;display:none;align-items:center;gap:6px;
  padding:6px 11px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:1px;
  color:var(--on-accent);background:var(--accent);box-shadow:0 3px 14px rgba(0,0,0,.45)}
.live-badge.on{display:flex}
.live-badge i{width:7px;height:7px;border-radius:50%;background:#151517;display:block}
.live-badge.playing i{animation:livePulse 1.1s ease-in-out infinite}
.live-badge.playing{background:#ffd60a}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
.live-bar{position:absolute;left:50%;top:60px;transform:translateX(-50%);z-index:6;
  display:none;align-items:center;gap:8px;width:min(360px,calc(100% - 24px));
  padding:7px 10px;border-radius:14px;background:rgba(16,16,19,.88);
  backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.5);
  transition:opacity .18s,transform .18s}
/* 「更多」工具菜单展开时收起进度条，避免两层浮层互相干扰 */
#app.more-open .live-bar{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-6px)}
.live-bar.on{display:flex}
.live-bar button{flex:0 0 auto;padding:5px 9px;border-radius:9px;font-size:10.5px;
  background:var(--w09);border:1px solid var(--line);color:var(--txt)}
.live-bar button:hover{background:rgba(var(--accent-rgb),.2);color:var(--accent)}
.live-bar input[type=range]{flex:1;min-width:40px;height:18px;touch-action:none}
.live-bar input[type=range]::-webkit-slider-thumb{width:13px;height:13px;margin-top:-5px}
.live-bar span{flex:0 0 auto;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.live-bar.recording{outline:1px solid #ff453a}
@media(max-width:520px){
  .live-badge{left:8px;top:8px;padding:5px 9px;font-size:10px}
  .live-bar{top:42px;bottom:auto;width:calc(100% - 16px);gap:6px;padding:6px 8px}
  .live-bar button{padding:5px 7px;font-size:10px}
  .live-bar span{font-size:9px}
}

/* 模式状态条 / 删除按钮 */
.mode-bar{display:flex;align-items:center;gap:9px;margin:0 0 11px;padding:9px 10px;
  border-radius:12px;background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.38)}
.mode-bar>span{flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;font-size:11px;color:var(--accent)}
.mode-bar>span .ic{width:15px;height:15px}
.mode-bar small{display:block;width:100%;font-size:10px;color:var(--sub);font-weight:400}
.mode-bar .btn{flex:0 0 auto;padding:6px 10px;font-size:11px}
.btn.danger{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.42);color:#ff8a80}
.btn.danger:hover{background:rgba(255,69,58,.26)}
@media(max-width:520px){
  .mode-bar{padding:8px 9px;margin-bottom:9px}
  .mode-bar>span{font-size:10.5px}
  .mode-bar .btn{padding:6px 8px;font-size:10px}
}
/* ============================================================
   简单动画 · 第二组：入场 / 反馈 / 展开 / 选中
   ============================================================ */
@keyframes bootFade{from{opacity:0}to{opacity:1}}
@keyframes bootUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes photoIn{from{opacity:.32;transform:scale(1.012)}to{opacity:1;transform:none}}
@keyframes unfoldIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes selectPop{0%{transform:scale(.965)}60%{transform:scale(1.018)}100%{transform:none}}
@keyframes numPulse{0%{color:var(--accent);transform:scale(1.14)}100%{color:var(--sub);transform:none}}

/* 启动时三个区域轻轻依次浮起 */
body.boot .topbar{animation:bootUp .40s ease-out both}
body.boot #stage{animation:bootFade .52s ease-out .05s both}
body.boot .dock{animation:bootUp .44s ease-out .12s both}

/* 换照片：两个画布同步淡入，不产生错位 */
#stage.photo-in #gl,#stage.photo-in #ov{animation:photoIn .40s ease-out both}

/* 按钮按下去的即时反馈 */
.btn:active,.tool:active,.add-btn:active,.chip:active,.iconbtn:active,
.tbtn:active,.sticker-chip:active,.more-item:active{transform:scale(.94)}
.zoomctl button:active{transform:scale(.88)}

/* 折叠内容展开 */
.foldbox[open]>.fb-body{animation:unfoldIn .24s ease-out both}
.foldbox>summary::after,.fold>summary::after{display:inline-block;transition:transform .2s ease}
.foldbox[open]>summary::after,.fold[open]>summary::after{transform:rotate(180deg)}

/* 选中态短脉冲：给「点到了」一个明确回音 */
.chip.active,.fitem.active,.layer.on,.el-row.on,.fx-card.on{animation:selectPop .26s ease-out}
.mode-bar{animation:floatIn .24s ease-out both}

/* 缩放数值变化时亮一下 */
#zVal.pulse{animation:numPulse .34s ease-out}

/* 提示条带一点弹起，比单纯淡入更活 */
.toast{transform:translateX(-50%) translateY(10px) scale(.94)}
.toast.show{transform:translateX(-50%) translateY(0) scale(1)}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ==========================================================
   Iris 品牌 —— 顶栏标识 / 欢迎卡 / 关于卡 / 收尾质感
   ========================================================== */
/* 不要给 .topbar 设 position:relative：桌面分栏规则让顶栏成为 absolute 悬浮层，
   被 relative 覆盖后它会重新变成 flex 子项、占满左侧一整列，把画布挤到几十像素宽。
   伪元素靠最近的定位祖先（桌面=顶栏自身 / 移动=视口）定位，都贴在页面顶端。 */
.topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none;
  z-index:2;background:linear-gradient(90deg,transparent 8%,rgba(var(--accent-rgb),.42) 50%,transparent 92%)}
.tb-title{display:flex;align-items:center;justify-content:center}
.tb-brand{display:flex;align-items:center;gap:8px;min-width:0}
.tb-mark{flex:0 0 auto;width:27px;height:27px;display:grid;place-items:center;
  filter:drop-shadow(0 0 7px rgba(var(--accent-rgb),.20))}
.tb-mark svg{display:block;width:100%;height:100%}
.tb-txt{min-width:0;text-align:left}
.tb-main{font-size:14.5px;font-weight:680;letter-spacing:.5px;white-space:nowrap;color:var(--txt)}
.tb-main span{color:var(--accent);font-weight:500;letter-spacing:.2px;margin-left:1px}
.tb-sub{font-size:10.5px;color:var(--sub);margin-top:1px;letter-spacing:.1px}
.tb-brand{animation:brandIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes brandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 欢迎卡：从「一个加号」升级为品牌启动页 */
.import-card{padding:22px 20px 18px;border-radius:24px;
  background:linear-gradient(180deg,rgba(28,28,33,.90),rgba(17,17,20,.92));
  border:1px solid var(--w11);
  box-shadow:0 24px 64px rgba(0,0,0,.62),inset 0 1px 0 var(--w06)}
.import-card::before{content:"";position:absolute;left:18%;right:18%;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.55),transparent)}
.import-card:hover{border-color:rgba(var(--accent-rgb),.38)}
.ic-icon.iris{width:58px;height:58px;margin:0 auto 10px;background:none;border:0;
  display:grid;place-items:center;filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.25))}
.ic-icon.iris svg{width:100%;height:100%;display:block}
.ic-kicker{font-size:8.5px;letter-spacing:2px;color:rgba(var(--accent-rgb),.75);
  font-weight:600;margin-bottom:5px}
.import-card b{font-size:17px;font-weight:680;letter-spacing:.6px;margin-bottom:8px}
.import-card b span{color:var(--accent);font-weight:500}
.import-card small{font-size:10.5px;line-height:1.75}
.ic-cta{margin-top:15px;padding:10px 24px;border-radius:12px;letter-spacing:.5px;
  box-shadow:0 6px 20px rgba(var(--accent-rgb),.18)}
.ic-foot{margin-top:12px;font-size:9.5px;color:var(--w34);letter-spacing:.4px}
/* 分栏 / 分组：功能不删，但一次只呈现一组 */
.preset-tabs{display:flex;gap:5px;margin:0 0 12px;padding:3px;border-radius:12px;
  background:var(--w035);border:1px solid var(--line)}
.preset-tabs .chip{flex:1;text-align:center;border-radius:9px;padding:7px 4px}
.more-group-title{font-size:10px;color:var(--sub);letter-spacing:1px;margin:10px 3px 7px}
.more-grid{grid-template-columns:repeat(3,1fr)}
.more-menu .more-grid+.more-group-title{border-top:1px solid var(--line);padding-top:9px}
.lf-depth{image-rendering:auto}
#panel .sec[id^="g-"]{scroll-margin-top:8px}
#panel .sec[id^="g-"] .hint{font-size:11px;line-height:1.75}
#panel input.fsel{background:var(--w06);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:12px;outline:none}
#panel input.fsel:focus{border-color:rgba(var(--accent-rgb),.55)}

/* 选中态只用底色 + 文字色表达，不再画任何下划线 */

/* 关于卡：预设页顶部的品牌收尾 */
.iris-about{display:flex;align-items:center;gap:14px;padding:14px;margin:2px 0 14px;
  border-radius:16px;border:1px solid rgba(var(--accent-rgb),.20);
  background:linear-gradient(120deg,rgba(var(--accent-rgb),.075),var(--w018) 70%);
  animation:floatIn .32s ease-out both}
.ia-logo{flex:0 0 58px;width:58px;height:58px;display:grid;place-items:center;
  filter:drop-shadow(0 0 12px rgba(var(--accent-rgb),.26))}
.ia-logo svg{width:100%;height:100%}
.ia-txt{min-width:0}
.ia-txt b{display:block;font-size:16px;font-weight:680;letter-spacing:.5px}
.ia-txt b span{color:var(--accent);font-weight:500}
.ia-txt em{display:block;font-style:normal;font-size:11px;color:var(--txt);opacity:.8;margin-top:2px}
.ia-txt small{display:block;font-size:10px;color:var(--sub);line-height:1.6;margin-top:4px}
.ia-stats{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px}
.ia-stats span{padding:4px 9px;border-radius:999px;font-size:10px;
  background:var(--w055);border:1px solid var(--w045);color:var(--sub)}
.ia-stats span b{color:var(--accent);font-weight:650}
.ia-actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

/* 分区标题：更细腻的层次，不靠粗边框 */
.panel .sec-h{font-size:10px;letter-spacing:1.6px;color:var(--sub);font-weight:650;
  display:flex;align-items:center;gap:8px}
.panel .sec-h::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--w075),transparent)}
.panel .hint{border-left-color:rgba(var(--accent-rgb),.34)}
.panel .btn{transition:background .18s,border-color .18s,transform .12s}
.panel .btn:active{transform:scale(.975)}
.panel .btn:hover{border-color:rgba(var(--accent-rgb),.28)}

@media(max-width:520px){
  .tb-mark{width:20px;height:20px}
  .tb-brand{gap:5px}
  .tb-main{font-size:12px;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
  .tb-txt{overflow:hidden}
  .tb-sub{display:none}
  /* 手机端保持「底部一条横幅」的轻量引导，不压住画面 */
  .import-card{left:8px;right:8px;top:auto;bottom:50px;width:auto;transform:none;
    display:flex;align-items:center;gap:9px;padding:9px 42px 9px 10px;
    text-align:left;border-radius:14px;
    background:linear-gradient(180deg,rgba(28,28,33,.94),rgba(17,17,20,.96));
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .import-card:hover{transform:none}

/* ============================================================
   技术实现页：长文 + 粘性目录 + 代码 / 流程 / 键值排版
   复用 ab-* 的章节外壳，tech-* 只负责文章内部元素
   ============================================================ */
.tech-hero{display:flex;align-items:center;gap:20px;padding:22px 24px;border-radius:20px;margin-bottom:16px;
  border:1px solid rgba(var(--accent-rgb),.24);
  background:radial-gradient(560px 250px at 6% 0%,rgba(var(--accent-rgb),.13),transparent 74%),
             linear-gradient(120deg,rgba(var(--accent-rgb),.05),var(--w018) 72%)}
.tech-hero-mark{flex:0 0 auto;filter:drop-shadow(0 4px 18px rgba(var(--accent-rgb),.22))}
.tech-hero-t{min-width:0}
.tech-hero h2{margin:8px 0 0;font-size:25px;font-weight:650;letter-spacing:.8px;line-height:1.32}
.tech-hero h2 span{font-weight:400;color:var(--accent);font-size:19px}
.tech-hero p{margin:9px 0 0!important;font-size:12.5px!important;line-height:1.9!important;
  color:var(--body)!important;max-width:660px}
.tech-hero-meta{margin-top:12px;font:10.5px/1.8 ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:.3px;color:var(--sub)}
.tech-doc{grid-template-columns:216px minmax(0,1fr)}
.tech-toc button{font-size:11px;line-height:1.45}
.tech-toc button.on{background:rgba(var(--accent-rgb),.16);color:var(--accent);font-weight:600}
.tech-chapter{padding:18px 20px}
.tech-chapter h3{font-size:15px;letter-spacing:.6px}
.tech-body p{margin:0 0 11px;font-size:12.5px;line-height:2.0;color:var(--body)}
.tech-body p:last-child{margin-bottom:0}
.tech-body b{color:var(--txt);font-weight:600}
.tech-body code{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);
  background:rgba(var(--accent-rgb),.09);padding:1px 5px;border-radius:5px}
.tech-kv{display:grid;gap:8px;margin:12px 0 4px}
.tech-kv>div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:start;
  padding:10px 12px;border-radius:11px;background:var(--w04);
  border:1px solid var(--w05)}
.tech-kv b{font-size:11.5px;color:var(--accent);font-weight:600;line-height:1.7}
.tech-kv span{font-size:11.5px;color:var(--body);line-height:1.85}
.tech-flow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 6px}
.tech-flow span{font-size:10.5px;color:var(--body);padding:6px 9px;border-radius:8px;
  background:rgba(var(--accent-rgb),.09);border:1px solid rgba(var(--accent-rgb),.18);white-space:nowrap}
.tech-flow span+span{position:relative}
ul.tech-list{margin:10px 0 4px;padding:0;list-style:none;display:grid;gap:7px}
ul.tech-list li{position:relative;padding:8px 11px 8px 24px;border-radius:10px;
  background:var(--w035);border:1px solid var(--w05);
  font-size:11.8px;line-height:1.85;color:var(--body)}
ul.tech-list li::before{content:'▸';position:absolute;left:9px;top:8px;color:var(--accent);font-size:11px}
ul.tech-list b{color:var(--txt)}
pre.tech-code{margin:12px 0 6px;padding:13px 15px;border-radius:12px;overflow-x:auto;
  background:rgba(6,6,8,.66);border:1px solid var(--w07);
  border-left:2px solid rgba(var(--accent-rgb),.5);
  font:11px/1.85 ui-monospace,Menlo,Consolas,monospace;color:var(--body);
  white-space:pre;tab-size:2}
.tech-note{margin:13px 0 2px;padding:12px 15px;border-radius:11px;
  background:rgba(var(--accent-rgb),.075);border:1px solid rgba(var(--accent-rgb),.2);
  font-size:11.8px;line-height:1.9;color:var(--body)}
.tech-note b{color:var(--accent)}
.tech-golink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  padding:8px 12px;border-radius:10px;font-size:11.5px;cursor:pointer;
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.3);color:var(--accent)}
.tech-golink:hover{background:rgba(var(--accent-rgb),.2)}
@media(max-width:760px){
  .tech-doc{grid-template-columns:1fr;gap:12px}
  /* 18 章在手机上改成一条横向滚动的目录，不把首屏全占掉 */
  .tech-toc{position:static;max-height:none;display:flex;flex-wrap:nowrap;gap:4px;padding:9px;
    overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .tech-toc .sp-toc-t{width:auto;flex:0 0 auto;align-self:center;margin:0 6px 0 0;color:var(--accent)}
  .tech-toc button{flex:0 0 auto;width:auto;white-space:nowrap;font-size:10.5px}
  .tech-hero{flex-direction:column;align-items:flex-start;gap:12px;padding:17px}
  .tech-hero h2{font-size:21px}
  .tech-hero h2 span{font-size:15px;display:block;margin-top:3px}
  .tech-hero p{font-size:12px!important}
  .tech-chapter{padding:15px 15px}
  .tech-chapter h3{font-size:14px}
  .tech-body p{font-size:12px;line-height:1.92}
  .tech-kv>div{grid-template-columns:1fr;gap:3px;padding:9px 11px}
  .tech-kv b{font-size:11px}
  .tech-flow span{font-size:10px}

@media(prefers-reduced-motion:reduce){.tech-chapter{animation:none}}


/* ============================================================
   自动保存恢复卡 + 新增独立页面通用组件
   ============================================================ */
.as-card{position:fixed;z-index:55;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);width:min(440px,calc(100vw - 28px));
  padding:16px 17px 15px;border-radius:18px;
  background:linear-gradient(150deg,rgba(28,27,30,.98),rgba(17,17,20,.985));
  border:1px solid rgba(var(--accent-rgb),.34);
  box-shadow:0 18px 52px rgba(0,0,0,.58),0 0 0 1px var(--w03) inset;
  animation:asIn .34s cubic-bezier(.2,.9,.3,1) both}
@keyframes asIn{from{opacity:0;transform:translate(-50%,14px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.as-card.hide{display:none}
.as-head{display:flex;align-items:center;gap:11px}
.as-thumb{width:58px;height:58px;flex:0 0 auto;border-radius:11px;object-fit:cover;
  background:var(--w06);border:1px solid var(--w09)}
.as-head-t{min-width:0}
.as-head-t b{display:block;font-size:13.5px;color:var(--txt);letter-spacing:.3px}
.as-head-t small{display:block;margin-top:4px;font-size:10.5px;color:var(--sub);line-height:1.6}
.as-eyebrow{font-size:9px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent);font-weight:700}
.as-note{margin:11px 0 0;font-size:11.5px;line-height:1.8;color:var(--body)}
.as-note b{color:var(--txt)}
.as-actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.as-actions button{flex:1 1 auto;min-width:96px;padding:9px 10px;border-radius:11px;font-size:11.5px;
  background:var(--w07);border:1px solid var(--w08);color:var(--txt)}
.as-actions button:hover{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.as-actions button.primary{background:var(--accent);color:var(--on-accent);font-weight:700;border-color:transparent;flex:1.4 1 auto}
.as-actions button.primary:hover{background:#edc46c;color:var(--on-accent)}
.as-link{display:block;margin-top:10px;text-align:center;font-size:10.5px;color:var(--sub);
  background:none;border:0;width:100%}
.as-link:hover{color:var(--accent)}
@media(max-width:520px){.as-card{bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:14px}
  .as-thumb{width:50px;height:50px}.as-actions button{min-width:0;font-size:11px}}
@media(prefers-reduced-motion:reduce){.as-card{animation:none}}

/* ---- 二级页面通用小组件 ---- */
.sp-section-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:16px 0 8px;font-size:12px;color:var(--accent);letter-spacing:.5px}
.sp-section-t small{color:var(--sub);font-size:10.5px;letter-spacing:0;font-weight:400}
.sp-empty{padding:22px 16px;border-radius:14px;text-align:center;font-size:11.5px;line-height:1.9;
  color:var(--sub);background:var(--w035);border:1px dashed var(--w1)}
.sp-empty b{display:block;color:var(--body);font-size:12.5px;margin-bottom:4px}
.sp-stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:10px 0 14px}
.sp-stat>div{padding:11px 12px;border-radius:12px;background:var(--w04);
  border:1px solid var(--w06)}
.sp-stat b{display:block;font-size:17px;color:var(--accent);font-weight:650;line-height:1.3}
.sp-stat small{display:block;margin-top:3px;font-size:10px;color:var(--sub);line-height:1.5}
.sp-table{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:11.5px}

.sp-table td:first-child{color:var(--txt);white-space:nowrap}
.sp-table td b{color:var(--accent);font-weight:600}
.sp-table tr:last-child td{border-bottom:0}
.sp-table .sp-mono{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
.sp-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;
  background:rgba(var(--accent-rgb),.12);border:1px solid rgba(var(--accent-rgb),.24);color:var(--accent)}
.sp-pill.off{background:var(--w05);border-color:var(--w09);color:var(--sub)}
.sp-rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:11px 13px;border-radius:12px;background:var(--w04);margin-bottom:8px}
.sp-rowline .sp-rl-t{min-width:0}
.sp-rowline b{display:block;font-size:12px;color:var(--txt)}
.sp-rowline small{display:block;margin-top:3px;font-size:10.5px;color:var(--sub);line-height:1.65}
.sp-rowline .sp-btns{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.sp-rowline .sp-btn{padding:7px 11px;font-size:11px}
.sp-gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.sp-gloss>div{padding:12px 13px;border-radius:13px;background:var(--w04);
  border:1px solid var(--w06)}
.sp-gloss b{display:block;font-size:12px;color:var(--accent);margin-bottom:5px}
.sp-gloss small{display:block;font-size:11px;color:var(--body);line-height:1.85}
.sp-gloss em{font-style:normal;color:var(--sub);font-size:10px}
.sp-timeline{position:relative;margin:12px 0 4px;padding-left:20px}
.sp-timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;
  background:rgba(var(--accent-rgb),.3)}
.sp-tl-item{position:relative;margin-bottom:14px;padding:11px 13px;border-radius:12px;
  background:var(--w04);border:1px solid var(--w05)}
.sp-tl-item::before{content:'';position:absolute;left:-19px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.14)}
.sp-tl-item b{display:block;font-size:12px;color:var(--txt);margin-bottom:4px}
.sp-tl-item span{display:block;font-size:10.5px;color:var(--sub);line-height:1.8}
.sp-tl-item .sp-tl-v{color:var(--accent);font:10px ui-monospace,Menlo,monospace;letter-spacing:.5px}
.sp-quiet{font-size:10.5px;color:var(--sub);line-height:1.85;margin:8px 0 0}
.sp-codebox{margin:9px 0 3px;padding:11px 13px;border-radius:11px;background:rgba(6,6,8,.6);
  border:1px solid var(--w07);font:10.5px/1.8 ui-monospace,Menlo,Consolas,monospace;
  color:var(--body);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto}
@media(max-width:760px){
  .sp-table{font-size:11px}.sp-table th,.sp-table td{padding:7px 6px}
  .sp-gloss{grid-template-columns:1fr}.sp-stat{grid-template-columns:repeat(3,1fr);gap:6px}
  .sp-stat>div{padding:9px 8px}.sp-stat b{font-size:15px}
}

.g-sum{font-size:11px;color:var(--sub);line-height:1.6;margin:3px 0 2px}
.g-sum b{color:var(--body)}

/* 浅色主题下把纯黑阴影调柔，避免界面发脏 */
html[data-theme="mist"] .import-card,html[data-theme="paper"] .import-card,
html[data-theme="mist"] .more-menu,html[data-theme="paper"] .more-menu,
html[data-theme="mist"] .tb-menu,html[data-theme="paper"] .tb-menu{
  box-shadow:0 20px 54px rgba(40,48,72,.18)}

html[data-theme="mist"] .fcat-arrow,html[data-theme="paper"] .fcat-arrow{color:rgba(255,255,255,.92)}

/* 面板内部重排不外溢；滤镜平铺 433 张时滚动更稳 */
.panel{contain:layout style}
/* ==================================================================
   NOVA · 全新界面
   与原版 UI 并存，只在 html[data-ui="nova"] 时生效。
   不改任何 DOM 结构、事件、坐标或功能：只重做圆角、层级、留白、
   玻璃质感、卡片化分组与光影。原版 UI 是这个属性的缺省值。
   ================================================================== */
html[data-ui="nova"][data-radius="soft"]{--nova-r:16px}
html[data-ui="nova"][data-radius="standard"]{--nova-r:26px}
html[data-ui="nova"][data-radius="max"]{--nova-r:38px}
html[data-ui="nova"]{--radius:var(--nova-r)}
html[data-motion="off"] *,html[data-motion="off"] *::before,html[data-motion="off"] *::after{
  animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important}

/* 全局：切换外观时一次柔和淡入，不闪不跳 */
html.iris-skin-in #app>*:not(canvas),html.iris-skin-in .subpage{animation:skinIn .22s ease-out both}
@keyframes skinIn{from{opacity:.62}to{opacity:1}}
html[data-ui="nova"] .topbar,html[data-ui="nova"] .dock,html[data-ui="nova"] .subpage,
html[data-ui="nova"] .tb-menu,html[data-ui="nova"] .more-menu,html[data-ui="nova"] .export-menu{
  transition:background .28s ease,border-color .28s ease,box-shadow .28s ease,border-radius .28s ease}

/* ---------- 背景与顶栏：柔光 + 悬浮胶囊 ---------- */
html[data-ui="nova"] #app{
  background:radial-gradient(900px 520px at 18% -8%,rgba(var(--accent-rgb),.10),transparent 72%),
             radial-gradient(760px 460px at 92% 108%,rgba(90,130,200,.09),transparent 70%),var(--bg)}
html[data-ui="nova"] .topbar{
  background:linear-gradient(115deg,var(--overlay),rgba(var(--accent-rgb),.07) 58%,var(--overlay))!important;
  border:1px solid var(--line)!important;
  border-radius:calc(var(--nova-r) * 1);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 1px 0 var(--w10);
  padding:11px 16px 10px!important}
html[data-ui="nova"] .topbar::before{
  /* 原版是 left:0;right:0 的全宽直角金线，胶囊化后它会从圆角外横穿出去，
     看起来就像顶栏背后还留着一层直角矩形。收进圆角内侧并做成圆头短线。 */
  left:calc(var(--nova-r) * 1.2);right:calc(var(--nova-r) * 1.2);top:0;height:1.5px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.75) 50%,transparent)}
html[data-ui="nova"] .iconbtn{border-radius:calc(var(--nova-r)*.55)!important;
  background:var(--w06);border:1px solid var(--w08);transition:transform .18s,background .18s}
html[data-ui="nova"] .iconbtn:hover{background:rgba(var(--accent-rgb),.16);transform:translateY(-1px)}
html[data-ui="nova"] .tbtn{border-radius:999px!important;padding:9px 16px!important;
  border:1px solid var(--w09)!important;background:var(--w055)!important;
  transition:transform .18s,box-shadow .18s,background .18s}
html[data-ui="nova"] .tbtn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.22)}
html[data-ui="nova"] .tbtn.primary{
  background:var(--accent)!important;color:var(--on-accent)!important;
  border-color:transparent!important;box-shadow:0 6px 20px rgba(var(--accent-rgb),.26)}
html[data-ui="nova"] .tb-mark{filter:drop-shadow(0 0 10px rgba(var(--accent-rgb),.42))}
html[data-ui="nova"] .tb-main{letter-spacing:1.2px}

/* ---------- 画布：极淡的柔光晕，控件全部胶囊化 ---------- */
html[data-ui="nova"] .stage{
  background:radial-gradient(700px 420px at 50% 40%,rgba(var(--accent-rgb),.045),transparent 75%),var(--stage-bg)!important}
html[data-ui="nova"] #hist{border-radius:calc(var(--nova-r)*.6)!important;
  border:1px solid var(--w10)!important;box-shadow:0 10px 30px rgba(0,0,0,.25)}
html[data-ui="nova"] .zoomctl,html[data-ui="nova"] .cmp{
  border-radius:999px!important;background:var(--overlay)!important;
  border:1px solid var(--w10)!important;

html[data-ui="nova"] .zoomctl button{border-radius:999px!important}
html[data-ui="nova"] .cmp{padding:10px 18px!important}
/* 手机端并入缩放条的圆形「对比」按钮必须保持正圆，否则 10px 上下 padding
   会把两个字挤出 24px 高的框，看起来就是文字偏移、不在圆内。 */
html[data-ui="nova"] .cmp.in-zoom{
  width:34px;height:34px;min-width:34px;min-height:34px;flex:0 0 34px;
  padding:0!important;border-radius:50%!important;
  display:grid;place-items:center;line-height:1;font-size:10.5px;
  white-space:nowrap;overflow:hidden}
html[data-ui="nova"] .drop{border-radius:calc(var(--nova-r) * 1)}
html[data-ui="nova"] .import-card{
  border-radius:calc(var(--nova-r) * 1);padding:28px 24px 22px!important;
  border:1px solid var(--w12)!important;
  background:linear-gradient(165deg,var(--overlay),rgba(var(--accent-rgb),.07) 130%)!important;
  /* 背景近乎不透明，blur 纯属浪费：去掉后滚动与切页明显更轻 */
  box-shadow:0 30px 80px rgba(0,0,0,.42),inset 0 1px 0 var(--w12)!important}
html[data-ui="nova"] .import-card::before{background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.8),transparent);height:1.5px}
html[data-ui="nova"] .ic-icon.iris{filter:drop-shadow(0 0 20px rgba(var(--accent-rgb),.45))}
html[data-ui="nova"] .ic-cta{border-radius:999px!important;padding:11px 26px!important;

html[data-ui="nova"] .stage.dragover::after{border-radius:calc(var(--nova-r) * 1)}

html[data-ui="nova"] .dock{
  border-radius:calc(var(--nova-r) * 1);

html[data-ui="nova"] .tb-menu,html[data-ui="nova"] .more-menu,
html[data-ui="nova"] .export-menu,html[data-ui="nova"] .cmd-panel,

.sk-sec{margin:22px 0 10px;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;

.sk-bar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.sk-pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);

  transition:transform .18s,background .18s,border-color .18s}

/* ==================================================================
   LIQUID GLASS · 液态玻璃主题
   第 9 套配色，同时自带一层高斯模糊玻璃质感：多层半透明渐变、
   折射高光边、强饱和 backdrop-filter。只作用于少数关键容器，
   并可用「玻璃模糊」开关一键关掉 blur 换取流畅度。
   ================================================================== */
html[data-theme="liquid"]{
  --bg:#080e1c; --panel:rgba(126,158,224,.11); --panel2:rgba(126,158,224,.17);
  --line:rgba(255,255,255,.20);
  --txt:#f6faff; --sub:#c3d7f5; --accent:#9cc2ff; --accent-rgb:156,194,255;
  --on-accent:#08122a; --blue:#6fa8ff; --body:#eef5ff;
  --stage-bg:#0a1428;
  --glass-rgb:18,30,58;
  --topbar-bg:rgba(140,175,240,.16);
  --topbar-grad:linear-gradient(to bottom,rgba(8,14,28,.65),rgba(8,14,28,0));
  --overlay:rgba(140,175,240,.17);
  --shadow:0 22px 60px rgba(3,10,32,.48);
}
html[data-theme="liquid"] #app{
  background:linear-gradient(118deg,rgba(255,255,255,.055),transparent 30%,rgba(150,190,255,.045) 68%,transparent),
             radial-gradient(820px 520px at 16% -10%,rgba(120,170,255,.26),transparent 70%),
             radial-gradient(700px 500px at 92% 108%,rgba(180,140,255,.22),transparent 72%),
             radial-gradient(600px 420px at 60% 45%,rgba(90,220,220,.11),transparent 72%),
             radial-gradient(380px 380px at 78% 18%,rgba(255,190,220,.10),transparent 76%),
             var(--bg)!important}
html[data-theme="liquid"] .stage{
  background:radial-gradient(700px 460px at 50% 42%,rgba(120,170,255,.10),transparent 76%),
             var(--stage-bg)!important}
/* 玻璃容器：顶栏 / 编辑区 / 菜单 / 欢迎卡 / 二级页头 */
html[data-theme="liquid"] .topbar,
html[data-theme="liquid"] .dock,
html[data-theme="liquid"] .tb-menu,
html[data-theme="liquid"] .more-menu,
html[data-theme="liquid"] .export-menu,
html[data-theme="liquid"] .import-card,
html[data-theme="liquid"] .sp-head,
html[data-theme="liquid"] .toast,
html[data-theme="liquid"] .zoomctl,
html[data-theme="liquid"] .cmp{
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(150,190,255,.075) 46%,rgba(255,255,255,.05))!important;
  border:1px solid rgba(255,255,255,.26)!important;
  box-shadow:0 18px 52px rgba(3,10,32,.46),
             inset 0 1px 0 rgba(255,255,255,.34),
             inset 0 -1px 0 rgba(255,255,255,.08)!important;
}
/* ===== 全局高斯模糊玻璃 · 9 套主题通用 + 浓度可调 =====
   关键修复：顶栏自身绝不能带 backdrop-filter。父元素一旦成为
   「backdrop root」，作为它后代的 ⋯ 溢出菜单，其 backdrop-filter
   只能采到顶栏那一层内容，看不到后面的照片 —— 视觉上就只剩
   「半透明色块」，完全没有模糊。现在顶栏的玻璃交给一个独立的
   兄弟层 .tb-glass（不是 .tb-menu 的祖先），菜单终于能真正采到照片。
   只作用于真正浮在照片上的少数容器；面板卡片用渐变模拟，不吃 GPU。 */
.tb-glass{position:absolute;inset:0;pointer-events:none;z-index:0;display:none;
  border-radius:inherit;overflow:hidden}
html[data-glass="on"] .tb-glass{display:block;
  background:var(--glass-sheen),var(--glass-bg);
  backdrop-filter:blur(18px) saturate(155%)!important;
  -webkit-backdrop-filter:blur(18px) saturate(155%)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),
             inset 0 -1px 0 rgba(255,255,255,.07)}
/* 顶栏内容抬到玻璃层之上；.tb-menu 是绝对定位浮层，保持原样 */
.topbar>*:not(.tb-glass):not(.tb-menu){position:relative;z-index:1}
html[data-glass="on"] .topbar{
  background:transparent!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  border-color:var(--glass-line)!important}
html[data-glass="on"] .tb-menu,
html[data-glass="on"] .more-menu,
html[data-glass="on"] .export-menu,
html[data-glass="on"] .cmd-panel,
html[data-glass="on"] .toast,
html[data-glass="on"] .import-card,
html[data-glass="on"] .sp-head,
html[data-glass="on"] .zoomctl,
html[data-glass="on"] .cmp{
  background:var(--glass-sheen),var(--glass-bg)!important;
  border-color:var(--glass-line)!important;
  backdrop-filter:blur(18px) saturate(155%)!important;
  -webkit-backdrop-filter:blur(18px) saturate(155%)!important;
  box-shadow:0 18px 48px rgba(0,0,0,.32),
             inset 0 1px 0 rgba(255,255,255,.28),
             inset 0 -1px 0 rgba(255,255,255,.07)!important;
}
/* ⋯ 溢出菜单单独再加一层：它挂在顶栏下面，最容易只看出半透明 */
html[data-glass="on"] #tbMenu.tb-menu{
  backdrop-filter:blur(22px) saturate(170%)!important;
  -webkit-backdrop-filter:blur(22px) saturate(170%)!important;
  box-shadow:0 22px 58px rgba(0,0,0,.42),
             inset 0 1px 0 rgba(255,255,255,.34),
             inset 0 -1px 0 rgba(255,255,255,.09)!important;
}
/* 液态玻璃：更强的折射、更冷的高光边、更立体的内外阴影与斜向扫光 */
html[data-theme="liquid"][data-glass="on"] .tb-glass{
  background:linear-gradient(118deg,rgba(255,255,255,.22),rgba(150,190,255,.11) 32%,
              rgba(255,255,255,.02) 58%,rgba(196,162,255,.14)),
             rgba(var(--glass-rgb),var(--glass-alpha))!important;
  backdrop-filter:blur(26px) saturate(200%) brightness(1.08)!important;
  -webkit-backdrop-filter:blur(26px) saturate(200%) brightness(1.08)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),
             inset 0 -1px 0 rgba(255,255,255,.12),
             inset 1px 0 0 rgba(255,255,255,.10),
             inset -1px 0 0 rgba(150,190,255,.12)!important;
}
html[data-theme="liquid"][data-glass="on"] .tb-menu,
html[data-theme="liquid"][data-glass="on"] .more-menu,
html[data-theme="liquid"][data-glass="on"] .export-menu,
html[data-theme="liquid"][data-glass="on"] .cmd-panel,
html[data-theme="liquid"][data-glass="on"] .toast,
html[data-theme="liquid"][data-glass="on"] .import-card,
html[data-theme="liquid"][data-glass="on"] .sp-head{
  background:linear-gradient(118deg,rgba(255,255,255,.22),rgba(150,190,255,.11) 32%,
              rgba(255,255,255,.02) 58%,rgba(196,162,255,.14)),
             rgba(var(--glass-rgb),var(--glass-alpha))!important;
  border:1px solid rgba(255,255,255,.32)!important;
  backdrop-filter:blur(26px) saturate(200%) brightness(1.08)!important;
  -webkit-backdrop-filter:blur(26px) saturate(200%) brightness(1.08)!important;
  box-shadow:0 24px 66px rgba(3,10,32,.50),
             inset 0 1px 0 rgba(255,255,255,.55),
             inset 0 -1px 0 rgba(255,255,255,.12),
             inset 1px 0 0 rgba(255,255,255,.10),
             inset -1px 0 0 rgba(150,190,255,.12)!important;
}
/* 斜向扫光：静态伪元素，不参与动画、不吃每帧合成 */
html[data-theme="liquid"][data-glass="on"] .tb-glass::after,
html[data-theme="liquid"][data-glass="on"] .tb-menu::after,
html[data-theme="liquid"][data-glass="on"] .more-menu::after,
html[data-theme="liquid"][data-glass="on"] .export-menu::after{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(112deg,transparent 14%,rgba(255,255,255,.13) 38%,
              rgba(255,255,255,.02) 48%,transparent 60%);
}
/* 关闭玻璃：blur 置 none，浮层回到主题实色（含 Nova 的 !important） */
html[data-glass="off"] .tb-glass{display:none}
html[data-glass="off"] .topbar,
html[data-glass="off"] .tb-menu,
html[data-glass="off"] .more-menu,
html[data-glass="off"] .export-menu,
html[data-glass="off"] .cmd-panel,
html[data-glass="off"] .toast,
html[data-glass="off"] .import-card,
html[data-glass="off"] .dock,
html[data-glass="off"] .sp-head,
html[data-glass="off"] .zoomctl,
html[data-glass="off"] .cmp,
html[data-glass="off"] .subpage{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
/* liquid 主题自身变量是半透明，关掉玻璃必须换真正不透明的底 */
html[data-glass="off"] .topbar,
html[data-glass="off"] .tb-menu,html[data-glass="off"] .more-menu,
html[data-glass="off"] .export-menu,html[data-glass="off"] .cmd-panel,

(function(){
  try{
    var s=JSON.parse(localStorage.getItem('iris_skin')||'{}');
    var r=document.documentElement;
    r.dataset.theme=s.theme||'aurum';
    r.dataset.ui=s.ui||'classic';
    r.dataset.radius=s.radius||'standard';
    r.dataset.glass=s.glass===false?'off':'on';
    var ga=parseFloat(s.glassAlpha);
    r.style.setProperty('--glass-alpha',String((isFinite(ga)&&ga>=.2&&ga<=.9)?ga:.55));
    if(s.motion===false) r.dataset.motion='off';
  }catch(e){
    var r=document.documentElement;
    r.dataset.theme='aurum'; r.dataset.ui='classic'; r.dataset.radius='standard';
    r.dataset.glass='on'; r.style.setProperty('--glass-alpha','.55');
  }
})();

/* ============================================================
   主调色盘 20 种模式 · 5 组 × 4 款
   同一个二维 pad（x = 横向 / y = 纵向）+ 强度条，但两轴被解释成
   完全不同的渲染语义。全部复用已有 uniform，不新增纹理 / 着色器分支，
   所以切换与拖动都不掉帧；零位严格等于原图。

   映射全部表驱动：每个模式只声明「哪个参数 = (ax·x + ay·y)·强度 + aa·amt」，
   amt = min(1, hypot(x,y))·强度，用于「离开中心才逐渐生效」的效果
   （如黑白、棕褐、红外）。零位 x=y=0 时 amt=0、所有增量恒为 0。
   表在启动时预编译成扁平数组，逐帧只做一次定长循环，无 Object.keys、
