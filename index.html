/* ============================================================
   Iris 自动保存 / 恢复
   ------------------------------------------------------------
   全部在 HTML 内核里实现，网页 / 静态托管 / Electron / Capacitor
   四条分发路径自动获得同一套行为，外壳只负责在退出或切后台时
   调一次 flush。照片不上传：数据只写进本机 IndexedDB / localStorage。

   存什么：
     一张照片的原始字节 + 完整编辑状态 + 缩略图 + 实况视频（可选）
   不存什么：
     演示图、自定义滤镜/我的色调（本来就在 localStorage）
   ============================================================ */
const AS_CFG='plate_autosave_cfg';
const AS_META='plate_autosave_meta';
const AS_EXPORTS='plate_autosave_exports';
const AS_BOOKMARKS='plate_history_bookmarks';
const AS_DB='iris_autosave_v1';
const AS_LIMIT_VIDEO=24*1024*1024;   // 实况视频超过 24MB 不随存
const AS_LIMIT_IMG=12*1024*1024;     // canvas 导出 PNG 超过 12MB 改存 JPEG

const IrisAutosave=(()=>{
  let cfg=loadCfg(), db=null, dbFailed=false, dbReason='';
  let timer=null, saving=null, suspend=false, card=null, lastLog=null;
  let pendingState=null;   // 降级恢复：等用户重新选完照片再套用参数

  function loadCfg(){
    try{
      const c=JSON.parse(localStorage.getItem(AS_CFG)||'{}');
      const mode=['ask','auto','off'].includes(c.mode)?c.mode:'ask';
      return {mode, on:mode!=='off', keepExports:c.keepExports!==false};
    }catch(e){ return {mode:'ask',on:true,keepExports:true}; }
  }
  function saveCfg(){ try{ localStorage.setItem(AS_CFG,JSON.stringify(cfg)); }catch(e){} }
  function lsGet(k,d){ try{ return JSON.parse(localStorage.getItem(k)||'null')||d; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function platform(){
    if(window.IrisDesktop) return '桌面版 · Electron';
    if(window.IrisMobile) return '移动版 · Capacitor';
    if(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform())
      return '移动版 · Capacitor';
    return '网页版 · 浏览器';
  }
  function fmtTime(t){
    if(!t) return '—';
    const d=new Date(t), now=new Date();
    const same=d.toDateString()===now.toDateString();
    const p=n=>String(n).padStart(2,'0');
    return (same?'今天 ':(d.getMonth()+1)+'/'+d.getDate()+' ')+p(d.getHours())+':'+p(d.getMinutes());
  }
  function fmtSize(n){
    if(!n&&n!==0) return '—';
    return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
  }

  /* ---------------------------------------------------------- IndexedDB */
  function openDB(){
    if(db) return Promise.resolve(db);
    if(dbFailed||!window.indexedDB) return Promise.reject(new Error(dbReason||'当前环境不支持 IndexedDB'));
    return new Promise((res,rej)=>{
      let rq;
      try{ rq=indexedDB.open(AS_DB,2); }
      catch(e){ dbFailed=true; dbReason=e.message; rej(e); return; }
      rq.onupgradeneeded=()=>{
        const d=rq.result;
        if(!d.objectStoreNames.contains('snapshot')) d.createObjectStore('snapshot',{keyPath:'id'});
        if(!d.objectStoreNames.contains('exports')) d.createObjectStore('exports',{keyPath:'id'});
        if(!d.objectStoreNames.contains('bookmarks')) d.createObjectStore('bookmarks',{keyPath:'id'});
        /* v2：历史编辑过的图片。只存本机，最多 12 条，不上传。 */
        if(!d.objectStoreNames.contains('gallery')) d.createObjectStore('gallery',{keyPath:'id'});
      };
      rq.onsuccess=()=>{ db=rq.result; res(db); };
      rq.onerror=()=>{ dbFailed=true; dbReason='IndexedDB 打开失败'; rej(rq.error||new Error(dbReason)); };
      rq.onblocked=()=>{ dbFailed=true; dbReason='IndexedDB 被其他标签页占用'; rej(new Error(dbReason)); };
    });
  }
  function idb(store,fn,mode){
    return openDB().then(d=>new Promise((res,rej)=>{
      let t;
      try{ t=d.transaction(store,mode||'readonly'); }catch(e){ rej(e); return; }
      const s=t.objectStore(store);
      let out;
      try{ out=fn(s); }catch(e){ rej(e); return; }
      t.oncomplete=()=>{
        /* IDBRequest 的 result 可能是 undefined（get 未命中 / clear / delete），
           这时必须 resolve undefined，不能把 request 对象当成记录返回。 */
        if(out&&typeof out==='object'&&'result' in out) res(out.result);
        else res(out);
      };
      t.onerror=()=>rej(t.error||new Error('IDB tx error'));
      t.onabort=()=>rej(t.error||new Error('IDB tx abort'));
    }));
  }
  function idbPut(store,val){ return idb(store,s=>s.put(val),'readwrite'); }
  function idbGet(store,key){ return idb(store,s=>s.get(key)); }
  function idbAll(store){ return idb(store,s=>s.getAll()); }
  function idbClear(store){ return idb(store,s=>s.clear(),'readwrite'); }

  /* ---------------------------------------------------------- 图片 → Blob */
  async function sourceToBlob(src){
    if(!src) return null;
    if(src instanceof Blob) return src;           // 原始 File：保留原字节与格式
    const w=src.naturalWidth||src.width||src.videoWidth||0;
    const h=src.naturalHeight||src.height||src.videoHeight||0;
    if(!w||!h) return null;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    try{ c.getContext('2d').drawImage(src,0,0,w,h); }
    catch(e){ return null; }
    const to=(type,q)=>new Promise(r=>{ try{ c.toBlob(r,type,q); }catch(e){ r(null); } });
    let b=await to('image/png');
    if(b&&b.size>AS_LIMIT_IMG) b=(await to('image/jpeg',.92))||b;
    return b;
  }
  function makeThumb(src){
    try{
      const w=src&&(src.naturalWidth||src.width||src.videoWidth)||imgW||1;
      const h=src&&(src.naturalHeight||src.height||src.videoHeight)||imgH||1;
      const s=Math.min(1,260/Math.max(w,h));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
      c.getContext('2d').drawImage(src,0,0,c.width,c.height);
      return c.toDataURL('image/jpeg',.62);
    }catch(e){ return ''; }
  }

  /* ---------------------------------------------------------- 照片字节缓存
     之前每次自动保存都把整张原图 drawImage + toBlob('image/png') 重编码一次，
     大图会阻塞主线程几百毫秒，而且每编辑一下就重复一次 —— 这是最明显的卡顿源。
     现在按「原图对象引用 + 实况视频标识」缓存：只有换照片时才重新编码，
     后续保存只序列化状态（几 KB），实况视频也只读一次。 */
  let photoCache={ready:false,src:null,liveKey:'',blob:null,img:null,
    thumb:'',live:null,liveBytes:0,liveSkipped:false,liveName:'',liveType:'',livePair:false};
  function invalidatePhoto(){ photoCache.ready=false; photoCache.src=null; }
  async function ensurePhotoCache(){
    const src=(typeof LIVE!=='undefined'&&LIVE.still)||null;
    const vf=(typeof LIVE!=='undefined'&&LIVE.vidFile)||null;
    const liveKey=vf?(vf.name+'|'+vf.size+'|'+(vf.lastModified||0)):'';
    if(photoCache.ready&&photoCache.src===src&&photoCache.liveKey===liveKey){
      IrisPerf.saveReuses++;
      return photoCache;
    }
    const blob=await sourceToBlob(src);
    if(!blob) return null;
    let img=null;
    try{ img=await blob.arrayBuffer(); }catch(e){}
    const livePair=!!(typeof LIVE!=='undefined'&&LIVE.pair);
    const liveName=vf&&vf.name||'', liveType=vf&&vf.type||'video/quicktime';
    let liveSkipped=!!(vf&&vf.size>AS_LIMIT_VIDEO);
    let live=null, liveBytes=0;
    if(vf&&!liveSkipped){
      try{ live=await vf.arrayBuffer(); liveBytes=live?live.byteLength:0; }
      catch(e){ liveSkipped=true; }
    }
    photoCache={ready:true,src,liveKey,blob,img,thumb:makeThumb(src),
      live,liveBytes,liveSkipped,liveName,liveType,livePair};
    IrisPerf.saveEncodes++;
    return photoCache;
  }

  /* ==========================================================
     历史编辑过的图片（「我的」页的数据源）
     设计目标：完全不碰渲染热路径。换照片只记一次（异步、空闲时写），
     编辑更新按 2.5s 节流复用同一条记录；缩略图直接用自动保存已算好的
     那张，不重复 drawImage。上限 12 条 / 60MB，超了删最旧。
     ========================================================== */
  const G_MAX=12, G_BYTES=60*1024*1024, G_IMG_LIMIT=12*1024*1024;
  let galleryCurrentId=null, gallerySrc=null, galleryTimer=null, galleryPending=null,
      galleryPrimed=false;
  function galleryId(){ return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  async function galleryTrim(){
    try{
      const all=(await idbAll('gallery'))||[];
      if(!all.length) return [];
      all.sort((a,b)=>(b.updatedAt||b.at)-(a.updatedAt||a.at));
      let bytes=0, drop=[];
      all.forEach((r,i)=>{
        bytes+=r.imgBytes||0;
        if(i>=G_MAX||bytes>G_BYTES) drop.push(r);
      });
      if(drop.length){
        await idb('gallery',st=>{ drop.forEach(r=>st.delete(r.id)); },'readwrite');
      }
      return all.filter(r=>!drop.includes(r));
    }catch(e){ return []; }
  }
  function galleryNote(name,opts){
    if(!cfg.on||suspend) return;
    if(typeof isDemoPhoto!=='undefined'&&isDemoPhoto) return;
    const o=opts||{};
    if(o.fromRestore){
      galleryCurrentId=o.galleryId||null;
      gallerySrc=(typeof LIVE!=='undefined'&&LIVE.still)||null;
      return;
    }
    const src=(typeof LIVE!=='undefined'&&LIVE.still)||null;
    if(src&&src===gallerySrc&&galleryCurrentId) return;   // 同一张照片不重复建档
    gallerySrc=src;
    galleryCurrentId=galleryId();
    galleryPrimed=false;
    const id=galleryCurrentId;
    /* 建档只写轻量元数据：不碰 ensurePhotoCache，避免与紧接着的自动保存
       并发各编码一次原图（那会让「换照片只编码 1 次」的优化失效）。
       缩略图与原图由第一次 galleryTouch 从 save 已算好的缓存里补齐。 */
    const run=async()=>{
      try{
        if(galleryCurrentId!==id) return;
        const rec={id, name:name||photoName||'我的照片', at:Date.now(), updatedAt:Date.now(),
          w:imgW||0,h:imgH||0, thumb:'', state:packState(state),
          imgType:'image/png', img:null, imgBytes:0,
          noImg:true, liveSkipped:true};
        await idbPut('gallery',rec);
        await galleryTrim();
      }catch(e){ /* 本机存储不可用时静默降级，不影响编辑 */ }
    };
    if(window.requestIdleCallback) requestIdleCallback(()=>run(),{timeout:1200});
    else setTimeout(run,260);
  }
  function galleryTouch(meta,img){
    if(!cfg.on||suspend||!galleryCurrentId||!meta) return;
    /* 节流：连续拖滑杆只在停手后更新一次，不逐次写 IndexedDB */
    galleryPending={id:galleryCurrentId,meta,img};
    if(galleryTimer) return;
    /* 首次（刚建档）立即补齐缩略图 / 原图；之后连续编辑按 2.5s 节流 */
    const delay=galleryPrimed?2500:0;
    galleryPrimed=true;
    galleryTimer=setTimeout(async()=>{
      galleryTimer=null;
      const q=galleryPending; galleryPending=null;
      if(!q) return;
      try{
        const old=await idbGet('gallery',q.id);
        if(!old) return;
        const big=q.img&&q.img.byteLength>G_IMG_LIMIT;
        const rec={...old, name:q.meta.name||old.name,
          w:q.meta.w||old.w, h:q.meta.h||old.h,
          updatedAt:Date.now(), state:q.meta.state||old.state,
          thumb:q.meta.thumb||old.thumb,
          imgType:q.meta.imgType||old.imgType,
          img:big?null:(q.img||old.img),
          imgBytes:big?0:(q.img?q.img.byteLength:(old.imgBytes||0)),
          noImg:!!big};
        await idbPut('gallery',rec);
      }catch(e){}
    },delay);
  }
  async function galleryAll(){
    try{
      const a=(await idbAll('gallery'))||[];
      return a.sort((x,y)=>(y.updatedAt||y.at)-(x.updatedAt||x.at));
    }catch(e){ return (lsGet('iris_gallery_fallback',[])||[]); }
  }
  async function galleryRemove(id){
    try{ await idb('gallery',st=>st.delete(id),'readwrite'); }catch(e){}
    if(galleryCurrentId===id) galleryCurrentId=null;
  }
  async function galleryClear(){
    try{ await idbClear('gallery'); }catch(e){}
    galleryCurrentId=null; gallerySrc=null;
  }
  async function galleryRestore(id){
    const rec=(await galleryAll()).find(r=>r.id===id);
    if(!rec){ toast('这条记录已不存在'); return false; }
    suspend=true; hideCard();
    try{
      if(rec.img){
        const blob=new Blob([rec.img],{type:rec.imgType||'image/png'});
        const url=URL.createObjectURL(blob);
        try{
          const im=await new Promise((res,rej)=>{
            const x=new Image(); x.onload=()=>res(x);
            x.onerror=()=>rej(new Error('图片解码失败')); x.src=url;
          });
          uploadImage(im,rec.name||'历史照片',false,
            {resetEdits:false,fromRestore:true,galleryId:rec.id});
          applyState(rec.state);
          toast('已回到「'+(rec.name||'历史照片')+'」的编辑');
        }finally{ setTimeout(()=>URL.revokeObjectURL(url),3000); }
      }else{
        /* 大图没随存：只恢复参数，请用户重新选照片 */
        pendingState=rec.state||null;
        applyPendingIfAny();
        const card=document.getElementById('drop'); if(card) card.classList.remove('hidden');
        toast('这张的原图未随存（超过 12MB），已恢复参数，请重新选择照片');
      }
      return true;
    }catch(e){
      console.warn('[IrisGallery] 恢复失败',e);
      toast('恢复失败：'+(e.message||e)); return false;
    }finally{ suspend=false; schedule(400); galleryNote(rec.name,{fromRestore:true,galleryId:rec.id}); }
  }
  async function galleryStats(){
    const a=await galleryAll();
    return {count:a.length, bytes:a.reduce((n,r)=>n+(r.imgBytes||0),0),
      created:a.length?Math.min(...a.map(r=>r.at)):0,
      updated:a.length?Math.max(...a.map(r=>r.updatedAt||r.at)):0};
  }

  /* ---------------------------------------------------------- 保存 */
  async function buildSnapshot(){
    if(typeof state==='undefined'||!imageReady) return null;
    if(typeof isDemoPhoto!=='undefined'&&isDemoPhoto) return null;   // 演示图不入档
    const c=await ensurePhotoCache();
    if(!c||!c.blob) return null;
    const st=packState(state);      // 差分存储：通常只有完整 JSON 的几十分之一
    const meta={
      id:'last', v:2, app:'Iris 调色盘', platform:platform(), savedAt:Date.now(),
      name:photoName||'我的照片', w:imgW, h:imgH,
      state:st, stateBytes:st.length, galleryId:galleryCurrentId,
      imgType:c.blob.type||'image/png', imgBytes:c.blob.size,
      thumb:c.thumb, degraded:false,
      livePair:c.livePair, liveName:c.liveName, liveType:c.liveType,
      liveSkipped:c.liveSkipped, liveBytes:c.liveBytes
    };
    return {meta,img:c.img,live:c.live};
  }
  async function save(){
    if(!cfg.on||suspend) return null;
    if(saving) return saving;
    saving=(async()=>{
      try{
        const snap=await buildSnapshot();
        if(!snap) return null;
        const {meta,img,live}=snap;
        try{
          await idbPut('snapshot',{...meta,img,live});
          meta.degraded=false;
        }catch(e){
          /* 降级：只存参数 + 缩略图，不含原图。恢复时会明确要求重新选照片 */
          meta.degraded=true; meta.img=null; meta.live=null;
          meta.degradeReason=(e&&e.message)||'本机存储不可用';
        }
        lsSet(AS_META,meta);           // 同步写一份轻量 meta，启动更快、IDB 挂了也能问
        lastSavedState=meta.state;     // 状态哨兵：记住这次已经落盘的版本
        cleared=false;
        galleryTouch(meta,img);        // 同一张照片的历史记录同步到最新编辑
        if(typeof window.__irisOnAutosave==='function') window.__irisOnAutosave(meta);
        return meta;
      }catch(e){ console.warn('[IrisAutosave] 保存失败',e); return null; }
      finally{ saving=null; }
    })();
    return saving;
  }
  function schedule(ms){
    if(!cfg.on||suspend) return;
    clearTimeout(timer);
    timer=setTimeout(()=>{ timer=null; save(); },ms===undefined?900:ms);
  }
  /* ==========================================================
     状态哨兵：元素 / 贴纸 / 马赛克涂抹 / 文字输入等有一部分路径
     直接改 state，既不走 mutate() 也不走 commit()。这里每 1.2s
     比对「当前打包状态」与「上次成功落盘的版本」，不同就补一次保存，
     任何遗漏的编辑路径都能兜住，不再依赖逐条代码去补 schedule。
     指纹用 packState（差分打包），大图也只是几 KB 的纯 JS 计算。
     ========================================================== */
  let lastSavedState=null, watchTimer=null, cleared=false, clearedAtState=null;
  function stateFingerprint(){
    try{ return (typeof packState==='function')?packState(state):JSON.stringify(state); }
    catch(e){ return null; }
  }
  function touch(){ schedule(350); }
  function startWatch(){
    if(watchTimer) return;
    watchTimer=setInterval(()=>{
      if(!cfg.on||suspend) return;
      if(typeof imageReady!=='undefined'&&!imageReady) return;
      if(typeof isDemoPhoto!=='undefined'&&isDemoPhoto) return;
      const f=stateFingerprint();
      if(f==null) return;
      if(cleared){
        /* 刚清除过且没有任何新编辑：不要再自动写回一份快照。
           一旦又调了参数，就解除标记、恢复正常自动保存。 */
        if(f===clearedAtState) return;
        cleared=false;
      }
      if(f!==lastSavedState) schedule(180);
    },1200);
  }
  function flush(){
    clearTimeout(timer); timer=null;
    /* 刚点过「清除上次的编辑」就退出：不要立刻又写一份回去。
       之后只要产生任何新编辑，哨兵 / schedule 会重新落盘并解除该标记。 */
    /* 退出瞬间先「同步」把当前编辑参数写进 localStorage 的轻量 meta，
       不等异步 IndexedDB。软件被立刻杀掉时，至少编辑不会全部丢失。 */
    try{
      if(cfg.on&&!suspend&&!cleared){
        const fp=stateFingerprint();
        /* 只在「确实保存过」时补写：old 是上次 save 留下的轻量 meta。
           既不会把降级存档（degraded）谎报成完整存档，也不会在用户
           点「清除上次的编辑」之后，退出时又凭空复活一份快照。 */
        const old=lsGet(AS_META,null);
        if(fp!=null&&old&&old.savedAt){
          lsSet(AS_META,{...old,app:'Iris 调色盘',v:2,savedAt:Date.now(),
            name:(typeof photoName!=='undefined'?photoName:old.name)||old.name||'我的照片',
            state:fp,stateBytes:fp.length,emergency:true});
        }
      }
    }catch(e){}
    return save();
  }
  /* 退出 / 切后台专用：刚点过「清除上次的编辑」且没有新编辑时，
     不要又写一份回去。显式「立即保存」仍走 flush()，始终保存。 */
  function flushOnExit(){
    if(cleared){
      let fp=null; try{ fp=stateFingerprint(); }catch(e){}
      if(fp===null||fp===clearedAtState) return Promise.resolve(null);
      cleared=false;
    }
    return flush();
  }
  function onPhotoChanged(){ hideCard(); schedule(350); }

  /* ---------------------------------------------------------- 读取 / 清除 */
  async function readMeta(){
    let m=lsGet(AS_META,null);
    try{
      const full=await idbGet('snapshot','last');
      if(full) m=full;               // IDB 里有原图，优先用完整版
    }catch(e){}
    return m&&m.savedAt?m:null;
  }
  async function readFull(){ try{ return await idbGet('snapshot','last'); }catch(e){ return null; } }
  async function clearSnapshot(){
    try{ await idbClear('snapshot'); }catch(e){}
    try{ localStorage.removeItem(AS_META); }catch(e){}
    cleared=true; lastSavedState=null;
    try{ clearedAtState=stateFingerprint(); }catch(e){ clearedAtState=null; }
    hideCard();
  }
  async function clearAll(){
    await clearSnapshot();
    try{ await idbClear('exports'); await idbClear('bookmarks'); await idbClear('gallery'); }catch(e){}
    try{ localStorage.removeItem(AS_EXPORTS); localStorage.removeItem(AS_BOOKMARKS); }catch(e){}
    galleryCurrentId=null; gallerySrc=null;
  }

  /* ---------------------------------------------------------- 导出记录 */
  async function listExports(){
    try{ const a=await idbAll('exports'); if(a&&a.length) return a.sort((x,y)=>y.at-x.at); }catch(e){}
    return (lsGet(AS_EXPORTS,[])||[]).sort((x,y)=>y.at-x.at);
  }
  async function logExport(name,blob){
    if(!cfg.on||!cfg.keepExports) return;
    const size=blob&&blob.size||0, at=Date.now();
    if(lastLog&&lastLog.name===name&&lastLog.size===size&&at-lastLog.at<900) return;
    lastLog={name,size,at};
    const rec={id:'e'+at+'_'+Math.random().toString(36).slice(2,7),name,size,
      type:(blob&&blob.type)||'',at,platform:platform(),dims:null};
    try{ const d=exportDims(); if(d) rec.dims=d.join('×'); }catch(e){}
    try{ await idbPut('exports',rec); }catch(e){
      const a=lsGet(AS_EXPORTS,[])||[]; a.unshift(rec); lsSet(AS_EXPORTS,a.slice(0,60));
    }
  }
  async function clearExports(){
    try{ await idbClear('exports'); }catch(e){}
    try{ localStorage.removeItem(AS_EXPORTS); }catch(e){}
  }

  /* ---------------------------------------------------------- 历史书签 */
  function bookmarks(){ return lsGet(AS_BOOKMARKS,[])||[]; }
  function addBookmark(name){
    const a=bookmarks();
    a.unshift({id:'b'+Date.now(),name:name||'未命名书签',at:Date.now(),state:packState(state)});
    lsSet(AS_BOOKMARKS,a.slice(0,24));
    return a;
  }
  /* 把旧版「完整 JSON」书签升级成差分格式，释放 localStorage 空间 */
  function compressBookmarks(){
    const a=bookmarks(); let n=0;
    const out=a.map(b=>{
      if(!b.state) return b;
      let o=null; try{ o=JSON.parse(b.state); }catch(e){ return b; }
      if(o&&o.__iris===IRIS_PACK) return b;
      n++; return {...b,state:packState(o)};
    });
    if(n) lsSet(AS_BOOKMARKS,out);
    return n;
  }
  function removeBookmark(id){ lsSet(AS_BOOKMARKS,bookmarks().filter(b=>b.id!==id)); }
  function loadBookmark(id){
    const b=bookmarks().find(x=>x.id===id); if(!b) return false;
    suspend=true;
    try{
      commit(JSON.stringify(state));
      state=unpackState(b.state);
      afterHistory();
    }finally{ suspend=false; }
    schedule(200);
    if(typeof toast==='function') toast('已载入书签「'+b.name+'」');
    return true;
  }

  /* ---------------------------------------------------------- 恢复 */
  function applyState(json){
    const z=state&&state.zoom||1, p=state&&state.pan||[0,0];
    state=unpackState(json);
    if(!state.zoom) state.zoom=z;
    if(!state.pan) state.pan=p;
    /* 恢复的不只是参数：涂抹笔迹对应的 GPU 遮罩也必须重算。
       signature 缓存可能还留着上一张照片的 key，先清空再强制重建。 */
    try{ brushKey=''; rebuildBrushTextures(); }catch(e){}
    try{ maskPaintKey=''; rebuildMaskPaint(true); }catch(e){}
    try{ BOK.low=null; BOK.ready=false; }catch(e){}
    try{ filterText=''; filterGroup='全部'; }catch(e){}
    try{ buildPanel(); syncUI(); render(); drawHistogram(); }catch(e){}
  }
  function applyPendingIfAny(){
    if(!pendingState) return;
    const s=pendingState; pendingState=null;
    try{ applyState(s); if(typeof toast==='function') toast('已恢复上次的编辑参数'); }
    catch(e){ console.warn('[IrisAutosave] 参数恢复失败',e); }
  }
  async function restore(m){
    suspend=true; hideCard();
    try{
      const full=(m&&m.img)?m:await readFull();
      if(full&&full.img){
        const blob=new Blob([full.img],{type:full.imgType||'image/png'});
        const url=URL.createObjectURL(blob);
        try{
          const im=await new Promise((res,rej)=>{
            const x=new Image(); x.onload=()=>res(x); x.onerror=()=>rej(new Error('图片解码失败')); x.src=url;
          });
          uploadImage(im,full.name||'上次的照片',false,
            {resetEdits:false,fromRestore:true,galleryId:full.galleryId||null});
          applyState(full.state);
          /* 实况视频：有就接回去，失败也不影响静态封面 */
          if(full.live){
            try{
              const vf=new File([full.live],full.liveName||'LivePhoto.mov',
                {type:full.liveType||'video/quicktime'});
              if(typeof attachLiveVideo==='function') await attachLiveVideo(vf);
              LIVE.vidFile=vf;
              if(typeof updateLiveUI==='function') updateLiveUI();
            }catch(e){}
          }
          if(typeof toast==='function')
            toast('已恢复「'+(full.name||'上次的照片')+'」'+(full.liveSkipped?'（实况视频未随存）':''));
        }finally{ setTimeout(()=>URL.revokeObjectURL(url),3000); }
      }else{
        /* 降级：没有原图，先记住参数，等用户重新选照片 */
        pendingState=m.state||null;
        if(typeof toast==='function') toast('本机未保存原图，请选择照片后自动套用上次的编辑');
        const card=document.getElementById('drop');
        if(card) card.classList.remove('hidden');
        if(typeof $==='function'){ const f=$('#file'); if(f) setTimeout(()=>f.click(),260); }
      }
    }catch(e){
      console.warn('[IrisAutosave] 恢复失败',e);
      if(typeof toast==='function') toast('恢复失败：'+(e.message||e));
    }finally{ suspend=false; schedule(400); }
  }

  /* ---------------------------------------------------------- 恢复询问卡 */
  function hideCard(){ if(card){ card.classList.add('hide'); card=null; } }
  function showCard(m){
    hideCard();
    const el=document.createElement('div');
    el.className='as-card'; el.setAttribute('role','dialog');
    el.setAttribute('aria-label','恢复上次的编辑');
    const line=m.degraded?'仅保存了编辑参数（需重新选择照片）':
      ((m.w||'?')+'×'+(m.h||'?')+' · '+fmtSize(m.imgBytes||m.stateBytes));
    el.innerHTML=
      '<div class="as-head">'+
        (m.thumb?'<img class="as-thumb" alt="上次照片缩略图" src="'+m.thumb+'">':
                 '<div class="as-thumb"></div>')+
        '<div class="as-head-t"><div class="as-eyebrow">IRIS · AUTOSAVE</div>'+
        '<b>继续上次的编辑？</b><small>'+esc(m.name||'上次的照片')+'　·　'+fmtTime(m.savedAt)+'</small>'+
        '<small>'+esc(line)+'</small></div></div>'+
      '<p class="as-note">检测到本机保存着上一次的照片与全部编辑（滤镜、调色盘、文字贴纸、裁剪都在）。'+
        '数据只在这台设备上，<b>不会上传</b>。也可以直接从新照片开始。</p>'+
      '<div class="as-actions">'+
        '<button class="primary" data-a="yes">继续编辑</button>'+
        '<button data-a="new">重新开始</button>'+
        '<button data-a="later">稍后</button></div>'+
      '<button class="as-link" data-a="always">下次直接恢复，不再询问</button>';
    el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='yes') restore(m);
      else if(a==='new'){ clearSnapshot(); if(typeof toast==='function') toast('已清除上次的编辑'); }
      else if(a==='later'){ hideCard(); if(typeof toast==='function') toast('可在「自动保存」页随时恢复'); }
      else if(a==='always'){ setMode('auto'); restore(m); }
    });
    document.body.appendChild(el); card=el;
  }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------------------------------------------------------- 设置 / 诊断 */
  function setMode(mode){
    cfg.mode=mode; cfg.on=(mode!=='off'); saveCfg();
    if(!cfg.on){ clearTimeout(timer); timer=null; }
    else schedule(300);
    if(typeof toast==='function') toast(mode==='off'?'自动保存已关闭':
      mode==='auto'?'已设为「下次直接恢复」':'已设为「每次询问」');
  }
  function setKeepExports(v){ cfg.keepExports=!!v; saveCfg(); }
  async function estimate(){
    try{ if(navigator.storage&&navigator.storage.estimate){ const e=await navigator.storage.estimate();
      return {usage:e.usage||0,quota:e.quota||0}; } }catch(err){}
    return {usage:0,quota:0};
  }
  async function diag(){
    const meta=await readMeta();
    const est=await estimate();
    let units=null, renderer='—', shader=false;
    try{
      units=gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);
      const ext=gl.getExtension('WEBGL_debug_renderer_info');
      if(ext) renderer=gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)||'—';
      shader=!!(typeof prog!=='undefined'&&prog);
    }catch(e){}
    return {
      platform:platform(), dbOK:!dbFailed&&!!window.indexedDB, dbReason:dbReason,
      snapshot:meta?{name:meta.name,at:meta.savedAt,bytes:meta.imgBytes||0,
        degraded:!!meta.degraded,dims:(meta.w||'?')+'×'+(meta.h||'?')}:null,
      exports:(await listExports()).length,
      bookmarks:bookmarks().length,
      stateBytes:packState(state).length,
      history:undoStack.length, redo:redoStack.length,
      imageReady:!!imageReady, imageSize:(imgW||0)+'×'+(imgH||0),
      demo:!!isDemoPhoto, units, renderer, shader,
      usage:est.usage, quota:est.quota,
      mode:cfg.mode, keepExports:cfg.keepExports
    };
  }

  /* ---------------------------------------------------------- 启动 */
  async function boot(){
    startWatch();          // 任何直接改 state 的编辑路径都会兜住
    /* 退出 / 切后台 / 隐藏时尽力落盘；异步 IDB 无法 100% 保证，
       所以 mutate 后 900ms 的常规保存才是主力，这里只作兜底。 */
    const bye=()=>{ try{ flushOnExit(); }catch(e){} };
    window.addEventListener('pagehide',bye);
    window.addEventListener('beforeunload',bye);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') bye(); });
    if(!cfg.on) return;
    let m=null;
    try{ m=await readMeta(); }catch(e){}
    if(!m||!m.savedAt) return;
    if(cfg.mode==='auto'){ await restore(m); return; }
    showCard(m);
  }

  return {
    cfg:()=>({...cfg}), setMode, setKeepExports, schedule, flush, flushOnExit, save, touch, startWatch,
    onPhotoChanged, invalidatePhoto, applyPendingIfAny, logExport, listExports, clearExports,
    bookmarks, addBookmark, removeBookmark, loadBookmark, compressBookmarks,
    readMeta, readFull, clearSnapshot, clearAll, restore, hideCard, diag,
    fmtTime, fmtSize, platform, boot,
    galleryNote, galleryAll, galleryRemove, galleryClear, galleryRestore, galleryStats,
    hold:v=>{ suspend=!!v; }, isSuspended:()=>suspend
  };
})();
window.IrisAutosave=IrisAutosave;

/* ---------- 11 自动保存与恢复 ---------- */
function renderAutosavePage(body){
  const w=spWrap(body);
  asHero(w,'IRIS · AUTOSAVE','自动保存与恢复',
    '照片与全部编辑只存在你这台设备上。重新打开网页 / 桌面 / 手机 App 时，可以选择继续上次的照片，也可以从新照片开始。',
    '同一套逻辑写在 HTML 内核里，网页版、静态托管、Electron 桌面版、Capacitor 移动版行为完全一致；外壳只在退出或切后台时补一次落盘。');

  const stat=spEl('div','sp-stat'); w.append(stat);
  const modes=spEl('div','sp-rowline'); w.append(modes);
  const ops=spEl('div','sp-row'); w.append(ops);
  const extra=spEl('div','sp-section-t','本机存储'); extra.append(spEl('small','全部在本机，不上传')); w.append(extra);
  const keepBox=spEl('div',''); w.append(keepBox);
  const info=spEl('div','sp-codebox','读取中…'); w.append(info);
  const note=spEl('div','sp-note',
    '· 保存内容：照片原始字节、完整编辑状态、缩略图；实况视频 ≤ 24MB 时一并保存。<br>'+
    '· <b>文字、贴纸、涂鸦、马赛克 / 模糊涂抹、蒙版涂抹、虚化涂抹也都会保存</b>：这些编辑走画布交互，'
    +'每次结束都会触发落盘，另有状态哨兵每 1.2 秒比对一次，任何直接改动的路径都能兜住；退出瞬间还会同步写一份轻量存档。<br>'+
    '· 演示图不会入档；自定义滤镜、我的色调、收藏等本来就在本地存储中。<br>'+
    '· 若浏览器不允许 IndexedDB，会降级为「只存参数 + 缩略图」，恢复时明确提示重新选择照片，不会假装恢复成功。<br>'+
    '· 关掉自动保存不会删除已有快照；「清除上次的编辑」才真正抹掉照片。清掉本机站点数据也会一并清除。');
  w.append(note);

  function refresh(){
    const c=IrisAutosave.cfg();
    let m=null;
    try{ m=JSON.parse(localStorage.getItem('plate_autosave_meta')||'null'); }catch(e){}
    const modeLabel=c.mode==='ask'?'每次询问':c.mode==='auto'?'直接恢复':'已关闭';
    /* 控件与统计全部同步可见，避免打开页面先空白一下 */
    stat.innerHTML='';
    [[m?IrisAutosave.fmtTime(m.savedAt):'无','上次保存'],
     [m?IrisAutosave.fmtSize(m.imgBytes||m.stateBytes):'—','照片大小'],
     [window.indexedDB?'可用':'降级','本机存储'],
     [m&&m.degraded?'仅参数':'含原图','快照类型'],
     [modeLabel,'恢复方式']]
    .forEach(([v,t])=>{ const x=spEl('div',''); x.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; stat.append(x); });

    modes.innerHTML='';
    const t=spEl('div','sp-rl-t');

    const bs=spEl('div','sp-btns');
    [['ask','每次询问'],['auto','直接恢复'],['off','关闭']].forEach(([m,label])=>{
      const btn=spEl('button','sp-btn'+(c.mode===m?' primary':''),label);
      btn.onclick=()=>{ IrisAutosave.setMode(m); refresh(); };
      bs.append(btn);
    });
    modes.append(t,bs);

    ops.innerHTML='';
    [['⟳ 立即保存',()=>IrisAutosave.flush().then(()=>{toast('已保存到本机');refresh();})],
     ['↺ 恢复上次的编辑',async()=>{ const mm=await IrisAutosave.readMeta(); if(!mm){toast('本机没有保存的照片');return;} closeSubPage(); await IrisAutosave.restore(mm); }],
     ['✕ 清除上次的编辑',async()=>{ if(confirm('清除本机保存的照片与编辑？此操作不可撤销。')){ await IrisAutosave.clearSnapshot(); toast('已清除'); refresh(); } }],
     ['⌕ 查看导出记录',()=>openSubPage('exports')],
     ['◈ 运行状态诊断',()=>openSubPage('diagnostics')]]
    .forEach(([txt,fn])=>{ const btn=spEl('button','sp-btn',txt); btn.onclick=fn; ops.append(btn); });

    keepBox.innerHTML='';
    const keep=spEl('div','sp-rowline');
    const kt=spEl('div','sp-rl-t');

    kb.onclick=()=>{ IrisAutosave.setKeepExports(!c.keepExports); refresh(); };
    const kb2=spEl('div','sp-btns'); kb2.append(kb); keep.append(kt,kb2);
    keepBox.append(keep);

    /* 精确诊断信息异步补齐，不阻塞按钮 */
    IrisAutosave.diag().then(d=>{
      if(!info.isConnected||!stat.isConnected) return;
      stat.innerHTML='';
      [[d.snapshot?IrisAutosave.fmtTime(d.snapshot.at):'无','上次保存'],
       [d.snapshot?IrisAutosave.fmtSize(d.snapshot.bytes):'—','照片大小'],
       [d.dbOK?'可用':'降级','本机存储'],
       [IrisAutosave.fmtSize(d.usage),'已用空间'],
       [modeLabel,'恢复方式']]
      .forEach(([v,t])=>{ const x=spEl('div',''); x.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; stat.append(x); });
      info.textContent=
        '平台        ' + d.platform+'\n'+
        '本机存储    ' + (d.dbOK?'IndexedDB 可用':('降级：'+d.dbReason))+'\n'+
        '上次快照    ' + (d.snapshot?(d.snapshot.name+' · '+d.snapshot.dims+' · '+IrisAutosave.fmtSize(d.snapshot.bytes)+(d.snapshot.degraded?' · 仅参数':' · 含原图')):'无')+'\n'+
        '当前照片    ' + (d.demo?'演示图（不入档）':d.imageSize)+'\n'+
        '状态体积    ' + IrisAutosave.fmtSize(d.stateBytes)+'\n'+
        '导出记录    ' + d.exports+' 条　书签 '+d.bookmarks+' 个\n'+
        '存储配额    ' + IrisAutosave.fmtSize(d.usage)+' / '+(d.quota?IrisAutosave.fmtSize(d.quota):'未知');
    }).catch(()=>{});
  }
  refresh();
}

      ['撤销 / 重做',undoStack.length+' / '+redoStack.length+' 步',IrisAutosave.fmtSize(histBytes()),'只存差分，拖一次滑杆约几十字节'],
      ['状态书签',bm.length+' 个',IrisAutosave.fmtSize(bmBytes),'相对默认状态存差分，旧版书签可一键压缩'],
      ['自动保存快照','1 份','见下方','照片原字节单独缓存，参数只写一次'],
      ['导出记录','仅元数据','—','不存图片本体，只存名称 / 格式 / 大小 / 时间']
    ];
    const t=spEl('table','sp-table');
    t.innerHTML='<thead><tr><th>项目</th><th>数量</th><th>占用</th></tr></thead>';
    const tb=document.createElement('tbody');
    rows.forEach(([a,b,c,note])=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+a+'<small style="display:block;opacity:.6;font-size:11px">'+note+'</small></td><td>'+b+'</td><td class="sp-mono">'+c+'</td>';
      tb.append(tr); });
    t.append(tb); opt.append(t);
    const r=spEl('div','sp-row');
    const c1=spEl('button','sp-btn','✧ 压缩旧书签');
    c1.onclick=()=>{ const n=IrisAutosave.compressBookmarks(); toast(n?('已压缩 '+n+' 个旧书签'):'书签已经是差分格式'); draw(); };
    const c2=spEl('button','sp-btn','○ 清空撤销历史');
    c2.onclick=()=>{ undoStack=[]; redoStack=[]; toast('已清空撤销历史（当前状态不变）'); draw(); };
    r.append(c1,c2); opt.append(r);
  }
  function gotoStep(idx){
    IrisAutosave.hold(true);
    try{
      let guard=0;
      while(undoStack.length>idx&&guard++<80) undo();
      guard=0;
      while(undoStack.length<idx&&redoStack.length&&guard++<80) redo();
    }finally{ IrisAutosave.hold(false); }
    IrisAutosave.schedule(250); draw(); toast('已回到第 '+idx+' 步');
  }
  function draw(){
    const total=undoStack.length;
    stat.innerHTML='';
    [[total,'可撤销步数'],[redoStack.length,'可重做步数'],
     [IrisAutosave.bookmarks().length,'书签数'],[IrisAutosave.fmtSize(histBytes()),'历史占用']]
    .forEach(([v,t])=>{ const x=spEl('div',''); x.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; stat.append(x); });

    list.innerHTML='';
    if(!total&&!redoStack.length){ list.append(spEl('div','sp-empty','<b>还没有编辑记录</b>拖动一下调色盘或调一根滑杆，这里就会出现时间线。')); }
    undoStack.forEach((s,i)=>{
      const r=spEl('div','sp-rowline');
      const t=spEl('div','sp-rl-t');
      t.innerHTML='<b>第 '+i+' 步</b><small>'+summary(s)+'</small>';
      const bs=spEl('div','sp-btns');
      const b=spEl('button','sp-btn','回到这里'); b.onclick=()=>gotoStep(i); bs.append(b);
      r.append(t,bs); list.append(r);
    });
    const cur=spEl('div','sp-rowline');
    cur.style.border='1px solid rgba(227,182,92,.32)';
    const ct=spEl('div','sp-rl-t');
    ct.innerHTML='<b>当前状态 <span class="sp-pill">NOW</span></b><small>'+summary(stateLabel(state))+'</small>';
    cur.append(ct); list.append(cur);
    redoStack.slice().reverse().forEach((s,i)=>{
      const r=spEl('div','sp-rowline'); r.style.opacity='.62';
      const t=spEl('div','sp-rl-t');
      t.innerHTML='<b>可重做 '+(i+1)+'</b><small>'+summary(s)+'</small>';
      r.append(t); list.append(r);
    });

    bm.innerHTML='';
    const arr=IrisAutosave.bookmarks();
    if(!arr.length){ bm.append(spEl('div','sp-empty','<b>还没有书签</b>把满意的状态存下来，下次一键载入。')); }
    arr.forEach(b=>{
      const r=spEl('div','sp-rowline');
      const t=spEl('div','sp-rl-t');
      t.innerHTML='<b>'+b.name.replace(/[&<>]/g,'')+'</b><small>'+IrisAutosave.fmtTime(b.at)+' · '+IrisAutosave.fmtSize(b.state.length)+'</small>';
      const bs=spEl('div','sp-btns');
      const l=spEl('button','sp-btn primary','载入'); l.onclick=()=>{ IrisAutosave.loadBookmark(b.id); draw(); };
      const d=spEl('button','sp-btn','删除'); d.onclick=()=>{ IrisAutosave.removeBookmark(b.id); draw(); };
      bs.append(l,d); r.append(t,bs); bm.append(r);
    });
  }
  drawOpt(); draw();
}

function renderDiagnosticsPage(body){
  const w=spWrap(body);
  asHero(w,'IRIS · DIAGNOSTICS','运行状态诊断',
    '一页看全当前设备、渲染能力、编辑状态与本机存储。遇到问题时可以把整段诊断信息复制给作者。','');
  const stat=spEl('div','sp-stat'); w.append(stat);
  const acts=spEl('div','sp-row'); w.append(acts);
  const box=spEl('div','sp-codebox','读取中…'); w.append(box);
  const tbl=spEl('div',''); w.append(tbl);
  const perfBox=spEl('div',''); w.append(perfBox);
  function drawPerf(){
    const q=IrisPerf.snapshot();
    const tot=q.uniformUploads+q.uniformSkips;
    const rate=tot?Math.round(q.uniformSkips/tot*100):0;
    perfBox.innerHTML='';
    const h=spEl('div','sp-section-t','渲染性能 · 实时');
    h.append(spEl('small','打开页面后累计 · 点「重新检测」刷新')); perfBox.append(h);
    const t=spEl('table','sp-table');
    t.innerHTML='<thead><tr><th>指标</th><th>数值</th><th>含义</th></tr></thead>';
    const rows=[
      ['实时帧率',(q.fps||'—')+' FPS','最近 1 秒实际绘制帧数'],
      ['累计帧数',q.frames,'已绘制总帧数'],
      ['uniform 上传',q.uniformUploads,'真正调用 gl.uniform* 的次数'],
      ['uniform 缓存命中',q.uniformSkips+'（'+rate+'%）','值未变化而跳过上传'],
      ['布局读取',q.layoutReads+' 次 / 命中 '+q.layoutHits,'帧内坐标换算共享一次布局读取'],
      ['直方图让帧',q.histSkips,'拖动时跳过同步 readPixels'],
      ['缩略图缓存',q.effHits+' 次命中','单款滤镜参数只算一次'],
      ['自动保存',q.saveEncodes+' 次编码 / '+q.saveReuses+' 次复用','原图只在换照片时重新编码']
    ];
    const tb=document.createElement('tbody');
    rows.forEach(([a,b,c])=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+a+'</td><td class="sp-mono">'+b+'</td><td>'+c+'</td>'; tb.append(tr); });
    t.append(tb); perfBox.append(t);
  }
  function drawActs(){
    acts.innerHTML='';
    const cp=spEl('button','sp-btn primary','⧉ 复制诊断信息');
    cp.onclick=()=>{
      const txt=box.textContent||'';
      const done=()=>toast('诊断信息已复制');
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(done).catch(()=>toast(txt.slice(0,40)+'…'));
      else toast(txt.slice(0,40)+'…');
    };
    const rf=spEl('button','sp-btn','⟳ 重新检测'); rf.onclick=()=>{ draw(); drawPerf(); };
    const av=spEl('button','sp-btn','◈ 自动保存设置'); av.onclick=()=>openSubPage('autosave');
    const pp=spEl('button','sp-btn','⚡ 刷新性能'); pp.onclick=drawPerf;
    acts.append(cp,rf,av,pp);
  }
  async function draw(){
    const d=await IrisAutosave.diag(), q=IrisPerf.snapshot();
    stat.innerHTML='';
    [[d.platform.split(' · ')[0],'运行平台'],[d.units??'—','纹理单元'],
     [(q.fps||'—')+' FPS','实时帧率'],
     [q.uniformSkips,'缓存命中'],
     [d.stateBytes?IrisAutosave.fmtSize(d.stateBytes):'—','状态体积'],
     [d.history,'历史步数'],[d.snapshot?'有':'无','自动保存']]
    .forEach(([v,t])=>{ const x=spEl('div',''); x.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; stat.append(x); });
    const text=
      'Iris 调色盘 · 运行状态诊断\n'+
      '生成时间    '+new Date().toLocaleString('zh-CN')+'\n'+
      '平台        '+d.platform+'\n'+
      '渲染器      '+d.renderer+'\n'+
      '着色器      '+(d.shader?'编译链接成功':'未就绪')+'\n'+
      '纹理单元    '+d.units+'\n'+
      'IndexedDB   '+(d.dbOK?'可用':('降级 / '+d.dbReason))+'\n'+
      '图像        '+(d.demo?'演示图':d.imageSize)+' · '+(d.imageReady?'已载入':'未载入')+'\n'+
      '状态体积    '+IrisAutosave.fmtSize(d.stateBytes)+'\n'+
      '撤销 / 重做 '+d.history+' / '+d.redo+'\n'+
      '快照        '+(d.snapshot?(d.snapshot.name+' · '+IrisAutosave.fmtTime(d.snapshot.at)+(d.snapshot.degraded?'（仅参数）':'（含原图）')):'无')+'\n'+
      '导出记录    '+d.exports+' 条　书签 '+d.bookmarks+' 个\n'+
      '本机用量    '+IrisAutosave.fmtSize(d.usage)+' / '+(d.quota?IrisAutosave.fmtSize(d.quota):'未知')+'\n'+
      '恢复方式    '+(d.mode==='ask'?'每次询问':d.mode==='auto'?'直接恢复':'已关闭')+'\n'+
      '渲染性能    '+(q.fps||'—')+' FPS · 已绘制 '+q.frames+' 帧 · uniform 缓存命中 '+q.uniformSkips+' 次\n'+
      '布局缓存    '+q.layoutReads+' 次读取 / '+q.layoutHits+' 次命中 · 直方图让帧 '+q.histSkips+' 次\n'+
      '照片缓存    '+q.saveEncodes+' 次原图编码 / '+q.saveReuses+' 次复用';
    box.textContent=text;
    drawActs();
    tbl.innerHTML='';
    const rows=[
      ['语义渲染',(state.sem&&state.sem.on)?'开启':'关闭'],
      ['背景虚化',(state.bokeh&&state.bokeh.on)?'开启':'关闭'],
      ['光场计算',(state.lf&&state.lf.on)?'开启':'关闭'],
      ['色调迁移',(typeof TONE_LUT!=='undefined'&&TONE_LUT.on)?'开启':'关闭'],
      ['分屏对比',state.splitOn?'开启':'关闭'],
      ['滤镜层数',(state.layers||[]).length+' / 4'],
      ['文字贴纸元素',(state.elements||[]).length+' 个'],
      ['局部效果',(state.fxRegions||[]).length+' 块'],
      ['笔迹遮罩',(typeof rebuildBrushTextures==='function')?'已就绪':'—'],
      ['盘面配色',(typeof padToneMode!=='undefined'&&padToneMode==='native')?'iPhone 原生':'跟随照片']
    ];
    const t=spEl('table','sp-table');
    t.innerHTML='<thead><tr><th>功能</th><th>当前状态</th></tr></thead>';
    const tb=document.createElement('tbody');
    rows.forEach(([a,b])=>{ const tr=document.createElement('tr');
      tr.innerHTML='<td>'+a+'</td><td><span class="sp-pill'+(b==='关闭'?' off':'')+'">'+b+'</span></td>'; tb.append(tr); });
    t.append(tb); tbl.append(t);
  }
  drawActs(); draw(); drawPerf();
}

/* ---------- 我的滤镜重命名（整套参数 / 普通滤镜通用） ---------- */
function renameUserFilter(name){
  const u=USER_FILTERS.find(x=>x.name===name);
  if(!u){ toast('找不到这套滤镜'); return; }
  const nn=prompt('给这套参数换个名字：',name);
  if(!nn||!nn.trim()||nn.trim()===name) return;
  const n=nn.trim();
  if(FILTERS.some(f=>f.name===n)){ toast('已有同名滤镜，请换个名字'); return; }
  const f=FILTERS.find(x=>x.name===name);
  u.name=n; if(f) f.name=n;
  if(thumbCache[name]){ thumbCache[n]=thumbCache[name]; delete thumbCache[name]; }
  FAV_FILTERS=FAV_FILTERS.map(x=>x===name?n:x); saveFavFilters();
  RECENT_FILTERS=RECENT_FILTERS.map(x=>x===name?n:x);
  try{ localStorage.setItem('plate_recent_filters',JSON.stringify(RECENT_FILTERS)); }catch(e){}
  state.layers.forEach(L=>{ if(L.name===name) L.name=n; });
  state.editLayerName=(state.layers[state.editLayer]||{}).name||'原图';
  FILTER_MAP=null;                       // 名称索引失效，下次查表时重建
  saveUserFilters(); refreshFilterGroups(); buildPanel();
  toast('已重命名为「'+n+'」');
}
/* ============================================================

async function renderMinePage(body){
  const w=spWrap(body);
  asHero(w,'IRIS · MINE','我的空间',
    '把散在各处的个人内容收到一页：编辑过的照片、自己存的滤镜与全套参数、历史步骤、书签、导出记录和最近使用。',
    '全部数据只存在这台设备的本机存储里，不上传、不跨设备同步；关掉自动保存不会删除已有记录，「清空历史图片」才会真正抹掉。');
  const alive=()=>document.body.contains(w);
  const stat=spEl('div','pc-stat'); w.append(stat);
  const quick=spEl('div','sp-row'); w.append(quick);
  const sec1=spSection(w,'历史编辑过的图片');
  const g1=spEl('div','mine-grid'); w.append(g1);
  const sec2=spSection(w,'我创作的滤镜与色调');
  const fbar=spEl('div','sp-row'); w.append(fbar);
  const g2=spEl('div','mine-grid'); w.append(g2);
  const sec3=spSection(w,'编辑历史与书签');
  const l3=spEl('div','mine-list'); w.append(l3);
  const sec4=spSection(w,'导出记录');
  const l4=spEl('div','mine-list'); w.append(l4);
  const sec5=spSection(w,'最近使用');
  const l5=spEl('div','sp-row'); l5.style.flexWrap='wrap'; w.append(l5);

  /* 快捷操作：一键保存所有参数是这一页的主入口 */
  const q1=spEl('button','sp-btn primary','✦ 一键保存所有参数');
  q1.title='把当前整套调色参数存成一款可复用的滤镜，点击即存';
  q1.onclick=()=>{ if(saveAllParamsOneClick()) openSubPage('mine'); };
  const q2=spEl('button','sp-btn','⟳ 恢复上次的编辑');
  q2.onclick=async()=>{ const m=await IrisAutosave.readMeta();
    if(!m){ toast('本机没有保存的照片'); return; }
    closeSubPage(); await IrisAutosave.restore(m); };
  const q3=spEl('button','sp-btn','↺ 编辑历史'); q3.onclick=()=>openSubPage('history');
  const q4=spEl('button','sp-btn','↧ 导出中心'); q4.onclick=()=>openSubPage('export');
  quick.append(q1,q2,q3,q4);

  const f1=spEl('button','sp-btn primary','✦ 再存一套参数');
  f1.onclick=()=>{ if(saveAllParamsOneClick()) openSubPage('mine'); };
  const f2=spEl('button','sp-btn','◈ 去滤镜库「我的」');
  f2.onclick=()=>{ closeSubPage(); gotoTool('filters'); filterGroup='我的'; filterBrowse=false; buildPanel(); };
  const f3=spEl('button','sp-btn','✦ 保存这张的色调');
  f3.onclick=()=>{ closeSubPage(); if(typeof saveCurrentTone==='function') saveCurrentTone(); else toast('按 T 即可保存当前照片的色调'); };
  fbar.append(f1,f2,f3);

  /* ---- 一次性并行读取，避免逐条 await 造成多次重排 ---- */
  let gallery=[],exports=[],bms=[],gs={count:0,bytes:0};
  try{
    [gallery,exports,bms,gs]=await Promise.all([
      IrisAutosave.galleryAll(), IrisAutosave.listExports(),
      Promise.resolve(IrisAutosave.bookmarks()), IrisAutosave.galleryStats()
    ]);
  }catch(e){}
  if(!alive()) return;

  stat.innerHTML='';
  [[gallery.length,'历史图片'],[USER_FILTERS.length,'我的滤镜'],
   [IRIS_TONES.length,'我的色调'],[bms.length,'书签'],[exports.length,'导出记录']]
  .forEach(([v,t])=>{ const d=spEl('div',''); d.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; stat.append(d); });

      const go=spEl('button','pri','套用');

/* ============================================================
   页面中心：把 22 个独立页面从「一排平铺」改成「分组 + 搜索 + 最近」
   默认只显示 5 张常用卡；点分类 tab 才展开该组；搜索跨全部分组。
   ============================================================ */
function renderPageCenter(body){
  const w=spWrap(body);
  asHero(w,'IRIS · PAGES','页面中心',
    '22 个独立页面不再一次全铺出来：首屏只有 7 个常用入口，其余按用途收进折叠分组，点组名才展开；也可以直接搜名字，或点最近打开。',
    '所有页面原样保留，全局搜索 Ctrl/⌘+K 依旧能直达任意一页。');
  const st=spEl('div','pc-stat');
  [[SP_ENTRIES.length,'独立页面'],[PAGE_GROUPS.length,'用途分组'],
   [PAGE_FAV.length,'常用置顶'],[recentPages.length,'最近打开']]
  .forEach(([v,t])=>{ const d=spEl('div',''); d.innerHTML='<b>'+v+'</b><small>'+t+'</small>'; st.append(d); });
  w.append(st);
  const top=spEl('div','pc-top');
  const b1=spEl('button','sp-btn primary','⌕ 打开全局搜索');
  b1.onclick=()=>{ closeSubPage(); setTimeout(()=>openCmd(),30); };
  const b2=spEl('button','sp-btn','▤ 直接看说明书');
  b2.onclick=()=>openSubPage('guide');
  top.append(b1,b2); w.append(top);
  const search=spEl('input','sp-search'); search.type='search';
  search.placeholder='搜索页面，如「说明书」「导出」「诊断」「作者」「隐私」…'; w.append(search);
  const tabs=spEl('div','pc-tabs'); w.append(tabs);
  const out=spEl('div',''); w.append(out);
  let tab='fav';
  const groupsOf=id=>PAGE_GROUPS.filter(g=>g.ids.includes(id)).map(g=>g.name).join(' · ');
  const card=e=>{
    const b=spEl('button','pc-card');
    b.dataset.spid=e.id;
    b.innerHTML='<span class="pc-ico">'+e.icon+'</span><span><b>'+e.name+'</b><small>'+e.sub+'</small></span><em>›</em>';
    b.title=groupsOf(e.id);
    b.onclick=()=>openSubPage(e.id);
    return b;
  };
  function section(title,ids,count){
    const sec=spEl('div','pc-sec');
    const h=spEl('h4','',title+(count?' <small>'+count+' 页</small>':''));
    sec.append(h);
    const grid=spEl('div','pc-cards');
    ids.forEach(id=>{
      const e=SP_ENTRIES.find(v=>v.id===id); if(e) grid.append(card(e));
    });
    sec.append(grid); return sec;
  }
  function drawTabs(){
    tabs.innerHTML='';
    [{id:'fav',name:'★ 常用'}]
      .concat(PAGE_GROUPS.map(g=>({id:g.id,name:g.name})))
      .forEach(t=>{
        const b=spEl('button','pc-tab'+(tab===t.id?' on':''),t.name);
        b.dataset.tab=t.id;
        b.onclick=()=>{ tab=t.id; search.value=''; drawTabs(); draw(); };
        tabs.append(b);
      });
  }
  function draw(){
    out.innerHTML='';
    const q=(search.value||'').trim().toLowerCase();
    if(q){
      const hit=SP_ENTRIES.filter(e=>
        (e.name+' '+e.sub+' '+e.id+' '+groupsOf(e.id)).toLowerCase().includes(q));
      if(!hit.length){ out.append(spEl('div','pc-empty','没有找到相关页面。<br>试试「导出」「说明」「诊断」，或直接用全局搜索 Ctrl/⌘+K。')); return; }
      out.append(section('搜索结果',hit.map(e=>e.id),hit.length));
      return;
    }
    if(tab==='fav'){
      if(recentPages.length){
        const sec=spEl('div','pc-sec');
        sec.append(spEl('h4','','◷ 最近打开 <small>只记在本机</small>'));
        const row=spEl('div','pc-recent');
        recentPages.slice(0,5).forEach(id=>{
          const e=SP_ENTRIES.find(v=>v.id===id); if(!e) return;
          const b=spEl('button','pc-chip',e.icon+' '+e.name);
          b.onclick=()=>openSubPage(id); row.append(b);
        });
        sec.append(row); out.append(sec);
      }
      out.append(section('★ 常用入口',PAGE_FAV,PAGE_FAV.length));
      /* 其余 13 页按用途收进折叠分组，默认全部收起：首屏只有 5 张卡 + 5 行组名 */
      const folds=spEl('div','pc-folds');
      folds.append(spEl('div','sp-note','其余 '+SP_ENTRIES.length+' 页按用途分在下面 '+PAGE_GROUPS.length+
        ' 组里，<b>点组名才展开</b>；也可以直接搜索。'));
      PAGE_GROUPS.forEach(g=>{
        const d=document.createElement('details'); d.className='pc-fold';
        const sm=document.createElement('summary');
        const ico=spEl('span','','▸'); ico.className='pf-a';
        sm.append(ico,document.createTextNode(g.name));
        const n=spEl('span','pf-n',g.ids.length+' 页'); sm.append(n);
        d.append(sm);
        /* 收起时 DOM 里也不创建卡片：首屏只有 5 张常用卡 + 5 行组名 */
        d.addEventListener('toggle',()=>{
          if(!d.open||d.dataset.built) return;
          d.dataset.built='1';
          const grid=spEl('div','pc-cards');
          g.ids.forEach(id=>{ const e=SP_ENTRIES.find(v=>v.id===id); if(e) grid.append(card(e)); });
          d.append(grid);
        });
        folds.append(d);
      });
      out.append(folds);
      return;
    }
    const g=PAGE_GROUPS.find(v=>v.id===tab);
    if(g) out.append(section(g.name,g.ids,g.ids.length));
  }
  search.addEventListener('input',()=>{ draw(); });
  drawTabs(); draw();
}

/* ---------- 局部蒙版：直接在照片上涂抹选区 ---------- */
function maskPaintIdx(){
  return (typeof drawMode==='string'&&drawMode.startsWith('maskpaint'))
    ?parseInt(drawMode.slice(9),10):-1;
}
function startMaskPaint(e){
  const i=maskPaintIdx(); if(i<0||!state.masks[i]) return;
  const m=state.masks[i], q=screenToQ(e.clientX,e.clientY);
  const before=JSON.stringify(state);
  if(m.paintStrokes.length>=80) m.paintStrokes.shift();
  m.paintStrokes.push({mode:m.paintMode,size:m.paintSize,feather:m.paintFeather,pts:[q]});
  m.on=true; m.src='paint';
  maskDrag={before,idx:i};
  const r=stage.getBoundingClientRect();
  brushCursor=[e.clientX-r.left,e.clientY-r.top];
  lastMaskDraw=performance.now();
  rebuildMaskPaint(true); render();
  capturePointer(stage,e);
}
function moveMaskPaint(e){
  if(!maskDrag) return false;
  const m=state.masks[maskDrag.idx], st=m&&m.paintStrokes[m.paintStrokes.length-1];
  if(st){
    const q=screenToQ(e.clientX,e.clientY), last=st.pts[st.pts.length-1];
    if(Math.hypot(q[0]-last[0],q[1]-last[1])>0.0022){
      st.pts.push(q);
      const now=performance.now();
      if(now-lastMaskDraw>45){ lastMaskDraw=now; rebuildMaskPaint(true); render(); }
    }
  }
  return true;
}
function endMaskPaint(){
  if(!maskDrag) return false;
  rebuildMaskPaint(true);
  commit(maskDrag.before);
  maskDrag=null;
  syncUI(); buildPanel(true); render();
  return true;
}

let bokDrag=null, lastBokDraw=0;
function startBokehPaint(e){
  const bk=state.bokeh;
  const q=screenToQ(e.clientX,e.clientY);
  const before=JSON.stringify(state);
  if(bk.paintStrokes.length>=60) bk.paintStrokes.shift();

  const r=stage.getBoundingClientRect();
  brushCursor=[e.clientX-r.left,e.clientY-r.top];
  lastBokDraw=performance.now();

}
function moveBokehPaint(e){

function bokPreviewCanvas(){
  const cv=document.createElement('canvas'); cv.width=240; cv.height=150;
  cv.className='bok-preview';
  const x=cv.getContext('2d');
  x.fillStyle='#17171c'; x.fillRect(0,0,240,150);
  if(!BOK.canvas||!BOK.low){
    x.fillStyle='#7b7b84'; x.font='12px sans-serif'; x.textAlign='center';
    x.fillText('点「一键检测」后这里显示主体范围',120,78); return cv;
  }
  /* 原图缩略 + 主体伪彩叠加 */
  const src=LIVE.still;
  if(src){ x.globalAlpha=.55; x.drawImage(src,0,0,240,150); x.globalAlpha=1; }
  const tmp=document.createElement('canvas'); tmp.width=BOK.W; tmp.height=BOK.H;
  const tx=tmp.getContext('2d'); tx.drawImage(BOK.canvas,0,0);
  const d=tx.getImageData(0,0,BOK.W,BOK.H).data;
  const out=tx.createImageData(BOK.W,BOK.H);
  for(let k=0;k<BOK.W*BOK.H;k++){
    const v=d[k*4]/255;
    out.data[k*4]=Math.round(40+190*v);
    out.data[k*4+1]=Math.round(60+150*v);
    out.data[k*4+2]=Math.round(110-70*v);
    out.data[k*4+3]=Math.round(150*Math.abs(v-.5)*2+40);
  }
  tx.putImageData(out,0,0);
  x.globalAlpha=.78; x.drawImage(tmp,0,0,240,150); x.globalAlpha=1;
  const b=state.bokeh;
  x.strokeStyle='rgba(227,182,92,.9)'; x.lineWidth=1.5; x.setLineDash([5,4]);
  x.beginPath(); x.ellipse(b.cx*240,b.cy*150,b.rx*240,b.ry*150,0,0,7); x.stroke();
  x.setLineDash([]);
  return cv;
}

  open.onclick=()=>openSubPage('guide');
  head.append(open);
  const inp=document.createElement('input'); inp.type='search'; inp.className='fsel';
  inp.placeholder='搜索说明书，如「肤色锁」「60fps」「涂抹」「光场」…';
  inp.value=guideQuery; inp.style.width='100%';

  head.append(inp); p.append(head);

  const toc=section('目录 · 点标题直达对应章节'); toc.classList.add('iris-fixed');
  const trow=document.createElement('div'); trow.className='row';
  GUIDE_CHAPTERS.forEach(c=>{
    const b=button(c.t.replace(/^\d+ · /,''),()=>openSubPage('guide',c.id));
    b.dataset.gid=c.id; b.className='btn sm'; trow.append(b);
  });
  toc.append(trow); p.append(toc);

  GUIDE_CHAPTERS.forEach(c=>{
    const d=section(c.t); d.id='g-'+c.id; d.classList.add('iris-fixed','g-sum-sec');
    d.dataset.gtext=(c.t+' '+c.k+' '+c.b).toLowerCase();
    const sum=document.createElement('div'); sum.className='g-sum';
    /* 摘要取正文第一段，完整正文在独立页 */
    sum.innerHTML=c.b.split('<br>')[0];

function guideFilter(p){
  const q=(guideQuery||'').trim().toLowerCase();
  p.querySelectorAll('[data-gtext]').forEach(d=>{
    d.style.display=(!q||d.dataset.gtext.includes(q))?'':'none';
  });
}

/* ---------- 3D LUT (.cube) ---------- */
function applyCube(text,name){
  let N=0; const data=[];
  text.split(/\r?\n/).forEach(raw=>{
    const l=raw.trim();
    if(!l||l[0]==='#'||/^TITLE/i.test(l)||/^DOMAIN/i.test(l))return;
    const m=l.match(/^LUT_3D_SIZE\s+(\d+)/i);
    if(m){N=parseInt(m[1],10);return;}
    const nums=l.split(/\s+/).map(Number);
    if(nums.length===3&&nums.every(v=>Number.isFinite(v)))data.push(nums[0],nums[1],nums[2]);
  });
  const need=N*N*N*3;
  if(!N||data.length<need){ toast('.cube 解析失败或数据不足'); return false; }
  const W=N*N, H=N;
  let maxTex=4096;
  try{ const v=gl.getParameter(0x0D33); if(typeof v==='number'&&v>=256) maxTex=v; }catch(e){}
  if(W>maxTex){ toast('LUT 阶数过高（'+N+'），请用 ≤ '+Math.floor(Math.sqrt(maxTex))+' 阶'); return false; }
  const buf=new Uint8Array(W*H*4);
  for(let b=0;b<N;b++) for(let g=0;g<N;g++) for(let r=0;r<N;r++){
    const src=(b*N*N+g*N+r)*3, dst=(b*W+g*N+r)*4;
    buf[dst]  =clamp(data[src]  *255,0,255);
    buf[dst+1]=clamp(data[src+1]*255,0,255);
    buf[dst+2]=clamp(data[src+2]*255,0,255);
    buf[dst+3]=255;
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,lutTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,buf);
  gl.activeTexture(gl.TEXTURE0);
  lutSize=N; lutName=name; state.lutOn=1;
  render(); toast(`已载入 LUT ${name}（${N}³）`);
  return true;
}
$('#cubeFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ applyCube(rd.result,f.name); buildPanel(); };
  rd.readAsText(f); e.target.value='';
};

/* ---------- 自动色阶 / 自动白平衡（基于全图像素统计） ---------- */
function imageStats(){
  const size=96, px=renderSmall(size,{});
  const hist=new Array(64).fill(0);
  let R=0,G=0,B=0,n=0;
  for(let i=0;i<px.length;i+=4){
    const r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255;
    hist[Math.min(63,Math.floor((.2126*r+.7152*g+.0722*b)*64))]++;
    R+=r;G+=g;B+=b;n++;
  }
  render();
  const total=n||1; let acc=0,lo=0,hi=1;
  for(let i=0;i<64;i++){acc+=hist[i];if(acc>=total*.01){lo=i/64;break;}}
  acc=0;for(let i=63;i>=0;i--){acc+=hist[i];if(acc>=total*.01){hi=i/64;break;}}
  return {lo,hi,r:R/total,g:G/total,b:B/total};
}
function autoLevels(){
  const st=imageStats();
  mutate(()=>{
    state.base.black=clamp(st.lo*1.6,0,1);
    state.base.gain=clamp((.92-st.hi)*1.3,-1,1);
    state.base.contrast=clamp(state.base.contrast+.06,-1,1);
    buildPanel();
  });
  toast('自动色阶已应用');
}
function autoWB(){
  const st=imageStats(), avg=(st.r+st.g+st.b)/3;
  const t=clamp((st.r-st.b)/.20,-1,1), ti=clamp((st.g-avg)/.08,-1,1);
  mutate(()=>{
    state.base.temp=clamp(state.base.temp-t*.55,-1,1);
    state.base.tint=clamp(state.base.tint-ti*.35,-1,1);
    buildPanel();
  });
  toast('自动白平衡已应用');
}

/* ============================================================
   GIF89a 编码器（纯前端，无外部依赖）
   中位切分生成 256 色全局调色板 + 可选 Floyd–Steinberg 抖动 + LZW 压缩，
   支持多帧延迟与 Netscape 循环扩展。所有帧复用同一调色板，体积更小。
   ============================================================ */
function GIFEncoder(W,H,delayCs,loop,dither){
  this.W=W; this.H=H; this.delay=Math.max(2,Math.round(delayCs||10));
  this.loop=clamp(loop||0,0,65535); this.dither=dither!==false;
  this.pal=null; this.frames=[]; this.buf=[];
}
GIFEncoder.prototype.bytes=function(n){ return [n&255,(n>>8)&255]; };
GIFEncoder.prototype.push=function(a){ for(let i=0;i<a.length;i++) this.buf.push(a[i]); };
/* 中位切分：从采样池里挑出 256 个代表性颜色 */
GIFEncoder.prototype.buildPalette=function(samples){
  const boxes=[[samples,0]];
  // 每个 box: [像素索引数组, 深度]；用最长通道范围切分
  const idxOf=(arr,ch)=>{
    let mn=255,mx=0;
    for(let i=0;i<arr.length;i++){ const v=arr[i][ch]; if(v<mn)mn=v; if(v>mx)mx=v; }
    return mx-mn;
  };
  const out=[];
  let guard=0;
  while(boxes.length&&boxes.length<256&&guard++<600){
    // 找当前范围最大的 box
    let bi=0,best=-1,bch=0;
    for(let i=0;i<boxes.length;i++){
      const a=boxes[i][0]; if(a.length<2) continue;
      let r=idxOf(a,0),g=idxOf(a,1),b=idxOf(a,2);
      const m=Math.max(r,g,b), ch=r>=g&&r>=b?0:(g>=b?1:2);
      if(m>best){best=m;bi=i;bch=ch;}
    }
    if(best<=0) break;
    const a=boxes.splice(bi,1)[0][0];
    a.sort((p,q)=>p[bch]-q[bch]);
    const mid=a.length>>1;
    boxes.push([a.slice(0,mid)], [a.slice(mid)]);
  }
  for(const b of boxes){
    const a=b[0]; if(!a.length){ out.push(0,0,0); continue; }
    let r=0,g=0,bl=0;
    for(const p of a){ r+=p[0];g+=p[1];bl+=p[2]; }
    out.push(Math.round(r/a.length),Math.round(g/a.length),Math.round(bl/a.length));
  }
  while(out.length<768) out.push(0,0,0);
  this.pal=new Uint8Array(out.slice(0,768));
  // 量化查表加速：把 24bit 压到 15bit，缓存最近颜色
  this.cache=new Int32Array(32768).fill(-1);
};
GIFEncoder.prototype.nearest=function(r,g,b){
  const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
  const c=this.cache[key]; if(c>=0) return c;
  const p=this.pal; let best=0,bd=1e12;
  for(let i=0;i<256;i++){
    const dr=r-p[i*3],dg=g-p[i*3+1],db=b-p[i*3+2];
    const d=dr*dr*3+dg*dg*4+db*db*2;   // 人眼对绿更敏感
    if(d<bd){bd=d;best=i;}
  }
  this.cache[key]=best; return best;
};
/* 一帧 RGBA → 调色板索引；带 FS 抖动时误差会扩散到邻像素 */
GIFEncoder.prototype.quantize=function(data){
  const W=this.W,H=this.H, out=new Uint8Array(W*H), p=this.pal;
  let er=new Float32Array(W),eg=new Float32Array(W),eb=new Float32Array(W); // 本行起始误差
  let nr=new Float32Array(W),ng=new Float32Array(W),nb=new Float32Array(W); // 下一行误差
  for(let y=0;y<H;y++){
    nr.fill(0); ng.fill(0); nb.fill(0);
    for(let x=0;x<W;x++){
      const i=(y*W+x)*4;
      const r=clamp(data[i]+er[x],0,255)|0;
      const g=clamp(data[i+1]+eg[x],0,255)|0;
      const b=clamp(data[i+2]+eb[x],0,255)|0;
      const q=this.nearest(r,g,b);
      out[y*W+x]=q;
      if(this.dither){
        const dr=r-p[q*3],dg=g-p[q*3+1],db=b-p[q*3+2];
        if(x+1<W){ er[x+1]+=dr*7/16; eg[x+1]+=dg*7/16; eb[x+1]+=db*7/16; }
        if(x>0){ nr[x-1]+=dr*3/16; ng[x-1]+=dg*3/16; nb[x-1]+=db*3/16; }
        nr[x]+=dr*5/16; ng[x]+=dg*5/16; nb[x]+=db*5/16;
        if(x+1<W){ nr[x+1]+=dr*1/16; ng[x+1]+=dg*1/16; nb[x+1]+=db*1/16; }
      }
    }
    const t1=er;er=nr;nr=t1; const t2=eg;eg=ng;ng=t2; const t3=eb;eb=nb;nb=t3;
  }
  return out;
};
/* LZW：GIF 变体，LSB-first 变长码字，clear=256 / end=257 */
GIFEncoder.prototype.lzw=function(idx){
  const clear=256,end=257,min=8;
  let codeSize=9,next=258;
  const dict=new Int32Array(4096*256); dict.fill(-1);
  const out=[]; let cur=0,bits=0;
  const emit=(code,size)=>{
    cur|=code<<bits; bits+=size;
    while(bits>=8){ out.push(cur&255); cur>>>=8; bits-=8; }
  };
  const reset=()=>{ dict.fill(-1); next=258; codeSize=9; };
  emit(clear,codeSize);
  let prefix=idx[0];
  for(let i=1;i<idx.length;i++){
    const k=idx[i], key=prefix*256+k;
    const found=dict[key];
    if(found>=0){ prefix=found; continue; }
    emit(prefix,codeSize);
    if(next<4096){
      dict[key]=next++;
      /* 解码器比编码器晚一个条目才扩位，因此这里必须是 > 而不是 >=；
         写成 >= 会提前一位扩码宽，后续整帧数据全部错位、GIF 被判为截断。 */
      if(next>(1<<codeSize)&&codeSize<12) codeSize++;
    } else { emit(clear,codeSize); reset(); }
    prefix=k;
  }
  emit(prefix,codeSize); emit(end,codeSize);
  if(bits>0) out.push(cur&255);
  // 拆成 ≤255 字节子块
  const blocks=[];
  for(let i=0;i<out.length;i+=255){ const c=out.slice(i,i+255); blocks.push(c.length,...c); }
  blocks.push(0);
  return blocks;
};
GIFEncoder.prototype.addFrame=function(indices){ this.frames.push(indices); };
GIFEncoder.prototype.finish=function(){
  const W=this.W,H=this.H,b=this.buf;
  const head=[0x47,0x49,0x46,0x38,0x39,0x61]; // GIF89a
  b.push(...head,...this.bytes(W),...this.bytes(H),0xF7,0x00,0x00);
  for(let i=0;i<this.pal.length;i++) b.push(this.pal[i]);
  // Netscape 2.0 循环扩展
  b.push(0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,
         0x03,0x01,...this.bytes(this.loop),0x00);
  this.frames.forEach(fr=>{
    b.push(0x21,0xF9,0x04,0x04,...this.bytes(this.delay),0x00,0x00); // disposal=1（每帧全幅覆盖）
    b.push(0x2C,...this.bytes(0),...this.bytes(0),...this.bytes(W),...this.bytes(H),0x00);
    b.push(0x08); b.push(...this.lzw(fr));
  });
  b.push(0x3B);
  return new Blob([new Uint8Array(b)],{type:'image/gif'});
};

/* 动图帧：在导出画布上做运镜，逐帧取像素 */
function gifMotionFrame(src,i,n,mode){
  const W=src.__gw||src.width, H=src.__gh||src.height;
  const t=n<=1?0:i/(n-1);
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#000'; x.fillRect(0,0,W,H);
  const drawScaled=(z,dx,dy)=>{
    const dw=W*z,dh=H*z;
    x.drawImage(src,0,0,src.width,src.height,(W-dw)/2+dx,(H-dh)/2+dy,dw,dh);
  };
  if(mode==='push') drawScaled(1+0.12*t,0,0);
  else if(mode==='zoomout') drawScaled(1.12-0.12*t,0,0);
  else if(mode==='pan') drawScaled(1.10,(t-.5)*-W*.10,0);
  else if(mode==='breathe') drawScaled(1+0.045*Math.sin(t*Math.PI*2),0,0);
  else drawScaled(1,0,0);
  if(mode==='breathe'){
    x.fillStyle='rgba(255,255,255,'+(0.045*(1-Math.cos(t*Math.PI*2)))+')'; x.fillRect(0,0,W,H);
  }
  if(mode==='color'){
    const hue=Math.round(t*360);
    x.globalCompositeOperation='overlay';
    x.fillStyle='hsl('+hue+',55%,50%)'; x.globalAlpha=.20; x.fillRect(0,0,W,H);
    x.globalAlpha=1; x.globalCompositeOperation='source-over';
  }
  return x.getImageData(0,0,W,H).data;
}
let gifExporting=false;
async function exportGif(){
  if(gifExporting){ toast('正在生成 GIF，请稍候…'); return; }
  gifExporting=true;
  try{
    const [ew,eh]=exportDims();
    const maxEdge=clamp(state.exportGifMaxEdge||640,320,1024);
    const k=Math.min(1,maxEdge/Math.max(ew,eh));
    let W=Math.max(2,Math.round(ew*k)), H=Math.max(2,Math.round(eh*k));
    if(W%2)W--; if(H%2)H--;
    let fps=clamp(state.exportGifFps||10,5,20);
    let secs=clamp(state.exportGifSeconds||2,.3,30);
    let n=Math.max(1,Math.min(400,Math.round(fps*secs)));
    if(n>400){ n=400; }
    const motion=state.exportGifMotion||'push';
    toast('正在生成 GIF：'+n+' 帧 · '+W+'×'+H+' …');
    const small=renderExportCanvas();
    // 缩小到 GIF 尺寸，之后所有帧复用这张位图
    const src=document.createElement('canvas'); src.width=W; src.height=H;
    src.getContext('2d').drawImage(small,0,0,W,H);
    src.__gw=W; src.__gh=H;
    const enc=new GIFEncoder(W,H,Math.round(100/fps),state.exportGifLoop,!!state.exportGifDither);
    // 第一遍：采样建调色板（每帧按步长取样，避免全量缓存）
    const samples=[]; const step=Math.max(1,Math.floor(Math.sqrt(W*H*n/14000)));
    for(let i=0;i<n;i++){
      const d=gifMotionFrame(src,i,n,motion);
      for(let y=0;y<H;y+=step)for(let x2=0;x2<W;x2+=step){
        const q=(y*W+x2)*4; samples.push([d[q],d[q+1],d[q+2]]);
      }
      if(i%12===0) await new Promise(r=>setTimeout(r,0));
    }
    enc.buildPalette(samples);
    // 第二遍：量化并编码
    for(let i=0;i<n;i++){
      const d=gifMotionFrame(src,i,n,motion);
      enc.addFrame(enc.quantize(d));
      if(i%8===0){ toast('GIF 编码中… '+Math.round((i+1)/n*100)+'%'); await new Promise(r=>setTimeout(r,0)); }
    }
    const blob=enc.finish();
    downloadBlob(blob,'Iris_动图_'+Date.now()+'.gif');
    toast('已导出 GIF · '+(blob.size/1024).toFixed(0)+' KB · '+n+' 帧 / '+secs+'s · '+
      (state.exportGifLoop===0?'无限循环':state.exportGifLoop+' 次循环'));
  }catch(e){ toast('GIF 导出失败：'+(e.message||e)); }
  finally{ gifExporting=false; }
}
async function doExport(){
  let mime=state.exportFormat||'image/png';
  if(!supportsMime(mime)){ toast('当前浏览器不支持该格式，已改用 PNG'); mime='image/png'; }
  const ext=mime==='image/jpeg'?'.jpg':mime==='image/webp'?'.webp':'.png';
  const q=mime==='image/png'?undefined:clamp(state.exportQuality??.92,.3,1);
  const [ew,eh]=exportDims();
  toast('正在导出 '+ew+'×'+eh+' …');
  const cv=renderExportCanvas();
  let b=null, note='';
  if(mime==='image/png'&&state.exportOptimizePng!==false){
    const r=await optimizePng(cv);
    if(r){
      b=r.blob;
      note=r.optimized
        ? ' · 无损瘦身 −'+Math.round(r.saved/r.original*100)+'%（'+IrisAutosave.fmtSize(r.original)+' → '+IrisAutosave.fmtSize(r.size)+'，像素完全一致）'
        : ' · 已保持原 PNG（本机编码器未更小）';
    }
  }
  if(!b) b=await canvasToBlob(cv,mime,q);
  if(!b){ toast('导出失败，请重试'); return; }
  downloadBlob(b,'Iris_'+Date.now()+ext);
  toast('已导出 '+ew+'×'+eh+' · '+IrisAutosave.fmtSize(b.size)+note);
}
/* 一次出 PNG / JPG / WebP 三张，打包成一个 ZIP */
async function exportBundle(){
  toast('正在打包全格式…');
  try{
    const c=renderExportCanvas(), files=[];
    const list=[['image/png','png',undefined],['image/jpeg','jpg',clamp(state.exportQuality??.92,.3,1)],
                ['image/webp','webp',clamp(state.exportQuality??.92,.3,1)]];
    for(const [mime,ext,q] of list){
      if(!supportsMime(mime)) continue;
      let b;
      if(mime==='image/png'&&state.exportOptimizePng!==false){
        const r=await optimizePng(c); if(r) b=r.blob;
      }
      if(!b) b=await canvasToBlob(c,mime,q);
      if(b&&b.size) files.push({name:'Iris_'+ext+'.'+ext,data:await blobBytes(b)});
    }
    if(!files.length) throw new Error('NO_FORMAT');
    const zip=zipStore(files);
    downloadBlob(zip,'Iris_全格式_'+Date.now()+'.zip');
    toast('已打包 '+files.length+' 种格式 · '+(zip.size/1024).toFixed(0)+' KB');
  }catch(e){ toast('打包失败：'+(e.message||e)); }
}
/* 一键智能增强：自动色阶 + 自动白平衡 + 轻微鲜明度 / 清晰度 */
function autoPlus(){
  const st=imageStats(), avg=(st.r+st.g+st.b)/3;
  mutate(()=>{
    state.base.black=clamp(st.lo*1.4,0,1);
    state.base.gain=clamp((.92-st.hi)*1.2,-1,1);
    state.base.contrast=clamp(state.base.contrast+.10,-1,1);
    const t=clamp((st.r-st.b)/.20,-1,1), ti=clamp((st.g-avg)/.08,-1,1);
    state.base.temp=clamp(state.base.temp-t*.40,-1,1);
    state.base.tint=clamp(state.base.tint-ti*.28,-1,1);
    state.base.vibrance=clamp(state.base.vibrance+.12,-1,1);
    state.base.clarity=clamp(state.base.clarity+.06,-1,1);
    buildPanel();
  });
  toast('智能增强已应用（色阶 + 白平衡 + 鲜明度）');
}

function cmdScore(it,words){
  const n=it.name.toLowerCase(), k=(it.key||'').toLowerCase(), d=(it.desc||'').toLowerCase();
  const hay=n+' '+k+' '+d;
  let s=0;
  for(const w of words){
    /* 每个词都必须能在「名称 / 别名 / 说明」里找到（AND），但不限定同一字段 */
    if(!hay.includes(w)) return -1;
    if(n.startsWith(w)) s+=4;
    else if(n.includes(w)) s+=3;
    else if(k.includes(w)) s+=2;
    else s+=1;
  }
  if(it.type==='操作'||it.type==='工具') s+=2;
  if(it.type==='参数') s+=1;
  return s;
}
function cmdSearch(q){
  const words=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){
    const acts=CMD.items.filter(i=>i.type==='操作').slice(0,7);
    const tools=CMD.items.filter(i=>i.type==='工具').slice(0,5);
    return acts.concat(tools);
  }
  const hits=CMD.items.map(it=>({it,s:cmdScore(it,words)})).filter(x=>x.s>=0);
  const key=words.join('');
  /* 名称直接命中的排最前（搜「色温」第一项就该是参数本身） */
  const top=hits.filter(x=>{
    const n=x.it.name.toLowerCase();
    return n===key||n.startsWith(key)||(words.length===1&&n.startsWith(words[0]));
  }).sort((a,b)=>b.s-a.s||a.it.name.length-b.it.name.length).slice(0,3);
  const used=new Set(top.map(x=>x.it));
  /* 其余按类型分桶：同组标题只出现一次，且每类都有配额，不会被某一类刷屏 */
  /* 页面 / 技术 / 关于 / 自动保存等结果都有配额，不会被某一类刷屏；
     独立页面最多 3 条，想看全部走「页面中心」折叠分组。 */
  const ORDER=['操作','工具','参数','滤镜','预设','页面','关于','技术','自动保存','模板','我的色调'];
  const CAP={'操作':5,'工具':5,'参数':5,'滤镜':9,'预设':4,'页面':3,'关于':3,'技术':3,
             '自动保存':3,'模板':4,'我的色调':3};
  const buckets={};
  hits.forEach(x=>{ if(used.has(x.it))return; (buckets[x.it.type]||(buckets[x.it.type]=[])).push(x); });
  const out=top.map(x=>({...x.it,type:'最佳匹配'}));
  ORDER.forEach(t=>{
    (buckets[t]||[]).sort((a,b)=>b.s-a.s||a.it.name.length-b.it.name.length)
      .slice(0,CAP[t]).forEach(x=>out.push(x.it));
  });
  return out.slice(0,18);
}
function renderCmd(){
  const q=cmdInput.value;
  CMD.results=cmdSearch(q);
  if(CMD.sel>=CMD.results.length) CMD.sel=0;
  cmdResults.innerHTML='';
  if(!CMD.results.length){
    const e=document.createElement('div'); e.className='cmd-empty';
    e.textContent='没有匹配「'+q+'」的结果'; cmdResults.append(e);
  } else {
    let lastType='';
    CMD.results.forEach((it,i)=>{
      if(it.type!==lastType){
        lastType=it.type;
        const g=document.createElement('div'); g.className='cmd-group'; g.textContent=it.type;
        cmdResults.append(g);
      }
      const b=document.createElement('button');
      b.className='cmd-item'+(i===CMD.sel?' sel':''); b.dataset.i=i;
      b.innerHTML=`<span class="ci">${it.icon}</span><span class="ct"><b></b><small></small></span>`+
        (it.hint?`<span class="ck"></span>`:'');
      b.querySelector('b').textContent=it.name;
      b.querySelector('small').textContent=it.desc;
      const ck=b.querySelector('.ck'); if(ck) ck.textContent=it.hint;
      b.onclick=()=>runCmd(i);
      cmdResults.append(b);
    });
  }
  $('#cmdCount').textContent=CMD.results.length+' 项';
}
function runCmd(i){

}

function closeCmd(){
  if(!CMD.open) return;
  CMD.open=false; cmdMask.classList.remove('show'); cmdInput.blur();
}
$('#btnSearch').onclick=e=>{ e.stopPropagation(); CMD.open?closeCmd():openCmd(); };
$('#cmdClose').onclick=closeCmd;
cmdMask.addEventListener('click',e=>{ if(e.target===cmdMask) closeCmd(); });
cmdInput.addEventListener('input',()=>{ CMD.sel=0; renderCmd(); });
cmdInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); CMD.sel=Math.min(CMD.results.length-1,CMD.sel+1); renderCmd(); scrollCmdSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); CMD.sel=Math.max(0,CMD.sel-1); renderCmd(); scrollCmdSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); runCmd(CMD.sel); }
});
function scrollCmdSel(){
  const el=cmdResults.querySelector('.cmd-item.sel');
  if(el) el.scrollIntoView({block:'nearest'});
}

/* ---------- 移动端适配 ---------- */
function applyMobileUI(){
  const m=isMobile();
  const cmp=$('#cmp'), zoom=$('.zoomctl'), stageEl=$('#stage');
  cmp.textContent=m?'对比':'按住对比原图';
  cmp.title=m?'按住看原图（空格键同效）':'按住看原图';
  if(m&&cmp.parentElement!==zoom){ zoom.appendChild(cmp); cmp.classList.add('in-zoom'); }
  else if(!m&&cmp.parentElement!==stageEl){ stageEl.appendChild(cmp); cmp.classList.remove('in-zoom'); }
  $('#btnOpen').classList.toggle('compact',m); $('#btnSave').classList.toggle('compact',m);
  syncFocusBtn();
}
$('#btnFocus').onclick=()=>{
  app.classList.contains('dock-off')?expandDock():collapseDock();
};
window.addEventListener('scroll',invalidateStageRect,true);
let lastLayout=isMobile()+'|'+isCompact();
window.addEventListener('resize',()=>{
  invalidateStageRect();
  const now=isMobile()+'|'+isCompact();
  if(now!==lastLayout){
    lastLayout=now; applyMobileUI(); buildTools(); buildPanel(); render();
  }
});

/* ---------- 启动 ---------- */
irisSkinApply(false);   // 与 head 内联脚本一致，并同步 theme-color
applyFrameIcons();
initIrisTones();
applyMobileUI();
initSubPages();
buildTools(); buildPanel(); updateFitBtn();
try{ const v=localStorage.getItem(dockKey()); if(v) setDock(parseFloat(v),false); }catch(e){}
new ResizeObserver(()=>render()).observe(stage);
/* 拖动右侧栏改变宽度时重新判断是否需要纵向布局 */
new ResizeObserver(()=>syncPanelFit(false)).observe($('#panel'));
render(); drawHistogram();
/* 入场动画只播一次：加类触发，播完移除，不留任何残留样式 */
document.body.classList.add('boot');
setTimeout(()=>document.body.classList.remove('boot'),1000);
/* 缩放百分比一变就轻轻亮一下，统一监听，不必改每个缩放入口 */
(()=>{
  const z=$('#zVal'); if(!z) return;
  let t=null;
  new MutationObserver(()=>{
    z.classList.remove('pulse'); void z.offsetWidth; z.classList.add('pulse');
    clearTimeout(t); t=setTimeout(()=>z.classList.remove('pulse'),400);
  }).observe(z,{childList:true,characterData:true,subtree:true});
})();
/* 自动保存启动：读取本机快照，按设置弹「是否编辑上次的照片」或直接恢复 */
try{ IrisAutosave.boot(); }catch(e){ console.warn('[IrisAutosave] 启动失败',e); }
</script>
